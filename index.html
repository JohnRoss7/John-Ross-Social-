<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>John Ross Social</title>
<meta name="theme-color" content="#000000">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#000;--text:#e7e9ea;--muted:#71767b;--border:#2f3336;--card:#16181c;--accent:#dc2626;--hover:rgba(255,255,255,.03);--blue:#1d9bf0}
body.light{--bg:#fff;--text:#0f1419;--muted:#536471;--border:#eff3f4;--card:#f7f9f9;--accent:#dc2626;--hover:rgba(0,0,0,.03);--blue:#1d9bf0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none}
.app-container{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:70px;background:var(--bg);border-left:1px solid var(--border);border-right:1px solid var(--border)}
.sidebar{position:fixed;top:0;left:-280px;width:280px;height:100vh;background:var(--bg);border-right:1px solid var(--border);z-index:1000;transition:left .3s;display:flex;flex-direction:column}
.sidebar.show{left:0}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border)}
.logo-box{background:var(--accent);color:#fff;padding:8px 14px;border-radius:20px;font-weight:700;font-size:14px}
#close-sidebar{background:none;border:none;color:var(--text);font-size:28px;cursor:pointer}
.sidebar-nav{flex:1;padding:12px;overflow-y:auto}
.sidebar-nav a{display:flex;align-items:center;gap:14px;padding:14px 16px;color:var(--text);text-decoration:none;border-radius:9999px;font-size:17px;font-weight:500;cursor:pointer;margin-bottom:4px}
.sidebar-nav a:hover,.sidebar-nav a.active{background:var(--card)}
.sidebar-nav a i{width:22px;height:22px}
.sidebar-nav hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.admin-link{background:var(--card)!important;border:1px solid var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;display:none}
.overlay.show{display:block}
.main-header{position:sticky;top:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 16px;z-index:100;display:flex;align-items:center;gap:10px}
body.light .main-header{background:rgba(255,255,255,.85)}
.menu-btn{background:none;border:none;color:var(--text);cursor:pointer;padding:6px}
.menu-btn i{width:24px;height:24px}
.logo-text{font-weight:700;font-size:17px}
.slogan-badge{background:var(--accent);color:#fff;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap}
.top-tabs{display:flex;border-bottom:1px solid var(--border)}
.tab-btn{flex:1;padding:16px;background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;border-bottom:3px solid transparent;font-weight:500}
.tab-btn.active{color:var(--text);border-bottom-color:var(--accent);font-weight:700}
.post{border-bottom:1px solid var(--border);padding:14px 16px}
.post:hover{background:var(--hover)}
.post-header{display:flex;gap:12px;margin-bottom:6px;align-items:flex-start}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#dc2626,#7c2d12);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden;background-size:cover;background-position:center;color:#fff;cursor:pointer}
.avatar-lg{width:110px;height:110px;font-size:48px;border-radius:16px}
.post-info{flex:1;min-width:0}
.username{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;cursor:pointer}
.handle{color:var(--muted);font-size:14px}
.post-content{font-size:15px;line-height:1.5;margin:4px 0 10px;word-wrap:break-word;white-space:pre-wrap}
.post-images{margin:10px 0;border-radius:12px;overflow:hidden}
.post-images img{width:100%;max-height:380px;object-fit:cover;border-radius:12px;cursor:pointer}
.hash{color:#1d9bf0;cursor:pointer}
.mention{color:var(--accent)!important;font-weight:600;cursor:pointer;user-select:none;-webkit-user-select:none}
.post-actions{display:flex;gap:28px;color:var(--muted);font-size:13px;margin-top:10px;align-items:center}
.post-actions span{display:flex;align-items:center;gap:6px;cursor:pointer}
.like-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;border:1.5px solid transparent;transition:all .2s}
.like-btn.liked{background:var(--accent);border-color:var(--accent);color:#fff !important}
.like-btn.liked svg{color:#fff !important;fill:#fff}
@keyframes likePop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.like-pop{animation:likePop .3s ease}
.comments-section{margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.comment{padding:12px 0;display:flex;gap:10px;position:relative}
.comment-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#dc2626,#7c2d12);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;overflow:hidden;background-size:cover;background-position:center;cursor:pointer}
.comment-info{flex:1;min-width:0}
.comment-name{font-weight:700;font-size:13px;cursor:pointer}
.comment-text{font-size:14px;margin-top:2px;line-height:1.4;word-wrap:break-word}
.comment-actions{display:flex;align-items:center;gap:12px;margin-top:8px;color:var(--muted);font-size:12px}
.comment-like-btn{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 10px;color:var(--muted);font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.comment-like-btn.liked{background:rgba(220,38,38,.15);border-color:var(--accent);color:var(--accent)!important}
.comment-like-btn.liked svg{fill:var(--accent)!important;stroke:var(--accent)!important}
.comment-menu-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;margin-left:auto}
.comment-menu{position:absolute;right:0;top:28px;background:var(--card);border:1px solid var(--border);border-radius:12px;min-width:140px;z-index:40;display:none;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.comment-menu.show{display:block}
.comment-menu button{width:100%;background:none;border:none;color:var(--text);padding:11px 14px;text-align:left;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px}
.comment-menu button:hover{background:var(--accent);color:#fff}
.comment-input-row{display:flex;gap:8px;margin-top:12px}
.comment-input-row input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:9999px;font-size:14px;outline:none}
.post-menu-container{position:relative;margin-left:auto}
.menu-btn-icon{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px}
.post-menu{position:absolute;right:0;top:28px;background:var(--card);border:1px solid var(--border);border-radius:12px;min-width:170px;z-index:50;display:none;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.post-menu.show{display:block}
.post-menu button{width:100%;background:none;border:none;color:var(--text);padding:12px 16px;text-align:left;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px}
.post-menu button:hover{background:var(--accent);color:#fff}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0;max-width:600px;margin:0 auto;z-index:100}
body.light .bottom-nav{background:rgba(255,255,255,.92)}
.nav-item{background:none;border:none;color:var(--muted);padding:8px 18px;cursor:pointer;position:relative}
.nav-item.active{color:var(--accent)}
.nav-item i{width:26px;height:26px}
.nav-badge{position:absolute;top:6px;right:14px;width:9px;height:9px;background:var(--accent);border-radius:50%;display:none}
.auth-container{text-align:center;padding:50px 24px}
.auth-container h2{margin-bottom:8px;font-size:28px;font-weight:800}
.auth-container .slogan{color:var(--muted);margin-bottom:32px}
.auth-container input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:14px 18px;border-radius:9999px;margin:8px 0;font-size:15px;max-width:340px;outline:none}
.auth-container button{width:100%;max-width:340px;background:var(--accent);color:#fff;border:none;padding:14px;border-radius:9999px;font-weight:700;cursor:pointer;font-size:15px;margin:8px 0}
.auth-container .btn-o{background:transparent;border:1px solid var(--border);color:var(--text)}
.profile{padding:20px}
.profile-header{text-align:center;margin-bottom:20px}
.profile-stats{display:flex;justify-content:center;gap:36px;margin:18px 0;color:var(--muted);font-size:14px}
.profile-stats b{color:var(--text);font-size:20px;display:block}
.profile-stats span{cursor:pointer}
.profile-form input,.profile-form textarea{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:16px;margin:8px 0;font-size:15px;font-family:inherit;outline:none}
.profile-form textarea{border-radius:12px;min-height:70px;resize:vertical}
.profile-form button{width:100%;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:9999px;font-weight:700;cursor:pointer;margin-top:12px}
.btn-full{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:9999px;font-weight:700;cursor:pointer;font-size:14px}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 18px;border-radius:9999px;cursor:pointer;font-size:14px}
.btn-follow{background:var(--text);color:var(--bg);border:none;padding:8px 20px;border-radius:9999px;font-weight:700;cursor:pointer;font-size:14px}
.btn-follow.following{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.profile-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.empty-state{padding:50px 20px;text-align:center;color:var(--muted);font-size:15px}
.admin-badge{background:var(--accent);color:#fff;padding:2px 7px;border-radius:8px;font-size:11px;font-weight:600}
.notif-item{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:flex-start;gap:10px}
.notif-item:hover{background:var(--hover)}
.notif-item.unread{background:rgba(29,155,240,0.15)!important;border-left:4px solid var(--blue)}
.notif-content{flex:1}
.notif-dot{font-size:13px;margin-top:2px}
.img-preview{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.img-preview img{width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:90vh;border-radius:8px;object-fit:contain}
.lightbox-close{position:absolute;top:16px;right:16px;background:none;border:none;color:#fff;font-size:32px;cursor:pointer}
.user-list-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.edit-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1500;display:none;align-items:center;justify-content:center;padding:20px}
.edit-modal.show{display:flex}
.edit-box{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:400px}
.edit-box textarea{width:100%;min-height:100px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:12px;font-size:15px;font-family:inherit;resize:vertical;outline:none}
.edit-actions{display:flex;gap:10px;margin-top:14px}
.edit-actions button{flex:1;padding:12px;border-radius:9999px;font-weight:700;cursor:pointer;border:none}
.single-post-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.single-post-header button{background:none;border:none;color:var(--text);cursor:pointer}
.cta-box{margin:20px 16px;padding:20px;background:var(--card);border-radius:16px;text-align:center;border:1px solid var(--border)}
.repost-label{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.quoted-box{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:10px;background:var(--hover)}
.quoted-box .q-name{font-weight:700;font-size:13px;cursor:pointer;color:var(--accent)}
.quoted-box .q-text{font-size:14px;margin-top:4px}
.quoted-box img{width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-top:8px;cursor:pointer}
#mentionDropdown{display:none;position:fixed;background:var(--card);border:1px solid var(--border);border-radius:12px;max-height:180px;overflow-y:auto;z-index:300;box-shadow:0 4px 20px rgba(0,0,0,.5)}
#mentionDropdown .mention-item{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;border-bottom:1px solid var(--border)}
#mentionDropdown .mention-item:hover{background:var(--hover)}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<aside id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <div class="logo-box">John Ross Social</div>
    <button id="close-sidebar" onclick="closeSidebar()">&times;</button>
  </div>
  <nav class="sidebar-nav">
    <a onclick="goHome();closeSidebar()"><i data-lucide="home"></i> Home</a>
    <a onclick="goProfile();closeSidebar()"><i data-lucide="user"></i> Profile</a>
    <a onclick="showEditProfile();closeSidebar()"><i data-lucide="edit-3"></i> Edit Profile</a>
    <a onclick="aiAssistant();closeSidebar()"><i data-lucide="bot"></i> AI Assistant</a>
    <a onclick="settings();closeSidebar()"><i data-lucide="settings"></i> Settings</a>
    <a onclick="clearCache();closeSidebar()"><i data-lucide="trash-2"></i> Εκκαθάριση Cache</a>
    <div id="adminMenuItem" style="display:none"><hr><a class="admin-link" onclick="showAdminPanel();closeSidebar()"><i data-lucide="shield"></i> Admin Panel</a></div>
    <hr>
    <a onclick="logout();closeSidebar()"><i data-lucide="log-out"></i> Logout</a>
  </nav>
</aside>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <img id="lightboxImg" src="" alt="">
</div>

<div class="edit-modal" id="editModal">
  <div class="edit-box">
    <h3 style="margin-bottom:12px;font-weight:700" id="editModalTitle">Επεξεργασία</h3>
    <textarea id="editText"></textarea>
    <div class="edit-actions">
      <button style="background:var(--border);color:var(--text)" onclick="closeEditModal()">Ακύρωση</button>
      <button style="background:var(--accent);color:#fff" onclick="saveEditPost()">Αποθήκευση</button>
    </div>
  </div>
</div>

<div class="edit-modal" id="shareModal">
  <div class="edit-box">
    <h3 style="margin-bottom:16px;font-weight:700" id="shareModalTitle">Κοινοποίηση</h3>
    <button class="btn-full" style="width:100%;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px" onclick="doNativeShare()">
      <i data-lucide="share-2" style="width:18px;height:18px"></i> <span id="shareAppsText">Κοινοποίηση σε εφαρμογές</span>
    </button>
    <button class="btn-outline" style="width:100%;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px" onclick="copyFromShare()">
      <i data-lucide="link" style="width:18px;height:18px"></i> <span id="shareCopyText">Αντιγραφή συνδέσμου</span>
    </button>
    <button class="btn-outline" style="width:100%;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px" onclick="doRepost()">
      <i data-lucide="repeat-2" style="width:18px;height:18px"></i> <span id="shareRepostText">Αναδημοσίευση</span>
    </button>
    <button class="btn-outline" style="width:100%;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px" onclick="quoteFromShare()">
      <i data-lucide="quote" style="width:18px;height:18px"></i> <span id="shareQuoteText">Παράθεση</span>
    </button>
    <button style="width:100%;padding:12px;border-radius:9999px;border:none;background:var(--border);color:var(--text);font-weight:600;cursor:pointer;margin-top:6px" onclick="closeShareModal()">
      <span id="shareCloseText">Κλείσιμο</span>
    </button>
  </div>
</div>

<main class="app-container">
  <header class="main-header">
    <button class="menu-btn" onclick="openSidebar()"><i data-lucide="menu"></i></button>
    <div class="logo-text">John Ross Social</div>
    <div class="slogan-badge">Your space. Your voice.</div>
  </header>
  <div id="main"></div>
  <nav class="bottom-nav" id="bottomNav" style="display:none">
    <button class="nav-item" data-tab="home" onclick="showTab('home')"><i data-lucide="home"></i></button>
    <button class="nav-item" data-tab="search" onclick="showTab('search')"><i data-lucide="search"></i></button>
    <button class="nav-item" data-tab="notif" onclick="showTab('notif')"><i data-lucide="bell"></i><span class="nav-badge" id="notifBadge"></span></button>
    <button class="nav-item" data-tab="profile" onclick="showTab('profile')"><i data-lucide="user"></i></button>
  </nav>
</main>

function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,'')}

function showTab(name, fromBack){
  if(!fromBack && tab !== name){historyStack.push(tab);if(historyStack.length>8)historyStack.shift();try{history.pushState({tab:name},'');}catch(e){}}
  tab=name;singlePostId=null;sessionStorage.setItem('jrs_tab',name);
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  render();if(typeof lucide!=='undefined')lucide.createIcons();
}

window.addEventListener('popstate',()=>{
  const shareModal=document.getElementById('shareModal');
  if(shareModal&&shareModal.classList.contains('show')){closeShareModal();try{history.pushState({tab},'');}catch(e){}return;}
  if(singlePostId){singlePostId=null;render();return;}
  if(historyStack.length>0){showTab(historyStack.pop(),true);}else{showTab('home',true);}
});

async function getUserName(uid){try{const doc=await db.collection('users').doc(uid).get();if(doc.exists)return doc.data().name||'User'}catch(e){}return 'User'}

function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{try{const MAX=600;let w=img.width,h=img.height;if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX}}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);let data=canvas.toDataURL('image/jpeg',0.42);if(data.length>280000)data=canvas.toDataURL('image/jpeg',0.30);resolve(data)}catch(err){reject(err)}};img.onerror=()=>reject(new Error('load fail'));img.src=e.target.result};reader.onerror=()=>reject(new Error('read fail'));reader.readAsDataURL(file)})}

async function handleImageSelect(e){const file=e.target.files[0];if(!file)return;pendingImages=[];try{if(file.size>25*1024*1024){alert(lang==='el'?'Πολύ μεγάλη':'Too large');return}const compressed=await compressImage(file);pendingImages=[compressed];renderImagePreview()}catch(err){alert(lang==='el'?'Δεν μπόρεσε να επεξεργαστεί.':'Could not process photo.')}e.target.value=''}
function renderImagePreview(){const box=document.getElementById('imgPreview');if(!box||pendingQuote)return;box.innerHTML=pendingImages.map(src=>`<div style="position:relative;display:inline-block"><img src="${src}"><button style="position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:14px;cursor:pointer" onclick="removeImage()">×</button></div>`).join('')}
function removeImage(){pendingImages=[];renderImagePreview()}

async function notifyMentions(text,fromUid,fromName,postId){if(!text)return;const mentions=text.match(/@(\w+)/g)||[];const unique=[...new Set(mentions.map(m=>m.substring(1).toLowerCase()))];for(const handle of unique){try{const snap=await db.collection('users').limit(40).get();for(const d of snap.docs){const u=d.data();if(norm(u.name)===handle&&d.id!==fromUid){db.collection('notifications').add({userId:d.id,senderId:fromUid,postId:postId||null,type:'mention',text:fromName+(lang==='el'?' σε ανέφερε.':' mentioned you.'),read:false,timestamp:Date.now()})}}}catch(e){}}}

function postContent(){const ta=document.getElementById('postText');if(!ta.value.trim()&&pendingImages.length===0&&!pendingQuote)return;db.collection('users').doc(user.uid).get().then(doc=>{const u=doc.data()||{};const name=u.name||user.displayName||user.email.split('@')[0];const postData={uid:user.uid,name:name,email:user.email,photo:u.photo||user.photoURL||'',text:ta.value,images:pendingImages,likes:0,likedBy:[],comments:[],createdAt:Date.now(),isRepost:false,isQuote:false};if(pendingQuote){postData.isQuote=true;postData.originalPostId=pendingQuote.originalPostId;postData.original=pendingQuote.original}db.collection('posts').add(postData).then(ref=>{notifyMentions(ta.value,user.uid,name,ref.id);if(pendingQuote&&pendingQuote.original&&pendingQuote.original.uid&&pendingQuote.original.uid!==user.uid){db.collection('notifications').add({userId:pendingQuote.original.uid,senderId:user.uid,postId:ref.id,type:'quote',text:name+(lang==='el'?' παρέθεσε τη δημοσίευσή σου.':' quoted your post.'),read:false,timestamp:Date.now()})}});ta.value='';ta.placeholder=t('placeholder');pendingImages=[];pendingQuote=null;const box=document.getElementById('imgPreview');if(box)box.innerHTML=''})}

function playLikeSound(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type='square';osc.frequency.setValueAtTime(520,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(780,ctx.currentTime+0.07);osc.frequency.exponentialRampToValueAtTime(380,ctx.currentTime+0.14);gain.gain.setValueAtTime(0.35,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.18);osc.start(ctx.currentTime);osc.stop(ctx.currentTime+0.18)}catch(e){}}

async function likePost(id,el){if(!user){alert(lang==='el'?'Πρέπει να συνδεθείς πρώτα':'Please sign in first');return}const ref=db.collection('posts').doc(id);const doc=await ref.get();const p=doc.data();const liked=(p.likedBy||[]).includes(user.uid);if(liked){await ref.update({likes:firebase.firestore.FieldValue.increment(-1),likedBy:firebase.firestore.FieldValue.arrayRemove(user.uid)})}else{await ref.update({likes:firebase.firestore.FieldValue.increment(1),likedBy:firebase.firestore.FieldValue.arrayUnion(user.uid)});playLikeSound();if(el){el.classList.add('like-pop');setTimeout(()=>el.classList.remove('like-pop'),350)}if(p.uid!==user.uid){const myName=await getUserName(user.uid);db.collection('notifications').add({userId:p.uid,senderId:user.uid,postId:id,type:'like',text:myName+(lang==='el'?' έκανε like στη δημοσίευσή σου.':' liked your post.'),read:false,timestamp:Date.now()})}}if(singlePostId)renderSinglePost();else if(tab==='profile'){setTimeout(()=>{const feed=document.getElementById('myPostsFeed');if(feed)loadProfilePosts(viewingUid||user.uid,feed)},280)}}

async function addComment(postId){if(!user){alert(lang==='el'?'Πρέπει να συνδεθείς πρώτα':'Please sign in first');return}const inp=document.getElementById('c_'+postId);if(!inp||!inp.value.trim())return;const text=inp.value.trim();const doc=await db.collection('posts').doc(postId).get();const p=doc.data();const myDoc=await db.collection('users').doc(user.uid).get();const ud=myDoc.data()||{};const myName=ud.name||user.displayName||user.email.split('@')[0];const myPhoto=ud.photo||'';const commentObj={id:genId(),uid:user.uid,name:myName,photo:myPhoto,email:user.email,text:text,time:Date.now(),likes:0,likedBy:[]};await db.collection('posts').doc(postId).update({comments:firebase.firestore.FieldValue.arrayUnion(commentObj)});if(p.uid!==user.uid){db.collection('notifications').add({userId:p.uid,senderId:user.uid,postId:postId,type:'comment',text:myName+(lang==='el'?' σχολίασε τη δημοσίευσή σου.':' commented on your post.'),read:false,timestamp:Date.now()})}notifyMentions(text,user.uid,myName,postId);inp.value='';hideMentionDropdown();if(singlePostId)renderSinglePost();else if(tab==='profile'){const feed=document.getElementById('myPostsFeed');if(feed)loadProfilePosts(viewingUid||user.uid,feed)}}

async function likeComment(postId,commentId,el){if(!user){alert(lang==='el'?'Πρέπει να συνδεθείς πρώτα':'Please sign in first');return}if(event){event.preventDefault();event.stopPropagation()}const ref=db.collection('posts').doc(postId);const doc=await ref.get();if(!doc.exists)return;const p=doc.data();let comments=[...(p.comments||[])];const idx=comments.findIndex(c=>(c.id||('old_'+c.time))===commentId);if(idx===-1)return;const c={...comments[idx]};if(!c.id)c.id=commentId;const likedBy=c.likedBy||[];const isLiked=likedBy.includes(user.uid);if(isLiked){c.likedBy=likedBy.filter(id=>id!==user.uid);c.likes=Math.max(0,(c.likes||0)-1)}else{c.likedBy=[...likedBy,user.uid];c.likes=(c.likes||0)+1;playLikeSound();if(el){el.classList.add('like-pop');setTimeout(()=>el.classList.remove('like-pop'),350)}if(c.uid&&c.uid!==user.uid){const myName=await getUserName(user.uid);db.collection('notifications').add({userId:c.uid,senderId:user.uid,postId:postId,type:'comment_like',text:myName+(lang==='el'?' έκανε like στο σχόλιό σου.':' liked your comment.'),read:false,timestamp:Date.now()})}}comments[idx]=c;await ref.update({comments});if(el){el.classList.toggle('liked',!isLiked);const num=el.querySelector('.like-count');if(num)num.textContent=c.likes}if(singlePostId)renderSinglePost();else if(tab==='profile'){const feed=document.getElementById('myPostsFeed');if(feed)loadProfilePosts(viewingUid||user.uid,feed)}}

async function deleteComment(postId,commentId){if(!confirm(t('delete')+'?'))return;const ref=db.collection('posts').doc(postId);const doc=await ref.get();if(!doc.exists)return;const comments=(doc.data().comments||[]).filter(c=>(c.id||('old_'+c.time))!==commentId);await ref.update({comments});document.querySelectorAll('.comment-menu.show').forEach(m=>m.classList.remove('show'));if(singlePostId)renderSinglePost();else if(tab==='profile'){const feed=document.getElementById('myPostsFeed');if(feed)loadProfilePosts(viewingUid||user.uid,feed)}}

let editingComment = null;

function openEditComment(postId, commentId, currentText){
  editingComment = {postId, commentId};
  editingPostId = null;
  document.getElementById('editText').value = currentText || '';
  document.getElementById('editModalTitle').textContent = lang==='el' ? 'Επεξεργασία σχολίου' : 'Edit comment';
  document.getElementById('editModal').classList.add('show');
  document.querySelectorAll('.comment-menu.show').forEach(m => m.classList.remove('show'));
}

async function saveEditComment(){
  if(!editingComment) return;
  const newText = document.getElementById('editText').value.trim();
  const {postId, commentId} = editingComment;
  const ref = db.collection('posts').doc(postId);
  const doc = await ref.get();
  if(!doc.exists) return;
  let comments = [...(doc.data().comments || [])];
  const idx = comments.findIndex(c => (c.id || ('old_'+c.time)) === commentId);
  if(idx === -1) return;
  comments[idx] = {...comments[idx], text: newText};
  await ref.update({comments});
  editingComment = null;
  document.getElementById('editModal').classList.remove('show');
  document.getElementById('editModalTitle').textContent = lang==='el' ? 'Επεξεργασία' : 'Edit';
  if(singlePostId) renderSinglePost();
  else if(tab==='profile'){
    const feed = document.getElementById('myPostsFeed');
    if(feed) loadProfilePosts(viewingUid || user.uid, feed);
  }
}

function hideMentionDropdown(){const dd=document.getElementById('mentionDropdown');if(dd)dd.style.display='none';activeMentionInput=null}
function showMentionDropdown(input,users){let dd=document.getElementById('mentionDropdown');if(!dd){dd=document.createElement('div');dd.id='mentionDropdown';document.body.appendChild(dd)}if(!users.length){dd.style.display='none';return}dd.innerHTML=users.map(u=>{const handle=norm(u.name);return `<div class="mention-item" onclick="insertMention('${handle}')"><div class="avatar" style="width:28px;height:28px;font-size:12px;${u.photo?`background-image:url('${u.photo}')`:''}">${u.photo?'':'👤'}</div><div><div style="font-weight:700;font-size:13px">${esc(u.name)}</div><div class="handle" style="font-size:12px">@${esc(handle)}</div></div></div>`}).join('');const rect=input.getBoundingClientRect();dd.style.left=Math.max(8,rect.left)+'px';dd.style.width=Math.min(300,rect.width)+'px';dd.style.bottom=(window.innerHeight-rect.top+6)+'px';dd.style.top='auto';dd.style.display='block';activeMentionInput=input}
function insertMention(handle){if(!activeMentionInput)return;const inp=activeMentionInput;const val=inp.value;const cursor=inp.selectionStart||val.length;const before=val.substring(0,cursor);const after=val.substring(cursor);const atIdx=before.lastIndexOf('@');if(atIdx===-1)return;inp.value=before.substring(0,atIdx)+'@'+handle+' '+after;inp.focus();const newPos=atIdx+handle.length+2;inp.setSelectionRange(newPos,newPos);hideMentionDropdown()}
function handleMentionInput(inp){const val=inp.value;const cursor=inp.selectionStart||val.length;const before=val.substring(0,cursor);const match=before.match(/@(\w*)$/);if(!match){hideMentionDropdown();return}const query=match[1].toLowerCase();db.collection('users').limit(40).get().then(snap=>{const users=snap.docs.map(d=>({id:d.id,...d.data()})).filter(u=>{const n=norm(u.name);return n.includes(query)||(u.name||'').toLowerCase().includes(query)}).slice(0,6);showMentionDropdown(inp,users)}).catch(()=>hideMentionDropdown())}
function openMentionProfile(handle){if(!handle)return;if(event){event.preventDefault();event.stopPropagation()}const h=norm(handle);db.collection('users').limit(50).get().then(snap=>{for(const d of snap.docs){const u=d.data();const n=norm(u.name);if(n===h||n.includes(h)||h.includes(n)){openUserProfile(d.id);return}}alert(lang==='el'?'Ο χρήστης δεν βρέθηκε':'User not found')})}
document.addEventListener('input',e=>{const t=e.target;if(t&&(t.id==='postText'||(t.id&&t.id.startsWith('c_'))))handleMentionInput(t)});
document.addEventListener('click',e=>{if(!e.target.closest('#mentionDropdown')&&!e.target.closest('input'))hideMentionDropdown()});

function openShareModal(postId){if(!user){alert(lang==='el'?'Πρέπει να συνδεθείς πρώτα':'Please sign in first');return}sharePostId=postId;sharePostUrl=window.location.origin+window.location.pathname+'?post='+postId;document.getElementById('shareModalTitle').textContent=lang==='el'?'Κοινοποίηση':'Share';document.getElementById('shareAppsText').textContent=lang==='el'?'Κοινοποίηση σε εφαρμογές':'Share via apps';document.getElementById('shareCopyText').textContent=lang==='el'?'Αντιγραφή συνδέσμου':'Copy link';document.getElementById('shareRepostText').textContent=lang==='el'?'Αναδημοσίευση':'Repost';document.getElementById('shareQuoteText').textContent=lang==='el'?'Παράθεση':'Quote';document.getElementById('shareCloseText').textContent=lang==='el'?'Κλείσιμο':'Close';try{history.pushState({share:true},'');}catch(e){}db.collection('posts').doc(postId).get().then(doc=>{if(doc.exists){const p=doc.data();sharePostText=p.text||'';if((p.isRepost||p.isQuote)&&p.original)sharePostText=p.original.text||''}document.getElementById('shareModal').classList.add('show');if(typeof lucide!=='undefined')lucide.createIcons()})}
function closeShareModal(){document.getElementById('shareModal').classList.remove('show');sharePostId=null}
async function doNativeShare(){const shareData={title:'John Ross Social',text:(sharePostText||'').substring(0,120),url:sharePostUrl};if(navigator.share){try{await navigator.share(shareData);closeShareModal()}catch(e){}}else{copyFromShare()}}
function copyFromShare(){if(navigator.clipboard){navigator.clipboard.writeText(sharePostUrl).then(()=>{alert(lang==='el'?'Ο σύνδεσμος αντιγράφηκε!':'Link copied!');closeShareModal()})}else{prompt(lang==='el'?'Αντιγραφή:':'Copy:',sharePostUrl);closeShareModal()}}
async function doRepost(){if(!user||!sharePostId)return;const doc=await db.collection('posts').doc(sharePostId).get();if(!doc.exists){closeShareModal();return}const p=doc.data();const original=((p.isRepost||p.isQuote)&&p.original)?p.original:{uid:p.uid,name:p.name,photo:p.photo||'',text:p.text||'',images:p.images||[],createdAt:p.createdAt};const originalPostId=(p.isRepost||p.isQuote)?(p.originalPostId||sharePostId):sharePostId;const myDoc=await db.collection('users').doc(user.uid).get();const u=myDoc.data()||{};await db.collection('posts').add({uid:user.uid,name:u.name||user.displayName||user.email.split('@')[0],email:user.email,photo:u.photo||user.photoURL||'',text:'',images:[],isRepost:true,originalPostId:originalPostId,original:original,likes:0,likedBy:[],comments:[],createdAt:Date.now()});if(original.uid&&original.uid!==user.uid){const myName=await getUserName(user.uid);db.collection('notifications').add({userId:original.uid,senderId:user.uid,postId:originalPostId,type:'repost',text:myName+(lang==='el'?' αναδημοσίευσε τη δημοσίευσή σου.':' reposted your post.'),read:false,timestamp:Date.now()})}closeShareModal();alert(lang==='el'?'Αναδημοσιεύτηκε!':'Reposted!')}
function quoteFromShare(){
  closeShareModal();
  if(!sharePostId) return;
  db.collection('posts').doc(sharePostId).get().then(doc=>{
    if(!doc.exists) return;
    const p = doc.data();
    const original = ((p.isRepost || p.isQuote) && p.original) ? p.original : {
      uid: p.uid, name: p.name, photo: p.photo || '', text: p.text || '', images: p.images || [], createdAt: p.createdAt
    };
    const originalPostId = (p.isRepost || p.isQuote) ? (p.originalPostId || sharePostId) : sharePostId;
    pendingQuote = { originalPostId, original };
    singlePostId = null;
    tab = 'home';
    sessionStorage.setItem('jrs_tab', 'home');
    render();
    setTimeout(function(){
      var ta = document.getElementById('postText');
      if(ta){
        ta.value = '';
        ta.placeholder = lang==='el' ? 'Γράψε το σχόλιό σου στην παράθεση...' : 'Write your comment on the quote...';
        ta.focus();
      }
      var box = document.getElementById('imgPreview');
      if(box && pendingQuote){
        var o = pendingQuote.original;
        var html = '<div class="quoted-box" style="width:100%;margin-bottom:8px">';
        html += '<div style="font-size:12px;color:var(--muted);margin-bottom:4px">' + (lang==='el'?'Παράθεση':'Quote') + '</div>';
        html += '<div class="q-name">@' + esc(norm(o.name||'user')) + '</div>';
        html += '<div class="q-text">' + esc((o.text||'').substring(0,160)) + ((o.text||'').length>160?'...':'') + '</div>';
        if(o.images && o.images[0]){
          html += '<img src="' + o.images[0] + '" style="max-height:140px;border-radius:8px;margin-top:8px;width:100%;object-fit:cover">';
        }
        html += '</div>';
        box.innerHTML = html;
      }
    }, 600);
  });
}
function sharePost(postId){openShareModal(postId)}

async function toggleFollow(targetUid){if(!user||targetUid===user.uid)return;const myRef=db.collection('users').doc(user.uid);const hisRef=db.collection('users').doc(targetUid);const myDoc=await myRef.get();const following=(myDoc.data()||{}).following||[];if(following.includes(targetUid)){await myRef.update({following:firebase.firestore.FieldValue.arrayRemove(targetUid)});await hisRef.update({followers:firebase.firestore.FieldValue.arrayRemove(user.uid)})}else{await myRef.update({following:firebase.firestore.FieldValue.arrayUnion(targetUid)});await hisRef.update({followers:firebase.firestore.FieldValue.arrayUnion(user.uid)});const myName=await getUserName(user.uid);db.collection('notifications').add({userId:targetUid,senderId:user.uid,type:'follow',text:myName+(lang==='el'?' άρχισε να σε ακολουθεί.':' started following you.'),read:false,timestamp:Date.now()})}if(tab==='profile')renderProfile(document.getElementById('main'));else render()}
async function toggleMute(targetUid){if(!user||targetUid===user.uid)return;const myRef=db.collection('users').doc(user.uid);const myDoc=await myRef.get();const muted=(myDoc.data()||{}).muted||[];if(muted.includes(targetUid)){await myRef.update({muted:firebase.firestore.FieldValue.arrayRemove(targetUid)});alert(lang==='el'?'Άρση σίγασης':'Unmuted')}else{await myRef.update({muted:firebase.firestore.FieldValue.arrayUnion(targetUid)});alert(lang==='el'?'Ο χρήστης τέθηκε σε σίγαση':'User muted')}document.querySelectorAll('.post-menu.show').forEach(m=>m.classList.remove('show'));if(tab==='profile')renderProfile(document.getElementById('main'))}
async function toggleBlock(targetUid){if(!user||targetUid===user.uid)return;if(!confirm(lang==='el'?'Θέλεις να αποκλείσεις αυτόν τον χρήστη;':'Block this user?'))return;const myRef=db.collection('users').doc(user.uid);const myDoc=await myRef.get();const blocked=(myDoc.data()||{}).blocked||[];if(blocked.includes(targetUid)){await myRef.update({blocked:firebase.firestore.FieldValue.arrayRemove(targetUid)});alert(lang==='el'?'Άρση αποκλεισμού':'Unblocked')}else{await myRef.update({blocked:firebase.firestore.FieldValue.arrayUnion(targetUid),following:firebase.firestore.FieldValue.arrayRemove(targetUid)});db.collection('users').doc(targetUid).update({followers:firebase.firestore.FieldValue.arrayRemove(user.uid)});alert(lang==='el'?'Ο χρήστης αποκλείστηκε':'User blocked')}document.querySelectorAll('.post-menu.show').forEach(m=>m.classList.remove('show'));if(tab==='profile')renderProfile(document.getElementById('main'))}

function renderTextWithHashtags(text){return esc(text).replace(/#(\w+)/g,'<span class="hash" onclick="searchHashtag(\'$1\')">#$1</span>').replace(/@(\w+)/g,'<span class="mention" onclick="openMentionProfile(\'$1\')">@$1</span>')}
function searchHashtag(tag){showTab('search');setTimeout(()=>{const inp=document.querySelector('#main input');if(inp){inp.value='#'+tag;inp.dispatchEvent(new Event('input'))}},80)}
function openLightbox(src){document.getElementById('lightboxImg').src=src;document.getElementById('lightbox').classList.add('show')}
function closeLightbox(){document.getElementById('lightbox').classList.remove('show')}
function openUserProfile(uid){if(!uid)return;viewingUid=uid;singlePostId=null;showTab('profile')}
function openSharedPost(postId){singlePostId=postId;try{history.pushState({single:postId},'');}catch(e){}history.replaceState({},'',window.location.pathname);renderSinglePost()}

function renderSinglePost(){const m=document.getElementById('main');document.getElementById('bottomNav').style.display=user?'flex':'none';m.innerHTML=`<div class="single-post-header"><button onclick="singlePostId=null;history.replaceState({},'');goHome()"><i data-lucide="arrow-left" style="width:22px;height:22px"></i></button><div style="font-weight:700;font-size:17px">Post</div></div><div id="singlePostContent"><div class="empty-state">Φόρτωση...</div></div>${!user?`<div class="cta-box"><h3>${t('joinUs')}</h3><p>${t('joinDesc')}</p><button class="btn-full" style="width:100%" onclick="singlePostId=null;history.replaceState({},'');showTab('home')">${t('signIn')}</button></div>`:''}`;db.collection('posts').doc(singlePostId).get().then(doc=>{if(!doc.exists){document.getElementById('singlePostContent').innerHTML='<div class="empty-state">Το ποστ δεν βρέθηκε</div>';return}renderPosts({empty:false,docs:[doc]},document.getElementById('singlePostContent'))}).catch(()=>{document.getElementById('singlePostContent').innerHTML='<div class="empty-state">Σφάλμα</div>'});if(typeof lucide!=='undefined')lucide.createIcons()}

function render(){if(singlePostId){renderSinglePost();return}const m=document.getElementById('main');if(!user){document.getElementById('bottomNav').style.display='none';m.innerHTML=`<div class="auth-container"><div style="font-size:64px;margin-bottom:16px">👋</div><h2>John Ross Social</h2><p class="slogan">${t('slogan')}</p><div style="max-width:340px;margin:0 auto"><input id="le" placeholder="${t('email')}" type="email"><input id="lp" placeholder="${t('password')}" type="password"><button onclick="login()">${t('login')}</button><button class="btn-o" onclick="register()">${t('register')}</button><button class="btn-o" onclick="googleLogin()"><i data-lucide="chrome" style="width:16px;height:16px;vertical-align:middle"></i> ${t('google')}</button></div></div>`;if(typeof lucide!=='undefined')lucide.createIcons();return}document.getElementById('bottomNav').style.display='flex';document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home')renderHome(m);else if(tab==='search')renderSearch(m);else if(tab==='notif')renderNotifs(m);else if(tab==='profile')renderProfile(m);else if(tab==='edit')showEditProfile();else if(tab==='admin')showAdminPanel();else renderHome(m);if(typeof lucide!=='undefined')lucide.createIcons()}

function renderHome(m){pendingImages=[];m.innerHTML=`<div style="padding:14px 16px;border-bottom:1px solid var(--border)"><textarea id="postText" placeholder="${t('placeholder')}" style="width:100%;background:transparent;border:none;color:var(--text);font-size:17px;resize:none;min-height:60px;font-family:inherit;outline:none"></textarea><div id="imgPreview" class="img-preview"></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><div><input type="file" id="imgInput" accept="image/*" style="display:none" onchange="handleImageSelect(event)"><button onclick="document.getElementById('imgInput').click()" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:6px"><i data-lucide="image" style="width:22px;height:22px"></i></button></div><button class="btn-full" style="width:auto;padding:8px 22px;margin:0" onclick="postContent()">${t('post')}</button></div></div><div class="top-tabs"><button class="tab-btn ${feedType==='foryou'?'active':''}" data-feed="foryou" onclick="setFeedType('foryou')">${t('forYou')}</button><button class="tab-btn ${feedType==='following'?'active':''}" data-feed="following" onclick="setFeedType('following')">${t('following')}</button></div><div id="feed"></div>`;loadFeed();if(typeof lucide!=='undefined')lucide.createIcons()}

function loadFeed(){const f=document.getElementById('feed');if(!f)return;if(feedType==='following'){db.collection('users').doc(user.uid).get().then(doc=>{const following=(doc.data()||{}).following||[];if(following.length===0){f.innerHTML='<div class="empty-state">'+t('noFollowing')+'</div>';return}db.collection('posts').where('uid','in',following.slice(0,10)).orderBy('createdAt','desc').limit(40).onSnapshot(snap=>renderPosts(snap,f))})}else{db.collection('posts').orderBy('createdAt','desc').limit(40).onSnapshot(snap=>renderPosts(snap,f))}}

function renderPosts(snap,f){
  if(!f)return;
  if(snap.empty){f.innerHTML='<div class="empty-state">'+t('noPosts')+'</div>';return}
  f.innerHTML=snap.docs.map(function(d){
    var p=d.data(),postId=d.id;
    var isRepost=!!p.isRepost&&p.original;
    var isQuote=!!p.isQuote&&p.original;
    var isPostAdmin=isAdmin(p.email);
    var adminBadge=isPostAdmin?'<span class="admin-badge">👑 Admin</span>':'';
    var isOwner=user&&user.uid===p.uid;
    var canEdit=isOwner&&!isRepost;
    var canDelete=isOwner||(user&&isAdmin(user.email));
    var isLiked=user&&(p.likedBy||[]).includes(user.uid);
    var imgHtml='';
    if(!isRepost&&!isQuote&&p.images&&p.images[0])imgHtml='<div class="post-images"><img src="'+p.images[0]+'" onclick="openLightbox(\''+p.images[0]+'\')"></div>';
    if(isRepost&&p.original&&p.original.images&&p.original.images[0])imgHtml='<div class="post-images"><img src="'+p.original.images[0]+'" onclick="openLightbox(\''+p.original.images[0]+'\')"></div>';
    var quoteHtml='';
    if(isQuote&&p.original){
      var o=p.original;
      var oImg=(o.images&&o.images[0])?'<img src="'+o.images[0]+'" onclick="openLightbox(\''+o.images[0]+'\')">':'';
      quoteHtml='<div class="quoted-box"><div class="q-name" onclick="openUserProfile(\''+(o.uid||'')+'\')">@'+esc(norm(o.name))+'</div><div class="q-text">'+renderTextWithHashtags(o.text||'')+'</div>'+oImg+'</div>';
    }
    var commentsHtml=(p.comments||[]).map(function(c){
      var cid=c.id||('old_'+(c.time||0));
      var cLiked=user&&(c.likedBy||[]).includes(user.uid);
      var canDelComment=user&&(user.uid===c.uid||user.uid===p.uid||isAdmin(user.email));
      var displayName=c.name||'User';
      if(displayName.indexOf('@')!==-1&&displayName.indexOf('.')!==-1)displayName=displayName.split('@')[0];
      var avHtml=c.photo?'<div class="comment-avatar" style="background-image:url(\''+c.photo+'\')" onclick="openUserProfile(\''+(c.uid||'')+'\')"></div>':'<div class="comment-avatar" onclick="openUserProfile(\''+(c.uid||'')+'\')">👤</div>';
      var menuHtml='';
      if(user&&(user.uid===c.uid||canDelComment)){
        menuHtml='<div style="position:relative;margin-left:auto"><button type="button" class="comment-menu-btn" onclick="toggleCommentMenu(\''+cid+'\')"><i data-lucide="more-horizontal" style="width:14px;height:14px"></i></button><div class="comment-menu" id="cm_'+cid+'">';
        if(user.uid===c.uid){
          menuHtml+='<button type="button" onclick="openEditComment(\''+postId+'\',\''+cid+'\',\''+esc(c.text||'').replace(/'/g,"\\'")+'\')"><i data-lucide="edit-3" style="width:14px;height:14px"></i> '+t('edit')+'</button>';
        }
        if(canDelComment){
          menuHtml+='<button type="button" onclick="deleteComment(\''+postId+'\',\''+cid+'\')"><i data-lucide="trash-2" style="width:14px;height:14px"></i> '+t('delete')+'</button>';
        }
        menuHtml+='</div></div>';
      }
      return '<div class="comment">'+avHtml+'<div class="comment-info"><div class="comment-name" onclick="openUserProfile(\''+(c.uid||'')+'\')">'+esc(displayName)+'</div><div class="comment-text">'+renderTextWithHashtags(c.text||'')+'</div><div class="comment-actions"><span onclick="replyToComment(\''+postId+'\',\''+esc(displayName)+'\')"><i data-lucide="message-circle" style="width:13px;height:13px"></i> '+t('reply')+'</span><button type="button" class="comment-like-btn '+(cLiked?'liked':'')+'" onclick="likeComment(\''+postId+'\',\''+cid+'\',this)"><i data-lucide="heart" style="width:13px;height:13px"></i> <span class="like-count">'+(c.likes||0)+'</span></button>'+menuHtml+'</div></div></div>';
    }).join('');
    var headerUid=isRepost?(p.original&&p.original.uid||p.uid):p.uid;
    var headerName=isRepost?(p.original&&p.original.name||p.name):p.name;
    var headerPhoto=isRepost?(p.original&&p.original.photo||''):(p.photo||'');
    var headerAvatar=headerPhoto?'<div class="avatar" style="background-image:url(\''+headerPhoto+'\')" onclick="openUserProfile(\''+headerUid+'\')"></div>':'<div class="avatar" onclick="openUserProfile(\''+headerUid+'\')">👤</div>';
    var menuButtons='<button onclick="copyPostLink(\''+postId+'\')"><i data-lucide="link"></i> '+t('copyLink')+'</button>';
    if(canEdit)menuButtons+='<button onclick="openEditPost(\''+postId+'\',\''+esc(p.text||'').replace(/'/g,"\\'")+'\')"><i data-lucide="edit-3"></i> '+t('edit')+'</button>';
    if(canDelete)menuButtons+='<button onclick="deletePost(\''+postId+'\')"><i data-lucide="trash-2"></i> '+t('delete')+'</button>';
    if(user&&user.uid!==p.uid){
      menuButtons+='<button onclick="toggleMute(\''+p.uid+'\')"><i data-lucide="volume-x"></i> '+t('mute')+'</button>';
      menuButtons+='<button onclick="toggleBlock(\''+p.uid+'\')"><i data-lucide="slash"></i> '+t('block')+'</button>';
    }
    var repostLabel=isRepost?'<div class="repost-label"><i data-lucide="repeat-2"></i> '+esc(p.name||'User')+' '+t('reposted')+'</div>':'';
    var mainText=isRepost?(p.original&&p.original.text||''):(p.text||'');
    return '<div class="post">'+repostLabel+'<div class="post-header">'+headerAvatar+'<div class="post-info"><div class="username" onclick="openUserProfile(\''+headerUid+'\')">'+esc(headerName||'User')+' '+adminBadge+'</div><div class="handle">@'+esc(norm(headerName))+' · '+new Date(p.createdAt||Date.now()).toLocaleString()+'</div></div><div class="post-menu-container"><button class="menu-btn-icon" onclick="togglePostMenu(\''+postId+'\')"><i data-lucide="more-horizontal"></i></button><div class="post-menu" id="pm_'+postId+'">'+menuButtons+'</div></div></div><div class="post-content">'+renderTextWithHashtags(mainText)+'</div>'+imgHtml+quoteHtml+'<div class="post-actions"><span class="like-btn '+(isLiked?'liked':'')+'" onclick="likePost(\''+postId+'\',this)"><i data-lucide="thumbs-up" style="width:16px;height:16px"></i> '+(p.likes||0)+'</span><span style="display:inline-flex;align-items:center;gap:6px;cursor:pointer" onclick="focusComment(\''+postId+'\')"><i data-lucide="message-circle" style="width:16px;height:16px"></i> '+((p.comments||[]).length)+'</span><span style="display:inline-flex;align-items:center;gap:6px;cursor:pointer" onclick="sharePost(\''+postId+'\')"><i data-lucide="share-2" style="width:16px;height:16px"></i></span></div>'+(commentsHtml?'<div class="comments-section">'+commentsHtml+'</div>':'')+(user?'<div class="comment-input-row"><input id="c_'+postId+'" placeholder="'+t('comment')+'..." autocomplete="off"><button onclick="addComment(\''+postId+'\')" style="background:var(--accent);border:none;color:#fff;padding:8px 16px;border-radius:9999px;cursor:pointer"><i data-lucide="send" style="width:16px;height:16px"></i></button></div>':'')+'</div>';
  }).join('');
  if(typeof lucide!=='undefined')lucide.createIcons();
}

function renderSearch(m){m.innerHTML=`<div style="padding:12px 16px"><input placeholder="${t('search')}..." oninput="searchUsers(this.value)" style="width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:9999px;font-size:15px;outline:none"><div id="searchRes"></div></div>`}
function searchUsers(q){const out=document.getElementById('searchRes');if(!q){out.innerHTML='';return}if(q.startsWith('#')){const tag=q.substring(1).toLowerCase();db.collection('posts').where('text','>=','#'+tag).where('text','<','#'+tag+'\uf8ff').limit(15).get().then(snap=>{out.innerHTML=snap.docs.map(d=>{const p=d.data();return `<div class="post"><div class="post-content">${renderTextWithHashtags(p.text)}</div><div class="handle">${esc(p.name)}</div></div>`}).join('')||'<div class="empty-state">-</div>'});return}db.collection('users').where('name','>=',q).where('name','<=',q+'\uf8ff').limit(15).get().then(snap=>{out.innerHTML=snap.docs.map(d=>{const u=d.data(),uId=d.id;const adminBadge=isAdmin(u.email)?'<span class="admin-badge">👑 Admin</span>':'';const avatar=u.photo?`<div class="avatar" style="background-image:url('${u.photo}')"></div>`:`<div class="avatar">👤</div>`;return `<div class="post" onclick="openUserProfile('${uId}')" style="cursor:pointer"><div class="post-header">${avatar}<div class="post-info"><div class="username">${esc(u.name)} ${adminBadge}</div><div class="handle">${esc(u.bio||'')}</div></div></div></div>`}).join('')||'<div class="empty-state">-</div>';if(typeof lucide!=='undefined')lucide.createIcons()})}

function listenUnreadNotifs(userId){db.collection('notifications').where('userId','==',userId).where('read','==',false).onSnapshot(snap=>{const badge=document.getElementById('notifBadge');if(badge)badge.style.display=snap.empty?'none':'block'},()=>{})}
function markNotifRead(notifId){if(!notifId)return;db.collection('notifications').doc(notifId).update({read:true}).catch(()=>{})}
function renderNotifs(m){m.innerHTML='<div class="empty-state">Φόρτωση...</div>';db.collection('notifications').where('userId','==',user.uid).limit(50).get().then(async snap=>{if(snap.empty){m.innerHTML='<div class="empty-state">'+t('noNotifs')+'</div>';return}const docs=snap.docs.sort((a,b)=>(b.data().timestamp||0)-(a.data().timestamp||0));let html='';for(const d of docs){const n=d.data();let displayText=n.text||'';if(n.senderId){try{const realName=await getUserName(n.senderId);displayText=displayText.replace(/^[^ ]+/,realName)}catch(e){}}let clickAction=`markNotifRead('${d.id}');`;if(n.postId)clickAction+=`openSharedPost('${n.postId}')`;else if(n.senderId)clickAction+=`openUserProfile('${n.senderId}')`;const isUnread=(n.read===false||n.read===undefined);html+=`<div class="notif-item ${isUnread?'unread':''}" onclick="${clickAction}"><div class="notif-content"><div style="font-size:15px;margin-bottom:4px">${esc(displayText)}</div><div class="handle">${new Date(n.timestamp||Date.now()).toLocaleString()}</div></div>${isUnread?'<span class="notif-dot">🔴</span>':''}</div>`}m.innerHTML=html}).catch(()=>{m.innerHTML='<div class="empty-state">Σφάλμα</div>'})}

function loadProfilePosts(uid,feedEl){db.collection('posts').where('uid','==',uid).limit(30).get().then(snap=>{const docs=snap.docs.sort((a,b)=>(b.data().createdAt||0)-(a.data().createdAt||0));renderPosts({empty:docs.length===0,docs},feedEl)})}
function showUserList(uid,type){tab='userlist';const m=document.getElementById('main');m.innerHTML=`<div class="profile"><h2 style="margin-bottom:16px">${type==='followers'?t('followers'):t('following2')}</h2><div id="userList"><div class="empty-state">Φόρτωση...</div></div><button class="btn-outline" style="margin-top:20px" onclick="viewingUid='${uid}';showTab('profile')">← Πίσω</button></div>`;db.collection('users').doc(uid).get().then(doc=>{const data=doc.data()||{};const ids=type==='followers'?(data.followers||[]):(data.following||[]);if(ids.length===0){document.getElementById('userList').innerHTML=`<div class="empty-state">${t('noUsers')}</div>`;return}Promise.all(ids.slice(0,25).map(id=>db.collection('users').doc(id).get())).then(snaps=>{const html=snaps.map(s=>{if(!s.exists)return'';const u=s.data();const avatar=u.photo?`<div class="avatar" style="background-image:url('${u.photo}')"></div>`:`<div class="avatar">👤</div>`;return `<div class="user-list-item" onclick="openUserProfile('${s.id}')">${avatar}<div><div style="font-weight:700">${esc(u.name||'User')}</div><div class="handle">@${esc(norm(u.name))}</div></div></div>`}).join('');document.getElementById('userList').innerHTML=html||`<div class="empty-state">${t('noUsers')}</div>`})})}

function renderProfile(m){const targetUid=viewingUid||user.uid;const isOwn=targetUid===user.uid;db.collection('users').doc(targetUid).get().then(doc=>{const u=doc.data()||{};const admin=isAdmin(u.email);const following=(u.following||[]).length;const followers=(u.followers||[]).length;db.collection('users').doc(user.uid).get().then(myDoc=>{const myData=myDoc.data()||{};const isFollowing=(myData.following||[]).includes(targetUid);const isMuted=(myData.muted||[]).includes(targetUid);const isBlocked=(myData.blocked||[]).includes(targetUid);const avatarContent=u.photo?`<div class="avatar avatar-lg" style="background-image:url('${u.photo}');margin:0 auto;cursor:pointer" onclick="openLightbox('${u.photo}')"></div>`:`<div class="avatar avatar-lg" style="margin:0 auto">👤</div>`;let actionButtons='';if(!isOwn){actionButtons=`<div class="profile-actions"><button class="btn-follow ${isFollowing?'following':''}" onclick="toggleFollow('${targetUid}')">${isFollowing?t('unfollow'):t('follow')}</button><button class="btn-outline" onclick="toggleMute('${targetUid}')">${isMuted?t('unmute'):t('mute')}</button><button class="btn-outline" style="border-color:var(--accent);color:var(--accent)" onclick="toggleBlock('${targetUid}')">${isBlocked?t('unblock'):t('block')}</button></div>`}m.innerHTML=`<div class="profile"><div class="profile-header">${avatarContent}<h2 style="font-size:20px;margin-top:14px;font-weight:800">${esc(u.name||'User')} ${admin?'<span class="admin-badge">👑 Admin</span>':''}</h2><div class="handle">@${esc(norm(u.name))}</div><p style="color:var(--muted);margin:10px 0;font-size:15px">${esc(u.bio||'')}</p><div class="profile-stats"><span onclick="showUserList('${targetUid}','followers')"><b>${followers}</b> ${t('followers')}</span><span onclick="showUserList('${targetUid}','following')"><b>${following}</b> ${t('following2')}</span></div>${actionButtons}</div><h3 style="margin:20px 0 12px;font-size:16px;font-weight:700">${t('myPosts')}</h3><div id="myPostsFeed"><div class="empty-state">Φόρτωση...</div></div></div>`;loadProfilePosts(targetUid,document.getElementById('myPostsFeed'));if(typeof lucide!=='undefined')lucide.createIcons()})})}

function showEditProfile(){tab='edit';sessionStorage.setItem('jrs_tab','edit');const m=document.getElementById('main');db.collection('users').doc(user.uid).get().then(doc=>{const u=doc.data()||{};m.innerHTML=`<div class="profile"><h2 style="margin-bottom:20px;font-weight:800">${t('editProfile')}</h2><div style="text-align:center;margin-bottom:20px">${u.photo?`<div class="avatar avatar-lg" style="background-image:url('${u.photo}');margin:0 auto;cursor:pointer" onclick="document.getElementById('photoInput').click()"></div>`:`<div class="avatar avatar-lg" style="margin:0 auto;cursor:pointer" onclick="document.getElementById('photoInput').click()">👤</div>`}<input type="file" id="photoInput" accept="image/*" style="display:none" onchange="uploadPhoto(event)"><button class="btn-outline" style="margin-top:10px" onclick="document.getElementById('photoInput').click()"><i data-lucide="camera" style="width:14px;height:14px;vertical-align:middle"></i> ${t('changePic')}</button></div><div class="profile-form"><input id="newName" placeholder="${t('profile')}" value="${esc(u.name||'')}"><textarea id="newBio" placeholder="${t('bio')}">${esc(u.bio||'')}</textarea><button onclick="saveProfile()">${t('save')}</button></div></div>`;if(typeof lucide!=='undefined')lucide.createIcons()})}
function showSettings(){const m=document.getElementById('main');const isLight=document.body.classList.contains('light');m.innerHTML=`<div class="profile"><h2 style="margin-bottom:20px;font-weight:800">${t('settings')}</h2><div class="profile-form"><label style="display:block;margin:10px 0;color:var(--muted)">${t('language')}</label><button onclick="toggleLang();showSettings()">${lang==='en'?'🇬🇧 English → Ελληνικά':'🇬🇷 Ελληνικά → English'}</button><label style="display:block;margin:20px 0 10px;color:var(--muted)">Theme</label><button onclick="toggleTheme();showSettings()">${isLight?'☀️ '+t('lightMode')+' → 🌙 '+t('darkMode'):'🌙 '+t('darkMode')+' → ☀️ '+t('lightMode')}</button></div></div>`}
function showAdminPanel(){if(!user||!isAdmin(user.email))return;tab='admin';sessionStorage.setItem('jrs_tab','admin');const m=document.getElementById('main');m.innerHTML=`<div class="profile"><h2 style="margin-bottom:8px;font-weight:800">🛡️ ${t('adminPanel')}</h2><div class="admin-stats" id="adminStats"><div class="stat-card"><b>...</b><span>${t('totalUsers')}</span></div><div class="stat-card"><b>...</b><span>${t('totalPosts')}</span></div></div><h3 style="margin:24px 0 12px;font-size:16px">${t('recentActivity')}</h3><div id="adminActivity" class="empty-state">Φόρτωση...</div></div>`;Promise.all([db.collection('users').get(),db.collection('posts').get()]).then(([u,p])=>{document.getElementById('adminStats').innerHTML=`<div class="stat-card"><b>${u.size}</b><span>${t('totalUsers')}</span></div><div class="stat-card"><b>${p.size}</b><span>${t('totalPosts')}</span></div>`});db.collection('notifications').orderBy('timestamp','desc').limit(20).get().then(async snap=>{const act=document.getElementById('adminActivity');if(snap.empty){act.innerHTML='<div class="empty-state">-</div>';return}let html='';for(const d of snap.docs){const n=d.data();let displayText=n.text||'';if(n.senderId){try{const realName=await getUserName(n.senderId);displayText=displayText.replace(/^[^ ]+/,realName)}catch(e){}}let click='';if(n.postId)click=`onclick="openSharedPost('${n.postId}')"`;else if(n.senderId)click=`onclick="openUserProfile('${n.senderId}')"`;const isUnread=(n.read===false||n.read===undefined);html+=`<div class="notif-item ${isUnread?'unread':''}" ${click}><div class="notif-content"><div style="font-size:14px">${esc(displayText)}</div><div class="handle">${new Date(n.timestamp).toLocaleString()}</div></div>${isUnread?'<span class="notif-dot">🔴</span>':''}</div>`}act.innerHTML=html})}
function uploadPhoto(event){const file=event.target.files[0];if(!file)return;compressImage(file).then(data=>{db.collection('users').doc(user.uid).update({photo:data}).then(()=>{db.collection('posts').where('uid','==',user.uid).get().then(snap=>{const batch=db.batch();let count=0;snap.docs.forEach(doc=>{if(count<400){batch.update(doc.ref,{photo:data});count++}});if(count>0)batch.commit();alert(lang==='el'?'Ενημερώθηκε!':'Updated!');showEditProfile()})})}).catch(()=>alert('Error'))}
function saveProfile(){const name=document.getElementById('newName').value;const bio=document.getElementById('newBio').value;db.collection('users').doc(user.uid).set({name,bio},{merge:true}).then(()=>{db.collection('posts').where('uid','==',user.uid).get().then(snap=>{const batch=db.batch();let count=0;snap.docs.forEach(doc=>{if(count<400){batch.update(doc.ref,{name});count++}});if(count>0)batch.commit()});alert(lang==='el'?'Αποθηκεύτηκε!':'Saved!');viewingUid=null;showTab('profile')})}

document.addEventListener('click',e=>{if(!e.target.closest('.post-menu-container')&&!e.target.closest('.comment-menu')&&!e.target.closest('.comment-menu-btn')){document.querySelectorAll('.post-menu.show, .comment-menu.show').forEach(m=>m.classList.remove('show'))}const shareModal=document.getElementById('shareModal');if(shareModal&&shareModal.classList.contains('show')&&e.target===shareModal)closeShareModal()});

try{history.replaceState({tab},'');}catch(e){}
loadTheme();
</script>
<script>lucide.createIcons();</script>
</body>
</html>
