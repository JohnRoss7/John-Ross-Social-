<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>John Ross Social</title>
<meta name="theme-color" content="#000000">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#000;--text:#e7e9ea;--muted:#71767b;--border:#2f3336;--card:#16181c;--accent:#dc2626;--hover:rgba(255,255,255,.03);--blue:#1d9bf0}
body.light{--bg:#fff;--text:#0f1419;--muted:#536471;--border:#eff3f4;--card:#f7f9f9;--accent:#dc2626;--hover:rgba(0,0,0,.03);--blue:#1d9bf0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none}
.app-container{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:70px;background:var(--bg);border-left:1px solid var(--border);border-right:1px solid var(--border)}
.sidebar{position:fixed;top:0;left:-280px;width:280px;height:100vh;background:var(--bg);border-right:1px solid var(--border);z-index:1000;transition:left .3s;display:flex;flex-direction:column}
.sidebar.show{left:0}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border)}
.logo-box{background:var(--accent);color:#fff;padding:8px 14px;border-radius:20px;font-weight:700;font-size:14px}
#close-sidebar{background:none;border:none;color:var(--text);font-size:28px;cursor:pointer}
.sidebar-nav{flex:1;padding:12px;overflow-y:auto}
.sidebar-nav a{display:flex;align-items:center;gap:14px;padding:14px 16px;color:var(--text);text-decoration:none;border-radius:9999px;font-size:17px;font-weight:500;cursor:pointer;margin-bottom:4px}
.sidebar-nav a:hover,.sidebar-nav a.active{background:var(--card)}
.sidebar-nav a i{width:22px;height:22px}
.sidebar-nav hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.admin-link{background:var(--card)!important;border:1px solid var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;display:none}
.overlay.show{display:block}
.main-header{position:sticky;top:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 16px;z-index:100;display:flex;align-items:center;gap:10px}
body.light .main-header{background:rgba(255,255,255,.85)}
.menu-btn{background:none;border:none;color:var(--text);cursor:pointer;padding:6px}
.menu-btn i{width:24px;height:24px}
.logo-text{font-weight:700;font-size:17px}
.slogan-badge{background:var(--accent);color:#fff;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap}
.top-tabs{display:flex;border-bottom:1px solid var(--border)}
.tab-btn{flex:1;padding:16px;background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;border-bottom:3px solid transparent;font-weight:500}
.tab-btn.active{color:var(--text);border-bottom-color:var(--accent);font-weight:700}
.post{border-bottom:1px solid var(--border);padding:14px 16px}
.post:hover{background:var(--hover)}
.post-header{display:flex;gap:12px;margin-bottom:6px;align-items:flex-start}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#dc2626,#7c2d12);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden;background-size:cover;background-position:center;color:#fff;cursor:pointer}
.avatar-lg{width:110px;height:110px;font-size:48px;border-radius:16px}
.post-info{flex:1;min-width:0}
.username{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;cursor:pointer}
.handle{color:var(--muted);font-size:14px}
.post-content{font-size:15px;line-height:1.5;margin:4px 0 10px;word-wrap:break-word;white-space:pre-wrap}
.post-images{margin:10px 0;border-radius:12px;overflow:hidden}
.post-images img{width:100%;max-height:380px;object-fit:cover;border-radius:12px;cursor:pointer}
.hash{color:var(--accent)!important;font-weight:600;cursor:pointer}
.mention{color:var(--accent)!important;font-weight:600;cursor:pointer;user-select:none;-webkit-user-select:none}
.post-actions{display:flex;gap:28px;color:var(--muted);font-size:13px;margin-top:10px;align-items:center}
.post-actions span{display:flex;align-items:center;gap:6px;cursor:pointer}
.like-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;border:1.5px solid transparent;transition:all .2s}
.like-btn.liked{background:var(--accent);border-color:var(--accent);color:#fff !important}
.like-btn.liked svg{color:#fff !important;fill:#fff}
@keyframes likePop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.like-pop{animation:likePop .3s ease}
.comments-section{margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.comment{padding:12px 0;display:flex;gap:10px;position:relative}
.comment-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#dc2626,#7c2d12);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;overflow:hidden;background-size:cover;background-position:center;cursor:pointer}
.comment-info{flex:1;min-width:0}
.comment-name{font-weight:700;font-size:13px;cursor:pointer}
.comment-text{font-size:14px;margin-top:2px;line-height:1.4;word-wrap:break-word}
.comment-actions{display:flex;align-items:center;gap:12px;margin-top:8px;color:var(--muted);font-size:12px}
.comment-like-btn{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 10px;color:var(--muted);font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.comment-like-btn.liked{background:rgba(220,38,38,.15);border-color:var(--accent);color:var(--accent)!important}
.comment-like-btn.liked svg{fill:var(--accent)!important;stroke:var(--accent)!important}
.comment-menu-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;margin-left:auto}
.comment-menu{position:absolute;right:0;top:28px;background:var(--card);border:1px solid var(--border);border-radius:12px;min-width:140px;z-index:40;display:none;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.comment-menu.show{display:block}
.comment-menu button{width:100%;background:none;border:none;color:var(--text);padding:11px 14px;text-align:left;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px}
.comment-menu button:hover{background:var(--accent);color:#fff}
.comment-input-row{display:flex;gap:8px;margin-top:12px}
.comment-input-row input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:9999px;font-size:14px;outline:none}
.post-menu-container{position:relative;margin-left:auto}
.menu-btn-icon{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px}
.post-menu{position:absolute;right:0;top:28px;background:var(--card);border:1px solid var(--border);border-radius:12px;min-width:170px;z-index:50;display:none;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.post-menu.show{display:block}
.post-menu button{width:100%;background:none;border:none;color:var(--text);padding:12px 16px;text-align:left;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px}
.post-menu button:hover{background:var(--accent);color:#fff}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0;max-width:600px;margin:0 auto;z-index:100}
body.light .bottom-nav{background:rgba(255,255,255,.92)}
.nav-item{background:none;border:none;color:var(--muted);padding:8px 18px;cursor:pointer;position:relative}
.nav-item.active{color:var(--accent)}
.nav-item i{width:26px;height:26px}
.nav-badge{position:absolute;top:6px;right:14px;width:9px;height:9px;background:var(--accent);border-radius:50%;display:none}
.auth-container{text-align:center;padding:50px 24px}
.auth-container h2{margin-bottom:8px;font-size:28px;font-weight:800}
.auth-container .slogan{color:var(--muted);margin-bottom:32px}
.auth-container input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:14px 18px;border-radius:9999px;margin:8px 0;font-size:15px;max-width:340px;outline:none}
.auth-container button{width:100%;max-width:340px;background:var(--accent);color:#fff;border:none;padding:14px;border-radius:9999px;font-weight:700;cursor:pointer;font-size:15px;margin:8px 0}
.auth-container .btn-o{background:transparent;border:1px solid var(--border);color:var(--text)}
.profile{padding:20px}
.profile-header{text-align:center;margin-bottom:20px}
.profile-stats{display:flex;justify-content:center;gap:36px;margin:18px 0;color:var(--muted);font-size:14px}
.profile-stats b{color:var(--text);font-size:20px;display:block}
.profile-stats span{cursor:pointer}
.profile-form input,.profile-form textarea{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:16px;margin:8px 0;font-size:15px;font-family:inherit;outline:none}
.profile-form textarea{border-radius:12px;min-height:70px;resize:vertical}
.profile-form button{width:100%;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:9999px;font-weight:700;cursor:pointer;margin-top:12px}
.btn-full{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:9999px;font-weight:700;cursor:pointer;font-size:14px}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 18px;border-radius:9999px;cursor:pointer;font-size:14px}
.btn-follow{background:var(--text);color:var(--bg);border:none;padding:8px 20px;border-radius:9999px;font-weight:700;cursor:pointer;font-size:14px}
.btn-follow.following{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.profile-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.empty-state{padding:50px 20px;text-align:center;color:var(--muted);font-size:15px}
.admin-badge{background:var(--accent);color:#fff;padding:2px 7px;border-radius:8px;font-size:11px;font-weight:600}
.notif-item{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:flex-start;gap:10px}
.notif-item:hover{background:var(--hover)}
.notif-item.unread{background:rgba(29,155,240,0.15)!important;border-left:4px solid var(--blue)}
.notif-content{flex:1}
.notif-dot{font-size:13px;margin-top:2px}
.img-preview{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.img-preview img{width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:90vh;border-radius:8px;object-fit:contain}
.lightbox-close{position:absolute;top:16px;right:16px;background:none;border:none;color:#fff;font-size:32px;cursor:pointer}
.user-list-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.edit-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1500;display:none;align-items:center;justify-content:center;padding:20px}
.edit-modal.show{display:flex}
.edit-box{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:400px}
.edit-box textarea{width:100%;min-height:100px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:12px;font-size:15px;font-family:inherit;resize:vertical;outline:none}
.edit-actions{display:flex;gap:10px;margin-top:14px}
.edit-actions button{flex:1;padding:12px;border-radius:9999px;font-weight:700;cursor:pointer;border:none}
.single-post-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.single-post-header button{background:none;border:none;color:var(--text);cursor:pointer}
.cta-box{margin:20px 16px;padding:20px;background:var(--card);border-radius:16px;text-align:center;border:1px solid var(--border)}
.repost-label{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.quoted-box{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:10px;background:var(--hover)}
.quoted-box .q-name{font-weight:700;font-size:13px;cursor:pointer;color:var(--accent)}
.quoted-box .q-text{font-size:14px;margin-top:4px}
.quoted-box img{width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-top:8px;cursor:pointer}
#mentionDropdown{display:none;position:fixed;background:var(--card);border:1px solid var(--border);border-radius:12px;max-height:180px;overflow-y:auto;z-index:300;box-shadow:0 4px 20px rgba(0,0,0,.5)}
#mentionDropdown .mention-item{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;border-bottom:1px solid var(--border)}
#mentionDropdown .mention-item:hover{background:var(--hover)}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<aside id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <div class="logo-box">John Ross Social</div>
    <button id="close-sidebar" onclick="closeSidebar()">&times;</button>
  </div>
  <nav class="sidebar-nav">
    <a onclick="goHome();closeSidebar()"><i data-lucide="home"></i> Home</a>
    <a onclick="goProfile();closeSidebar()"><i data-lucide="user"></i> Profile</a>
    <a onclick="showEditProfile();closeSidebar()"><i data-lucide="edit-3"></i> Edit Profile</a>
    <a onclick="aiAssistant();closeSidebar()"><i data-lucide="bot"></i> AI Assistant</a>
    <a onclick="settings();closeSidebar()"><i data-lucide="settings"></i> Settings</a>
    <a onclick="clearCache();closeSidebar()"><i data-lucide="trash-2"></i> Εκκαθάριση Cache</a>
    <div id="adminMenuItem" style="display:none"><hr><a class="admin-link" onclick="showAdminPanel();closeSidebar()"><i data-lucide="shield"></i> Admin Panel</a></div>
    <hr>
    <a onclick="logout();closeSidebar()"><i data-lucide="log-out"></i> Logout</a>
  </nav>
</aside>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <img id="lightboxImg" src="" alt="">
</div>

<div class="edit-modal" id="editModal">
  <div class="edit-box">
    <h3 style="margin-bottom:12px;font-weight:700" id="editModalTitle">Επεξεργασία</h3>
    <textarea id="editText"></textarea>
    <div class="edit-actions">
      <button style="background:var(--border);color:var(--text)" onclick="closeEditModal()">Ακύρωση</button>
      <button style="background:var(--accent);color:#fff" onclick="saveEditPost()">Αποθήκευση</button>
    </div>
  </div>
</div>

<div class="edit-modal" id="shareModal">
  <div class="edit-box">
    <h3 style="margin-bottom:16px;font-weight:700" id="shareModalTitle">Κοινοποίηση</h3>
    <button class="btn-full" style="width:100%;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px" onclick="doNativeShare()">
      <i data-lucide="share-2" style="width:18px;height:18px"></i> <span id="shareAppsText">Κοινοποίηση σε εφαρμογές</span>
    </button>
    <button class="btn-outline" style="width:100%;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px" onclick="copyFromShare()">
      <i data-lucide="link" style="width:18px;height:18px"></i> <span id="shareCopyText">Αντιγραφή συνδέσμου</span>
    </button>
    <button class="btn-outline" style="width:100%;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px" onclick="doRepost()">
      <i data-lucide="repeat-2" style="width:18px;height:18px"></i> <span id="shareRepostText">Αναδημοσίευση</span>
    </button>
    <button class="btn-outline" style="width:100%;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px" onclick="quoteFromShare()">
      <i data-lucide="quote" style="width:18px;height:18px"></i> <span id="shareQuoteText">Παράθεση</span>
    </button>
    <button style="width:100%;padding:12px;border-radius:9999px;border:none;background:var(--border);color:var(--text);font-weight:600;cursor:pointer;margin-top:6px" onclick="closeShareModal()">
      <span id="shareCloseText">Κλείσιμο</span>
    </button>
  </div>
</div>

<main class="app-container">
  <header class="main-header">
    <button class="menu-btn" onclick="openSidebar()"><i data-lucide="menu"></i></button>
    <div class="logo-text">John Ross Social</div>
    <div class="slogan-badge">Your space. Your voice.</div>
  </header>
  <div id="main"></div>
  <nav class="bottom-nav" id="bottomNav" style="display:none">
    <button class="nav-item" data-tab="home" onclick="showTab('home')"><i data-lucide="home"></i></button>
    <button class="nav-item" data-tab="search" onclick="showTab('search')"><i data-lucide="search"></i></button>
    <button class="nav-item" data-tab="notif" onclick="showTab('notif')"><i data-lucide="bell"></i><span class="nav-badge" id="notifBadge"></span></button>
    <button class="nav-item" data-tab="profile" onclick="showTab('profile')"><i data-lucide="user"></i></button>
  </nav>
</main>

function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,'')}

function toggleLang(){lang=lang==='en'?'el':'en';localStorage.setItem('jrs_lang',lang);render()}
function toggleTheme(){document.body.classList.toggle('light');localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark')}
function loadTheme(){if(localStorage.getItem('theme')==='light')document.body.classList.add('light')}

function openSidebar(){document.getElementById('sidebar').classList.add('show');document.getElementById('overlay').classList.add('show')}
function closeSidebar(){document.getElementById('sidebar').classList.remove('show');document.getElementById('overlay').classList.remove('show')}
function goHome(){singlePostId=null;showTab('home')}
function goProfile(){viewingUid=null;singlePostId=null;showTab('profile')}
function aiAssistant(){alert(t('comingSoon'))}
function settings(){showSettings()}
function clearCache(){if(confirm(lang==='el'?'Θέλεις να καθαρίσεις την προσωρινή μνήμη;':'Clear cache?')){localStorage.clear();sessionStorage.clear();location.reload(true);}}

function showTab(name, fromBack){
  if(!fromBack && tab !== name){historyStack.push(tab);if(historyStack.length>8)historyStack.shift();try{history.pushState({tab:name},'');}catch(e){}}
  tab=name;singlePostId=null;sessionStorage.setItem('jrs_tab',name);
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  render();if(typeof lucide!=='undefined')lucide.createIcons();
}

window.addEventListener('popstate',()=>{
  const shareModal=document.getElementById('shareModal');
  if(shareModal&&shareModal.classList.contains('show')){closeShareModal();try{history.pushState({tab},'');}catch(e){}return;}
  if(singlePostId){singlePostId=null;render();return;}
  if(historyStack.length>0){showTab(historyStack.pop(),true);}else{showTab('home',true);}
});

function setFeedType(type){feedType=type;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.feed===type));renderHome(document.getElementById('main'));if(typeof lucide!=='undefined')lucide.createIcons();}

function checkSharedPost(){const p=new URLSearchParams(window.location.search).get('post');if(p){singlePostId=p;return true;}return false;}

auth.onAuthStateChanged(u=>{
  user=u;
  const ai=document.getElementById('adminMenuItem');
  if(ai)ai.style.display=(u&&isAdmin(u.email))?'block':'none';
  if(checkSharedPost())renderSinglePost();else render();

function login(){const e=document.getElementById('le').value,p=document.getElementById('lp').value;auth.signInWithEmailAndPassword(e,p).catch(err=>alert(err.message))}
function register(){const e=document.getElementById('le').value,p=document.getElementById('lp').value;if(!e||!p)return alert(lang==='el'?'Συμπλήρωσε email και κωδικό':'Fill email & password');auth.createUserWithEmailAndPassword(e,p).then(cred=>db.collection('users').doc(cred.user.uid).set({email:e,name:e.split('@')[0],bio:'',photo:'',followers:[],following:[],muted:[],blocked:[],createdAt:Date.now()})).catch(err=>alert(err.message))}
function googleLogin(){const provider=new firebase.auth.GoogleAuthProvider();auth.signInWithPopup(provider).then(cred=>saveUserToDb(cred.user)).catch(err=>{if(err.code==='auth/popup-blocked')auth.signInWithRedirect(provider);else alert(err.message)})}
function saveUserToDb(u){db.collection('users').doc(u.uid).set({email:u.email,name:u.displayName||u.email.split('@')[0],bio:'',photo:u.photoURL||'',followers:[],following:[],muted:[],blocked:[],createdAt:Date.now()},{merge:true})}
function logout(){auth.signOut();sessionStorage.removeItem('jrs_tab');historyStack=[];singlePostId=null}

async function getUserName(uid){try{const doc=await db.collection('users').doc(uid).get();if(doc.exists)return doc.data().name||'User'}catch(e){}return 'User'}

function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{try{const MAX=600;let w=img.width,h=img.height;if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX}}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);let data=canvas.toDataURL('image/jpeg',0.42);if(data.length>280000)data=canvas.toDataURL('image/jpeg',0.30);resolve(data)}catch(err){reject(err)}};img.onerror=()=>reject(new Error('load fail'));img.src=e.target.result};reader.onerror=()=>reject(new Error('read fail'));reader.readAsDataURL(file)})}

async function handleImageSelect(e){const file=e.target.files[0];if(!file)return;pendingImages=[];try{if(file.size>25*1024*1024){alert(lang==='el'?'Πολύ μεγάλη':'Too large');return}const compressed=await compressImage(file);pendingImages=[compressed];renderImagePreview()}catch(err){alert(lang==='el'?'Δεν μπόρεσε να επεξεργαστεί.':'Could not process photo.')}e.target.value=''}
function renderImagePreview(){const box=document.getElementById('imgPreview');if(!box||pendingQuote)return;box.innerHTML=pendingImages.map(src=>`<div style="position:relative;display:inline-block"><img src="${src}"><button style="position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:14px;cursor:pointer" onclick="removeImage()">×</button></div>`).join('')}
function removeImage(){pendingImages=[];renderImagePreview()}

async function notifyMentions(text,fromUid,fromName,postId){if(!text)return;const mentions=text.match(/@(\w+)/g)||[];const unique=[...new Set(mentions.map(m=>m.substring(1).toLowerCase()))];for(const handle of unique){try{const snap=await db.collection('users').limit(40).get();for(const d of snap.docs){const u=d.data();if(norm(u.name)===handle&&d.id!==fromUid){db.collection('notifications').add({userId:d.id,senderId:fromUid,postId:postId||null,type:'mention',text:fromName+(lang==='el'?' σε ανέφερε.':' mentioned you.'),read:false,timestamp:Date.now()})}}}catch(e){}}}

function postContent(){const ta=document.getElementById('postText');if(!ta.value.trim()&&pendingImages.length===0&&!pendingQuote)return;db.collection('users').doc(user.uid).get().then(doc=>{const u=doc.data()||{};const name=u.name||user.displayName||user.email.split('@')[0];const postData={uid:user.uid,name:name,email:user.email,photo:u.photo||user.photoURL||'',text:ta.value,images:pendingImages,likes:0,likedBy:[],comments:[],createdAt:Date.now(),isRepost:false,isQuote:false};if(pendingQuote){postData.isQuote=true;postData.originalPostId=pendingQuote.originalPostId;postData.original=pendingQuote.original}db.collection('posts').add(postData).then(ref=>{notifyMentions(ta.value,user.uid,name,ref.id);if(pendingQuote&&pendingQuote.original&&pendingQuote.original.uid&&pendingQuote.original.uid!==user.uid){db.collection('notifications').add({userId:pendingQuote.original.uid,senderId:user.uid,postId:ref.id,type:'quote',text:name+(lang==='el'?' παρέθεσε τη δημοσίευσή σου.':' quoted your post.'),read:false,timestamp:Date.now()})}});ta.value='';ta.placeholder=t('placeholder');pendingImages=[];pendingQuote=null;const box=document.getElementById('imgPreview');if(box)box.innerHTML=''})}

function playLikeSound(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type='square';osc.frequency.setValueAtTime(520,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(780,ctx.currentTime+0.07);osc.frequency.exponentialRampToValueAtTime(380,ctx.currentTime+0.14);gain.gain.setValueAtTime(0.35,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.18);osc.start(ctx.currentTime);osc.stop(ctx.currentTime+0.18)}catch(e){}}

async function likePost(id,el){if(!user){alert(lang==='el'?'Πρέπει να συνδεθείς πρώτα':'Please sign in first');return}const ref=db.collection('posts').doc(id);const doc=await ref.get();const p=doc.data();const liked=(p.likedBy||[]).includes(user.uid);if(liked){await ref.update({likes:firebase.firestore.FieldValue.increment(-1),likedBy:firebase.firestore.FieldValue.arrayRemove(user.uid)})}else{await ref.update({likes:firebase.firestore.FieldValue.increment(1),likedBy:firebase.firestore.FieldValue.arrayUnion(user.uid)});playLikeSound();if(el){el.classList.add('like-pop');setTimeout(()=>el.classList.remove('like-pop'),350)}if(p.uid!==user.uid){const myName=await getUserName(user.uid);db.collection('notifications').add({userId:p.uid,senderId:user.uid,postId:id,type:'like',text:myName+(lang==='el'?' έκανε like στη δημοσίευσή σου.':' liked your post.'),read:false,timestamp:Date.now()})}}if(singlePostId)renderSinglePost();else if(tab==='profile'){setTimeout(()=>{const feed=document.getElementById('myPostsFeed');if(feed)loadProfilePosts(viewingUid||user.uid,feed)},280)}}

async function addComment(postId){if(!user){alert(lang==='el'?'Πρέπει να συνδεθείς πρώτα':'Please sign in first');return}const inp=document.getElementById('c_'+postId);if(!inp||!inp.value.trim())return;const text=inp.value.trim();const doc=await db.collection('posts').doc(postId).get();const p=doc.data();const myDoc=await db.collection('users').doc(user.uid).get();const ud=myDoc.data()||{};const myName=ud.name||user.displayName||user.email.split('@')[0];const myPhoto=ud.photo||'';const commentObj={id:genId(),uid:user.uid,name:myName,photo:myPhoto,email:user.email,text:text,time:Date.now(),likes:0,likedBy:[]};await db.collection('posts').doc(postId).update({comments:firebase.firestore.FieldValue.arrayUnion(commentObj)});if(p.uid!==user.uid){db.collection('notifications').add({userId:p.uid,senderId:user.uid,postId:postId,type:'comment',text:myName+(lang==='el'?' σχολίασε τη δημοσίευσή σου.':' commented on your post.'),read:false,timestamp:Date.now()})}notifyMentions(text,user.uid,myName,postId);inp.value='';hideMentionDropdown();if(singlePostId)renderSinglePost();else if(tab==='profile'){const feed=document.getElementById('myPostsFeed');if(feed)loadProfilePosts(viewingUid||user.uid,feed)}}

async function likeComment(postId,commentId,el){if(!user){alert(lang==='el'?'Πρέπει να συνδεθείς πρώτα':'Please sign in first');return}if(event){event.preventDefault();event.stopPropagation()}const ref=db.collection('posts').doc(postId);const doc=await ref.get();if(!doc.exists)return;const p=doc.data();let comments=[...(p.comments||[])];const idx=comments.findIndex(c=>(c.id||('old_'+c.time))===commentId);if(idx===-1)return;const c={...comments[idx]};if(!c.id)c.id=commentId;const likedBy=c.likedBy||[];const isLiked=likedBy.includes(user.uid);if(isLiked){c.likedBy=likedBy.filter(id=>id!==user.uid);c.likes=Math.max(0,(c.likes||0)-1)}else{c.likedBy=[...likedBy,user.uid];c.likes=(c.likes||0)+1;if(c.uid&&c.uid!==user.uid){const myName=await getUserName(user.uid);db.collection('notifications').add({userId:c.uid,senderId:user.uid,postId:postId,type:'comment_like',text:myName+(lang==='el'?' έκανε like στο σχόλιό σου.':' liked your comment.'),read:false,timestamp:Date.now()})} }comments[idx]=c;await ref.update({comments:comments});if(singlePostId)renderSinglePost()}

function toggleCommentMenu(postId,commentId){const m=document.getElementById('cm_'+postId+'_'+commentId);document.querySelectorAll('.comment-menu').forEach(x=>{if(x!==m)x.classList.remove('show')});if(m)m.classList.toggle('show')}

async function deletePost(id){if(confirm(lang==='el'?'Διαγραφή δημοσίευσης;':'Delete post?')){await db.collection('posts').doc(id).delete();if(singlePostId){singlePostId=null;showTab('home')}else render()}}

function editPost(id,text){editingPostId=id;document.getElementById('editText').value=text;document.getElementById('editModalTitle').innerText=t('edit');document.getElementById('editModal').classList.add('show')}
function closeEditModal(){document.getElementById('editModal').classList.remove('show');editingPostId=null}

async function deleteComment(postId,commentId){if(confirm(lang==='el'?'Διαγραφή σχολίου;':'Delete comment?')){const ref=db.collection('posts').doc(postId);const doc=await ref.get();if(!doc.exists)return;const p=doc.data();let comments=[...(p.comments||[])];comments=comments.filter(c=>(c.id||('old_'+c.time))!==commentId);await ref.update({comments:comments});if(singlePostId)renderSinglePost();else render()}}

function formatTime(ts){if(!ts)return'';const diff=Math.floor((Date.now()-ts)/1000);if(diff<60)return(lang==='el'?'πριν λίγο':'just now');if(diff<3600)return Math.floor(diff/60)+(lang==='el'?'λ':'m');if(diff<86400)return Math.floor(diff/3600)+(lang==='el'?'ω':'h');return Math.floor(diff/86400)+(lang==='el'?'μ':'d')}

function formatTextWithLinks(text){
  if(!text)return'';
  let safe=esc(text);
  safe=safe.replace(/#(\w+)/g,'<span class="hash" onclick="openHashtagModal(\'$1\')">#$1</span>');
  safe=safe.replace(/@(\w+)/g,'<span class="mention" onclick="openProfileByHandle(\'$1\')">@$1</span>');
  return safe;
}

function openHashtagModal(tag){
  const main=document.getElementById('main');
  main.innerHTML=`<div class="single-post-header">
    <button onclick="goHome()"><i data-lucide="arrow-left"></i></button>
    <span style="font-weight:700">#${tag}</span>
  </div>
  <div id="hashtagFeedList"></div>`;
  
  db.collection('posts').orderBy('createdAt','desc').get().then(snap=>{
    const feed=document.getElementById('hashtagFeedList');
    if(!feed)return;
    let posts=[];
    snap.forEach(d=>{
      const p={id:d.id,...d.data()};
      if((p.text||'').toLowerCase().includes('#'+tag.toLowerCase())){
        posts.push(p);
      }
    });
    if(posts.length===0){
      feed.innerHTML=`<div class="empty-state">${t('noPosts')}</div>`;
      return;
    }
    feed.innerHTML=posts.map(p=>renderPostHTML(p)).join('');
    if(typeof lucide!=='undefined')lucide.createIcons();
  });
}

async function openProfileByHandle(handle){const snap=await db.collection('users').get();for(const doc of snap.docs){const u=doc.data();if(norm(u.name)===norm(handle)){openProfile(doc.id);return}}alert(lang==='el'?'Ο χρήστης δεν βρέθηκε':'User not found')}

async function openProfile(uid){viewingUid=uid;showTab('profile')}

async function followUser(targetUid){if(!user)return;const myRef=db.collection('users').doc(user.uid);const targetRef=db.collection('users').doc(targetUid);const myDoc=await myRef.get();const targetDoc=await targetRef.get();if(!myDoc.exists||!targetDoc.exists)return;const following=myDoc.data().following||[];const isFollowing=following.includes(targetUid);if(isFollowing){await myRef.update({following:firebase.firestore.FieldValue.arrayRemove(targetUid)});await targetRef.update({followers:firebase.firestore.FieldValue.arrayRemove(user.uid)})}else{await myRef.update({following:firebase.firestore.FieldValue.arrayUnion(targetUid)});await targetRef.update({followers:firebase.firestore.FieldValue.arrayUnion(user.uid)});const myName=await getUserName(user.uid);db.collection('notifications').add({userId:targetUid,senderId:user.uid,postId:null,type:'follow',text:myName+(lang==='el'?' σε ακολούθησε.':' started following you.'),read:false,timestamp:Date.now()})}render()}

async function muteUser(targetUid){if(!user)return;const ref=db.collection('users').doc(user.uid);const doc=await ref.get();const muted=doc.data().muted||[];if(muted.includes(targetUid))await ref.update({muted:firebase.firestore.FieldValue.arrayRemove(targetUid)});else await ref.update({muted:firebase.firestore.FieldValue.arrayUnion(targetUid)});render()}

async function blockUser(targetUid){if(!user)return;if(confirm(lang==='el'?'Αποκλεισμός χρήστη;':'Block user?')){const ref=db.collection('users').doc(user.uid);await ref.update({blocked:firebase.firestore.FieldValue.arrayUnion(targetUid),following:firebase.firestore.FieldValue.arrayRemove(targetUid)});render()}}

function openShare(postId,url){sharePostId=postId;sharePostUrl=url||window.location.origin+window.location.pathname+'?post='+postId;db.collection('posts').doc(postId).get().then(doc=>{if(doc.exists)sharePostText=doc.data().text||''});document.getElementById('shareModal').classList.add('show');if(typeof lucide!=='undefined')lucide.createIcons()}
function closeShareModal(){document.getElementById('shareModal').classList.remove('show');sharePostId=null}
function doNativeShare(){if(navigator.share){navigator.share({title:'John Ross Social',text:sharePostText,url:sharePostUrl}).catch(()=>{});closeShareModal()}else{copyFromShare()}}
function copyFromShare(){navigator.clipboard.writeText(sharePostUrl);alert(lang==='el'?'Αντιγράφηκε!':'Copied!');closeShareModal()}

async function doRepost(){if(!user||!sharePostId)return;const doc=await db.collection('posts').doc(sharePostId).get();if(!doc.exists)return;const p=doc.data();const myDoc=await db.collection('users').doc(user.uid).get();const ud=myDoc.data()||{};const name=ud.name||user.displayName||user.email.split('@')[0];await db.collection('posts').add({uid:user.uid,name:name,email:user.email,photo:ud.photo||'',text:'',images:[],likes:0,likedBy:[],comments:[],createdAt:Date.now(),isRepost:true,originalPostId:sharePostId,original:{uid:p.uid,name:p.name,text:p.text,images:p.images||[],createdAt:p.createdAt}});closeShareModal();alert(lang==='el'?'Αναδημοσιεύτηκε!':'Reposted!');render()}

function quoteFromShare(){const id=sharePostId;closeShareModal();db.collection('posts').doc(id).get().then(doc=>{if(!doc.exists)return;const p=doc.data();pendingQuote={originalPostId:id,original:{uid:p.uid,name:p.name,text:p.text,images:p.images||[],createdAt:p.createdAt}};pendingImages=[];showTab('home');setTimeout(()=>{const ta=document.getElementById('postText');if(ta)ta.focus();renderHome(document.getElementById('main'))},100)})}

function openLightbox(src){document.getElementById('lightboxImg').src=src;document.getElementById('lightbox').classList.add('show')}
function closeLightbox(){document.getElementById('lightbox').classList.remove('show')}

function renderSinglePost(){
  const main=document.getElementById('main');
  db.collection('posts').doc(singlePostId).get().then(doc=>{
    if(!doc.exists){main.innerHTML=`<div class="empty-state">Post not found</div>`;return;}
    const p={id:doc.id,...doc.data()};
    main.innerHTML=`<div class="single-post-header"><button onclick="singlePostId=null;render()"><i data-lucide="arrow-left"></i></button><span style="font-weight:700">${t('post')}</span></div>`+renderPostHTML(p,true);
    if(typeof lucide!=='undefined')lucide.createIcons();
  });
}

function renderPostHTML(p, isSingle=false){
  const liked=(p.likedBy||[]).includes(user?user.uid:'');
  const isOwner=user&&p.uid===user.uid;
  let imgsHTML='';
  if(p.images&&p.images.length>0){
    imgsHTML=`<div class="post-images">${p.images.map(img=>`<img src="${img}" onclick="openLightbox('${img}')">`).join('')}</div>`;
  }
  let quotedHTML='';
  if(p.isQuote&&p.original){
    const o=p.original;
    quotedHTML=`<div class="quoted-box"><div class="q-name" onclick="openProfile('${o.uid}')">@${esc(o.name)}</div><div class="q-text">${formatTextWithLinks(o.text)}</div>${o.images&&o.images.length>0?`<img src="${o.images[0]}" onclick="openLightbox('${o.images[0]}')">`:''}</div>`;
  }
  let repostLabel='';
  if(p.isRepost){
    repostLabel=`<div class="repost-label"><i data-lucide="repeat-2" style="width:14px;height:14px"></i> ${esc(p.name)} ${t('reposted')}</div>`;
  }

  let commentsHTML='';
  if(p.comments&&p.comments.length>0){
    commentsHTML=`<div class="comments-section">${p.comments.map(c=>{
      const cLiked=(c.likedBy||[]).includes(user?user.uid:'');
      const cOwner=user&&(c.uid===user.uid||isOwner);
      const cId=c.id||('old_'+c.time);
      return `<div class="comment">
        <div class="comment-avatar" style="${c.photo?'background-image:url('+c.photo+')':''}" onclick="openProfile('${c.uid}')">${!c.photo?(c.name?c.name[0].toUpperCase():'U'):''}</div>
        <div class="comment-info">
          <div class="comment-name" onclick="openProfile('${c.uid}')">${esc(c.name)}</div>
          <div class="comment-text">${formatTextWithLinks(c.text)}</div>
          <div class="comment-actions">
            <span>${formatTime(c.time)}</span>
            <button class="comment-like-btn ${cLiked?'liked':''}" onclick="likeComment('${p.id}','${cId}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="${cLiked?'var(--accent)':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> ${c.likes||0}</button>
          </div>
        </div>
        ${cOwner?`<button class="comment-menu-btn" onclick="toggleCommentMenu('${p.id}','${cId}')"><i data-lucide="more-vertical" style="width:16px;height:16px"></i></button><div class="comment-menu" id="cm_${p.id}_${cId}"><button onclick="deleteComment('${p.id}','${cId}')"><i data-lucide="trash-2" style="width:14px;height:14px"></i> ${t('delete')}</button></div>`:''}
      </div>`;
    }).join('')}</div>`;
  }

  let addCommentHTML=isSingle||isSinglePostContext(p.id)?`<div class="comment-input-row"><input type="text" id="c_${p.id}" placeholder="${t('reply')}..." oninput="handleMentionInput(event)" onkeydown="if(event.key==='Enter')addComment('${p.id}')"><button class="btn-full" style="padding:10px 16px" onclick="addComment('${p.id}')"><i data-lucide="send" style="width:16px;height:16px"></i></button></div>`:'';

  return `<div class="post">
    ${repostLabel}
    <div class="post-header">
      <div class="avatar" style="${p.photo?'background-image:url('+p.photo+')':''}" onclick="openProfile('${p.uid}')">${!p.photo?(p.name?p.name[0].toUpperCase():'U'):''}</div>
      <div class="post-info">
        <div class="username" onclick="openProfile('${p.uid}')">${esc(p.name)} ${isAdmin(p.email)?'<span class="admin-badge">Admin</span>':''} <span class="handle">@${norm(p.name)}</span> · <span style="color:var(--muted);font-weight:400">${formatTime(p.createdAt)}</span></div>
      </div>
      ${isOwner?`<div class="post-menu-container"><button class="menu-btn-icon" onclick="togglePostMenu('${p.id}')"><i data-lucide="more-horizontal" style="width:18px;height:18px"></i></button><div class="post-menu" id="pm_${p.id}"><button onclick="editPost('${p.id}',${JSON.stringify(p.text)})"><i data-lucide="edit-3" style="width:16px;height:16px"></i> ${t('edit')}</button><button onclick="deletePost('${p.id}')"><i data-lucide="trash-2" style="width:16px;height:16px"></i> ${t('delete')}</button></div></div>`:''}
    </div>
    <div class="post-content">${formatTextWithLinks(p.text)}</div>
    ${imgsHTML}
    ${quotedHTML}
    <div class="post-actions">
      <span onclick="if(!singlePostId){singlePostId='${p.id}';render()}"><i data-lucide="message-circle" style="width:18px;height:18px"></i> ${(p.comments||[]).length}</span>
      <span onclick="openShare('${p.id}')"><i data-lucide="repeat" style="width:18px;height:18px"></i></span>
      <span class="like-btn ${liked?'liked':''}" onclick="likePost('${p.id}',this)"><svg width="18" height="18" viewBox="0 0 24 24" fill="${liked?'#fff':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> ${p.likes||0}</span>
      <span onclick="openShare('${p.id}')"><i data-lucide="share" style="width:18px;height:18px"></i></span>
    </div>
    ${commentsHTML}
    ${addCommentHTML}
  </div>`;
}

function isSinglePostContext(id){return singlePostId===id}

function renderHome(main){
  main.innerHTML=`<div class="top-tabs">
    <button class="tab-btn ${feedType==='foryou'?'active':''}" data-feed="foryou" onclick="setFeedType('foryou')">${t('forYou')}</button>
    <button class="tab-btn ${feedType==='following'?'active':''}" data-feed="following" onclick="setFeedType('following')">${t('following')}</button>
  </div>
  <div style="padding:14px 16px;border-bottom:1px solid var(--border)">
    <textarea id="postText" placeholder="${t('placeholder')}" style="width:100%;background:transparent;border:none;color:var(--text);font-size:16px;resize:none;outline:none;min-height:60px;font-family:inherit" oninput="handleMentionInput(event)"></textarea>
    <div id="imgPreview" class="img-preview"></div>
    ${pendingQuote?`<div class="quoted-box" style="margin-bottom:10px"><div class="q-name">@${esc(pendingQuote.original.name)}</div><div class="q-text">${formatTextWithLinks(pendingQuote.original.text)}</div><button style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;margin-top:4px" onclick="pendingQuote=null;renderHome(document.getElementById('main'))">Remove quote</button></div>`:''}
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">
      <label style="cursor:pointer;color:var(--accent);display:flex;align-items:center;gap:6px">
        <i data-lucide="image" style="width:20px;height:20px"></i>
        <input type="file" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
      </label>
      <button class="btn-full" onclick="postContent()">${t('post')}</button>
    </div>
  </div>
  <div id="feedList"></div>`;

  db.collection('users').doc(user.uid).get().then(doc=>{
    const uData=doc.data()||{};
    const muted=uData.muted||[];
    const blocked=uData.blocked||[];
    const following=uData.following||[];

    db.collection('posts').orderBy('createdAt','desc').limit(50).get().then(snap=>{
      const feedList=document.getElementById('feedList');
      if(!feedList)return;
      let posts=[];
      snap.forEach(d=>{
        const p={id:d.id,...d.data()};
        if(blocked.includes(p.uid))return;
        if(muted.includes(p.uid))return;
        if(feedType==='following'&&!following.includes(p.uid)&&p.uid!==user.uid)return;
        posts.push(p);
      });
      if(posts.length===0){
        feedList.innerHTML=`<div class="empty-state">${feedType==='following'?t('noFollowing'):t('noPosts')}</div>`;
        return;
      }
      feedList.innerHTML=posts.map(p=>renderPostHTML(p)).join('');
      if(typeof lucide!=='undefined')lucide.createIcons();
    });
  });
}

function renderSearch(main){
  main.innerHTML=`<div style="padding:14px 16px"><input type="text" id="searchInput" placeholder="${t('search')}..." style="width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px 18px;border-radius:9999px;font-size:15px;outline:none" oninput="doSearch(this.value)"></div><div id="searchResults"></div>`;
  doSearch('');
  setTimeout(()=>{const inp=document.getElementById('searchInput');if(inp)inp.focus()},50);
}

async function doSearch(query){
  const res=document.getElementById('searchResults');
  if(!res)return;
  const q=query.toLowerCase().trim();
  const usersSnap=await db.collection('users').get();
  let users=[];
  usersSnap.forEach(d=>users.push({id:d.id,...d.data()}));

  const postsSnap=await db.collection('posts').orderBy('createdAt','desc').limit(40).get();
  let posts=[];
  postsSnap.forEach(d=>posts.push({id:d.id,...d.data()}));

  let html='';
  if(q){
    const filteredUsers=users.filter(u=>(u.name||'').toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q));
    if(filteredUsers.length>0){
      html+=`<div style="padding:8px 16px;font-weight:700;font-size:13px;color:var(--muted)">Users</div>`;
      html+=filteredUsers.map(u=>`<div class="user-list-item" onclick="openProfile('${u.id}')"><div class="avatar" style="${u.photo?'background-image:url('+u.photo+')':''}">${!u.photo?(u.name?u.name[0].toUpperCase():'U'):''}</div><div><div style="font-weight:700">${esc(u.name)}</div><div style="color:var(--muted);font-size:13px">@${norm(u.name)}</div></div></div>`).join('');
    }
    const filteredPosts=posts.filter(p=>(p.text||'').toLowerCase().includes(q)||(p.name||'').toLowerCase().includes(q));
    if(filteredPosts.length>0){
      html+=`<div style="padding:8px 16px;font-weight:700;font-size:13px;color:var(--muted);margin-top:10px">Posts</div>`;
      html+=filteredPosts.map(p=>renderPostHTML(p)).join('');
    }
    if(!html)html=`<div class="empty-state">${t('noPosts')}</div>`;
  } else {
    html=`<div style="padding:8px 16px;font-weight:700;font-size:13px;color:var(--muted)">Suggested Users</div>`;
    html+=users.filter(u=>u.id!==user.uid).slice(0,5).map(u=>`<div class="user-list-item" onclick="openProfile('${u.id}')"><div class="avatar" style="${u.photo?'background-image:url('+u.photo+')':''}">${!u.photo?(u.name?u.name[0].toUpperCase():'U'):''}</div><div><div style="font-weight:700">${esc(u.name)}</div><div style="color:var(--muted);font-size:13px">@${norm(u.name)}</div></div></div>`).join('');
  }
  res.innerHTML=html;
  if(typeof lucide!=='undefined')lucide.createIcons();
}

function renderNotif(main){
  main.innerHTML=`<div id="notifList"></div>`;
  db.collection('notifications').where('userId','==',user.uid).orderBy('timestamp','desc').limit(40).get().then(snap=>{
    const list=document.getElementById('notifList');
    if(!list)return;
    let notifs=[];
    snap.forEach(d=>{notifs.push({id:d.id,...d.data()});db.collection('notifications').doc(d.id).update({read:true})});
    if(notifs.length===0){list.innerHTML=`<div class="empty-state">${t('noNotifs')}</div>`;return;}
    list.innerHTML=notifs.map(n=>`<div class="notif-item ${n.read?'':'unread'}" onclick="${n.postId?`singlePostId='${n.postId}';render()`:`openProfile('${n.senderId}')`}"><div class="notif-dot">${n.type==='like'?'❤️':n.type==='comment'?'💬':n.type==='follow'?'👤':n.type==='mention'?'🔔':'✨'}</div><div class="notif-content"><div>${esc(n.text)}</div><div style="color:var(--muted);font-size:12px;margin-top:4px">${formatTime(n.timestamp)}</div></div></div>`).join('');
    const badge=document.getElementById('notifBadge');if(badge)badge.style.display='none';
  });
}

function listenUnreadNotifs(uid){
  db.collection('notifications').where('userId','==',uid).where('read','==',false).onSnapshot(snap=>{
    const badge=document.getElementById('notifBadge');
    if(badge)badge.style.display=snap.size>0?'block':'none';
  });
}

async function renderProfile(main){
  const uid=viewingUid||user.uid;
  const isMe=uid===user.uid;
  const userDoc=await db.collection('users').doc(uid).get();
  const uData=userDoc.data()||{};
  const myDoc=await db.collection('users').doc(user.uid).get();
  const myData=myDoc.data()||{};
  const isFollowing=(myData.following||[]).includes(uid);
  const isMuted=(myData.muted||[]).includes(uid);
  const isBlocked=(myData.blocked||[]).includes(uid);

  main.innerHTML=`<div class="profile">
    <div class="profile-header">
      <div class="avatar avatar-lg" style="margin:0 auto 12px;${uData.photo?'background-image:url('+uData.photo+')':''}">${!uData.photo?(uData.name?uData.name[0].toUpperCase():'U'):''}</div>
      <div style="font-weight:800;font-size:20px">${esc(uData.name||'User')} ${isAdmin(uData.email)?'<span class="admin-badge">Admin</span>':''}</div>
      <div style="color:var(--muted);font-size:14px">@${norm(uData.name||'user')}</div>
      <div style="margin-top:10px;font-size:15px">${esc(uData.bio||'')}</div>
      <div class="profile-stats">
        <span><b>${(uData.followers||[]).length}</b> ${t('followers')}</span>
        <span><b>${(uData.following||[]).length}</b> ${t('following2')}</span>
      </div>
      <div class="profile-actions">
        ${isMe?`<button class="btn-outline" onclick="showEditProfile()">${t('editProfile')}</button><button class="btn-outline" onclick="settings()">${t('settings')}</button>`:`<button class="btn-follow ${isFollowing?'following':''}" onclick="followUser('${uid}')">${isFollowing?t('unfollow'):t('follow')}</button><button class="btn-outline" onclick="muteUser('${uid}')">${isMuted?t('unmute'):t('mute')}</button><button class="btn-outline" style="color:var(--accent)" onclick="blockUser('${uid}')">${isBlocked?t('unblock'):t('block')}</button>`}
      </div>
    </div>
    <div style="font-weight:700;font-size:16px;margin:20px 0 10px;border-bottom:1px solid var(--border);padding-bottom:8px">${t('myPosts')}</div>
    <div id="myPostsFeed"></div>
  </div>`;

  loadProfilePosts(uid,document.getElementById('myPostsFeed'));
  if(typeof lucide!=='undefined')lucide.createIcons();
}

async function loadProfilePosts(uid,feed){
  const snap=await db.collection('posts').where('uid','==',uid).orderBy('createdAt','desc').get();
  let posts=[];
  snap.forEach(d=>posts.push({id:d.id,...d.data()}));
  if(posts.length===0){feed.innerHTML=`<div class="empty-state">${t('noPosts')}</div>`;return;}
  feed.innerHTML=posts.map(p=>renderPostHTML(p)).join('');
  if(typeof lucide!=='undefined')lucide.createIcons();
}

function showEditProfile(){
  const main=document.getElementById('main');
  db.collection('users').doc(user.uid).get().then(doc=>{
    const u=doc.data()||{};
    main.innerHTML=`<div class="profile">
      <h2>${t('editProfile')}</h2>
      <div class="profile-form" style="margin-top:20px">
        <label>${t('profile')} Name</label>
        <input type="text" id="editName" value="${esc(u.name||'')}">
        <label>${t('bio')}</label>
        <textarea id="editBio">${esc(u.bio||'')}</textarea>
        <label>Photo URL</label>
        <input type="text" id="editPhoto" value="${esc(u.photo||'')}">
        <button onclick="saveProfile()">${t('save')}</button>
      </div>
    </div>`;
  });
}

async function saveProfile(){
  const name=document.getElementById('editName').value.trim();
  const bio=document.getElementById('editBio').value.trim();
  const photo=document.getElementById('editPhoto').value.trim();
  if(!name)return;
  await db.collection('users').doc(user.uid).set({name:name,bio:bio,photo:photo},{merge:true});
  goProfile();
}

async function adminDeleteUser(uid){
  if(confirm(lang==='el'?'Διαγραφή χρήστη;':'Delete user?')){
    await db.collection('users').doc(uid).delete();
    showAdminPanel();
  }
}

async function handleMentionInput(e){
  const ta=e.target;
  const val=ta.value;
  const pos=ta.selectionStart;
  const textBefore=val.substring(0,pos);
  const match=textBefore.match(/@(\w*)$/);
  activeMentionInput=ta;

  let dropdown=document.getElementById('mentionDropdown');
  if(!dropdown){
    dropdown=document.createElement('div');
    dropdown.id='mentionDropdown';
    document.body.appendChild(dropdown);
  }

  if(match){
    const query=match[1].toLowerCase();
    const snap=await db.collection('users').limit(20).get();
    let matches=[];
    snap.forEach(d=>{
      const u=d.data();
      if((u.name||'').toLowerCase().includes(query))matches.push(u);
    });

    if(matches.length>0){
      const rect=ta.getBoundingClientRect();
      dropdown.style.top=(rect.bottom+window.scrollY+4)+'px';
      dropdown.style.left=(rect.left+window.scrollX)+'px';
      dropdown.style.width=Math.min(rect.width, 300)+'px';
      dropdown.innerHTML=matches.map(u=>`<div class="mention-item" onclick="selectMention('${esc(u.name)}')"><div class="avatar" style="width:28px;height:28px;font-size:12px;${u.photo?'background-image:url('+u.photo+')':''}">${!u.photo?(u.name?u.name[0].toUpperCase():'U'):''}</div><div style="font-weight:600;font-size:14px">${esc(u.name)}</div></div>`).join('');
      dropdown.style.display='block';
      return;
    }
  }
  hideMentionDropdown();
}

function hideMentionDropdown(){
  const dropdown=document.getElementById('mentionDropdown');
  if(dropdown)dropdown.style.display='none';
}

function selectMention(name){
  if(!activeMentionInput)return;
  const ta=activeMentionInput;
  const pos=ta.selectionStart;
  const val=ta.value;
  const textBefore=val.substring(0,pos);
  const textAfter=val.substring(pos);
  const newBefore=textBefore.replace(/@\w*$/, '@'+name+' ');
  ta.value=newBefore+textAfter;
  ta.focus();
  ta.setSelectionRange(newBefore.length,newBefore.length);
  hideMentionDropdown();
}
