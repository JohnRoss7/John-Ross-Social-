<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>John Ross Social</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #000000; --text: #FFFFFF; --muted: #777777; --border: #222222;
            --card: #111111; --accent: #dc2626; --blue: #1d9bf0;
        }
        body.light {
            --bg: #FFFFFF; --text: #000000; --muted: #666666; --border: #EEEEEE;
            --card: #F9F9F9; --accent: #dc2626; --blue: #1d9bf0;
        }

        /* ΑΠΟΛΥΤΟ ΚΛΕΙΔΩΜΑ ΓΙΑ MOBILE */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; }

        .app-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; max-width: 550px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); position: relative; }

        /* HEADER & TABS (Threads Style) */
        header { position: sticky; top: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 100; border-bottom: 1px solid var(--border); }
        .header-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
        .tabs { display: flex; border-bottom: 1px solid var(--border); }
        .tab { flex: 1; padding: 14px; text-align: center; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: 0.2s; }
        .tab.active { color: var(--text); border-bottom-color: var(--text); }

        /* FEED */
        #main-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
        .post { padding: 16px; border-bottom: 1px solid var(--border); position: relative; }
        .post-header { display: flex; gap: 12px; margin-bottom: 8px; }
        .avatar { width: 45px; height: 45px; border-radius: 10px; background: #333; background-size: cover; background-position: center; flex-shrink: 0; border: 1px solid var(--border); }
        .post-content { flex: 1; min-width: 0; }
        .username { font-weight: 700; font-size: 15px; margin-bottom: 2px; display: flex; align-items: center; gap: 5px; }
        .post-text { font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
        .post-text span { color: var(--accent); font-weight: 600; }

        /* PHOTOS (Fixed 350px) */
        .post-img { width: 100%; max-height: 350px; object-fit: cover; border-radius: 12px; margin-top: 12px; border: 1px solid var(--border); cursor: pointer; }

        /* ACTIONS (Larger) */
        .post-actions { display: flex; gap: 20px; margin-top: 15px; color: var(--muted); }
        .post-actions span { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .post-actions i { width: 22px; height: 22px; }
        .liked { color: var(--accent); }

        /* BOTTOM NAV */
        nav.bottom-nav { height: 60px; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; background: var(--bg); }
        .nav-item { color: var(--muted); position: relative; cursor: pointer; padding: 10px; }
        .nav-item.active { color: var(--text); }
        .badge { position: absolute; top: 6px; right: 6px; width: 10px; height: 10px; background: var(--accent); border-radius: 50%; border: 2px solid var(--bg); display: none; }

        /* SIDEBAR */
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--bg); z-index: 1000; border-right: 1px solid var(--border); transition: 0.3s ease; }
        .sidebar.show { left: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 900; display: none; }

        /* FORMS */
        .composer { padding: 16px; border-bottom: 1px solid var(--border); }
        .composer textarea { width: 100%; background: none; border: none; color: var(--text); font-size: 17px; resize: none; outline: none; min-height: 50px; }
        .img-prev-box { position: relative; display: inline-block; margin-top: 10px; }
        .img-prev-box img { width: 80px; height: 80px; border-radius: 10px; object-fit: cover; }
        .img-prev-box .del { position: absolute; top: -5px; right: -5px; background: var(--accent); color: #fff; border-radius: 50%; width: 20px; height: 20px; border: none; font-weight: bold; cursor: pointer; }

        /* ADMIN CARD */
        .admin-card { background: var(--card); padding: 20px; border-radius: 15px; margin: 10px; border: 1px solid var(--border); }
        .admin-card b { font-size: 24px; color: var(--accent); }

        /* LIGHTBOX */
        .lightbox { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; align-items: center; justify-content: center; }
        .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .close-lb { position: absolute; top: 30px; right: 20px; background: var(--accent); color: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; font-weight: bold; cursor: pointer; }

        .admin-badge { background: var(--accent); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 10px; margin-left: 5px; }
    </style>
</head>
<body class="dark">

<div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>

<aside class="sidebar" id="sidebar">
    <div style="padding: 20px; border-bottom: 1px solid var(--border); font-weight: 800; font-size: 20px;">Menu</div>
    <div style="padding: 10px;">
        <div onclick="showTab('settings')" style="padding: 15px; cursor: pointer;"><i data-lucide="settings"></i> Ρυθμίσεις</div>
        <div onclick="clearCache()" style="padding: 15px; cursor: pointer;"><i data-lucide="trash-2"></i> Εκκαθάριση Cache</div>
        <div id="adminLink" style="display:none;" onclick="showTab('admin')" style="padding: 15px; cursor: pointer;"><i data-lucide="shield"></i> Admin Panel</div>
        <hr style="border: none; border-top: 1px solid var(--border); margin: 10px 0;">
        <div onclick="logout()" style="padding: 15px; color: var(--accent); cursor: pointer;"><i data-lucide="log-out"></i> Αποσύνδεση</div>
    </div>
</aside>

<div class="app-wrapper">
    <header>
        <div class="header-top">
            <i data-lucide="menu" onclick="toggleSidebar(true)" style="cursor: pointer;"></i>
            <div style="font-weight: 800; font-size: 20px;">John Ross Social</div>
            <i data-lucide="plus-circle" onclick="showTab('home')" style="opacity: 0;"></i> <!-- Spacer -->
        </div>
        <div class="tabs" id="home-tabs">
            <div class="tab active" id="t-foryou" onclick="changeFeed('foryou')">Για εσένα</div>
            <div class="tab" id="t-following" onclick="changeFeed('following')">Ακολουθείς</div>
        </div>
    </header>

    <main id="main-scroll">
        <div id="content"></div>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" id="n-home" onclick="showTab('home')"><i data-lucide="home"></i></div>
        <div class="nav-item" id="n-search" onclick="showTab('search')"><i data-lucide="search"></i></div>
        <div class="nav-item" id="n-notif" onclick="showTab('notif')"><i data-lucide="bell"></i><div class="badge" id="notif-badge"></div></div>
        <div class="nav-item" id="n-profile" onclick="showTab('profile')"><i data-lucide="user"></i></div>
    </nav>
</div>

<div class="lightbox" id="lightbox" onclick="this.style.display='none'">
    <button class="close-lb">X</button>
    <img id="lb-img">
</div>

<!-- FIREBASE SDKS -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCPIg-aoWUhqOqO5hyHUd66HLcHPyC6e70",
        authDomain: "studio-386569156-384ec.firebaseapp.com",
        projectId: "studio-386569156-384ec",
        storageBucket: "studio-386569156-384ec.firebasestorage.app",
        messagingSenderId: "976658898078",
        appId: "1:976658898078:web:6209be10508924e2116f8f"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let user = null;
    let currentTab = 'home';
    let feedType = 'foryou';
    let pendingImage = null;
    let historyStack = [];
    const adminEmail = 'rossrossg7@gmail.com';

    // ΗΧΟΣ LIKE (POPSOUND)
    function playPop() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine"; osc.frequency.setValueAtTime(500, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    // ΣΥΜΠΙΕΣΗ ΦΩΤΟΓΡΑΦΙΑΣ
    async function processImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 800; let w = img.width, h = img.height;
                    if (w > h) { if(w > MAX){ h *= MAX/w; w = MAX; } } else { if(h > MAX){ w *= MAX/h; h = MAX; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    // AUTH LOGIC
    auth.onAuthStateChanged(u => {
        user = u;
        if(u) {
            document.getElementById('adminLink').style.display = (u.email === adminEmail) ? 'block' : 'none';
            listenNotifs();
        }
        render();
    });

    function logout() { auth.signOut(); location.reload(); }
    function toggleSidebar(show) {
        document.getElementById('sidebar').classList.toggle('show', show);
        document.getElementById('overlay').style.display = show ? 'block' : 'none';
    }

    // NAVIGATION
    function showTab(t, fromBack = false) {
        if(!fromBack && currentTab !== t) {
            historyStack.push(currentTab);
            window.history.pushState({tab: t}, "");
        }
        currentTab = t;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if(document.getElementById('n-'+t)) document.getElementById('n-'+t).classList.add('active');
        document.getElementById('home-tabs').style.display = (t === 'home') ? 'flex' : 'none';
        render();
    }
    window.onpopstate = () => { if(historyStack.length > 0) showTab(historyStack.pop(), true); };

    function changeFeed(f) {
        feedType = f;
        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        document.getElementById('t-'+f).classList.add('active');
        renderFeed();
    }

    // RENDERING
    function render() {
        const container = document.getElementById('content');
        if(!user) {
            container.innerHTML = `
                <div style="padding: 50px 20px; text-align: center;">
                    <h1 style="font-size: 32px; margin-bottom: 20px;">John Ross Social</h1>
                    <input id="le" placeholder="Email" style="width:100%; padding:15px; margin-bottom:10px; border-radius:10px; background:#111; border:1px solid #333; color:#fff;">
                    <input id="lp" type="password" placeholder="Password" style="width:100%; padding:15px; margin-bottom:20px; border-radius:10px; background:#111; border:1px solid #333; color:#fff;">
                    <button onclick="auth.signInWithEmailAndPassword(le.value, lp.value)" style="width:100%; padding:15px; background:var(--accent); color:#fff; border:none; border-radius:10px; font-weight:bold;">Σύνδεση</button>
                </div>`;
            return;
        }

        if(currentTab === 'home') renderHome(container);
        else if(currentTab === 'profile') renderProfile(container, user.uid);
        else if(currentTab === 'notif') renderNotifs(container);
        else if(currentTab === 'admin') renderAdmin(container);
        else if(currentTab === 'settings') renderSettings(container);
        else if(currentTab === 'search') container.innerHTML = '<div style="padding:20px;">Αναζήτηση σύντομα...</div>';
        
        lucide.createIcons();
    }

    function renderHome(container) {
        container.innerHTML = `
            <div class="composer">
                <textarea id="postText" placeholder="Τι συμβαίνει;"></textarea>
                <div id="imgPrev"></div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                    <i data-lucide="image" onclick="document.getElementById('fInp').click()" style="color:var(--blue); cursor:pointer;"></i>
                    <input type="file" id="fInp" hidden accept="image/*" onchange="handleFile(this)">
                    <button onclick="sendPost()" style="background:var(--text); color:var(--bg); border:none; padding:8px 20px; border-radius:20px; font-weight:bold;">Δημοσίευση</button>
                </div>
            </div>
            <div id="feed"></div>`;
        renderFeed();
    }

    async function handleFile(inp) {
        const data = await processImage(inp.files[0]);
        pendingImage = data;
        document.getElementById('imgPrev').innerHTML = `<div class="img-prev-box"><img src="${data}"><button class="del" onclick="pendingImage=null; imgPrev.innerHTML=''">×</button></div>`;
    }

    function renderFeed() {
        const feedContainer = document.getElementById('feed');
        if(!feedContainer) return;
        db.collection('posts').orderBy('createdAt', 'desc').limit(25).onSnapshot(snap => {
            let posts = snap.docs.map(d => ({id: d.id, ...d.data()}));
            if(feedType === 'following') {
                db.collection('users').doc(user.uid).get().then(uDoc => {
                    const following = uDoc.data().following || [];
                    displayPosts(posts.filter(p => following.includes(p.uid) || p.uid === user.uid), feedContainer);
                });
            } else {
                displayPosts(posts, feedContainer);
            }
        });
    }

    function displayPosts(posts, container) {
        container.innerHTML = posts.map(p => {
            const isLiked = (p.likedBy || []).includes(user.uid);
            const canManage = (user.uid === p.uid || user.email === adminEmail);
            return `
                <div class="post">
                    ${canManage ? `<i data-lucide="more-horizontal" onclick="postAction('${p.id}', '${p.text}')" style="position:absolute; right:15px; top:15px; color:var(--muted);"></i>` : ''}
                    <div class="post-header">
                        <div class="avatar" style="${p.photo?`background-image:url('${p.photo}')`:''}"></div>
                        <div class="post-content">
                            <div class="username">${esc(p.name)} ${p.email === adminEmail?'<span class="admin-badge">ADMIN</span>':''}</div>
                            <div class="post-text">${format(p.text)}</div>
                            ${p.images && p.images[0] ? `<img src="${p.images[0]}" class="post-img" onclick="openLB('${p.images[0]}')">` : ''}
                            <div class="post-actions">
                                <span class="${isLiked?'liked':''}" onclick="like('${p.id}')"><i data-lucide="heart" style="${isLiked?'fill:var(--accent)':''}"></i> ${p.likes||0}</span>
                                <span><i data-lucide="message-circle"></i> ${(p.comments||[]).length}</span>
                                <span onclick="share('${p.id}')"><i data-lucide="share-2"></i></span>
                            </div>
                        </div>
                    </div>
                </div>`;
        }).join('');
        lucide.createIcons();
    }

    function format(text) { return esc(text).replace(/([#@]\w+)/g, '<span>$1</span>'); }
    function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

    async function sendPost() {
        const txt = document.getElementById('postText').value;
        if(!txt.trim() && !pendingImage) return;
        const uDoc = await db.collection('users').doc(user.uid).get();
        await db.collection('posts').add({
            uid: user.uid, name: uDoc.data().name, photo: uDoc.data().photo || '', email: user.email,
            text: txt, images: pendingImage ? [pendingImage] : [], likes: 0, likedBy: [], createdAt: Date.now()
        });
        document.getElementById('postText').value = ''; pendingImage = null; document.getElementById('imgPrev').innerHTML = '';
    }

    async function like(id) {
        playPop();
        const ref = db.collection('posts').doc(id);
        const doc = await ref.get();
        const p = doc.data();
        if((p.likedBy || []).includes(user.uid)) {
            ref.update({ likes: firebase.firestore.FieldValue.increment(-1), likedBy: firebase.firestore.FieldValue.arrayRemove(user.uid) });
        } else {
            ref.update({ likes: firebase.firestore.FieldValue.increment(1), likedBy: firebase.firestore.FieldValue.arrayUnion(user.uid) });
            if(p.uid !== user.uid) db.collection('notifications').add({ userId: p.uid, text: `${user.email.split('@')[0]} έκανε like`, read: false, createdAt: Date.now() });
        }
    }

    function postAction(id, text) {
        const op = confirm("OK: Διαγραφή, Cancel: Επεξεργασία");
        if(op) { if(confirm("Σίγουρα;")) db.collection('posts').doc(id).delete(); }
        else {
            const newT = prompt("Νέο κείμενο:", text);
            if(newT) db.collection('posts').doc(id).update({text: newT});
        }
    }

    function renderNotifs(container) {
        container.innerHTML = '<h2 style="padding:20px;">Ειδοποιήσεις</h2><div id="nList"></div>';
        db.collection('notifications').where('userId', '==', user.uid).orderBy('createdAt', 'desc').limit(20).onSnapshot(snap => {
            document.getElementById('nList').innerHTML = snap.docs.map(d => {
                const n = d.data();
                return `<div style="padding:15px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
                    <span>${esc(n.text)}</span>
                    ${!n.read ? '<div style="width:8px; height:8px; background:var(--accent); border-radius:50%;"></div>' : ''}
                </div>`;
            }).join('') || '<p style="padding:20px;">Καμία ειδοποίηση</p>';
            snap.docs.forEach(d => d.ref.update({read: true}));
            document.getElementById('notif-badge').style.display = 'none';
        });
    }

    function listenNotifs() {
        db.collection('notifications').where('userId', '==', user.uid).where('read', '==', false).onSnapshot(snap => {
            document.getElementById('notif-badge').style.display = snap.empty ? 'none' : 'block';
        });
    }

    function renderProfile(m, uid) {
        db.collection('users').doc(uid).onSnapshot(doc => {
            const u = doc.data();
            m.innerHTML = `
                <div style="height:120px; background:var(--card);"></div>
                <div style="padding:0 20px; margin-top:-50px;">
                    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                        <div class="avatar" style="width:90px; height:90px; border:4px solid var(--bg); border-radius:20px; ${u.photo?`background-image:url('${u.photo}')`:''}"></div>
                        <button onclick="document.getElementById('pInp').click()" style="padding:8px 20px; border-radius:20px; background:none; border:1px solid var(--border); color:var(--text); font-weight:bold; cursor:pointer;">Αλλαγή</button>
                        <input type="file" id="pInp" hidden onchange="handleProfileFile(this)">
                    </div>
                    <h2 style="margin-top:15px;">${esc(u.name)}</h2>
                    <p style="color:var(--muted); margin:10px 0;">${esc(u.bio || 'Κανένα βιογραφικό')}</p>
                    <div style="display:flex; gap:20px;"><span><b>${(u.followers||[]).length}</b> Followers</span></div>
                </div>
                <div id="user-feed"></div>`;
            db.collection('posts').where('uid', '==', uid).orderBy('createdAt', 'desc').get().then(snap => displayPosts(snap.docs.map(d => ({id:d.id, ...d.data()})), document.getElementById('user-feed')));
        });
    }

    async function handleProfileFile(inp) {
        const data = await processImage(inp.files[0]);
        await db.collection('users').doc(user.uid).update({ photo: data });
        alert("Ενημερώθηκε!");
    }

    function renderAdmin(m) {
        m.innerHTML = '<div style="padding:20px;"><h2>Admin Panel</h2><div id="stats"></div></div>';
        Promise.all([db.collection('users').get(), db.collection('posts').get()]).then(([u, p]) => {
            document.getElementById('stats').innerHTML = `<div class="admin-card"><b>${u.size}</b> Χρήστες</div><div class="admin-card"><b>${p.size}</b> Ποστ</div>`;
        });
    }

    function renderSettings(m) {
        m.innerHTML = `
            <div style="padding:20px;">
                <h2>Ρυθμίσεις</h2><br>
                <div style="background:var(--card); padding:20px; border-radius:15px; display:flex; justify-content:space-between; margin-bottom:10px;" onclick="toggleTheme()">
                    <span>Θέμα: Dark / Light</span>
                    <i data-lucide="moon"></i>
                </div>
            </div>`;
        lucide.createIcons();
    }

    function toggleTheme() { document.body.classList.toggle('light'); }
    function clearCache() { if(confirm("Εκκαθάριση;")) { localStorage.clear(); location.reload(); } }
    function openLB(src) { document.getElementById('lb-img').src=src; document.getElementById('lightbox').style.display='flex'; }

    lucide.createIcons();
</script>
</body>
</html>
