<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>John Ross Social v19</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg:#000; --text:#fff; --muted:#777; --border:#222; --card:#16181c; --accent:#dc2626; --blue:#1d9bf0; }
        body.light { --bg:#fff; --text:#000; --muted:#666; --border:#eee; --card:#f7f9f9; }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }
        html, body { width:100%; height:100%; background:var(--bg); color:var(--text); font-family:sans-serif; overflow:hidden; position:fixed; }
        
        .app-wrapper { width:100%; height:100%; display:flex; flex-direction:column; max-width:550px; margin:0 auto; border-left:1px solid var(--border); border-right:1px solid var(--border); background:var(--bg); position:relative; }
        
        header { background:var(--bg); border-bottom:1px solid var(--border); flex-shrink:0; z-index:1000; }
        .header-top { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
        .tabs { display:flex; border-bottom:1px solid var(--border); }
        .tab { flex:1; padding:14px; text-align:center; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; }
        .tab.active { color:var(--text); border-bottom-color:var(--accent); }
        
        #main-scroll { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }

        .post { padding:16px; border-bottom:1px solid var(--border); position:relative; }
        .post-header { display:flex; gap:12px; margin-bottom:8px; align-items: center; }
        .avatar { width:48px; height:48px; border-radius:12px; background:#333; background-size:cover; background-position:center; flex-shrink:0; cursor:pointer; }
        .username { font-weight:700; font-size:15px; color:var(--text); cursor:pointer; }
        .post-text { font-size:16px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; margin:5px 0; }
        .hashtag { color:var(--accent) !important; font-weight:600; cursor:pointer; }
        .post-img { width:100%; max-height:350px; object-fit:cover; border-radius:14px; margin-top:12px; border:1px solid var(--border); cursor:pointer; }
        
        .post-actions { display:flex; justify-content:space-between; max-width:400px; margin-top:15px; color:var(--muted); }
        .post-actions span { display:flex; align-items:center; gap:8px; font-size:16px; cursor:pointer; }
        .liked i { fill:var(--accent); color:var(--accent); }

        .post-menu-btn { position:absolute; top:15px; right:15px; color:var(--muted); cursor:pointer; padding:5px; }

        /* SIDEBAR */
        .sidebar { position:fixed; top:0; left:-285px; width:280px; height:100%; background:var(--bg); z-index:3000; border-right:1px solid var(--border); transition:0.3s ease; display:flex; flex-direction:column; }
        .sidebar.show { left:0; }
        .sidebar-header { padding:20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
        .close-x { color:var(--accent); font-size:24px; cursor:pointer; }

        /* MODALS */
        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:5000; display:none; align-items:center; justify-content:center; padding:20px; }
        .modal-content { background:var(--card); width:100%; max-width:400px; border-radius:24px; padding:20px; border:1px solid var(--border); }
        .input-box { width:100%; padding:14px; background:var(--bg); border:1px solid var(--border); color:#fff; border-radius:12px; font-size:16px; margin-top:10px; }
        
        nav.bottom-nav { height:65px; border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; background:var(--bg); flex-shrink:0; }
        .nav-item { color:var(--muted); position:relative; cursor:pointer; padding:12px; }
        .nav-item.active { color:var(--text); }
        .red-dot { position:absolute; top:8px; right:8px; width:12px; height:12px; background:var(--accent); border-radius:50%; border:2px solid var(--bg); display:none; }
        .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2500; display:none; }
        .btn-main { background:var(--accent); color:#fff; border:none; padding:12px 25px; border-radius:20px; font-weight:700; cursor:pointer; width:100%; margin-top:10px; }
        
        .lightbox { position:fixed; inset:0; background:#000; z-index:6000; display:none; align-items:center; justify-content:center; }
        .close-lb { position:absolute; top:40px; right:20px; background:var(--accent); color:#fff; border:none; border-radius:50%; width:45px; height:45px; font-weight:bold; cursor:pointer; font-size:22px; }
    </style>
</head>
<body class="dark">

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <span style="font-weight:800; font-size:20px;">John Ross Social</span>
        <i data-lucide="x-circle" class="close-x" onclick="toggleSidebar(false)"></i>
    </div>
    <div style="padding: 10px; flex: 1; overflow-y: auto;">
        <div onclick="showTab('home');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="home"></i> Αρχική</div>
        <div onclick="showTab('profile');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="user"></i> Προφίλ</div>
        <div onclick="showTab('edit-profile');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="edit-3"></i> Επεξεργασία Προφίλ</div>
        <div onclick="showTab('settings');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="settings"></i> Ρυθμίσεις</div>
        <div id="adminBtn" style="display:none;" onclick="showTab('admin');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="shield"></i> Admin Panel</div>
        <hr style="border:none; border-top:1px solid var(--border); margin:10px 0;">
        <div onclick="forceReset()" style="padding:15px; cursor:pointer; color:orange"><i data-lucide="trash-2"></i> Καθαρισμός Cache</div>
        <div onclick="auth.signOut();location.reload()" style="padding:15px; color:var(--accent); cursor:pointer"><i data-lucide="log-out"></i> Αποσύνδεση</div>
    </div>
    <div style="padding:20px; font-size:10px; color:var(--muted); text-align:center">Version 19.0 Mega Stable</div>
</aside>

<div class="app-wrapper">
    <header>
        <div class="header-top">
            <i data-lucide="menu" onclick="toggleSidebar(true)" style="cursor:pointer"></i>
            <div style="font-weight:800; font-size:20px">John Ross Social</div>
            <div style="width:24px"></div>
        </div>
        <div class="tabs" id="home-tabs" style="display:none">
            <div class="tab active" id="tab-foryou" onclick="setFeed('foryou')">Για εσένα</div>
            <div class="tab" id="tab-following" onclick="setFeed('following')">Ακολουθείς</div>
        </div>
    </header>

    <main id="main-scroll"><div id="content"></div></main>

    <nav class="bottom-nav">
        <div class="nav-item active" id="btn-home" onclick="showTab('home')"><i data-lucide="home"></i></div>
        <div class="nav-item" id="btn-search" onclick="showTab('search')"><i data-lucide="search"></i></div>
        <div class="nav-item" id="btn-notif" onclick="showTab('notif')"><i data-lucide="bell"></i><div class="red-dot" id="notif-badge"></div></div>
        <div class="nav-item" id="btn-profile" onclick="showTab('profile')"><i data-lucide="user"></i></div>
    </nav>
</div>

<div class="lightbox" id="lightbox" onclick="this.style.display='none'"><button class="close-lb">X</button><img id="lb-img" style="max-width:95%; max-height:95%; object-fit:contain"></div>

<!-- MODALS -->
<div class="modal" id="shareModal">
    <div class="modal-content">
        <h3>Κοινοποίηση</h3><br>
        <div onclick="doNativeShare()" style="padding:15px; border-bottom:1px solid var(--border); cursor:pointer">Κοινοποίηση σε εφαρμογές</div>
        <div onclick="copyLink()" style="padding:15px; border-bottom:1px solid var(--border); cursor:pointer">Αντιγραφή Συνδέσμου</div>
        <div onclick="repostNow()" style="padding:15px; border-bottom:1px solid var(--border); cursor:pointer">Αναδημοσίευση (Repost)</div>
        <div onclick="quoteNow()" style="padding:15px; cursor:pointer">Παράθεση (Quote)</div>
        <button onclick="closeAll()" class="btn-main" style="background:#222">Κλείσιμο</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCPIg-aoWUhqOqO5hyHUd66HLcHPyC6e70",
        authDomain: "studio-386569156-384ec.firebaseapp.com",
        projectId: "studio-386569156-384ec",
        storageBucket: "studio-386569156-384ec.firebasestorage.app",
        messagingSenderId: "976658898078",
        appId: "1:976658898078:web:6209be10508924e2116f8f"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let user = null, currentTab = 'home', feedType = 'foryou', pendingImg = null, activePostData = null;
    let historyStack = [], lang = localStorage.getItem('jrs_lang') || 'el', theme = localStorage.getItem('jrs_theme') || 'dark';
    const adminEmail = 'rossrossg7@gmail.com';

    function playPop() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = "sine"; osc.frequency.setValueAtTime(500, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.1);
        } catch(e){}
    }

    auth.onAuthStateChanged(u => {
        user = u;
        if(u) {
            document.getElementById('adminBtn').style.display = (u.email === adminEmail) ? 'block' : 'none';
            listenNotifs();
        }
        document.body.className = theme;
        render();
    });

    function toggleSidebar(s) { document.getElementById('sidebar').classList.toggle('show', s); document.getElementById('overlay').style.display = s ? 'block' : 'none'; }
    function closeAll() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); document.getElementById('overlay').style.display='none'; toggleSidebar(false); }
    function forceReset() { localStorage.clear(); location.href = location.pathname + '?r=' + Date.now(); }

    function showTab(t, fromBack = false) {
        if(!fromBack && currentTab !== t) { historyStack.push(currentTab); window.history.pushState({tab: t}, ""); }
        currentTab = t;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if(document.getElementById('btn-'+t)) document.getElementById('btn-'+t).classList.add('active');
        document.getElementById('home-tabs').style.display = (t === 'home') ? 'flex' : 'none';
        render();
    }
    window.onpopstate = () => { if(historyStack.length > 0) showTab(historyStack.pop(), true); };

    function format(text) {
        if(!text) return "";
        let esc = String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
        return esc.replace(/#(\w+)/g, '<span class="hashtag" onclick="event.stopPropagation(); handleHash(\'#$1\')">#$1</span>');
    }
    function handleHash(h) { showTab('search'); setTimeout(() => { const i = document.getElementById('searchInp'); if(i) { i.value = h; doSearch(h); } }, 400); }

    function render() {
        const c = document.getElementById('content');
        if(!user) { c.innerHTML = `<div style="padding:60px 25px; text-align:center"><h1>John Ross Social</h1><br><button onclick="auth.signInWithEmailAndPassword(prompt('Email:'), prompt('Password:'))" class="btn-main">Σύνδεση</button></div>`; return; }
        if(currentTab === 'home') renderHome(c);
        else if(currentTab === 'profile') renderProfile(c, user.uid);
        else if(currentTab === 'notif') renderNotifs(c);
        else if(currentTab === 'search') renderSearch(c);
        else if(currentTab === 'settings') renderSettings(c);
        else if(currentTab === 'edit-profile') renderEditProfile(c);
        else if(currentTab === 'admin') renderAdmin(c);
        lucide.createIcons();
    }

    function renderHome(m) {
        m.innerHTML = `<div style="padding:16px; border-bottom:1px solid var(--border)"><div style="display:flex; gap:12px"><div class="avatar" id="myAvH" style="width:40px; height:40px"></div><textarea id="postText" placeholder="Τι συμβαίνει;" style="flex:1; background:none; border:none; color:#fff; font-size:18px; outline:none; resize:none; min-height:60px"></textarea></div><div id="imgPrv"></div><div style="display:flex; justify-content:space-between; margin-top:10px; padding-left:52px"><i data-lucide="image" onclick="document.getElementById('fInp').click()" style="color:var(--blue); cursor:pointer"></i><input type="file" id="fInp" hidden accept="image/*" onchange="handleFile(this)"><button onclick="sendPost()" class="btn-main" style="width:auto">Post</button></div></div><div id="feed"></div>`;
        db.collection('users').doc(user.uid).get().then(doc => { if(doc.exists && doc.data().photo) document.getElementById('myAvH').style.backgroundImage = `url('${doc.data().photo}')`; });
        loadFeed('feed');
    }

    function loadFeed(id, uid = null) {
        const feed = document.getElementById(id);
        let q = db.collection('posts').orderBy('createdAt', 'desc').limit(25);
        if(uid) q = q.where('uid', '==', uid);
        q.onSnapshot(snap => {
            feed.innerHTML = snap.docs.map(d => {
                const p = d.data(); const isLiked = (p.likedBy || []).includes(user.uid);
                const canManage = (user.uid === p.uid || user.email === adminEmail);
                return `<div class="post">
                    ${canManage ? `<i data-lucide="more-horizontal" class="post-menu-btn" onclick="postOp('${d.id}', '${p.text}', '${p.uid}')"></i>` : ''}
                    <div class="post-header"><div class="avatar" onclick="openProfile('${p.uid}')" style="${p.photo?`background-image:url('${p.photo}')`:''}"></div><div class="post-content"><div class="username" onclick="openProfile('${p.uid}')">${p.name} ${p.email===adminEmail?'<span class="admin-badge">ADMIN</span>':''}</div><div class="post-text">${format(p.text)}</div>
                            ${p.images && p.images[0] ? `<img src="${p.images[0]}" class="post-img" onclick="openLB('${p.images[0]}')">` : ''}
                            <div class="post-actions"><span onclick="like('${d.id}')"><i data-lucide="heart" style="${isLiked?'fill:var(--accent)':''}"></i> ${p.likes||0}</span><span onclick="alert('Σχόλια σύντομα')"><i data-lucide="message-circle"></i></span><span onclick="openShare('${d.id}', '${p.text.replace(/'/g,'')}', '${p.images?p.images[0]:''}')"><i data-lucide="share-2"></i></span></div>
                        </div></div></div>`;
            }).join(''); lucide.createIcons();
        });
    }

    async function sendPost() {
        const txt = document.getElementById('postText').value; if(!txt.trim() && !pendingImg) return;
        const uDoc = await db.collection('users').doc(user.uid).get();
        await db.collection('posts').add({ uid:user.uid, name:uDoc.data().name, photo:uDoc.data().photo || '', text:txt, images:pendingImg?[pendingImg]:[], likes:0, likedBy:[], createdAt:Date.now() });
        document.getElementById('postText').value = ''; pendingImg = null; document.getElementById('imgPrv').innerHTML = '';
    }

    async function like(id) {
        playPop(); const ref = db.collection('posts').doc(id); const doc = await ref.get(); const p = doc.data();
        if((p.likedBy || []).includes(user.uid)) { ref.update({ likes: firebase.firestore.FieldValue.increment(-1), likedBy: firebase.firestore.FieldValue.arrayRemove(user.uid) }); }
        else { ref.update({ likes: firebase.firestore.FieldValue.increment(1), likedBy: firebase.firestore.FieldValue.arrayUnion(user.uid) }); if(p.uid !== user.uid) db.collection('notifications').add({ userId: p.uid, text: `${user.email.split('@')[0]} έκανε like`, read: false, createdAt: Date.now() }); }
    }

    function renderProfile(m, uid) {
        db.collection('users').doc(uid).onSnapshot(doc => {
            const u = doc.data();
            m.innerHTML = `<div class="profile-head"><div class="avatar-lg" onclick="openLB('${u.photo}')" style="${u.photo?`background-image:url('${u.photo}')`:''}"></div><h2>${u.name}</h2><p style="color:var(--muted); margin-top:5px">${u.bio || ''}</p>
                <div class="stats"><div class="stat-btn"><b>${(u.followers||[]).length}</b><span>Followers</span></div><div class="stat-btn"><b>${(u.following||[]).length}</b><span>Following</span></div></div>
                ${uid !== user.uid ? `<button onclick="toggleFollow('${uid}')" class="btn-main" style="width:auto; padding:8px 20px; margin-top:15px">Ακολουθείς</button>` : ''}
                </div><div id="p-feed"></div>`;
            loadFeed('p-feed', uid);
        });
    }

    function renderEditProfile(m) {
        db.collection('users').doc(user.uid).get().then(doc => {
            const u = doc.data();
            m.innerHTML = `<div style="padding:20px"><h2>Επεξεργασία Προφίλ</h2><br>
                <label>Όνομα Χρήστη / Emoji</label><input id="eName" class="profile-input" value="${u.name}">
                <label>Βιογραφικό</label><textarea id="eBio" class="profile-input" style="height:100px">${u.bio||''}</textarea>
                <button onclick="saveProfileEdit()" class="btn-main">Save Profile</button></div>`;
        });
    }

    async function saveProfileEdit() {
        const n = document.getElementById('eName').value, b = document.getElementById('eBio').value;
        await db.collection('users').doc(user.uid).update({ name: n, bio: b });
        const snap = await db.collection('posts').where('uid', '==', user.uid).get();
        const batch = db.batch(); snap.docs.forEach(d => batch.update(d.ref, { name: n })); await batch.commit();
        alert("Αποθηκεύτηκε!"); showTab('profile');
    }

    function openShare(id, text, img) { activePostData = {id, text, img}; document.getElementById('shareModal').style.display='flex'; document.getElementById('overlay').style.display='block'; }
    async function repostNow() {
        const uDoc = await db.collection('users').doc(user.uid).get();
        await db.collection('posts').add({ uid:user.uid, name:uDoc.data().name, photo:uDoc.data().photo||'', text:"Reposted: " + activePostData.text, images: activePostData.img ? [activePostData.img] : [], likes:0, likedBy:[], createdAt:Date.now() });
        closeAll(); alert("Αναδημοσιεύτηκε!");
    }
    function quoteNow() { document.getElementById('postText').value = "Quote: " + activePostData.text + "\n---\n"; showTab('home'); closeAll(); document.getElementById('postText').focus(); }

    async function handleFile(inp, target = 'post') {
        const reader = new FileReader(); reader.onload = (e) => {
            const img = new Image(); img.onload = () => {
                const canvas = document.createElement('canvas'); const MAX = 800; let w = img.width, h = img.height;
                if (w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } } else { if(h > MAX) { w *= MAX/h; h = MAX; } }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
                const data = canvas.toDataURL('image/jpeg', 0.4);
                if(target === 'profile') db.collection('users').doc(user.uid).update({ photo: data });
                else { pendingImg = data; document.getElementById('imgPrv').innerHTML = `<div class="img-prev-box"><img src="${data}"><button class="del" onclick="pendingImg=null;document.getElementById('imgPrv').innerHTML=''">×</button></div>`; }
            }; img.src = e.target.result;
        }; reader.readAsDataURL(inp.files[0]);
    }

    function postOp(id, text, postUid) {
        if(user.uid === postUid) {
            const op = confirm("OK: Διαγραφή, Cancel: Επεξεργασία");
            if(op) db.collection('posts').doc(id).delete();
            else { const nt = prompt("Νέο κείμενο:", text); if(nt) db.collection('posts').doc(id).update({text:nt}); }
        } else if(user.email === adminEmail) { if(confirm("ADMIN: Διαγραφή;")) db.collection('posts').doc(id).delete(); }
    }

    function listenNotifs() { db.collection('notifications').where('userId', '==', user.uid).where('read', '==', false).onSnapshot(s => { document.getElementById('notif-badge').style.display = s.empty ? 'none' : 'block'; }); }
    function renderNotifs(m) { m.innerHTML = '<h2 style="padding:20px">Ειδοποιήσεις</h2><div id="nL"></div>'; db.collection('notifications').where('userId', '==', user.uid).orderBy('createdAt', 'desc').limit(20).onSnapshot(s => { document.getElementById('nL').innerHTML = s.docs.map(d => `<div class="notif-item">${d.data().text}</div>`).join('') || '<p style="padding:20px">Καμία ειδοποίηση</p>'; s.forEach(d => d.ref.update({read:true})); }); }
    function openProfile(uid) { showTab('profile'); renderProfile(document.getElementById('content'), uid); }
    function openLB(src) { document.getElementById('lb-img').src=src; document.getElementById('lightbox').style.display='flex'; }
    function setFeed(f) { feedType = f; document.querySelectorAll('.tab').forEach(e => e.classList.remove('active')); document.getElementById('tab-'+f).classList.add('active'); loadPosts(); }
    function renderSearch(m) { m.innerHTML = '<div style="padding:20px"><input id="searchInp" placeholder="Search #hashtags..." class="input-box" style="border-radius:30px"></div>'; }
    function renderSettings(m) { m.innerHTML = `<div style="padding:20px"><h2>Ρυθμίσεις</h2><br><div style="background:var(--card); padding:18px; border-radius:16px; display:flex; justify-content:space-between; cursor:pointer" onclick="document.body.classList.toggle('light')"><span>Dark / Light Mode</span><i data-lucide="moon"></i></div></div>`; }
    function renderAdmin(m) { Promise.all([db.collection('users').get(), db.collection('posts').get()]).then(([u,p]) => { m.innerHTML = `<div style="padding:20px"><h2>Admin Panel</h2><br><div style="background:var(--card); padding:20px; border-radius:15px; text-align:center"><b>${u.size}</b> Users<br><b>${p.size}</b> Posts</div></div>`; }); }

    lucide.createIcons();
</script>
</body>
</html>
