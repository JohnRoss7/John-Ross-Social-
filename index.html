<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>John Ross Social v18</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg:#000; --text:#fff; --muted:#777; --border:#222; --card:#16181c; --accent:#dc2626; --blue:#1d9bf0; }
        body.light { --bg:#fff; --text:#000; --muted:#666; --border:#eee; --card:#f7f9f9; }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }
        html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:sans-serif; position:fixed; }
        .app-wrapper { width:100%; height:100%; display:flex; flex-direction:column; max-width:550px; margin:0 auto; border-left:1px solid var(--border); border-right:1px solid var(--border); background:var(--bg); position:relative; }
        
        /* HEADER */
        header { background:var(--bg); border-bottom:1px solid var(--border); flex-shrink:0; z-index:1000; }
        .header-top { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
        .tabs { display:flex; border-bottom:1px solid var(--border); }
        .tab { flex:1; padding:14px; text-align:center; font-weight:600; color:var(--muted); cursor:pointer; }
        .tab.active { color:var(--text); border-bottom:2px solid var(--accent); }
        
        #main-scroll { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }

        /* POSTS & ACTIONS */
        .post { padding:16px; border-bottom:1px solid var(--border); position:relative; }
        .avatar { width:45px; height:45px; border-radius:12px; background:#333; background-size:cover; background-position:center; flex-shrink:0; cursor:pointer; }
        .post-text { font-size:16px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; margin:5px 0; }
        .hashtag { color:var(--accent) !important; font-weight:600; cursor:pointer; }
        .post-img { width:100%; max-height:350px; object-fit:cover; border-radius:14px; margin-top:12px; border:1px solid var(--border); cursor:pointer; }
        .post-actions { display:flex; justify-content:space-between; max-width:400px; margin-top:15px; color:var(--muted); }
        .post-actions span { display:flex; align-items:center; gap:8px; font-size:16px; cursor:pointer; padding:5px; }

        /* SIDEBAR WITH RED X */
        .sidebar { position:fixed; top:0; left:-285px; width:280px; height:100%; background:var(--bg); z-index:2000; border-right:1px solid var(--border); transition:0.3s ease; display:flex; flex-direction:column; }
        .sidebar.show { left:0; }
        .sidebar-header { padding:20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
        .close-menu-btn { color:var(--accent); cursor:pointer; }
        .sidebar-nav { padding:10px; flex:1; }
        .sidebar-nav div { padding:15px; cursor:pointer; display:flex; align-items:center; gap:10px; font-size:18px; }

        /* MODALS (SHARE/QUOTE) */
        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:5000; display:none; align-items:center; justify-content:center; padding:20px; }
        .modal-content { background:var(--card); width:100%; max-width:400px; border-radius:20px; padding:20px; border:1px solid var(--border); }
        .share-option { padding:15px; border-bottom:1px solid var(--border); cursor:pointer; font-weight:600; display:flex; align-items:center; gap:10px; }

        /* BOTTOM NAV */
        nav.bottom-nav { height:65px; border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; background:var(--bg); flex-shrink:0; }
        .nav-item { color:var(--muted); position:relative; cursor:pointer; padding:12px; }
        .nav-item.active { color:var(--text); }
        .red-dot { position:absolute; top:8px; right:8px; width:12px; height:12px; background:var(--accent); border-radius:50%; border:2px solid var(--bg); display:none; }
        .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1500; display:none; }
        .btn-main { background:var(--accent); color:#fff; border:none; padding:12px 25px; border-radius:20px; font-weight:700; cursor:pointer; }
    </style>
</head>
<body class="dark">

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <span style="font-weight:800">John Ross Social</span>
        <i data-lucide="x-circle" class="close-menu-btn" onclick="toggleSidebar(false)"></i>
    </div>
    <div class="sidebar-nav">
        <div onclick="showTab('home');toggleSidebar(false)"><i data-lucide="home"></i> Αρχική</div>
        <div onclick="showTab('profile');toggleSidebar(false)"><i data-lucide="user"></i> Προφίλ</div>
        <div onclick="showTab('settings');toggleSidebar(false)"><i data-lucide="settings"></i> Ρυθμίσεις</div>
        <div id="adminBtn" style="display:none" onclick="showTab('admin');toggleSidebar(false)"> <i data-lucide="shield"></i> Admin Panel</div>
        <hr style="border:none; border-top:1px solid var(--border); margin:10px 0;">
        <div onclick="clearAppCache()" style="color:orange"><i data-lucide="trash-2"></i> Εκκαθάριση Cache</div>
        <div onclick="auth.signOut();location.reload()" style="color:var(--accent)"><i data-lucide="log-out"></i> Αποσύνδεση</div>
    </div>
</aside>

<div class="app-wrapper">
    <header>
        <div class="header-top">
            <i data-lucide="menu" onclick="toggleSidebar(true)" style="cursor:pointer"></i>
            <div style="font-weight:800; font-size:20px">John Ross Social</div>
            <div style="width:24px"></div>
        </div>
        <div class="tabs" id="home-tabs" style="display:none">
            <div class="tab active" id="tab-foryou" onclick="setFeed('foryou')">Για εσένα</div>
            <div class="tab" id="tab-following" onclick="setFeed('following')">Ακολουθείς</div>
        </div>
    </header>
    <main id="main-scroll"><div id="content"></div></main>
    <nav class="bottom-nav">
        <div class="nav-item active" id="btn-home" onclick="showTab('home')"><i data-lucide="home"></i></div>
        <div class="nav-item" id="btn-search" onclick="showTab('search')"><i data-lucide="search"></i></div>
        <div class="nav-item" id="btn-notif" onclick="showTab('notif')"><i data-lucide="bell"></i><div class="red-dot" id="notif-badge"></div></div>
        <div class="nav-item" id="btn-profile" onclick="showTab('profile')"><i data-lucide="user"></i></div>
    </nav>
</div>

<!-- SHARE MODAL -->
<div class="modal" id="shareModal">
    <div class="modal-content">
        <h3>Κοινοποίηση</h3><br>
        <div class="share-option" onclick="doNativeShare()"><i data-lucide="share"></i> Κοινοποίηση σε εφαρμογές</div>
        <div class="share-option" onclick="copyLink()"><i data-lucide="link"></i> Αντιγραφή Συνδέσμου</div>
        <div class="share-option" onclick="repostNow()"><i data-lucide="repeat"></i> Αναδημοσίευση (Repost)</div>
        <div class="share-option" onclick="quoteNow()"><i data-lucide="quote"></i> Παράθεση (Quote)</div>
        <button onclick="closeAll()" class="btn-main" style="width:100%; background:#222; margin-top:15px">Κλείσιμο</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCPIg-aoWUhqOqO5hyHUd66HLcHPyC6e70", authDomain: "studio-386569156-384ec.firebaseapp.com", projectId: "studio-386569156-384ec", storageBucket: "studio-386569156-384ec.firebasestorage.app", messagingSenderId: "976658898078", appId: "1:976658898078:web:6209be10508924e2116f8f" };
    firebase.initializeApp(firebaseConfig); const auth = firebase.auth(); const db = firebase.firestore();

    let user = null, currentTab = localStorage.getItem('lastTab') || 'home', feedType = 'foryou', pendingImg = null, activePost = null;
    const adminEmail = 'rossrossg7@gmail.com';

    auth.onAuthStateChanged(u => { user = u; if(u) { document.getElementById('adminBtn').style.display = (u.email === adminEmail) ? 'block' : 'none'; listenNotifs(); } render(); });

    function toggleSidebar(s) { document.getElementById('sidebar').classList.toggle('show', s); document.getElementById('overlay').style.display = s ? 'block' : 'none'; }
    function closeAll() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); document.getElementById('overlay').style.display='none'; toggleSidebar(false); }
    function clearAppCache() { localStorage.clear(); sessionStorage.clear(); location.href = location.pathname + '?r=' + Date.now(); }

    function showTab(t) {
        currentTab = t; localStorage.setItem('lastTab', t);
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if(document.getElementById('btn-'+t)) document.getElementById('btn-'+t).classList.add('active');
        document.getElementById('home-tabs').style.display = (t === 'home') ? 'flex' : 'none';
        render();
    }

    function render() {
        const c = document.getElementById('content');
        if(!user) { c.innerHTML = `<div style="padding:60px 25px; text-align:center"><h1>John Ross Social</h1><br><button onclick="auth.signInWithEmailAndPassword(prompt('Email:'), prompt('Password:'))" class="btn-main">Σύνδεση</button></div>`; return; }
        if(currentTab === 'home') renderHome(c);
        else if(currentTab === 'profile') renderProfile(c, user.uid);
        else if(currentTab === 'notif') renderNotifs(c);
        else if(currentTab === 'settings') c.innerHTML = '<div style="padding:20px"><h2>Ρυθμίσεις</h2><p>Dark Mode: Ενεργό</p></div>';
        else if(currentTab === 'admin') renderAdmin(c);
        lucide.createIcons();
    }

    function renderHome(m) {
        m.innerHTML = `<div style="padding:16px; border-bottom:1px solid var(--border)"><textarea id="postText" placeholder="Τι συμβαίνει;" style="width:100%; background:none; border:none; color:#fff; font-size:18px; outline:none; resize:none; min-height:60px"></textarea><div id="imgPrv"></div><div style="display:flex; justify-content:space-between; margin-top:10px"><i data-lucide="image" onclick="document.getElementById('fInp').click()" style="color:var(--blue); cursor:pointer"></i><input type="file" id="fInp" hidden onchange="handleFile(this)"><button onclick="sendPost()" class="btn-main" style="width:auto">Post</button></div></div><div id="feed"></div>`;
        loadFeed('feed');
    }

    function loadFeed(id, uid = null) {
        const feed = document.getElementById(id);
        let q = db.collection('posts').orderBy('createdAt', 'desc').limit(20);
        if(uid) q = q.where('uid', '==', uid);
        q.onSnapshot(snap => {
            feed.innerHTML = snap.docs.map(d => {
                const p = d.data(); const isLiked = (p.likedBy || []).includes(user.uid);
                return `<div class="post">
                    <div class="post-header" onclick="openProfile('${p.uid}')">
                        <div class="avatar" style="${p.photo?`background-image:url('${p.photo}')`:''}"></div>
                        <div class="post-content"><div class="username">${p.name}</div>
                        <div class="post-text">${p.text.replace(/#(\w+)/g, '<span class="hashtag">#$1</span>')}</div>
                        ${p.images && p.images[0] ? `<img src="${p.images[0]}" class="post-img" onclick="event.stopPropagation(); openLB('${p.images[0]}')">` : ''}
                        <div class="post-actions">
                            <span onclick="event.stopPropagation(); like('${d.id}')"><i data-lucide="heart" style="${isLiked?'fill:var(--accent)':''}"></i> ${p.likes||0}</span>
                            <span onclick="event.stopPropagation(); alert('Σχόλια σύντομα')"><i data-lucide="message-circle"></i></span>
                            <span onclick="event.stopPropagation(); openShareModal('${d.id}', '${p.text.replace(/'/g,'')}')"><i data-lucide="share-2"></i></span>
                        </div>
                    </div></div></div>`;
            }).join(''); lucide.createIcons();
        });
    }

    function renderProfile(m, uid) {
        db.collection('users').doc(uid).onSnapshot(doc => {
            const u = doc.data();
            m.innerHTML = `<div style="padding:25px 20px; text-align:center; border-bottom:1px solid var(--border)">
                <div class="avatar" style="width:100px; height:100px; border-radius:20px; border:3px solid var(--accent); margin:0 auto 15px; ${u.photo?`background-image:url('${u.photo}')`:''}"></div>
                <h2>${u.name}</h2><p style="color:var(--muted); margin-top:5px">${u.bio || ''}</p>
                <div style="display:flex; justify-content:center; gap:20px; margin-top:15px"><b>${(u.followers||[]).length} Followers</b> <b>${(u.following||[]).length} Following</b></div>
                ${uid === user.uid ? `<button onclick="document.getElementById('pInp').click()" class="btn-main" style="width:auto; margin-top:15px">Αλλαγή Φωτό</button><input type="file" id="pInp" hidden onchange="handleFile(this, 'profile')">` : ''}
                </div><div id="p-feed"></div>`;
            loadFeed('p-feed', uid);
        });
    }

    async function handleFile(inp, target = 'post') {
        const reader = new FileReader(); reader.onload = async (e) => {
            const img = new Image(); img.onload = async () => {
                const canvas = document.createElement('canvas'); const MAX = 600;
                let w = img.width, h = img.height;
                if (w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } } else { if(h > MAX) { w *= MAX/h; h = MAX; } }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
                const data = canvas.toDataURL('image/jpeg', 0.4);
                if(target === 'profile') { await db.collection('users').doc(user.uid).update({ photo: data }); alert("Η φωτογραφία άλλαξε!"); }
                else { pendingImg = data; document.getElementById('imgPrv').innerHTML = `<div style="position:relative;display:inline-block;margin-top:10px"><img src="${data}" style="width:80px;height:80px;border-radius:10px;object-fit:cover"><button onclick="pendingImg=null;document.getElementById('imgPrv').innerHTML=''" style="position:absolute;top:-5px;right:-5px;background:red;color:white;border-radius:50%;border:none;width:20px;height:20px">×</button></div>`; }
            }; img.src = e.target.result;
        }; reader.readAsDataURL(inp.files[0]);
    }

    async function sendPost() {
        const t = document.getElementById('postText').value; if(!t.trim() && !pendingImg) return;
        const uDoc = await db.collection('users').doc(user.uid).get();
        await db.collection('posts').add({ uid:user.uid, name:uDoc.data().name, photo:uDoc.data().photo || '', text:t, images:pendingImg?[pendingImg]:[], likes:0, likedBy:[], createdAt:Date.now() });
        document.getElementById('postText').value = ''; pendingImg = null; document.getElementById('imgPrv').innerHTML = '';
    }

    async function like(id) { 
        const ref = db.collection('posts').doc(id); const doc = await ref.get(); const p = doc.data();
        if((p.likedBy || []).includes(user.uid)) { ref.update({ likes: firebase.firestore.FieldValue.increment(-1), likedBy: firebase.firestore.FieldValue.arrayRemove(user.uid) }); }
        else { ref.update({ likes: firebase.firestore.FieldValue.increment(1), likedBy: firebase.firestore.FieldValue.arrayUnion(user.uid) }); if(p.uid !== user.uid) db.collection('notifications').add({ userId: p.uid, text: `${user.email.split('@')[0]} έκανε like`, read: false, createdAt: Date.now() }); }
    }

    function openShareModal(id, text) { activePost = {id, text}; document.getElementById('shareModal').style.display='flex'; }
    function copyLink() { navigator.clipboard.writeText(window.location.origin + window.location.pathname + "?post=" + activePost.id); alert("Link Copied!"); closeAll(); }
    async function repostNow() { await db.collection('posts').add({ uid:user.uid, name:user.displayName||user.email.split('@')[0], text: "Reposted: " + activePost.text, createdAt: Date.now(), likes:0, likedBy:[] }); alert("Αναδημοσιεύτηκε!"); closeAll(); }
    function quoteNow() { document.getElementById('postText').value = "Quote: " + activePost.text + "\n---\n"; showTab('home'); closeAll(); document.getElementById('postText').focus(); }
    function doNativeShare() { navigator.share({ title: 'John Ross Social', url: window.location.origin + window.location.pathname + "?post=" + activePost.id }); closeAll(); }

    function listenNotifs() { db.collection('notifications').where('userId', '==', user.uid).where('read', '==', false).onSnapshot(s => { document.getElementById('notif-badge').style.display = s.empty ? 'none' : 'block'; }); }
    function renderNotifs(m) { m.innerHTML = '<h2 style="padding:20px">Ειδοποιήσεις</h2><div id="nL"></div>'; db.collection('notifications').where('userId', '==', user.uid).orderBy('createdAt', 'desc').limit(20).onSnapshot(s => { document.getElementById('nL').innerHTML = s.docs.map(d => `<div class="notif-item">${d.data().text}</div>`).join('') || '<p style="padding:20px">Καμία ειδοποίηση</p>'; s.forEach(d => d.ref.update({read:true})); }); }
    function openProfile(uid) { showTab('profile'); renderProfile(document.getElementById('content'), uid); }
    function openLB(src) { document.getElementById('lb-img').src=src; document.getElementById('lightbox').style.display='flex'; }

    lucide.createIcons();
</script>
</body>
</html>
