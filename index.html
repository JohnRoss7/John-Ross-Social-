<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>John Ross Social</title>
<meta name="theme-color" content="#000000">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#000;--text:#e7e9ea;--muted:#71767b;--border:#2f3336;--card:#16181c;--accent:#dc2626;--hover:rgba(255,255,255,.05);--blue:#1d9bf0}
body.light{--bg:#fff;--text:#0f1419;--muted:#536471;--border:#eff3f4;--card:#f7f9f9;--accent:#dc2626;--hover:rgba(0,0,0,.03);--blue:#1d9bf0}
*{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none; font-size:17px}
.app-container{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:80px;background:var(--bg);border-left:1px solid var(--border);border-right:1px solid var(--border)}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:-280px;width:280px;height:100vh;background:var(--bg);border-right:1px solid var(--border);z-index:1001;transition:left 0.3s ease;display:flex;flex-direction:column}
.sidebar.show{left:0}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.logo-box{background:var(--accent);color:#fff;padding:8px 14px;border-radius:20px;font-weight:700;font-size:15px}
.sidebar-nav{flex:1;padding:12px;overflow-y:auto}
.sidebar-nav a{display:flex;align-items:center;gap:15px;padding:14px 16px;color:var(--text);text-decoration:none;border-radius:9999px;font-size:18px;font-weight:500;margin-bottom:5px;cursor:pointer}
.sidebar-nav a:active{background:var(--card)}
.sidebar-nav hr{border:none;border-top:1px solid var(--border);margin:15px 0}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:none}
.overlay.show{display:block}

/* HEADER */
.main-header{position:sticky;top:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 16px;z-index:100;display:flex;align-items:center;gap:12px}
body.light .main-header{background:rgba(255,255,255,0.85)}
.menu-btn{background:none;border:none;color:var(--text);cursor:pointer;padding:5px}
.logo-text{font-weight:800;font-size:20px;letter-spacing:-0.5px}

/* POSTS */
.post{border-bottom:1px solid var(--border);padding:16px}
.post-header{display:flex;gap:12px;margin-bottom:10px}
.avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#dc2626,#7c2d12);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0}
.username{font-weight:700;font-size:17px;display:flex;align-items:center;gap:5px}
.handle{color:var(--muted);font-size:15px}
.post-content{font-size:17px;line-height:1.5;margin:8px 0;white-space:pre-wrap;word-wrap:break-word}
.post-images img{width:100%;max-height:450px;object-fit:cover;border-radius:16px;margin-top:12px;border:1px solid var(--border)}
.post-actions{display:flex;justify-content:space-between;max-width:320px;color:var(--muted);margin-top:15px}
.post-actions span{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.post-actions .liked{color:var(--accent)}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.95);backdrop-filter:blur(15px);border-top:1px solid var(--border);display:none;justify-content:space-around;padding:12px 0;max-width:600px;margin:0 auto;z-index:999}
.nav-item{background:none;border:none;color:var(--muted);cursor:pointer;position:relative;padding:5px 15px}
.nav-badge{position:absolute;top:5px;right:15px;width:10px;height:10px;background:var(--accent);border-radius:50%;display:none}
.nav-item.active{color:var(--text)}

/* FORMS */
.auth-container{text-align:center;padding:60px 25px}
.auth-container input{width:100%;max-width:360px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:16px;border-radius:14px;margin:10px 0;font-size:16px;outline:none}
.auth-container button{width:100%;max-width:360px;background:var(--accent);color:#fff;border:none;padding:16px;border-radius:14px;font-weight:700;font-size:16px;margin:10px 0}

.img-preview{display:flex;gap:10px;margin-top:10px;overflow-x:auto}
.img-preview img{width:100px;height:100px;border-radius:12px;object-fit:cover;border:2px solid var(--accent)}

.admin-badge{background:var(--accent);color:#fff;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800;margin-left:5px}

/* SETTINGS APP FEEL */
.settings-row{background:var(--card);padding:18px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<aside id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <div class="logo-box">John Ross Social</div>
    <button onclick="closeSidebar()" style="background:none;border:none;color:var(--text);font-size:32px">&times;</button>
  </div>
  <nav class="sidebar-nav">
    <a onclick="showTab('home');closeSidebar()"><i data-lucide="home"></i> Αρχική</a>
    <a onclick="showTab('profile');closeSidebar()"><i data-lucide="user"></i> Προφίλ</a>
    <a onclick="showTab('edit-profile');closeSidebar()"><i data-lucide="edit-3"></i> Επεξεργασία</a>
    <a onclick="showTab('settings');closeSidebar()"><i data-lucide="settings"></i> Ρυθμίσεις</a>
    <div id="adminMenu" style="display:none"><hr><a onclick="showTab('admin');closeSidebar()"><i data-lucide="shield"></i> Admin Panel</a></div>
    <hr>
    <a onclick="logout()"><i data-lucide="log-out"></i> Αποσύνδεση</a>
  </nav>
</aside>

<main class="app-container">
  <header class="main-header">
    <button class="menu-btn" onclick="openSidebar()"><i data-lucide="menu"></i></button>
    <div class="logo-text">John Ross Social</div>
  </header>

  <div id="main"></div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" id="btn-home" onclick="showTab('home')"><i data-lucide="home"></i></button>
    <button class="nav-item" id="btn-search" onclick="showTab('search')"><i data-lucide="search"></i></button>
    <button class="nav-item" id="btn-notif" onclick="showTab('notif')"><i data-lucide="bell"></i><span class="nav-badge" id="notifBadge"></span></button>
    <button class="nav-item" id="btn-profile" onclick="showTab('profile')"><i data-lucide="user"></i></button>
  </nav>
</main>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCPIg-aoWUhqOqO5hyHUd66HLcHPyC6e70",
  authDomain: "studio-386569156-384ec.firebaseapp.com",
  projectId: "studio-386569156-384ec",
  storageBucket: "studio-386569156-384ec.firebasestorage.app",
  messagingSenderId: "976658898078",
  appId: "1:976658898078:web:6209be10508924e2116f8f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let user = null;
let currentTab = 'home';
let pendingImages = [];
const adminEmails = ['rossrossg7@gmail.com'];

function openSidebar(){ document.getElementById('sidebar').classList.add('show'); document.getElementById('overlay').classList.add('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('show'); document.getElementById('overlay').classList.remove('show'); }
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

auth.onAuthStateChanged(u => {
  user = u;
  if(u) {
    document.getElementById('adminMenu').style.display = adminEmails.includes(u.email) ? 'block' : 'none';
    listenNotifications();
  }
  render();
});

function login(){
  const e=document.getElementById('le').value, p=document.getElementById('lp').value;
  auth.signInWithEmailAndPassword(e,p).catch(err=>alert("Σφάλμα σύνδεσης"));
}
function register(){
  const e=document.getElementById('le').value, p=document.getElementById('lp').value;
  auth.createUserWithEmailAndPassword(e,p).then(cred => {
    db.collection('users').doc(cred.user.uid).set({name:e.split('@')[0], bio:'', photo:'', followers:[], following:[], createdAt:Date.now()});
  }).catch(err=>alert("Σφάλμα εγγραφής"));
}
function logout(){ auth.signOut(); location.reload(); }

function showTab(t){
  currentTab = t;
  document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
  if(document.getElementById('btn-' + t)) document.getElementById('btn-' + t).classList.add('active');
  render();
}

async function handleImage(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 1000;
      let w = img.width, h = img.height;
      if(w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } }
      else { if(h > MAX) { w *= MAX/h; h = MAX; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const data = canvas.toDataURL('image/jpeg', 0.7);
      pendingImages = [data];
      document.getElementById('imgPreview').innerHTML = `<img src="${data}" onclick="pendingImages=[]">`;
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
}

function render(){
  const m = document.getElementById('main');
  const nav = document.getElementById('bottomNav');
  if(!user){
    nav.style.display = 'none';
    m.innerHTML = `<div class="auth-container"><h1>John Ross Social</h1><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Κωδικός"><button onclick="login()">Σύνδεση</button><button onclick="register()" style="background:#222">Εγγραφή</button></div>`;
    lucide.createIcons(); return;
  }
  nav.style.display = 'flex';
  if(currentTab === 'home') renderHome(m);
  else if(currentTab === 'profile') renderProfile(m, user.uid);
  else if(currentTab === 'settings') renderSettings(m);
  else if(currentTab === 'edit-profile') renderEditProfile(m);
  else if(currentTab === 'search') renderSearch(m);
  else if(currentTab === 'notif') renderNotifs(m);
  else if(currentTab === 'admin') m.innerHTML = '<div style="padding:20px"><h2>Admin Panel</h2><p>Σύντομα διαθέσιμο</p></div>';
  lucide.createIcons();
}

function renderHome(m){
  m.innerHTML = `
    <div style="padding:16px; border-bottom:1px solid var(--border)">
      <textarea id="postText" placeholder="Τι συμβαίνει;" style="width:100%; background:none; border:none; color:#fff; font-size:19px; outline:none; resize:none; min-height:90px; font-family:inherit"></textarea>
      <div id="imgPreview" class="img-preview"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px">
        <button onclick="document.getElementById('fileInp').click()" style="background:none;border:none;color:var(--blue);cursor:pointer"><i data-lucide="image" style="width:28px;height:28px"></i></button>
        <input type="file" id="fileInp" hidden onchange="handleImage(event)">
        <button class="btn-full" style="width:auto; padding:10px 28px; border-radius:30px" onclick="createPost()">Post</button>
      </div>
    </div>
    <div id="feed"></div>`;
  
  db.collection('posts').orderBy('createdAt', 'desc').limit(40).onSnapshot(snap => {
    const feed = document.getElementById('feed');
    if(!feed) return;
    feed.innerHTML = snap.docs.map(d => {
      const p = d.data();
      const isAdminUser = adminEmails.includes(p.email);
      return `<div class="post">
        <div class="post-header">
          <div class="avatar" style="${p.photo?`background-image:url('${p.photo}')`:''}">👤</div>
          <div class="post-info">
            <div class="username">${esc(p.name)} ${isAdminUser?'<span class="admin-badge">ADMIN</span>':''}</div>
            <div class="handle">@${esc(p.name.toLowerCase())}</div>
          </div>
        </div>
        <div class="post-content">${esc(p.text)}</div>
        ${p.images && p.images[0] ? `<img src="${p.images[0]}" style="width:100%;border-radius:16px;margin-top:10px">` : ''}
        <div class="post-actions">
          <span onclick="likePost('${d.id}')"><i data-lucide="heart"></i> ${p.likes||0}</span>
          <span><i data-lucide="message-circle"></i> ${(p.comments||[]).length}</span>
          <span><i data-lucide="share"></i></span>
        </div>
      </div>`;
    }).join('');
    lucide.createIcons();
  });
}

async function createPost(){
  const txt = document.getElementById('postText').value;
  if(!txt.trim() && pendingImages.length === 0) return;
  const uDoc = await db.collection('users').doc(user.uid).get();
  const uData = uDoc.data();
  await db.collection('posts').add({
    uid: user.uid, name: uData.name, photo: uData.photo, email: user.email,
    text: txt, images: pendingImages, likes: 0, likedBy: [], comments: [], createdAt: Date.now()
  });
  document.getElementById('postText').value = '';
  pendingImages = []; document.getElementById('imgPreview').innerHTML = '';
}

function renderProfile(m, uid){
  db.collection('users').doc(uid).get().then(doc => {
    const u = doc.data() || {};
    m.innerHTML = `<div style="padding:25px; text-align:center">
      <div class="avatar" style="width:100px;height:100px;margin:0 auto;font-size:35px;${u.photo?`background-image:url('${u.photo}')`:''}">👤</div>
      <h2 style="margin-top:15px;font-size:24px">${esc(u.name)}</h2>
      <p style="color:var(--muted);margin:12px 0;font-size:17px">${esc(u.bio || 'Χωρίς βιογραφικό')}</p>
      <div style="display:flex;justify-content:center;gap:30px;margin:25px 0">
        <span><b>${(u.followers||[]).length}</b> Followers</span>
        <span><b>${(u.following||[]).length}</b> Following</span>
      </div>
      <hr style="border:none;border-top:1px solid var(--border);margin:25px 0">
      <div id="userPosts"></div>
    </div>`;
  });
}

function renderSettings(m){
  m.innerHTML = `<div style="padding:20px">
    <h2 style="margin-bottom:25px;font-size:26px">Ρυθμίσεις</h2>
    <div class="settings-row"><span>Dark Mode</span><div style="width:45px;height:24px;background:var(--accent);border-radius:20px"></div></div>
    <div class="settings-row" onclick="alert('v2.2.0')"><span>Έκδοση</span><span>2.2.0</span></div>
    <div class="settings-row" onclick="logout()" style="color:var(--accent)"><span>Αποσύνδεση</span><i data-lucide="log-out"></i></div>
  </div>`;
}

function renderEditProfile(m){
  db.collection('users').doc(user.uid).get().then(doc => {
    const u = doc.data() || {};
    m.innerHTML = `<div style="padding:20px">
      <h2 style="margin-bottom:25px">Επεξεργασία</h2>
      <label style="color:var(--muted);display:block;margin-bottom:8px">Όνομα</label>
      <input id="updName" value="${esc(u.name)}" style="width:100%;padding:16px;background:var(--card);border:1px solid var(--border);color:#fff;border-radius:14px;margin-bottom:20px;font-size:17px">
      <label style="color:var(--muted);display:block;margin-bottom:8px">Βιογραφικό</label>
      <textarea id="updBio" style="width:100%;padding:16px;background:var(--card);border:1px solid var(--border);color:#fff;border-radius:14px;min-height:120px;font-size:17px">${esc(u.bio)}</textarea>
      <button class="btn-full" onclick="saveProfile()" style="margin-top:25px">Αποθήκευση</button>
    </div>`;
  });
}

async function saveProfile(){
  await db.collection('users').doc(user.uid).update({ name: document.getElementById('updName').value, bio: document.getElementById('updBio').value });
  alert("Ενημερώθηκε!"); showTab('profile');
}

function listenNotifications(){
  db.collection('notifications').where('userId', '==', user.uid).where('read', '==', false).onSnapshot(snap => {
    document.getElementById('notifBadge').style.display = snap.empty ? 'none' : 'block';
  });
}

function renderSearch(m){ m.innerHTML = '<div style="padding:20px"><input placeholder="Αναζήτηση..." style="width:100%;padding:16px;background:var(--card);border:none;color:#fff;border-radius:30px;font-size:17px"></div>'; }
function renderNotifs(m){ m.innerHTML = '<div style="padding:20px"><h2>Ειδοποιήσεις</h2><p style="color:var(--muted);margin-top:20px">Δεν έχετε νέες ειδοποιήσεις</p></div>'; }

lucide.createIcons();
</script>
</body>
</html>
