<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>John Ross Social</title>
    <meta name="theme-color" content="#000000">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root{--bg:#000;--text:#e7e9ea;--muted:#71767b;--border:#2f3336;--card:#16181c;--accent:#dc2626;--hover:rgba(255,255,255,.03);--blue:#1d9bf0}
        body.light{--bg:#fff;--text:#0f1419;--muted:#536471;--border:#eff3f4;--card:#f7f9f9;--accent:#dc2626;--hover:rgba(0,0,0,.03);--blue:#1d9bf0}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none}
        
        .app-container{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:70px;background:var(--bg);border-left:1px solid var(--border);border-right:1px solid var(--border)}
        
        .sidebar{position:fixed;top:0;left:-280px;width:280px;height:100vh;background:var(--bg);border-right:1px solid var(--border);z-index:1000;transition:left .3s;display:flex;flex-direction:column}
        .sidebar.show{left:0}
        .sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border)}
        .logo-box{background:var(--accent);color:#fff;padding:8px 14px;border-radius:20px;font-weight:700;font-size:14px}
        #close-sidebar{background:none;border:none;color:var(--text);font-size:28px;cursor:pointer}
        
        .sidebar-nav{flex:1;padding:12px;overflow-y:auto}
        .sidebar-nav a{display:flex;align-items:center;gap:14px;padding:14px 16px;color:var(--text);text-decoration:none;border-radius:9999px;font-size:17px;font-weight:500;cursor:pointer;margin-bottom:4px}
        .sidebar-nav a:hover{background:var(--card)}
        
        .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;display:none}
        .overlay.show{display:block}
        
        .main-header{position:sticky;top:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 16px;z-index:100;display:flex;align-items:center;gap:10px}
        .menu-btn{background:none;border:none;color:var(--text);cursor:pointer;padding:6px}
        
        .top-tabs{display:flex;border-bottom:1px solid var(--border)}
        .tab-btn{flex:1;padding:16px;background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;border-bottom:3px solid transparent;font-weight:500}
        .tab-btn.active{color:var(--text);border-bottom-color:var(--accent);font-weight:700}
        
        .post{border-bottom:1px solid var(--border);padding:14px 16px}
        .post-header{display:flex;gap:12px;margin-bottom:6px;align-items:flex-start}
        .avatar{width:45px;height:45px;border-radius:12px;background:#333;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden;background-size:cover;background-position:center;color:#fff}
        .username{font-weight:700;font-size:15px}
        .post-content{font-size:15px;line-height:1.5;margin:4px 0 10px;white-space:pre-wrap}
        .post-img{width:100%;max-height:400px;object-fit:cover;border-radius:12px;margin-top:10px;border:1px solid var(--border)}

        /* IMAGE PREVIEW WITH X */
        .img-prev-box{position:relative;display:inline-block;margin-top:10px}
        .img-prev-box img{width:80px;height:80px;border-radius:10px;object-fit:cover;border:1px solid var(--accent)}
        .img-prev-box .del-btn{position:absolute;top:-5px;right:-5px;background:var(--accent);color:white;border-radius:50%;width:22px;height:22px;border:none;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center}

        /* PROFILE FORM */
        .profile-input{width:100%;padding:12px;background:var(--card);border:1px solid var(--border);color:#fff;border-radius:10px;margin-bottom:10px;font-size:16px}
        .btn-main{background:var(--accent);color:#fff;border:none;padding:12px 24px;border-radius:20px;font-weight:700;cursor:pointer;width:100%}

        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:12px 0;max-width:600px;margin:0 auto}
        .nav-item{background:none;border:none;color:var(--muted);cursor:pointer}
        .nav-item.active{color:var(--text)}
    </style>
</head>
<body class="dark">

<div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="logo-box">John Ross Social</div>
        <button id="close-sidebar" onclick="toggleSidebar(false)">&times;</button>
    </div>
    <nav class="sidebar-nav">
        <a onclick="showTab('home');toggleSidebar(false)"><i data-lucide="home"></i> Αρχική</a>
        <a onclick="showTab('profile');toggleSidebar(false)"><i data-lucide="user"></i> Προφίλ</a>
        <hr>
        <a onclick="auth.signOut();location.reload()"><i data-lucide="log-out"></i> Αποσύνδεση</a>
    </nav>
</aside>

<div class="app-container">
    <header class="main-header">
        <button class="menu-btn" onclick="toggleSidebar(true)"><i data-lucide="menu"></i></button>
        <div style="font-weight:800; font-size:18px">John Ross Social</div>
    </header>

    <main id="content"></main>

    <nav class="bottom-nav">
        <button class="nav-item active" id="btn-home" onclick="showTab('home')"><i data-lucide="home"></i></button>
        <button class="nav-item" id="btn-profile" onclick="showTab('profile')"><i data-lucide="user"></i></button>
    </nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCPIg-aoWUhqOqO5hyHUd66HLcHPyC6e70",
        authDomain: "studio-386569156-384ec.firebaseapp.com",
        projectId: "studio-386569156-384ec",
        storageBucket: "studio-386569156-384ec.firebasestorage.app",
        messagingSenderId: "976658898078",
        appId: "1:976658898078:web:6209be10508924e2116f8f"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let user = null;
    let currentTab = 'home';
    let pendingImg = null;

    auth.onAuthStateChanged(u => { user = u; render(); });

    function toggleSidebar(s) {
        document.getElementById('sidebar').classList.toggle('show', s);
        document.getElementById('overlay').style.display = s ? 'block' : 'none';
    }

    function showTab(t) {
        currentTab = t;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if(document.getElementById('btn-'+t)) document.getElementById('btn-'+t).classList.add('active');
        render();
    }

    // ΣΥΜΠΙΕΣΗ ΦΩΤΟΓΡΑΦΙΑΣ
    async function processImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 800; let w = img.width, h = img.height;
                    if (w > h) { if(w > MAX){ h *= MAX/w; w = MAX; } } else { if(h > MAX){ w *= MAX/h; h = MAX; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', 0.5));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    function render() {
        const c = document.getElementById('content');
        if(!user) {
            c.innerHTML = `<div style="padding:50px 20px; text-align:center"><h1>John Ross Social</h1><br>
            <button class="btn-main" onclick="auth.signInWithEmailAndPassword(prompt('Email:'), prompt('Password:'))">Σύνδεση</button></div>`;
            return;
        }
        if(currentTab === 'home') renderHome(c);
        else if(currentTab === 'profile') renderProfile(c);
        lucide.createIcons();
    }

    function renderHome(m) {
        m.innerHTML = `
            <div style="padding:16px; border-bottom:1px solid var(--border)">
                <textarea id="postText" placeholder="Τι συμβαίνει;" style="width:100%; background:none; border:none; color:#fff; font-size:18px; outline:none; resize:none; min-height:60px"></textarea>
                <div id="imgPrv"></div>
                <div style="display:flex; justify-content:space-between; margin-top:10px">
                    <i data-lucide="image" onclick="document.getElementById('fInp').click()" style="color:var(--blue); cursor:pointer"></i>
                    <input type="file" id="fInp" hidden onchange="handleFile(this)">
                    <button onclick="sendPost()" class="btn-main" style="width:auto">Post</button>
                </div>
            </div>
            <div id="feed"></div>`;
        db.collection('posts').orderBy('createdAt', 'desc').limit(20).onSnapshot(snap => {
            document.getElementById('feed').innerHTML = snap.docs.map(d => {
                const p = d.data();
                return `<div class="post">
                    <div class="post-header">
                        <div class="avatar" style="${p.photo?`background-image:url('${p.photo}')`:''}"></div>
                        <div class="post-content">
                            <div class="username">${p.name}</div>
                            <div class="post-text">${p.text}</div>
                            ${p.images && p.images[0] ? `<img src="${p.images[0]}" class="post-img">` : ''}
                        </div>
                    </div>
                </div>`;
            }).join('');
        });
    }

    async function handleFile(inp, target = 'post') {
        const data = await processImage(inp.files[0]);
        if(target === 'profile') {
            await db.collection('users').doc(user.uid).update({ photo: data });
            const posts = await db.collection('posts').where('uid','==',user.uid).get();
            const batch = db.batch(); posts.forEach(d => batch.update(d.ref, {photo: data})); await batch.commit();
            alert("Η φωτογραφία άλλαξε!");
        } else {
            pendingImg = data;
            document.getElementById('imgPrv').innerHTML = `<div class="img-prev-box"><img src="${data}"><button class="del-btn" onclick="pendingImg=null;document.getElementById('imgPrv').innerHTML=''">×</button></div>`;
        }
    }

    async function sendPost() {
        const t = document.getElementById('postText').value;
        if(!t.trim() && !pendingImg) return;
        const uDoc = await db.collection('users').doc(user.uid).get();
        await db.collection('posts').add({
            uid:user.uid, name:uDoc.data().name, photo:uDoc.data().photo || '',
            text:t, images: pendingImg ? [pendingImg] : [], createdAt: Date.now()
        });
        document.getElementById('postText').value = ''; pendingImg = null; document.getElementById('imgPrv').innerHTML = '';
    }

    function renderProfile(m) {
        db.collection('users').doc(user.uid).onSnapshot(doc => {
            const u = doc.data();
            m.innerHTML = `
                <div style="padding:20px; text-align:center">
                    <div class="avatar-lg" style="${u.photo?`background-image:url('${u.photo}')`:''}"></div>
                    <button onclick="document.getElementById('pInp').click()" class="btn-main" style="width:auto; padding:5px 15px; margin-bottom:15px">Αλλαγή Φωτό</button>
                    <input type="file" id="pInp" hidden onchange="handleFile(this, 'profile')">
                    <input id="uName" class="profile-input" value="${u.name}" placeholder="Όνομα">
                    <textarea id="uBio" class="profile-input" style="height:80px; resize:none" placeholder="Βιογραφικό">${u.bio||''}</textarea>
                    <button onclick="saveProfile()" class="btn-main">Save Profile</button>
                </div>`;
        });
    }

    async function saveProfile() {
        const n = document.getElementById('uName').value;
        const b = document.getElementById('uBio').value;
        await db.collection('users').doc(user.uid).update({ name: n, bio: b });
        const posts = await db.collection('posts').where('uid', '==', user.uid).get();
        const batch = db.batch(); posts.forEach(d => batch.update(d.ref, { name: n })); await batch.commit();
        alert("Αποθηκεύτηκε!");
    }
</script>
</body>
</html>
