<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>John Ross Social v22</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg:#000; --text:#fff; --muted:#777; --border:#222; --card:#16181c; --accent:#dc2626; --blue:#1d9bf0; }
        body.light { --bg:#fff; --text:#000; --muted:#666; --border:#eee; --card:#f7f9f9; }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }
        html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:sans-serif; position:fixed; }
        
        .app-wrapper { width:100%; height:100%; display:flex; flex-direction:column; max-width:550px; margin:0 auto; border-left:1px solid var(--border); border-right:1px solid var(--border); background:var(--bg); position:relative; }
        
        header { background:var(--bg); border-bottom:1px solid var(--border); flex-shrink:0; z-index:1000; }
        .header-top { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
        .tabs { display:flex; border-bottom:1px solid var(--border); }
        .tab { flex:1; padding:14px; text-align:center; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; }
        .tab.active { color:var(--text); border-bottom:2px solid var(--accent); }
        
        #main-scroll { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }

        /* POST STYLE FIX */
        .post { padding:16px; border-bottom:1px solid var(--border); position:relative; width:100%; }
        .post-header { display:flex; gap:12px; margin-bottom:8px; align-items: flex-start; }
        .avatar { width:48px; height:48px; border-radius:12px; background:#333; background-size:cover; background-position:center; flex-shrink:0; cursor:pointer; border:1px solid var(--border); }
        .post-content { flex:1; min-width:0; }
        .username { font-weight:700; font-size:15px; color:var(--text); cursor:pointer; display: block; margin-bottom: 2px; }
        .post-text { font-size:16px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; margin:5px 0; }
        .hashtag { color:var(--accent) !important; font-weight:600; cursor:pointer; }
        .post-img { width:100%; max-height:350px; object-fit:cover; border-radius:14px; margin-top:12px; border:1px solid var(--border); cursor:pointer; background:#111; }
        
        .post-actions { display:flex; justify-content:space-between; max-width:350px; margin-top:15px; color:var(--muted); }
        .post-actions span { display:flex; align-items:center; gap:8px; font-size:16px; cursor:pointer; padding:5px; }
        .liked i { fill:var(--accent); color:var(--accent); }

        /* PROFILE */
        .profile-head { padding:25px 20px; text-align:center; border-bottom:1px solid var(--border); }
        .avatar-lg { width:120px; height:120px; border-radius:25px; border:3px solid var(--accent); background-size:cover; background-position:center; margin:0 auto 15px; cursor:pointer; background-color: #222; }
        .stats { display:flex; justify-content:center; gap:30px; margin-top:15px; }
        .stat-btn { cursor:pointer; text-align: center; }
        .stat-btn b { display:block; font-size:18px; color:var(--text); }
        .stat-btn span { font-size: 13px; color: var(--muted); }

        /* SIDEBAR */
        .sidebar { position:fixed; top:0; left:-285px; width:280px; height:100%; background:var(--bg); z-index:3000; border-right:1px solid var(--border); transition:0.3s ease; display:flex; flex-direction:column; }
        .sidebar.show { left:0; }
        .sidebar-header { padding:20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
        .close-x { color:var(--accent); cursor:pointer; }

        .settings-group { background:var(--card); border-radius:16px; border:1px solid var(--border); margin:15px; overflow:hidden; }
        .settings-row { padding:16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; cursor:pointer; font-weight:600; }
        .input-box { width:100%; padding:14px; background:var(--bg); border:1px solid var(--border); color:#fff; border-radius:12px; font-size:16px; margin-top:5px; }

        nav.bottom-nav { height:65px; border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; background:var(--bg); flex-shrink:0; }
        .nav-item { color:var(--muted); position:relative; cursor:pointer; padding:12px; }
        .nav-item.active { color:var(--text); }
        .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1500; display:none; }
        .btn-main { background:var(--accent); color:#fff; border:none; padding:12px 25px; border-radius:20px; font-weight:700; cursor:pointer; width:100%; }
        .lightbox { position:fixed; inset:0; background:#000; z-index:6000; display:none; align-items:center; justify-content:center; }
        .close-lb { position:absolute; top:40px; right:20px; background:var(--accent); color:#fff; border:none; border-radius:50%; width:45px; height:45px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        
        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:5000; display:none; align-items:center; justify-content:center; padding:20px; }
        .modal-content { background:var(--card); width:100%; max-width:400px; border-radius:24px; padding:20px; border:1px solid var(--border); }
    </style>
</head>
<body class="dark">

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><span style="font-weight:800; font-size:20px;">John Ross Social</span><i data-lucide="x-circle" class="close-x" onclick="toggleSidebar(false)"></i></div>
    <div style="padding: 10px; flex: 1; overflow-y: auto;">
        <div onclick="showTab('home');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="home"></i> Αρχική</div>
        <div onclick="showTab('profile');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="user"></i> Προφίλ</div>
        <div onclick="showTab('settings');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="settings"></i> Ρυθμίσεις</div>
        <div id="adminBtn" style="display:none;" onclick="showTab('admin');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="shield"></i> Admin Panel</div>
        <hr style="border:none; border-top:1px solid var(--border); margin:10px 0;">
        <div onclick="location.reload(true)" style="padding:15px; color:orange; cursor:pointer"><i data-lucide="trash-2"></i> Εκκαθάριση Cache</div>
        <div onclick="auth.signOut();location.reload()" style="padding:15px; color:var(--accent); cursor:pointer"><i data-lucide="log-out"></i> Αποσύνδεση</div>
    </div>
</aside>

<div class="app-wrapper">
    <header><div class="header-top"><i data-lucide="menu" onclick="toggleSidebar(true)" style="cursor:pointer"></i><div style="font-weight:800; font-size:20px">John Ross Social</div><div style="width:24px"></div></div>
        <div class="tabs" id="home-tabs" style="display:none"><div class="tab active" id="t-foryou" onclick="setFeed('foryou')">Για εσένα</div><div class="tab" id="t-following" onclick="setFeed('following')">Ακολουθείς</div></div>
    </header>
    <main id="main-scroll"><div id="content"></div></main>
    <nav class="bottom-nav">
        <div class="nav-item active" id="btn-home" onclick="showTab('home')"><i data-lucide="home"></i></div>
        <div class="nav-item" id="btn-search" onclick="showTab('search')"><i data-lucide="search"></i></div>
        <div class="nav-item" id="btn-notif" onclick="showTab('notif')"><i data-lucide="bell"></i></div>
        <div class="nav-item" id="btn-profile" onclick="showTab('profile')"><i data-lucide="user"></i></div>
    </nav>
</div>

<!-- LIST MODAL FOR FOLLOWERS -->
<div class="modal" id="listModal">
    <div class="modal-content">
        <h3 id="listTitle" style="margin-bottom:15px">Λίστα</h3>
        <div id="listContainer" style="max-height:300px; overflow-y:auto"></div>
        <button onclick="closeAll()" class="btn-main" style="background:#222; margin-top:15px">Κλείσιμο</button>
    </div>
</div>

<div class="lightbox" id="lightbox" onclick="this.style.display='none'"><button class="close-lb">X</button><img id="lb-img" style="max-width:95%; max-height:95%; object-fit:contain"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = { apiKey: "AIzaSyCPIg-aoWUhqOqO5hyHUd66HLcHPyC6e70", authDomain: "studio-386569156-384ec.firebaseapp.com", projectId: "studio-386569156-384ec", storageBucket: "studio-386569156-384ec.firebasestorage.app", messagingSenderId: "976658898078", appId: "1:976658898078:web:6209be10508924e2116f8f" };
    firebase.initializeApp(firebaseConfig); const auth = firebase.auth(); const db = firebase.firestore();
    
    let user = null, currentTab = 'home', feedType = 'foryou', pendingImg = null, historyStack = [], theme = localStorage.getItem('jrs_theme') || 'dark';
    const adminEmail = 'rossrossg7@gmail.com';

    function playPop() { try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(); const g = ctx.createGain(); o.type="sine"; o.frequency.setValueAtTime(500, ctx.currentTime); o.frequency.exponentialRampToValueAtTime(100, ctx.currentTime+0.1); g.gain.setValueAtTime(0.2, ctx.currentTime); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.1); } catch(e){} }

    auth.onAuthStateChanged(u => { user = u; if(u) { document.getElementById('adminBtn').style.display = (u.email === adminEmail) ? 'block' : 'none'; } document.body.className = theme; render(); });

    function toggleSidebar(s) { document.getElementById('sidebar').classList.toggle('show', s); document.getElementById('overlay').style.display = s ? 'block' : 'none'; }
    function closeAll() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); document.getElementById('sidebar').classList.remove('show'); document.getElementById('overlay').style.display='none'; }
    function showTab(t, fromBack = false) { if(!fromBack && currentTab !== t) { historyStack.push(currentTab); window.history.pushState({tab: t}, ""); } currentTab = t; document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active')); if(document.getElementById('btn-'+t)) document.getElementById('btn-'+t).classList.add('active'); document.getElementById('home-tabs').style.display = (t === 'home') ? 'flex' : 'none'; render(); }
    window.onpopstate = () => { if(historyStack.length > 0) showTab(historyStack.pop(), true); };

    function format(text) {
        if(!text) return "";
        let escaped = String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
        return escaped.replace(/#(\w+)/g, '<span class="hashtag" onclick="event.stopPropagation(); showTab(\'search\')">#$1</span>');
    }

    function render() {
        const c = document.getElementById('content');
        if(!user) { c.innerHTML = `<div style="padding:60px 25px; text-align:center"><h1>John Ross Social</h1><br><button onclick="auth.signInWithEmailAndPassword(prompt('Email:'), prompt('Password:'))" class="btn-main">Σύνδεση</button></div>`; return; }
        if(currentTab === 'home') renderHome(c);
        else if(currentTab === 'profile') renderProfile(c, user.uid);
        else if(currentTab === 'settings') renderSettings(c);
        else if(currentTab === 'admin') renderAdmin(c);
        else c.innerHTML = '<div style="padding:40px; text-align:center">Coming Soon...</div>';
        lucide.createIcons();
    }

    function renderHome(m) {
        m.innerHTML = `<div style="padding:16px; border-bottom:1px solid var(--border)"><textarea id="postText" placeholder="Τι συμβαίνει;" style="width:100%; background:none; border:none; color:#fff; font-size:18px; outline:none; resize:none; min-height:60px"></textarea><div id="imgPrv"></div><div style="display:flex; justify-content:space-between; margin-top:10px"><i data-lucide="image" onclick="document.getElementById('fInp').click()" style="color:var(--blue); cursor:pointer"></i><input type="file" id="fInp" hidden onchange="handleFile(this)"><button onclick="sendPost()" class="btn-main" style="width:auto">Post</button></div></div><div id="feed"></div>`;
        loadFeed('feed');
    }

    function loadFeed(id, uid = null) {
        const feed = document.getElementById(id);
        let q = db.collection('posts').orderBy('createdAt', 'desc').limit(25);
        if(uid) q = q.where('uid', '==', uid);
        q.onSnapshot(snap => {
            feed.innerHTML = snap.docs.map(d => {
                const p = d.data(); const isLiked = (p.likedBy || []).includes(user.uid);
                return `<div class="post">
                    <div class="post-header">
                        <div class="avatar" onclick="openProfile('${p.uid}')" style="${p.photo?`background-image:url('${p.photo}')`:''}"></div>
                        <div class="post-content">
                            <div class="username" onclick="openProfile('${p.uid}')">${p.name}</div>
                            <div class="post-text">${format(p.text)}</div>
                            ${p.images && p.images[0] ? `<img src="${p.images[0]}" class="post-img" onclick="openLB('${p.images[0]}')">` : ''}
                            <div class="post-actions">
                                <span onclick="like('${d.id}')"><i data-lucide="heart" style="${isLiked?'fill:var(--accent)':''}"></i> ${p.likes||0}</span>
                                <span onclick="alert('Coming soon')"><i data-lucide="message-circle"></i></span>
                                <span onclick="sharePost('${d.id}')"><i data-lucide="share-2"></i></span>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join(''); lucide.createIcons();
        });
    }

    function renderProfile(m, uid) {
        db.collection('users').doc(uid).onSnapshot(doc => {
            const u = doc.data();
            m.innerHTML = `<div class="profile-head"><div class="avatar-lg" onclick="openLB('${u.photo}')" style="${u.photo?`background-image:url('${u.photo}')`:''}"></div><h2>${u.name}</h2><p style="color:var(--muted); margin-top:5px">${u.bio || ''}</p>
                <div class="stats">
                    <div class="stat-btn" onclick="showUsers('${uid}', 'followers')"><b>${(u.followers||[]).length}</b><span>Followers</span></div>
                    <div class="stat-btn" onclick="showUsers('${uid}', 'following')"><b>${(u.following||[]).length}</b><span>Following</span></div>
                </div>
                ${uid !== user.uid ? `<button class="btn-main" onclick="toggleFollow('${uid}')" style="margin-top:15px; width:auto; padding:8px 20px">Ακολουθείς</button>` : ''}
                </div><div id="p-feed"></div>`;
            loadFeed('p-feed', uid);
        });
    }

    async function showUsers(uid, type) {
        const doc = await db.collection('users').doc(uid).get();
        const ids = doc.data()[type] || [];
        document.getElementById('listTitle').innerText = type === 'followers' ? 'Followers' : 'Following';
        const cont = document.getElementById('listContainer');
        cont.innerHTML = 'Φόρτωση...';
        document.getElementById('listModal').style.display='flex';
        document.getElementById('overlay').style.display='block';
        if(ids.length === 0) { cont.innerHTML = 'Κανένας χρήστης'; return; }
        let html = '';
        for(let id of ids) {
            const uDoc = await db.collection('users').doc(id).get();
            if(uDoc.exists) html += `<div style="display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--border)" onclick="closeAll();openProfile('${id}')"><div class="avatar" style="width:35px;height:35px;${uDoc.data().photo?`background-image:url('${uDoc.data().photo}')`:''}"></div><b>${uDoc.data().name}</b></div>`;
        }
        cont.innerHTML = html;
    }

    async function handleFile(inp, target = 'post') {
        const reader = new FileReader(); reader.onload = async (e) => {
            const img = new Image(); img.onload = async () => {
                const canvas = document.createElement('canvas'); const MAX = 600; let w = img.width, h = img.height;
                if (w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } } else { if(h > MAX) { w *= MAX/h; h = MAX; } }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
                const data = canvas.toDataURL('image/jpeg', 0.4);
                if(target === 'profile') {
                    await db.collection('users').doc(user.uid).update({ photo: data });
                    const snap = await db.collection('posts').where('uid','==',user.uid).get();
                    const batch = db.batch(); snap.docs.forEach(d => batch.update(d.ref, {photo: data})); await batch.commit();
                } else {
                    pendingImg = data;
                    document.getElementById('imgPrv').innerHTML = `<div style="position:relative;display:inline-block;margin-top:10px"><img src="${data}" style="width:80px;height:80px;border-radius:10px;object-fit:cover"><button onclick="pendingImg=null;document.getElementById('imgPrv').innerHTML=''" style="position:absolute;top:-5px;right:-5px;background:red;color:white;border-radius:50%;border:none;width:20px;height:20px">×</button></div>`;
                }
            }; img.src = e.target.result;
        }; reader.readAsDataURL(inp.files[0]);
    }

    async function like(id) { playPop(); const ref = db.collection('posts').doc(id); const doc = await ref.get(); const p = doc.data();
        if((p.likedBy || []).includes(user.uid)) { ref.update({ likes: firebase.firestore.FieldValue.increment(-1), likedBy: firebase.firestore.FieldValue.arrayRemove(user.uid) }); }
        else { ref.update({ likes: firebase.firestore.FieldValue.increment(1), likedBy: firebase.firestore.FieldValue.arrayUnion(user.uid) }); if(p.uid !== user.uid) db.collection('notifications').add({ userId: p.uid, text: `${user.email.split('@')[0]} έκανε like`, read: false, createdAt: Date.now() }); }
    }

    function renderSettings(m) {
        db.collection('users').doc(user.uid).get().then(doc => {
            const u = doc.data();
            m.innerHTML = `<div style="padding:20px"><h2>Ρυθμίσεις</h2>
                <div class="settings-group">
                    <div class="settings-row" onclick="document.getElementById('pInp').click()"><span>Αλλαγή Φωτογραφίας</span><i data-lucide="camera"></i></div>
                    <input type="file" id="pInp" hidden accept="image/*" onchange="handleFile(this, 'profile')">
                    <div style="padding:15px"><label>Όνομα Χρήστη</label><input id="s-name" class="input-box" value="${u.name}"><label style="margin-top:10px; display:block">Bio</label><textarea id="s-bio" class="input-box" style="height:70px">${u.bio||''}</textarea><button onclick="saveSet()" class="btn-main" style="margin-top:10px">Save Changes</button></div>
                </div></div>`;
            lucide.createIcons();
        });
    }

    async function saveSet() {
        const n = document.getElementById('s-name').value, b = document.getElementById('s-bio').value;
        await db.collection('users').doc(user.uid).update({ name:n, bio:b });
        const snap = await db.collection('posts').where('uid', '==', user.uid).get();
        const batch = db.batch(); snap.docs.forEach(d => batch.update(d.ref, {name: n})); await batch.commit();
        alert("Saved!");
    }

    function renderAdmin(m) { Promise.all([db.collection('users').get(), db.collection('posts').get()]).then(([u,p]) => { m.innerHTML = `<div style="padding:20px"><h2>Admin Panel</h2><br><div style="background:var(--card); padding:20px; border-radius:15px; text-align:center"><b>${u.size}</b> Users<br><b>${p.size}</b> Posts</div></div>`; }); }
    function openProfile(uid) { showTab('profile'); renderProfile(document.getElementById('content'), uid); }
    function openLB(src) { document.getElementById('lb-img').src=src; document.getElementById('lightbox').style.display='flex'; }
    async function sendPost() { const t=document.getElementById('postText').value; if(!t.trim() && !pendingImg) return; const uDoc = await db.collection('users').doc(user.uid).get(); await db.collection('posts').add({uid:user.uid, name:uDoc.data().name, photo:uDoc.data().photo || '', text:t, images:pendingImg?[pendingImg]:[], likes:0, likedBy:[], createdAt:Date.now()}); document.getElementById('postText').value=''; pendingImg=null; document.getElementById('imgPrv').innerHTML=''; }
    function sharePost(id) { const link = window.location.origin + window.location.pathname + "?post=" + id; navigator.clipboard.writeText(link); alert("Link Copied!"); }

    lucide.createIcons();
</script>
</body>
</html>
