<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
 <title>John Ross Social</title>
 <meta name="description" content="John Ross Social - Your space. Your voice.">
 <meta name="theme-color" content="#dc2626">
 <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23dc2626'/><text x='50' y='64' font-family='Arial Black, Arial, sans-serif' font-size='34' font-weight='900' fill='white' text-anchor='middle'>JRS</text></svg>">
 <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23dc2626'/><text x='50' y='64' font-family='Arial Black, Arial, sans-serif' font-size='34' font-weight='900' fill='white' text-anchor='middle'>JRS</text></svg>">
 <script src="https://unpkg.com/lucide@latest"></script>
 <style>
 :root { --bg:#000; --text:#fff; --muted:#777; --border:#222; --card:#16181c; --accent:#dc2626; --blue:#1d9bf0; }
 body.light { --bg:#fff; --text:#000; --muted:#666; --border:#eee; --card:#f7f9f9; }
 * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }
 html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:system-ui, -apple-system, sans-serif; position:fixed; }
 .app-wrapper { width:100%; height:100%; display:flex; flex-direction:column; max-width:550px; margin:0 auto; border-left:1px solid var(--border); border-right:1px solid var(--border); background:var(--bg); }
 header { background:var(--bg); border-bottom:1px solid var(--border); flex-shrink:0; z-index:1000; }
 .header-top { display:flex; align-items:center; justify-content:space-between; padding:10px 16px 8px; }
 .tabs { display:flex; border-bottom:1px solid var(--border); }
 .tab { flex:1; padding:14px; text-align:center; font-weight:600; color:var(--muted); cursor:pointer; }
 .tab.active { color:var(--text); border-bottom:2px solid var(--accent); }
 #main-scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
 .post { padding:16px; border-bottom:1px solid var(--border); position:relative; }
 .post-header { display:flex; gap:12px; }
 .avatar { width:48px; height:48px; border-radius:12px; background:#333; background-size:cover; background-position:center; flex-shrink:0; cursor:pointer; border:1px solid var(--border); }
 .username { font-weight:700; font-size:15px; }
 .post-time { font-size:12px; color:var(--muted); margin-top:2px; }
 .post-text { font-size:16px; line-height:1.5; white-space:pre-wrap; margin:6px 0; }
 .hashtag, .mention { color:var(--accent) !important; font-weight:600; cursor:pointer; }
 .post-img { width:100%; max-height:350px; object-fit:cover; border-radius:14px; margin-top:10px; border:1px solid var(--border); cursor:pointer; }
 .post-actions { display:flex; justify-content:space-between; max-width:340px; margin-top:12px; color:var(--muted); }
 .post-actions span { display:flex; align-items:center; gap:6px; cursor:pointer; padding:4px; }
 .post-menu-btn { position:absolute; top:14px; right:12px; color:var(--muted); cursor:pointer; }
 .sidebar { position:fixed; top:0; left:-285px; width:280px; height:100%; background:var(--bg); z-index:3000; border-right:1px solid var(--border); transition:0.3s; display:flex; flex-direction:column; }
 .sidebar.show { left:0; }
 .sidebar-header { padding:20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
 .modal { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:5000; display:none; align-items:center; justify-content:center; padding:20px; }
 .modal-content { background:var(--card); width:100%; max-width:400px; border-radius:20px; padding:20px; border:1px solid var(--border); max-height:85vh; overflow-y:auto; }
 .input-box { width:100%; padding:14px; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:12px; font-size:16px; margin:6px 0 12px; }
 nav.bottom-nav { height:70px; border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; background:var(--bg); flex-shrink:0; padding-bottom:env(safe-area-inset-bottom); }
 .nav-item { color:var(--muted); position:relative; cursor:pointer; padding:8px 12px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; min-width:60px; }
 .nav-item.active { color:var(--accent); }
 .red-dot { position:absolute; top:4px; right:12px; width:10px; height:10px; background:var(--accent); border-radius:50%; border:2px solid var(--bg); display:none; }
 .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1500; display:none; }
 .btn-main { background:var(--accent); color:#fff; border:none; padding:13px 22px; border-radius:30px; font-weight:700; cursor:pointer; width:100%; font-size:15px; }
 .lightbox { position:fixed; inset:0; background:#000; z-index:6000; display:none; align-items:center; justify-content:center; }
 .close-lb { position:absolute; top:40px; right:20px; background:var(--accent); color:#fff; border:none; border-radius:50%; width:42px; height:42px; font-weight:bold; cursor:pointer; }
 .settings-row { padding:15px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; cursor:pointer; background:var(--card); border-radius:12px; margin-bottom:10px; }
 .admin-badge { background:var(--accent); color:#fff; padding:2px 6px; border-radius:6px; font-size:10px; font-weight:900; margin-left:5px; }
 .pin-badge { background:#f59e0b; color:#000; padding:2px 7px; border-radius:6px; font-size:10px; font-weight:800; margin-left:6px; }
 .notif-item { padding:14px 16px; border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:flex-start; cursor:pointer; }
 .notif-item.unread { background:rgba(220,38,38,0.13); border-left:3px solid var(--accent); }
 .notif-item.read { opacity:0.7; }
 .quote-box { border:1px solid var(--border); border-radius:12px; padding:12px; margin-top:10px; background:rgba(255,255,255,0.03); }
 .admin-stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:18px 0; }
 .stat-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; text-align:center; }
 .stat-card b { display:block; font-size:24px; color:var(--accent); }
 .user-list-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); cursor:pointer; }
 .handle { color:var(--muted); font-size:14px; }
 .guest-banner { background:linear-gradient(90deg,#dc2626,#b91c1c); color:#fff; padding:14px; text-align:center; font-weight:600; }
 .guest-banner button { background:#fff; color:#dc2626; border:none; padding:8px 16px; border-radius:20px; font-weight:700; margin-top:8px; }
 .login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:30px 25px; text-align:center; }
 .login-logo { font-size:30px; font-weight:900; margin-bottom:6px; }
 .login-tagline { color:var(--accent); font-size:15px; font-style:italic; margin-bottom:35px; }
 .login-form input { width:100%; padding:15px; background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:14px; font-size:16px; margin-bottom:12px; }
 </style>
</head>
<body class="dark">

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<aside class="sidebar" id="sidebar">
 <div class="sidebar-header">
 <span style="font-weight:800;font-size:20px">John Ross Social</span>
 <i data-lucide="x-circle" style="color:var(--accent);cursor:pointer" onclick="toggleSidebar(false)"></i>
 </div>
 <div style="padding:10px;flex:1;overflow-y:auto">
 <div onclick="showTab('home');toggleSidebar(false)" style="padding:15px;cursor:pointer"><i data-lucide="home"></i> Αρχική</div>

<div class="app-wrapper">
 <header>
 <div class="header-top">
 <i data-lucide="menu" onclick="toggleSidebar(true)" style="cursor:pointer"></i>
 <div style="text-align:center;line-height:1.15">
 <div style="font-weight:800;font-size:17px">John Ross Social</div>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyCPIg-aoWUhqOqO5hyHUd66HLcHPyC6e70",
 authDomain: "studio-386569156-384ec.firebaseapp.com",
 projectId: "studio-386569156-384ec",
 storageBucket: "studio-386569156-384ec.firebasestorage.app",
 messagingSenderId: "976658898078",
 appId: "1:976658898078:web:6209be10508924e2116f8f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let user = null;
let currentTab = 'home';
let feedType = 'foryou';
let pendingImg = null;
let activePost = null;
let historyStack = [];
let unsubscribeFeed = null;
let theme = localStorage.getItem('jrs_theme') || 'dark';
const adminEmail = 'rossrossg7@gmail.com';
const USERNAME_COOLDOWN = 30 * 24 * 60 * 60 * 1000;

function playPop() {
 try {
 const ctx = new (window.AudioContext || window.webkitAudioContext)();
 const o = ctx.createOscillator();
 const g = ctx.createGain();
 o.frequency.setValueAtTime(520, ctx.currentTime);
 o.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.1);
 g.gain.setValueAtTime(0.12, ctx.currentTime);
 o.connect(g); g.connect(ctx.destination);
 o.start(); o.stop(ctx.currentTime + 0.1);
 } catch(e){}
}

function formatTime(ts) {
 if (!ts) return '';
 const d = new Date(ts);
 const diff = (Date.now() - d) / 1000;
 if (diff < 60) return 'τώρα';
 if (diff < 3600) return Math.floor(diff/60) + 'λ';
 if (diff < 86400) return Math.floor(diff/3600) + 'ώ';
 return d.toLocaleDateString('el-GR', {day:'numeric', month:'short'}) + ' · ' + d.toLocaleTimeString('el-GR', {hour:'2-digit', minute:'2-digit'});
}

function checkUrlParams() {
 const p = new URLSearchParams(location.search);
 if (p.get('post')) { renderSinglePost(p.get('post')); history.replaceState({}, '', location.pathname); return true; }
 if (p.get('user')) { openProfile(p.get('user')); history.replaceState({}, '', location.pathname); return true; }
 return false;
}

auth.onAuthStateChanged(u => {
 user = u;
 if (u) {
 document.getElementById('adminBtn').style.display = (u.email === adminEmail) ? 'block' : 'none';
 document.getElementById('bottomNav').style.display = 'flex';
 db.collection('users').doc(u.uid).get().then(doc => {
 if (!doc.exists) {
 const base = (u.email.split('@')[0] || 'user').toLowerCase().replace(/[^a-z0-9]/g,'');
 const username = base + Math.floor(Math.random()*900+100);
 db.collection('users').doc(u.uid).set({
 name: u.email.split('@')[0],
 username, bio:'', photo:'', followers:[], following:[], pinnedPosts:[],
 usernameChangedAt: Date.now(), createdAt: Date.now()
 });
 db.collection('usernames').doc(username).set({uid: u.uid});
 }
 });
 listenNotifs();
 } else {
 document.getElementById('bottomNav').style.display = 'none';
 }
 document.body.className = theme;
 if (!checkUrlParams()) render();
});

function doLogin() {
 const email = document.getElementById('loginEmail')?.value;
 const pass = document.getElementById('loginPass')?.value;
 if (!email || !pass) return alert('Συμπλήρωσε email και κωδικό');
 auth.signInWithEmailAndPassword(email, pass).catch(err => {
 if (err.code === 'auth/user-not-found') {
 auth.createUserWithEmailAndPassword(email, pass).catch(e => alert(e.message));
 } else alert('Λάθος στοιχεία');
 });
}

function toggleSidebar(s) {
 document.getElementById('sidebar').classList.toggle('show', s);
 document.getElementById('overlay').style.display = s ? 'block' : 'none';
}
function closeAll() {
 document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
 document.getElementById('sidebar').classList.remove('show');
 document.getElementById('overlay').style.display = 'none';
}

function showTab(t, fromBack=false) {
 if (!user) return;
 if (!fromBack && currentTab !== t) {
 historyStack.push(currentTab);
 history.pushState({tab:t}, '');
 }
 currentTab = t;
 document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
 document.getElementById('btn-'+t)?.classList.add('active');
 document.getElementById('home-tabs').style.display = t==='home' ? 'flex' : 'none';
 if (t === 'notif') {
 const b = document.getElementById('notif-badge');
 if (b) b.style.display = 'none';
 }
 render();
}
window.onpopstate = () => {
 if (historyStack.length) showTab(historyStack.pop(), true);
 else showTab('home', true);
};

function format(text) {
 if (!text) return '';
 let t = String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 t = t.replace(/@(\w+)/g, '<span class="mention" onclick="event.stopPropagation();handleMention(\'$1\')">@$1</span>');
 t = t.replace(/#(\w+)/g, '<span class="hashtag" onclick="event.stopPropagation();handleHash(\'#$1\')">#$1</span>');
 return t;
}

function handleHash(h) {
 showTab('search');
 setTimeout(() => {
 const i = document.getElementById('searchInp');
 if (i) { i.value = h; doSearch(h); }
 }, 250);
}

function handleMention(uname) {
 const clean = (uname || '').toLowerCase().trim();
 if (!clean) return;

 // Πρώτα ψάχνουμε στο usernames collection
 db.collection('usernames').doc(clean).get()
 .then(doc => {
 if (doc.exists && doc.data().uid) {
 openProfile(doc.data().uid);
 return null;
 }
 // Fallback: ψάχνουμε στο users
 return db.collection('users').where('username', '==', clean).limit(1).get();
 })
 .then(snap => {
 if (! snap) return;
 if (!snap.empty) {
 openProfile(snap.docs[0].id);
 } else {
 alert('Ο χρήστης @' + uname + ' δεν βρέθηκε');
 }
 })
 .catch(() => {
 alert('Ο χρήστης @' + uname + ' δεν βρέθηκε');
 });
}

function render() {
 const c = document.getElementById('content');
 document.getElementById('home-tabs').style.display = (user && currentTab==='home') ? 'flex' : 'none';
 if (!user) {
 c.innerHTML = `
 <div class="login-screen">
 <div class="login-logo">John Ross Social</div>
 <div class="login-tagline">Your space. Your voice.</div>
 <div class="login-form">
 <input type="email" id="loginEmail" placeholder="Email">
 <input type="password" id="loginPass" placeholder="Κωδικός">
 <button onclick="doLogin()" class="btn-main">Σύνδεση / Εγγραφή</button>
 </div>
 </div>`;
 return;
 }
 if (currentTab==='home') renderHome(c);
 else if (currentTab==='profile') renderProfile(c, user.uid);
 else if (currentTab==='settings') renderSettings(c);
 else if (currentTab==='notif') renderNotifs(c);
 else if (currentTab==='search') renderSearch(c);
 else if (currentTab==='admin') renderAdmin(c);
 lucide.createIcons();
}

async function renderSinglePost(postId) {
 const c = document.getElementById('content');
 c.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)">Φόρτωση...</div>';
 try {
 const doc = await db.collection('posts').doc(postId).get();
 if (!doc.exists) {
 c.innerHTML = '<div style="padding:40px;text-align:center"><p>Δεν βρέθηκε</p><br><button onclick="location.href=location.pathname" class="btn-main">Αρχική</button></div>';
 return;
 }
 const p = {id: doc.id, ...doc.data()};
 let html = '';
 if (!user) html += `<div class="guest-banner">Θέλεις να φτιάξεις προφίλ;<br><button onclick="location.href=location.pathname">Σύνδεση / Εγγραφή</button></div>`;
 html += '<div id="singlePost"></div>';
 c.innerHTML = html;
 displayPosts([p], document.getElementById('singlePost'));
 if (!user) document.getElementById('bottomNav').style.display = 'none';
 } catch(e) {
 c.innerHTML = '<div style="padding:40px;text-align:center;color:#dc2626">Σφάλμα</div>';
 }
}

function renderHome(m) {
 m.innerHTML = `
 <div style="padding:16px;border-bottom:1px solid var(--border)">
 <div style="display:flex;gap:12px">
 <div class="avatar" id="myAvH" style="width:40px;height:40px"></div>
 <textarea id="postText" placeholder="Τι συμβαίνει;" style="flex:1;background:none;border:none;color:var(--text);font-size:17px;resize:none;min-height:55px"></textarea>
 </div>
 <div id="imgPrv"></div>
 <div style="display:flex;justify-content:space-between;margin-top:10px;padding-left:52px">
 <i data-lucide="image" onclick="document.getElementById('fInp').click()" style="color:var(--blue);cursor:pointer"></i>
 <input type="file" id="fInp" hidden accept="image/*" onchange="handleFile(this)">
 <button onclick="sendPost()" class="btn-main" style="width:auto;padding:9px 18px">Post</button>
 </div>
 </div>
 <div id="feed"></div>`;
 db.collection('users').doc(user.uid).get().then(doc => {
 if (doc.exists && doc.data().photo) document.getElementById('myAvH').style.backgroundImage = `url('${doc.data().photo}')`;
 });
 loadFeed('feed');
}

function loadFeed(id, uid=null) {
 if (unsubscribeFeed) { unsubscribeFeed(); unsubscribeFeed = null; }
 const feed = document.getElementById(id);
 if (!feed) return;
 unsubscribeFeed = db.collection('posts').orderBy('createdAt','desc').limit(50).onSnapshot(snap => {
 let posts = snap.docs.map(d => ({id:d.id, ...d.data()}));
 if (uid) {
 db.collection('users').doc(uid).get().then(uDoc => {
 const pinned = uDoc.exists ? (uDoc.data().pinnedPosts||[]) : [];
 let userPosts = posts.filter(p => p.uid===uid);
 userPosts.forEach(p => p._isPinned = pinned.includes(p.id));
 userPosts.sort((a,b) => (b._isPinned?1:0) - (a._isPinned?1:0) || b.createdAt - a.createdAt);
 displayPosts(userPosts, feed);
 });
 } else if (feedType==='following' && currentTab==='home') {
 db.collection('users').doc(user.uid).get().then(uDoc => {
 const following = uDoc.exists ? (uDoc.data().following||[]) : [];
 displayPosts(posts.filter(p => following.includes(p.uid) || p.uid===user.uid), feed);
 });
 } else displayPosts(posts, feed);
 }, err => feed.innerHTML = '<p style="padding:20px;color:#dc2626">Σφάλμα</p>');
}

function displayPosts(posts, container) {
 if (!container) return;
 if (!posts.length) {
 container.innerHTML = '<p style="padding:30px;text-align:center;color:var(--muted)">Δεν υπάρχουν αναρτήσεις</p>';
 return;
