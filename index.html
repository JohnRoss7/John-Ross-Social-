<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>John Ross Social</title>
<meta name="theme-color" content="#000000">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#000;--text:#e7e9ea;--muted:#71767b;--border:#2f3336;--card:#16181c;--accent:#dc2626;--hover:rgba(255,255,255,.03);--blue:#1d9bf0}
body.light{--bg:#fff;--text:#0f1419;--muted:#536471;--border:#eff3f4;--card:#f7f9f9;--accent:#dc2626;--hover:rgba(0,0,0,.03);--blue:#1d9bf0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none}
.app-container{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:70px;background:var(--bg);border-left:1px solid var(--border);border-right:1px solid var(--border)}
.sidebar{position:fixed;top:0;left:-280px;width:280px;height:100vh;background:var(--bg);border-right:1px solid var(--border);z-index:1000;transition:left .3s;display:flex;flex-direction:column}
.sidebar.show{left:0}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border)}
.logo-box{background:var(--accent);color:#fff;padding:8px 14px;border-radius:20px;font-weight:700;font-size:14px}
#close-sidebar{background:none;border:none;color:var(--text);font-size:28px;cursor:pointer}
.sidebar-nav{flex:1;padding:12px;overflow-y:auto}
.sidebar-nav a{display:flex;align-items:center;gap:14px;padding:14px 16px;color:var(--text);text-decoration:none;border-radius:9999px;font-size:17px;font-weight:500;cursor:pointer;margin-bottom:4px}
.sidebar-nav a:hover{background:var(--card)}
.sidebar-nav hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;display:none}
.overlay.show{display:block}
.main-header{position:sticky;top:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 16px;z-index:100;display:flex;align-items:center;gap:10px}
body.light .main-header{background:rgba(255,255,255,.85)}
.menu-btn{background:none;border:none;color:var(--text);cursor:pointer;padding:6px}
.logo-text{font-weight:700;font-size:17px}
.slogan-badge{background:var(--accent);color:#fff;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap}
.top-tabs{display:flex;border-bottom:1px solid var(--border)}
.tab-btn{flex:1;padding:16px;background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;border-bottom:3px solid transparent;font-weight:500}
.tab-btn.active{color:var(--text);border-bottom-color:var(--accent);font-weight:700}
.post{border-bottom:1px solid var(--border);padding:14px 16px}
.post:hover{background:var(--hover)}
.post-header{display:flex;gap:12px;margin-bottom:6px;align-items:flex-start}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#dc2626,#7c2d12);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden;background-size:cover;background-position:center;color:#fff;cursor:pointer}
.avatar-lg{width:110px;height:110px;font-size:48px;border-radius:16px}
.post-info{flex:1;min-width:0}
.username{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;cursor:pointer}
.handle{color:var(--muted);font-size:14px}
.post-content{font-size:15px;line-height:1.5;margin:4px 0 10px;word-wrap:break-word;white-space:pre-wrap}
.post-images img{width:100%;max-height:380px;object-fit:cover;border-radius:12px;cursor:pointer;margin-top:10px}
.post-actions{display:flex;gap:28px;color:var(--muted);font-size:13px;margin-top:10px;align-items:center}
.post-actions span{display:flex;align-items:center;gap:6px;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:none;justify-content:space-around;padding:10px 0;max-width:600px;margin:0 auto;z-index:100}
.nav-item{background:none;border:none;color:var(--muted);padding:8px 18px;cursor:pointer}
.nav-item.active{color:var(--accent)}
.nav-badge{position:absolute;top:6px;right:14px;width:9px;height:9px;background:var(--accent);border-radius:50%;display:none}
.auth-container{text-align:center;padding:50px 24px}
.auth-container input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:14px;border-radius:9999px;margin:8px 0;outline:none;max-width:340px}
.auth-container button{width:100%;max-width:340px;background:var(--accent);color:#fff;border:none;padding:14px;border-radius:9999px;font-weight:700;cursor:pointer;margin:8px 0}
.profile{padding:20px}
.admin-badge{background:var(--accent);color:#fff;padding:2px 7px;border-radius:8px;font-size:11px;font-weight:600}
.img-preview img{width:90px;height:90px;object-fit:cover;border-radius:10px;margin:10px 5px 0 0}
.notif-item{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.notif-item.unread{background:rgba(29,155,240,0.1)}
.quoted-box{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:10px;background:var(--hover)}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<aside id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <div class="logo-box">John Ross Social</div>
    <button id="close-sidebar" onclick="closeSidebar()">&times;</button>
  </div>
  <nav class="sidebar-nav">
    <a onclick="goHome();closeSidebar()"><i data-lucide="home"></i> Home</a>
    <a onclick="showTab('profile');closeSidebar()"><i data-lucide="user"></i> Profile</a>
    <a onclick="showTab('edit-profile');closeSidebar()"><i data-lucide="edit-3"></i> Edit Profile</a>
    <a onclick="showTab('settings');closeSidebar()"><i data-lucide="settings"></i> Settings</a>
    <a onclick="clearCache();closeSidebar()"><i data-lucide="trash-2"></i> Clear Cache</a>
    <div id="adminMenuItem" style="display:none"><hr><a onclick="showTab('admin');closeSidebar()"><i data-lucide="shield"></i> Admin Panel</a></div>
    <hr>
    <a onclick="logout();closeSidebar()"><i data-lucide="log-out"></i> Logout</a>
  </nav>
</aside>

<main class="app-container">
  <header class="main-header">
    <button class="menu-btn" onclick="openSidebar()"><i data-lucide="menu"></i></button>
    <div class="logo-text">John Ross Social</div>
    <div class="slogan-badge">Your space. Your voice.</div>
  </header>
  <div id="main"></div>
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item" id="nav-home" onclick="showTab('home')"><i data-lucide="home"></i></button>
    <button class="nav-item" id="nav-search" onclick="showTab('search')"><i data-lucide="search"></i></button>
    <button class="nav-item" id="nav-notif" onclick="showTab('notif')"><i data-lucide="bell"></i><span class="nav-badge" id="notifBadge"></span></button>
    <button class="nav-item" id="nav-profile" onclick="showTab('profile')"><i data-lucide="user"></i></button>
  </nav>
</main>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCPIg-aoWUhqOqO5hyHUd66HLcHPyC6e70",
  authDomain: "studio-386569156-384ec.firebaseapp.com",
  projectId: "studio-386569156-384ec",
  storageBucket: "studio-386569156-384ec.firebasestorage.app",
  messagingSenderId: "976658898078",
  appId: "1:976658898078:web:6209be10508924e2116f8f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let user = null;
let currentTab = 'home';
let pendingImages = [];
const adminEmails = ['rossrossg7@gmail.com'];

function openSidebar(){document.getElementById('sidebar').classList.add('show');document.getElementById('overlay').classList.add('show')}
function closeSidebar(){document.getElementById('sidebar').classList.remove('show');document.getElementById('overlay').classList.remove('show')}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function goHome(){ showTab('home'); }
function clearCache(){ localStorage.clear(); location.reload(); }

auth.onAuthStateChanged(u => {
  user = u;
  if(u) {
    document.getElementById('adminMenuItem').style.display = adminEmails.includes(u.email) ? 'block' : 'none';
    listenNotifs();
  }
  render();
});

function login(){
  const e=document.getElementById('le').value, p=document.getElementById('lp').value;
  auth.signInWithEmailAndPassword(e,p).catch(err=>alert(err.message));
}
function register(){
  const e=document.getElementById('le').value, p=document.getElementById('lp').value;
  auth.createUserWithEmailAndPassword(e,p).then(cred => {
    db.collection('users').doc(cred.user.uid).set({name:e.split('@')[0], bio:'', photo:'', followers:[], following:[], createdAt:Date.now()});
  }).catch(err=>alert(err.message));
}
function logout(){ auth.signOut(); }

function showTab(t){
  currentTab = t;
  render();
}

function compressImage(file){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 600;
        let w = img.width, h = img.height;
        if(w > h) { if(w > MAX){ h *= MAX/w; w = MAX; } }
        else { if(h > MAX){ w *= MAX/h; h = MAX; } }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handleImage(e){
  const file = e.target.files[0];
  if(file){
    const compressed = await compressImage(file);
    pendingImages = [compressed];
    document.getElementById('imgPreview').innerHTML = `<img src="${compressed}">`;
  }
}

function render(){
  const m = document.getElementById('main');
  const nav = document.getElementById('bottomNav');
  if(!user){
    nav.style.display = 'none';
    m.innerHTML = `<div class="auth-container"><h2>John Ross Social</h2><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button onclick="login()">Login</button><button onclick="register()" style="background:#333">Register</button></div>`;
    lucide.createIcons();
    return;
  }
  nav.style.display = 'flex';
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  if(document.getElementById('nav-'+currentTab)) document.getElementById('nav-'+currentTab).classList.add('active');

  if(currentTab === 'home') renderHome(m);
  else if(currentTab === 'profile') renderProfile(m, user.uid);
  else if(currentTab === 'search') renderSearch(m);
  else if(currentTab === 'notif') renderNotifs(m);
  else if(currentTab === 'edit-profile') renderEditProfile(m);
  else if(currentTab === 'admin') renderAdmin(m);
  
  lucide.createIcons();
}

function renderHome(m){
  m.innerHTML = `
    <div style="padding:15px; border-bottom:1px solid var(--border)">
      <textarea id="postText" placeholder="What's happening?" style="width:100%; background:none; border:none; color:#fff; font-size:18px; outline:none; resize:none"></textarea>
      <div id="imgPreview" class="img-preview"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px">
        <button onclick="document.getElementById('fileInput').click()" style="background:none; border:none; color:var(--muted); cursor:pointer"><i data-lucide="image"></i></button>
        <input type="file" id="fileInput" hidden onchange="handleImage(event)">
        <button class="btn-full" style="width:auto; padding:8px 22px" onclick="createPost()">Post</button>
      </div>
    </div>
    <div id="feed"></div>`;
  
  db.collection('posts').orderBy('createdAt', 'desc').limit(40).onSnapshot(snap => {
    const feed = document.getElementById('feed');
    if(!feed) return;
    feed.innerHTML = snap.docs.map(d => {
      const p = d.data();
      return `<div class="post">
        <div class="post-header">
          <div class="avatar" style="${p.photo?`background-image:url('${p.photo}')`:''}">👤</div>
          <div class="post-info"><b>${esc(p.name)}</b><div class="handle">@${esc(p.name.toLowerCase())}</div></div>
        </div>
        <div class="post-content">${esc(p.text)}</div>
        ${p.images && p.images[0] ? `<img src="${p.images[0]}" style="width:100%; border-radius:12px; margin-top:10px">` : ''}
        <div class="post-actions">
          <span onclick="likePost('${d.id}')"><i data-lucide="heart"></i> ${p.likes||0}</span>
          <span><i data-lucide="message-circle"></i> ${(p.comments||[]).length}</span>
        </div>
      </div>`;
    }).join('');
    lucide.createIcons();
  });
}

async function createPost(){
  const txt = document.getElementById('postText').value;
  if(!txt.trim() && pendingImages.length === 0) return;
  const uDoc = await db.collection('users').doc(user.uid).get();
  const userData = uDoc.data();
  await db.collection('posts').add({
    uid: user.uid, name: userData.name || user.email.split('@')[0],
    photo: userData.photo || '', text: txt, images: pendingImages,
    likes: 0, likedBy: [], comments: [], createdAt: Date.now()
  });
  pendingImages = [];
  document.getElementById('postText').value = '';
  document.getElementById('imgPreview').innerHTML = '';
}

async function likePost(id){
  const ref = db.collection('posts').doc(id);
  const doc = await ref.get();
  const p = doc.data();
  const liked = (p.likedBy || []).includes(user.uid);
  if(liked){
    ref.update({ likes: firebase.firestore.FieldValue.increment(-1), likedBy: firebase.firestore.FieldValue.arrayRemove(user.uid) });
  } else {
    ref.update({ likes: firebase.firestore.FieldValue.increment(1), likedBy: firebase.firestore.FieldValue.arrayUnion(user.uid) });
  }
}

function renderSearch(m){
  m.innerHTML = `<div style="padding:15px"><input id="searchInp" oninput="doSearch(this.value)" placeholder="Search users..." style="width:100%; background:var(--card); border:none; color:#fff; padding:12px; border-radius:20px; outline:none"></div><div id="searchResults"></div>`;
}

function doSearch(q){
  if(!q) return;
  db.collection('users').where('name', '>=', q).limit(10).get().then(snap => {
    document.getElementById('searchResults').innerHTML = snap.docs.map(d => `
      <div class="post" onclick="showTab('profile'); renderProfile(document.getElementById('main'), '${d.id}')">
        <b>${esc(d.data().name)}</b>
      </div>`).join('');
  });
}

function renderNotifs(m){
  db.collection('notifications').where('userId', '==', user.uid).limit(20).get().then(snap => {
    m.innerHTML = snap.docs.map(d => `<div class="notif-item">${esc(d.data().text)}</div>`).join('') || '<div class="empty-state">No notifications</div>';
  });
}

function listenNotifs(){
  db.collection('notifications').where('userId', '==', user.uid).where('read', '==', false).onSnapshot(snap => {
    document.getElementById('notifBadge').style.display = snap.empty ? 'none' : 'block';
  });
}

function renderProfile(m, uid){
  db.collection('users').doc(uid).get().then(doc => {
    const u = doc.data() || {};
    m.innerHTML = `
      <div class="profile">
        <div style="text-align:center">
          <div class="avatar avatar-lg" style="margin:0 auto; ${u.photo?`background-image:url('${u.photo}')`:''}">👤</div>
          <h2 style="margin-top:10px">${esc(u.name)}</h2>
          <p>${esc(u.bio)}</p>
        </div>
        <div id="userPosts"></div>
      </div>`;
  });
}

function renderEditProfile(m){
  db.collection('users').doc(user.uid).get().then(doc => {
    const u = doc.data() || {};
    m.innerHTML = `
      <div class="profile">
        <h3>Edit Profile</h3>
        <input id="editName" value="${esc(u.name)}" placeholder="Name">
        <textarea id="editBio" placeholder="Bio">${esc(u.bio)}</textarea>
        <button class="btn-full" onclick="saveProfile()">Save</button>
      </div>`;
  });
}

async function saveProfile(){
  const name = document.getElementById('editName').value;
  const bio = document.getElementById('editBio').value;
  await db.collection('users').doc(user.uid).update({ name, bio });
  alert('Saved!');
  showTab('profile');
}

function renderAdmin(m){
  m.innerHTML = `<div class="profile"><h3>Admin Panel</h3><p>Total posts loading...</p></div>`;
}

lucide.createIcons();
</script>
</body>
</html>
