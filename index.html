<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>John Ross Social v13</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg:#000; --text:#fff; --muted:#777; --border:#222; --card:#16181c; --accent:#dc2626; --blue:#1d9bf0; }
        body.light { --bg:#fff; --text:#000; --muted:#666; --border:#eee; --card:#f7f9f9; }
        
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }
        html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:-apple-system, system-ui, sans-serif; position:fixed; }

        .app-wrapper { width:100%; height:100%; display:flex; flex-direction:column; max-width:550px; margin:0 auto; border-left:1px solid var(--border); border-right:1px solid var(--border); background:var(--bg); position:relative; }

        /* HEADER */
        header { background:rgba(0,0,0,0.85); backdrop-filter:blur(15px); z-index:1000; border-bottom:1px solid var(--border); flex-shrink:0; }
        .header-top { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
        .tabs { display:flex; border-bottom:1px solid var(--border); }
        .tab { flex:1; padding:14px; text-align:center; font-weight:600; color:var(--muted); cursor:pointer; }
        .tab.active { color:var(--text); border-bottom:2px solid var(--accent); }

        #main-scroll { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }

        /* POSTS */
        .post { padding:16px; border-bottom:1px solid var(--border); position:relative; width:100%; }
        .post-header { display:flex; gap:12px; margin-bottom:8px; }
        .avatar { width:48px; height:48px; border-radius:12px; background:#333; background-size:cover; background-position:center; flex-shrink:0; cursor:pointer; border:1px solid var(--border); }
        .post-content { flex:1; min-width:0; }
        .username { font-weight:700; font-size:15px; color:var(--text); display:flex; align-items:center; gap:5px; cursor:pointer; }
        .post-text { font-size:16px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; }
        .hashtag { color:var(--accent) !important; font-weight:600; cursor:pointer; }
        .post-img { width:100% !important; max-height:350px !important; object-fit:cover; border-radius:14px; margin-top:12px; border:1px solid var(--border); cursor:pointer; display:block; background:#111; }

        .post-actions { display:flex; justify-content:space-between; max-width:350px; margin-top:15px; color:var(--muted); }
        .post-actions span { display:flex; align-items:center; gap:10px; font-size:16px; cursor:pointer; padding:5px; }

        /* NAV */
        nav.bottom-nav { height:65px; border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; background:var(--bg); flex-shrink:0; }
        .nav-item { color:var(--muted); position:relative; cursor:pointer; padding:12px; }
        .nav-item.active { color:var(--text); }
        .badge { position:absolute; top:8px; right:8px; width:12px; height:12px; background:var(--accent); border-radius:50%; border:2px solid var(--bg); display:none; }

        /* PROFILE SPECIAL UI */
        .profile-container { padding: 25px 20px; text-align:center; position:relative; border-bottom: 1px solid var(--border); }
        .avatar-main-wrapper { position:relative; display:inline-block; margin-bottom:15px; }
        .avatar-lg { width:120px; height:120px; border-radius:25px; border:3px solid var(--accent); background-size:cover; background-position:center; cursor:pointer; background-color:#333; }
        .profile-menu-dots { position:absolute; top:5px; right:5px; background:rgba(0,0,0,0.6); color:white; border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:10; }
        
        .profile-stats { display:flex; justify-content:center; gap:25px; margin-top:15px; }
        .stat-item { cursor:pointer; font-size:14px; color:var(--muted); }
        .stat-item b { color:var(--text); font-size:18px; display:block; }

        /* MODALS */
        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:5000; display:none; align-items:center; justify-content:center; padding:20px; }
        .modal-content { background:var(--card); width:100%; max-width:400px; border-radius:20px; padding:20px; border:1px solid var(--border); }
        .profile-input { width:100%; padding:14px; background:var(--bg); border:1px solid var(--border); color:#fff; border-radius:12px; font-size:16px; margin-top:5px; margin-bottom:10px; }
        
        .sidebar { position:fixed; top:0; left:-285px; width:280px; height:100%; background:var(--bg); z-index:2000; border-right:1px solid var(--border); transition:0.3s ease; display:flex; flex-direction:column; }
        .sidebar.show { left:0; }
        .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1500; display:none; }
        .btn-main { background:var(--accent); color:#fff; border:none; padding:12px 24px; border-radius:20px; font-weight:700; cursor:pointer; width:100%; }
        .close-lb { position:absolute; top:40px; right:20px; background:var(--accent); color:#fff; border:none; border-radius:50%; width:45px; height:45px; font-weight:bold; cursor:pointer; z-index:5100; font-size:20px; }
    </style>
</head>
<body class="dark">

<div class="overlay" id="overlay" onclick="toggleSidebar(false); closeModals()"></div>

<aside class="sidebar" id="sidebar">
    <div style="padding:20px; border-bottom:1px solid var(--border); font-weight:800; font-size:20px;">John Ross Social</div>
    <div style="padding: 10px; flex: 1; overflow-y: auto;">
        <div onclick="showTab('home');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="home"></i> Αρχική</div>
        <div onclick="showTab('profile');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="user"></i> Προφίλ</div>
        <div onclick="showTab('settings');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="settings"></i> Ρυθμίσεις</div>
        <div onclick="forceResetApp()" style="padding:15px; cursor:pointer; color:#ff9800"><i data-lucide="trash-2"></i> Εκκαθάριση Cache</div>
        <div id="adminBtn" style="display:none;" onclick="showTab('admin');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="shield"></i> Admin Panel</div>
        <hr style="border:none; border-top:1px solid var(--border); margin:10px 0;">
        <div onclick="logout()" style="padding:15px; color:var(--accent); cursor:pointer"><i data-lucide="log-out"></i> Αποσύνδεση</div>
        <div style="padding:20px; font-size:10px; color:var(--muted); text-align:center">Version 13.0 Pro</div>
    </div>
</aside>

<div class="app-wrapper">
    <header id="main-header">
        <div class="header-top">
            <i data-lucide="menu" onclick="toggleSidebar(true)" style="cursor:pointer"></i>
            <div style="font-weight:800; font-size:20px">John Ross Social</div>
            <i data-lucide="plus-circle" style="opacity:0"></i>
        </div>
        <div class="tabs" id="home-tabs" style="display:none">
            <div class="tab active" id="tab-foryou" onclick="setFeed('foryou')">Για εσένα</div>
            <div class="tab" id="tab-following" onclick="setFeed('following')">Ακολουθείς</div>
        </div>
    </header>

    <main id="main-scroll"><div id="content"></div></main>

    <nav class="bottom-nav">
        <div class="nav-item active" id="btn-home" onclick="showTab('home')"><i data-lucide="home"></i></div>
        <div class="nav-item" id="btn-search" onclick="showTab('search')"><i data-lucide="search"></i></div>
        <div class="nav-item" id="btn-notif" onclick="showTab('notif')"><i data-lucide="bell"></i><div class="badge" id="notif-badge"></div></div>
        <div class="nav-item" id="btn-profile" onclick="showTab('profile')"><i data-lucide="user"></i></div>
    </nav>
</div>

<!-- EDIT PROFILE MODAL -->
<div class="modal" id="editProfileModal">
    <div class="modal-content">
        <h3 id="modalEditTitle">Επεξεργασία Προφίλ</h3><br>
        <div onclick="document.getElementById('pInp').click()" style="text-align:center; cursor:pointer; margin-bottom:10px; color:var(--blue)">Αλλαγή Φωτογραφίας</div>
        <input type="file" id="pInp" hidden accept="image/*" onchange="handleFile(this, 'profile')">
        <label style="font-size:12px; color:var(--muted)">Όνομα Χρήστη</label>
        <input id="uName" class="profile-input">
        <label style="font-size:12px; color:var(--muted)">Βιογραφικό</label>
        <textarea id="uBio" class="profile-input" style="height:80px; resize:none"></textarea>
        <div onclick="toggleLang()" style="padding:10px 0; cursor:pointer; color:var(--blue); font-weight:bold" id="langSwitcher">English / Ελληνικά</div>
        <button onclick="saveProfile()" class="btn-main">Save Changes</button>
        <button onclick="closeModals()" style="background:none; border:none; color:#fff; width:100%; margin-top:10px">Κλείσιμο</button>
    </div>
</div>

<!-- USER LIST MODAL (Followers/Following) -->
<div class="modal" id="userListModal">
    <div class="modal-content">
        <h3 id="userListTitle">Λίστα</h3>
        <div id="userListContainer" style="max-height:300px; overflow-y:auto; margin:15px 0;"></div>
        <button onclick="closeModals()" class="btn-main">Κλείσιμο</button>
    </div>
</div>

<div class="lightbox" id="lightbox" onclick="this.style.display='none'"><button class="close-lb">X</button><img id="lb-img" style="max-width:100%; max-height:100%; object-fit:contain"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCPIg-aoWUhqOqO5hyHUd66HLcHPyC6e70",
        authDomain: "studio-386569156-384ec.firebaseapp.com",
        projectId: "studio-386569156-384ec",
        storageBucket: "studio-386569156-384ec.firebasestorage.app",
        messagingSenderId: "976658898078",
        appId: "1:976658898078:web:6209be10508924e2116f8f"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let user = null;
    let currentTab = 'home';
    let historyStack = [];
    let feedType = 'foryou';
    let lang = localStorage.getItem('jrs_lang') || 'el';
    const adminEmail = 'rossrossg7@gmail.com';

    auth.onAuthStateChanged(u => {
        user = u;
        if(u) {
            document.getElementById('adminBtn').style.display = (u.email === adminEmail) ? 'block' : 'none';
            listenNotifs();
        }
        render();
    });

    function toggleSidebar(show) { document.getElementById('sidebar').classList.toggle('show', show); document.getElementById('overlay').style.display = show ? 'block' : 'none'; }
    function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); document.getElementById('overlay').style.display='none'; }
    function logout() { auth.signOut(); location.reload(); }
    function forceResetApp() { localStorage.clear(); location.href = location.pathname + '?r=' + Date.now(); }
    function toggleLang() { lang = (lang === 'el' ? 'en' : 'el'); localStorage.setItem('jrs_lang', lang); location.reload(); }

    function showTab(t, fromBack = false) {
        if(!fromBack && currentTab !== t) { historyStack.push(currentTab); window.history.pushState({tab: t}, ""); }
        currentTab = t;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if(document.getElementById('btn-'+t)) document.getElementById('btn-'+t).classList.add('active');
        document.getElementById('home-tabs').style.display = (t === 'home') ? 'flex' : 'none';
        render();
    }
    window.onpopstate = () => { if(historyStack.length > 0) showTab(historyStack.pop(), true); };

    function format(text) {
        if(!text) return "";
        let esc = String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
        return esc.replace(/#(\w+)/g, '<span class="hashtag" onclick="event.stopPropagation(); handleTagClick(\'#$1\')">#$1</span>');
    }
    function handleTagClick(tag) { showTab('search'); setTimeout(() => { const inp = document.getElementById('searchInp'); if(inp) { inp.value = tag; doSearch(tag); } }, 500); }

    function render() {
        const container = document.getElementById('content');
        if(!user) {
            container.innerHTML = `<div style="padding:60px 25px; text-align:center;"><h1>John Ross Social</h1><br><button onclick="auth.signInWithEmailAndPassword(prompt('Email:'), prompt('Password:'))" class="btn-main">Σύνδεση</button></div>`;
            return;
        }
        if(currentTab === 'home') renderHome(container);
        else if(currentTab === 'profile') renderProfile(container, user.uid);
        else if(currentTab === 'notif') renderNotifs(container);
        else if(currentTab === 'search') renderSearch(container);
        else if(currentTab === 'settings') container.innerHTML = '<div style="padding:20px"><h2>Ρυθμίσεις</h2><p>Dark Mode: Ενεργό</p></div>';
        else if(currentTab === 'admin') renderAdmin(container);
        lucide.createIcons();
    }

    function renderHome(m) {
        m.innerHTML = `<div style="padding:16px; border-bottom:1px solid var(--border)"><textarea id="postText" placeholder="Τι συμβαίνει;" style="width:100%; background:none; border:none; color:#fff; font-size:18px; outline:none; resize:none; min-height:60px"></textarea><div id="imgPrev"></div><div style="display:flex; justify-content:space-between; margin-top:10px"><i data-lucide="image" onclick="document.getElementById('fInp').click()" style="color:var(--blue); cursor:pointer"></i><input type="file" id="fInp" hidden onchange="handleFile(this)"><button onclick="sendPost()" class="btn-main" style="width:auto">Post</button></div></div><div id="feed"></div>`;
        renderFeed('feed');
    }

    function renderFeed(targetId, filterUid = null) {
        const feed = document.getElementById(targetId);
        if(!feed) return;
        let query = db.collection('posts').orderBy('createdAt', 'desc').limit(25);
        if(filterUid) query = query.where('uid', '==', filterUid);

        query.onSnapshot(snap => {
            let posts = snap.docs.map(d => ({id: d.id, ...d.data()}));
            feed.innerHTML = posts.map(p => {
                const isLiked = (p.likedBy || []).includes(user.uid);
                return `<div class="post">
                    <div class="post-header">
                        <div class="avatar" onclick="openProfile('${p.uid}')" style="${p.photo?`background-image:url('${p.photo}')`:''}"></div>
                        <div class="post-content">
                            <div class="username" onclick="openProfile('${p.uid}')">${p.name}</div>
                            <div class="post-text">${format(p.text)}</div>
                            ${p.images && p.images[0] ? `<img src="${p.images[0]}" class="post-img" onclick="openLB('${p.images[0]}')">` : ''}
                            <div class="post-actions">
                                <span onclick="like('${p.id}')"><i data-lucide="heart" style="${isLiked?'fill:var(--accent)':''}"></i> ${p.likes||0}</span>
                                <span onclick="focusComment('${p.id}')"><i data-lucide="message-circle"></i></span>
                                <span onclick="sharePost('${p.id}')"><i data-lucide="share-2"></i></span>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        });
    }

    function renderProfile(m, uid) {
        db.collection('users').doc(uid).onSnapshot(doc => {
            if(!doc.exists) return;
            const u = doc.data();
            const isOwn = uid === user.uid;
            m.innerHTML = `
                <div class="profile-container">
                    <div class="avatar-main-wrapper">
                        <div class="avatar-lg" onclick="openLB('${u.photo}')" style="${u.photo?`background-image:url('${u.photo}')`:''}"></div>
                        ${isOwn ? `<div class="profile-menu-dots" onclick="openEditModal()"><i data-lucide="more-horizontal" style="width:18px"></i></div>` : ''}
                    </div>
                    <h2>${u.name}</h2>
                    <p style="color:var(--muted); margin:10px 0">${u.bio || ''}</p>
                    <div class="profile-stats">
                        <div class="stat-item" onclick="showUsers('${uid}', 'followers')"><b>${(u.followers||[]).length}</b> Followers</div>
                        <div class="stat-item" onclick="showUsers('${uid}', 'following')"><b>${(u.following||[]).length}</b> Following</div>
                    </div>
                    ${!isOwn ? `<button class="btn-main" onclick="toggleFollow('${uid}')" style="margin-top:15px; width:auto; padding:8px 20px">${(u.followers||[]).includes(user.uid)?'Ακολουθείς':'Ακολούθηση'}</button>` : ''}
                </div>
                <div id="profile-feed"></div>`;
            lucide.createIcons();
            renderFeed('profile-feed', uid);
        });
    }

    function openEditModal() {
        db.collection('users').doc(user.uid).get().then(doc => {
            const u = doc.data();
            document.getElementById('uName').value = u.name;
            document.getElementById('uBio').value = u.bio || '';
            document.getElementById('editProfileModal').style.display='flex';
            document.getElementById('overlay').style.display='block';
        });
    }

    async function saveProfile() {
        const n = document.getElementById('uName').value;
        const b = document.getElementById('uBio').value;
        await db.collection('users').doc(user.uid).update({ name: n, bio: b });
        // Update old posts
        const posts = await db.collection('posts').where('uid', '==', user.uid).get();
        const batch = db.batch();
        posts.forEach(d => batch.update(d.ref, { name: n }));
        await batch.commit();
        closeModals();
        alert("Αποθηκεύτηκε!");
    }

    async function showUsers(uid, type) {
        const doc = await db.collection('users').doc(uid).get();
        const ids = doc.data()[type] || [];
        document.getElementById('userListTitle').innerText = type === 'followers' ? 'Followers' : 'Following';
        const container = document.getElementById('userListContainer');
        container.innerHTML = 'Φόρτωση...';
        document.getElementById('userListModal').style.display='flex';
        document.getElementById('overlay').style.display='block';
        
        if(ids.length === 0) { container.innerHTML = 'Κανένας χρήστης'; return; }
        
        let html = '';
        for(let id of ids) {
            const uDoc = await db.collection('users').doc(id).get();
            if(uDoc.exists) {
                const u = uDoc.data();
                html += `<div style="display:flex; align-items:center; gap:10px; padding:10px; border-bottom:1px solid var(--border)" onclick="closeModals(); openProfile('${id}')">
                    <div class="avatar" style="width:35px; height:35px; ${u.photo?`background-image:url('${u.photo}')`:''}"></div>
                    <b>${u.name}</b>
                </div>`;
            }
        }
        container.innerHTML = html;
    }

    async function handleFile(inp, target = 'post') {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = async () => {
                const canvas = document.createElement('canvas'); const MAX = 600;
                let w = img.width, h = img.height;
                if (w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } } else { if(h > MAX) { w *= MAX/h; h = MAX; } }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
                const data = canvas.toDataURL('image/jpeg', 0.4);
                if(target === 'profile') {
                    await db.collection('users').doc(user.uid).update({ photo: data });
                    const posts = await db.collection('posts').where('uid','==',user.uid).get();
                    const batch = db.batch(); posts.forEach(d => batch.update(d.ref, {photo: data})); await batch.commit();
                    alert("Φωτογραφία άλλαξε!");
                } else {
                    pendingImg = data;
                    document.getElementById('imgPrev').innerHTML = `<div class="img-prev-box"><img src="${data}"><button class="del" onclick="pendingImg=null; document.getElementById('imgPrev').innerHTML=''">×</button></div>`;
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(inp.files[0]);
    }

    async function sendPost() {
        const txt = document.getElementById('postText').value;
        if(!txt.trim() && !pendingImg) return;
        const uDoc = await db.collection('users').doc(user.uid).get();
        await db.collection('posts').add({
            uid: user.uid, name: uDoc.data().name, photo: uDoc.data().photo || '',
            text: txt, images: pendingImg ? [pendingImg] : [], likes: 0, likedBy: [], createdAt: Date.now()
        });
        document.getElementById('postText').value = ''; pendingImg = null; document.getElementById('imgPrev').innerHTML = '';
    }

    async function like(id) {
        const ref = db.collection('posts').doc(id);
        const doc = await ref.get();
        const p = doc.data();
        if((p.likedBy || []).includes(user.uid)) {
            ref.update({ likes: firebase.firestore.FieldValue.increment(-1), likedBy: firebase.firestore.FieldValue.arrayRemove(user.uid) });
        } else {
            ref.update({ likes: firebase.firestore.FieldValue.increment(1), likedBy: firebase.firestore.FieldValue.arrayUnion(user.uid) });
            if(p.uid !== user.uid) db.collection('notifications').add({ userId: p.uid, text: `${user.name} έκανε like`, read: false, createdAt: Date.now() });
        }
    }

    function openProfile(uid) { showTab('profile'); renderProfile(document.getElementById('content'), uid); }
    function openLB(src) { document.getElementById('lb-img').src=src; document.getElementById('lightbox').style.display='flex'; }
    function focusComment() { alert("Λειτουργία σχολίων σύντομα διαθέσιμη!"); }

    lucide.createIcons();
</script>
</body>
</html>
