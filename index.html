<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Ross Social</title>
    <!-- Εισαγωγή Firebase SDK & Στυλ -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <h2>John Ross Social</h2>
        </header>

        <!-- Main Feed / Tabs -->
        <main id="main-content">
            <!-- Εδώ φορτώνονται τα posts -->
            <div id="posts-container"></div>
        </main>

        <!-- Notifications Section -->
        <section id="notifications-section" style="display:none;">
            <h3>Ειδοποιήσεις</h3>
            <div id="notifications-container"></div>
        </section>

        <!-- Navigation Bar -->
        <nav class="bottom-nav">
            <button onclick="switchTab('feed')">🏠</button>
            <button onclick="switchTab('search')">🔍</button>
            <button onclick="switchTab('notifications')" id="notif-btn">
                🔔 <span id="notif-badge" class="badge-dot" style="display:none;"></span>
            </button>
            <button onclick="switchTab('profile')">👤</button>
        </nav>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <script>
        // Ρυθμίσεις Firebase (Βάλε τα δικά σου στοιχεία)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 1. Διόρθωση Login για Υπολογιστή (Αποφυγή μπλοκαρίσματος popup)
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch((error) => {
                // Αν αποτύχει το popup στον υπολογιστή, γίνεται χρήση redirect
                auth.signInWithRedirect(provider);
            });
        }

        // 2. Έλεγχος Admin (Μόνο για το username σου)
        function renderAdminBadge(username) {
            if (username === 'johnross7') {
                return '<span class="admin-badge" style="background:red; color:white; padding:2px 6px; border-radius:4px; font-size:10px;">Admin</span>';
            }
            return '';
        }

        // 3. Φόρτωση Ειδοποιήσεων & Κουμπί Follow
        function loadNotifications(userId) {
            const notifContainer = document.getElementById('notifications-container');
            const badge = document.getElementById('notif-badge');
            notifContainer.innerHTML = '';

            db.collection('notifications')
              .where('userId', '==', userId)
              .orderBy('timestamp', 'desc')
              .onSnapshot(snapshot => {
                  let unreadCount = 0;
                  notifContainer.innerHTML = '';
                  
                  if(snapshot.empty) {
                      notifContainer.innerHTML = '<p>Δεν υπάρχουν ειδοποιήσεις.</p>';
                      badge.style.display = 'none';
                      return;
                  }

                  snapshot.forEach(doc => {
                      const notif = doc.data();
                      if (!notif.read) unreadCount++;

                      const div = document.createElement('div');
                      div.className = 'notification-item';
                      div.innerHTML = `
                          <p>${notif.text}</p>
                          ${notif.senderId ? `<button onclick="followUser('${notif.senderId}')">Ακολουθήστε</button>` : ''}
                      `;
                      notifContainer.appendChild(div);
                  });

                  if (unreadCount > 0) {
                      badge.style.display = 'inline-block';
                  } else {
                      badge.style.display = 'none';
                  }
              });
        }

        // Συνάρτηση για Follow πίσω
        async function followUser(targetUserId) {
            const currentUser = auth.currentUser;
            if (!currentUser) {
                alert('Πρέπει να συνδεθείτε!');
                return;
            }
            try {
                await db.collection('users').doc(currentUser.uid).collection('following').doc(targetUserId).set({
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert('Επιτυχής ακολουθία χρήστη!');
            } catch (error) {
                console.error("Σφάλμα στο follow:", error);
            }
        }

        function switchTab(tabName) {
            // Διαχείριση οθονών/tabs της εφαρμογής σου
            const currentUser = auth.currentUser;
            if (tabName === 'notifications' && currentUser) {
                loadNotifications(currentUser.uid);
            }
        }
    </script>
</body>
</html>
