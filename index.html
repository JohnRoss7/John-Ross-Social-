<style>
:root{--bg:#000;--text:#fff;--muted:#777;--border:#222;--card:#16181c;--accent:#dc2626;--blue:#1d9bf0}
body.light{--bg:#fff;--text:#000;--muted:#666;--border:#eee;--card:#f7f9f9}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;position:fixed;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
input,textarea,select,button{font-size:16px!important;touch-action:manipulation}
.app-wrapper{width:100%;height:100%;display:flex;flex-direction:column;max-width:550px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border);background:var(--bg)}
header{background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;z-index:1000}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:14px;text-align:center;font-weight:600;color:var(--muted);cursor:pointer}
.tab.active{color:var(--text);border-bottom:2px solid var(--accent)}
#main-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.post{padding:16px;border-bottom:1px solid var(--border);position:relative}
.post-header{display:flex;gap:12px}
.avatar{width:48px;height:48px;border-radius:12px;background:#333;background-size:cover;background-position:center;flex-shrink:0;cursor:pointer;border:1px solid var(--border)}
.username{font-weight:700;font-size:15px}
.post-time{font-size:12px;color:var(--muted);margin-top:2px}
.post-text{font-size:16px;line-height:1.5;white-space:pre-wrap;margin:6px 0}
.hashtag,.mention{color:var(--accent)!important;font-weight:600;cursor:pointer}
.post-img{width:100%;max-height:70vh;object-fit:contain;border-radius:14px;margin-top:10px;border:1px solid var(--border);cursor:pointer;background:#0a0a0a;display:block}
.post-actions{display:flex;justify-content:space-between;max-width:340px;margin-top:12px;color:var(--muted)}
.post-actions span{display:flex;align-items:center;gap:7px;cursor:pointer;padding:6px 4px;border-radius:10px;-webkit-user-select:none;user-select:none}
.post-actions span:active{opacity:.7}
.post-menu-btn{position:absolute;top:14px;right:12px;color:var(--muted);cursor:pointer;z-index:5}
.sidebar{position:fixed;top:0;left:-285px;width:280px;height:100%;background:var(--bg);z-index:3000;border-right:1px solid var(--border);transition:.3s;display:flex;flex-direction:column}
.sidebar.show{left:0}
.sidebar-header{padding:18px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.side-scroll{flex:1;overflow-y:auto;padding:12px}
.side-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:6px;margin-bottom:12px}
.side-item{padding:13px 12px;cursor:pointer;display:flex;align-items:center;gap:12px;border-radius:12px;font-size:15px;font-weight:500}
.side-item:active{background:rgba(255,255,255,.06)}
.side-item i{width:20px;height:20px;flex-shrink:0}
.side-cache{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.35);border-radius:16px;padding:6px;margin-bottom:12px}
.side-cache .side-item{color:#f59e0b}
.side-danger{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.4);border-radius:16px;padding:6px;margin-bottom:8px}
.side-danger-title{padding:10px 12px 4px;font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.3px}
.side-danger .side-item{color:var(--accent)}
.side-danger .side-item .sub{display:block;font-size:11px;font-weight:400;color:rgba(220,38,38,.75);margin-top:1px}
.side-footer{padding:12px 16px 20px;text-align:center;font-size:11px;color:var(--muted);border-top:1px solid var(--border)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:5000;display:none;align-items:flex-end;justify-content:center;padding:0}
.modal-content{background:var(--card);width:100%;max-width:550px;border-radius:20px 20px 0 0;padding:16px 16px 20px;border:1px solid var(--border);max-height:85vh;overflow:hidden;display:flex;flex-direction:column}
.modal-content.center{align-self:center;border-radius:20px;margin:20px;max-height:85vh;overflow-y:auto}
.input-box{width:100%;padding:14px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:12px;font-size:16px;margin:6px 0 12px}
nav.bottom-nav{height:70px;border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;background:var(--bg);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{color:var(--muted);position:relative;cursor:pointer;padding:8px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;min-width:60px}
.nav-item.active{color:var(--accent)}
.red-dot{position:absolute;top:4px;right:12px;width:10px;height:10px;background:var(--accent);border-radius:50%;border:2px solid var(--bg);display:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1500;display:none}
.btn-main{background:var(--accent);color:#fff;border:none;padding:13px 22px;border-radius:30px;font-weight:700;cursor:pointer;width:100%;font-size:15px}
.lightbox{position:fixed;inset:0;background:#000;z-index:6000;display:none;align-items:center;justify-content:center}
.close-lb{position:absolute;top:40px;right:20px;background:var(--accent);color:#fff;border:none;border-radius:50%;width:42px;height:42px;font-weight:bold;cursor:pointer}
.settings-row{padding:15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:var(--card);border-radius:12px;margin-bottom:10px}
.admin-badge{background:var(--accent);color:#fff;padding:2px 6px;border-radius:6px;font-size:10px;font-weight:900;margin-left:5px}
.pin-badge{background:#f59e0b;color:#000;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:800;margin-left:6px}
.notif-item{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.notif-item.unread{background:rgba(220,38,38,.13);border-left:3px solid var(--accent)}
.notif-item.read{opacity:.7}
