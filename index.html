<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>John Ross Social</title>
<meta name="theme-color" content="#000000">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#000;--text:#e7e9ea;--muted:#71767b;--border:#2f3336;--card:#16181c;--accent:#dc2626;--hover:rgba(255,255,255,.05);--blue:#1d9bf0}
body.light{--bg:#fff;--text:#0f1419;--muted:#536471;--border:#eff3f4;--card:#f7f9f9;--accent:#dc2626;--hover:rgba(0,0,0,.03);--blue:#1d9bf0}
*{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none; font-size:16px}
.app-container{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:80px;background:var(--bg);border-left:1px solid var(--border);border-right:1px solid var(--border)}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:-280px;width:280px;height:100vh;background:var(--bg);border-right:1px solid var(--border);z-index:1000;transition:left 0.3s cubic-bezier(0.4, 0, 0.2, 1);display:flex;flex-direction:column}
.sidebar.show{left:0}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.logo-box{background:var(--accent);color:#fff;padding:8px 14px;border-radius:20px;font-weight:700;font-size:15px}
.sidebar-nav{flex:1;padding:15px;overflow-y:auto}
.sidebar-nav a{display:flex;align-items:center;gap:15px;padding:14px 16px;color:var(--text);text-decoration:none;border-radius:9999px;font-size:18px;font-weight:500;margin-bottom:5px;cursor:pointer}
.sidebar-nav a:active{background:var(--card)}
.sidebar-nav hr{border:none;border-top:1px solid var(--border);margin:15px 0}

/* HEADER */
.main-header{position:sticky;top:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 16px;z-index:100;display:flex;align-items:center;gap:12px}
body.light .main-header{background:rgba(255,255,255,0.85)}
.menu-btn{background:none;border:none;color:var(--text);cursor:pointer;padding:5px}
.logo-text{font-weight:800;font-size:19px;letter-spacing:-0.5px}
.slogan-badge{background:var(--accent);color:#fff;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700}

/* POSTS */
.post{border-bottom:1px solid var(--border);padding:16px}
.post-header{display:flex;gap:12px;margin-bottom:8px}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#dc2626,#7c2d12);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0}
.post-info{flex:1}
.username{font-weight:700;font-size:16px;display:flex;align-items:center;gap:5px}
.handle{color:var(--muted);font-size:15px}
.post-content{font-size:16px;line-height:1.5;margin:8px 0;white-space:pre-wrap;word-wrap:break-word}
.post-images img{width:100%;max-height:400px;object-fit:cover;border-radius:16px;margin-top:10px;border:1px solid var(--border)}
.post-actions{display:flex;justify-content:space-between;max-width:300px;color:var(--muted);margin-top:12px}
.post-actions span{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.post-actions .liked{color:var(--accent)}

/* QUOTE BOX */
.quoted-box{border:1px solid var(--border);border-radius:16px;padding:12px;margin-top:10px;background:rgba(255,255,255,0.02)}
.q-name{font-weight:700;font-size:14px;color:var(--accent);margin-bottom:4px}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.95);backdrop-filter:blur(15px);border-top:1px solid var(--border);display:none;justify-content:space-around;padding:12px 0;max-width:600px;margin:0 auto;z-index:1000}
body.light .bottom-nav{background:rgba(255,255,255,0.95)}
.nav-item{background:none;border:none;color:var(--muted);cursor:pointer;position:relative;padding:5px 15px}
.nav-item.active{color:var(--text)}
.nav-badge{position:absolute;top:5px;right:15px;width:10px;height:10px;background:var(--accent);border-radius:50%;display:none}

/* FORMS */
.auth-container{text-align:center;padding:60px 25px}
.auth-container input{width:100%;max-width:340px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:16px;border-radius:12px;margin:10px 0;font-size:16px;outline:none}
.auth-container button{width:100%;max-width:340px;background:var(--accent);color:#fff;border:none;padding:16px;border-radius:12px;font-weight:700;font-size:16px;margin:10px 0}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:999;display:none}
.overlay.show{display:block}
.img-preview{display:flex;gap:10px;margin-top:10px}
.img-preview img{width:80px;height:80px;border-radius:10px;object-fit:cover;border:1px solid var(--accent)}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:#000;z-index:2000;display:none;align-items:center;justify-content:center}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:90vh}

/* ADMIN */
.admin-badge{background:var(--accent);color:#fff;padding:2px 6px;border-radius:6px;font-size:10px;font-weight:800;margin-left:5px}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<aside id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <div class="logo-box">John Ross Social</div>
    <button onclick="closeSidebar()" style="background:none;border:none;color:var(--text);font-size:30px">&times;</button>
  </div>
  <nav class="sidebar-nav">
    <a onclick="showTab('home');closeSidebar()"><i data-lucide="home"></i> Αρχική</a>
    <a onclick="showTab('profile');closeSidebar()"><i data-lucide="user"></i> Προφίλ</a>
    <a onclick="showTab('edit-profile');closeSidebar()"><i data-lucide="edit-3"></i> Επεξεργασία</a>
    <a onclick="showTab('settings');closeSidebar()"><i data-lucide="settings"></i> Ρυθμίσεις</a>
    <div id="adminMenuItem" style="display:none"><hr><a onclick="showTab('admin');closeSidebar()"><i data-lucide="shield"></i> Admin Panel</a></div>
    <hr>
    <a onclick="logout()"><i data-lucide="log-out"></i> Αποσύνδεση</a>
  </nav>
</aside>

<main class="app-container">
  <header class="main-header">
    <button class="menu-btn" onclick="openSidebar()"><i data-lucide="menu"></i></button>
    <div class="logo-text">John Ross Social</div>
    <div class="slogan-badge">v2.1</div>
  </header>

  <div id="main"></div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" id="btn-home" onclick="showTab('home')"><i data-lucide="home"></i></button>
    <button class="nav-item" id="btn-search" onclick="showTab('search')"><i data-lucide="search"></i></button>
    <button class="nav-item" id="btn-notif" onclick="showTab('notif')"><i data-lucide="bell"></i><span class="nav-badge" id="notifBadge"></span></button>
    <button class="nav-item" id="btn-profile" onclick="showTab('profile')"><i data-lucide="user"></i></button>
  </nav>
</main>

<div class="lightbox" id="lightbox" onclick="this.style.display='none'"><img id="lightboxImg"></div>

<!-- FIREBASE SDKS -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCPIg-aoWUhqOqO5hyHUd66HLcHPyC6e70",
  authDomain: "studio-386569156-384ec.firebaseapp.com",
  projectId: "studio-386569156-384ec",
  storageBucket: "studio-386569156-384ec.firebasestorage.app",
  messagingSenderId: "976658898078",
  appId: "1:976658898078:web:6209be10508924e2116f8f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let user = null;
let currentTab = 'home';
let pendingImages = [];
const adminEmails = ['rossrossg7@gmail.com'];

// UI LOGIC
function openSidebar(){ document.getElementById('sidebar').classList.add('show'); document.getElementById('overlay').classList.add('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('show'); document.getElementById('overlay').classList.remove('show'); }

auth.onAuthStateChanged(u => {
  user = u;
  if(u) {
    document.getElementById('adminMenuItem').style.display = adminEmails.includes(u.email) ? 'block' : 'none';
    listenNotifs();
  }
  render();
});

function login(){
  const e=document.getElementById('le').value, p=document.getElementById('lp').value;
  auth.signInWithEmailAndPassword(e,p).catch(err=>alert(err.message));
}
function register(){
  const e=document.getElementById('le').value, p=document.getElementById('lp').value;
  auth.createUserWithEmailAndPassword(e,p).then(cred => {
    db.collection('users').doc(cred.user.uid).set({name:e.split('@')[0], bio:'', photo:'', followers:[], following:[], createdAt:Date.now()});
  }).catch(err=>alert(err.message));
}
function logout(){ auth.signOut(); location.reload(); }

function showTab(t){
  currentTab = t;
  document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
  const activeBtn = document.getElementById('btn-' + t);
  if(activeBtn) activeBtn.classList.add('active');
  render();
}

// COMPRESSION
async function handleImage(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 800;
      let w = img.width, h = img.height;
      if(w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } }
      else { if(h > MAX) { w *= MAX/h; h = MAX; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const data = canvas.toDataURL('image/jpeg', 0.7);
      pendingImages = [data];
      document.getElementById('imgPreview').innerHTML = `<img src="${data}">`;
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
}

// RENDERING
function render(){
  const m = document.getElementById('main');
  const nav = document.getElementById('bottomNav');
  
  if(!user){
    nav.style.display = 'none';
    m.innerHTML = `
      <div class="auth-container">
        <h1 style="font-size:32px;margin-bottom:20px">John Ross Social</h1>
        <input id="le" placeholder="Email">
        <input id="lp" type="password" placeholder="Κωδικός">
        <button onclick="login()">Σύνδεση</button>
        <button onclick="register()" style="background:#222">Εγγραφή</button>
      </div>`;
    lucide.createIcons();
    return;
  }

  nav.style.display = 'flex';
  if(currentTab === 'home') renderHome(m);
  else if(currentTab === 'search') renderSearch(m);
  else if(currentTab === 'notif') renderNotifs(m);
  else if(currentTab === 'profile') renderProfile(m, user.uid);
  else if(currentTab === 'settings') renderSettings(m);
  else if(currentTab === 'edit-profile') renderEditProfile(m);
  else if(currentTab === 'admin') renderAdmin(m);
  
  lucide.createIcons();
}

function renderHome(m){
  m.innerHTML = `
    <div style="padding:16px; border-bottom:1px solid var(--border)">
      <textarea id="postText" placeholder="Τι συμβαίνει;" style="width:100%; background:none; border:none; color:#fff; font-size:18px; outline:none; resize:none; min-height:80px; font-family:inherit"></textarea>
      <div id="imgPreview" class="img-preview"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px">
        <button onclick="document.getElementById('fileInp').click()" style="background:none;border:none;color:var(--blue);cursor:pointer"><i data-lucide="image"></i></button>
        <input type="file" id="fileInp" hidden onchange="handleImage(event)">
        <button class="btn-full" style="width:auto; padding:10px 25px; border-radius:30px" onclick="createPost()">Δημοσίευση</button>
      </div>
    </div>
    <div id="feed"></div>`;
  
  db.collection('posts').orderBy('createdAt', 'desc').limit(40).onSnapshot(snap => {
    const feed = document.getElementById('feed');
    if(!feed) return;
    feed.innerHTML = snap.docs.map(d => {
      const p = d.data();
      const isLiked = (p.likedBy || []).includes(user.uid);
      const isAdminUser = adminEmails.includes(p.email);
      return `
        <div class="post">
          <div class="post-header">
            <div class="avatar" style="${p.photo?`background-image:url('${p.photo}')`:''}">👤</div>
            <div class="post-info">
              <div class="username">${esc(p.name)} ${isAdminUser?'<span class="admin-badge">ADMIN</span>':''}</div>
              <div class="handle">@${esc(p.name.toLowerCase())}</div>
            </div>
          </div>
          <div class="post-content">${esc(p.text)}</div>
          ${p.images && p.images[0] ? `<img src="${p.images[0]}" class="post-images" style="width:100%;border-radius:16px" onclick="showLightbox('${p.images[0]}')">` : ''}
          <div class="post-actions">
            <span class="${isLiked?'liked':''}" onclick="likePost('${d.id}')"><i data-lucide="heart" style="fill:${isLiked?'var(--accent)':'none'}"></i> ${p.likes||0}</span>
            <span onclick="alert('Σχόλια σύντομα')"><i data-lucide="message-circle"></i> ${(p.comments||[]).length}</span>
            <span onclick="sharePost('${d.id}')"><i data-lucide="share"></i></span>
          </div>
        </div>`;
    }).join('');
    lucide.createIcons();
  });
}

async function createPost(){
  const txt = document.getElementById('postText').value;
  if(!txt.trim() && pendingImages.length === 0) return;
  const uDoc = await db.collection('users').doc(user.uid).get();
  const uData = uDoc.data();
  await db.collection('posts').add({
    uid: user.uid, name: uData.name, photo: uData.photo, email: user.email,
    text: txt, images: pendingImages, likes: 0, likedBy: [], comments: [], createdAt: Date.now()
  });
  document.getElementById('postText').value = '';
  pendingImages = [];
  document.getElementById('imgPreview').innerHTML = '';
}

async function likePost(id){
  const ref = db.collection('posts').doc(id);
  const doc = await ref.get();
  const p = doc.data();
  if((p.likedBy || []).includes(user.uid)){
    ref.update({ likes: firebase.firestore.FieldValue.increment(-1), likedBy: firebase.firestore.FieldValue.arrayRemove(user.uid) });
  } else {
    ref.update({ likes: firebase.firestore.FieldValue.increment(1), likedBy: firebase.firestore.FieldValue.arrayUnion(user.uid) });
  }
}

function showLightbox(src){ document.getElementById('lightboxImg').src=src; document.getElementById('lightbox').style.display='flex'; }

function renderProfile(m, uid){
  db.collection('users').doc(uid).get().then(doc => {
    const u = doc.data() || {};
    m.innerHTML = `
      <div class="profile" style="text-align:center">
        <div class="avatar" style="width:90px;height:90px;margin:0 auto;font-size:30px;${u.photo?`background-image:url('${u.photo}')`:''}">👤</div>
        <h2 style="margin-top:15px">${esc(u.name)}</h2>
        <p style="color:var(--muted);margin:10px 0">${esc(u.bio || 'Χωρίς βιογραφικό')}</p>
        <div style="display:flex;justify-content:center;gap:20px;margin:20px 0">
          <span><b>${(u.followers||[]).length}</b> Followers</span>
          <span><b>${(u.following||[]).length}</b> Following</span>
        </div>
        <hr style="border:none;border-top:1px solid var(--border);margin:20px 0">
        <h3>Οι δημοσιεύσεις μου</h3>
        <div id="userPosts"></div>
      </div>`;
  });
}

function renderEditProfile(m){
  db.collection('users').doc(user.uid).get().then(doc => {
    const u = doc.data() || {};
    m.innerHTML = `
      <div style="padding:20px">
        <h2 style="margin-bottom:20px">Επεξεργασία Προφίλ</h2>
        <label style="color:var(--muted);font-size:14px">Όνομα</label>
        <input id="updName" value="${esc(u.name)}" style="width:100%;padding:14px;background:var(--card);border:1px solid var(--border);color:#fff;border-radius:10px;margin:8px 0 20px;font-size:16px">
        <label style="color:var(--muted);font-size:14px">Βιογραφικό</label>
        <textarea id="updBio" style="width:100%;padding:14px;background:var(--card);border:1px solid var(--border);color:#fff;border-radius:10px;margin:8px 0;font-size:16px;min-height:100px">${esc(u.bio)}</textarea>
        <button class="btn-full" onclick="saveProfile()" style="margin-top:20px">Αποθήκευση</button>
      </div>`;
  });
}

async function saveProfile(){
  const name = document.getElementById('updName').value;
  const bio = document.getElementById('updBio').value;
  await db.collection('users').doc(user.uid).update({ name, bio });
  alert('Το προφίλ ενημερώθηκε!');
  showTab('profile');
}

function renderSettings(m){
  m.innerHTML = `
    <div style="padding:20px">
      <h2 style="margin-bottom:25px">Ρυθμίσεις</h2>
      <div style="background:var(--card);padding:20px;border-radius:15px;display:flex;justify-content:space-between;align-items:center">
        <span>Dark Mode</span>
        <div style="width:40px;height:20px;background:var(--accent);border-radius:20px"></div>
      </div>
      <p style="color:var(--muted);margin-top:15px;font-size:14px">Version 2.1.0 - John Ross Social</p>
    </div>`;
}

function listenNotifs(){
  db.collection('notifications').where('userId', '==', user.uid).where('read', '==', false).onSnapshot(snap => {
    document.getElementById('notifBadge').style.display = snap.empty ? 'none' : 'block';
  });
}

function renderSearch(m){
  m.innerHTML = `<div style="padding:15px"><input oninput="doSearch(this.value)" placeholder="Αναζήτηση χρηστών..." style="width:100%;padding:14px;background:var(--card);border:none;color:#fff;border-radius:30px;outline:none;font-size:16px"></div><div id="res"></div>`;
}

function doSearch(q){
  if(!q) return;
  db.collection('users').where('name', '>=', q).limit(10).get().then(snap => {
    document.getElementById('res').innerHTML = snap.docs.map(d => `<div class="post" onclick="showTab('profile');renderProfile(document.getElementById('main'),'${d.id}')"><b>${esc(d.data().name)}</b></div>`).join('');
  });
}

lucide.createIcons();
</script>
</body>
</html>
