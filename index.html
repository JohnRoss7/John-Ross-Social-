<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>John Ross Social</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#000;--text:#e7e9ea;--muted:#71767b;--border:#2f3336;--card:#16181c;--accent:#dc2626;--hover:rgba(255,255,255,.05);--blue:#1d9bf0}
body.light{--bg:#fff;--text:#0f1419;--muted:#536471;--border:#eff3f4;--card:#f7f9f9;--accent:#dc2626;--hover:rgba(0,0,0,.03);--blue:#1d9bf0}
*{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none; font-size:16px}

.app-container{max-width:550px;margin:0 auto;min-height:100vh;padding-bottom:80px;background:var(--bg);border-left:1px solid var(--border);border-right:1px solid var(--border); position: relative}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:-280px;width:280px;height:100vh;background:var(--bg);border-right:1px solid var(--border);z-index:1500;transition:left 0.3s ease;display:flex;flex-direction:column}
.sidebar.show{left:0}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sidebar-nav a{display:flex;align-items:center;gap:15px;padding:14px 16px;color:var(--text);text-decoration:none;border-radius:9999px;font-size:18px;font-weight:500;cursor:pointer}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1400;display:none}
.overlay.show{display:block}

/* HEADER */
.main-header{position:sticky;top:0;background:var(--bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);z-index:100}
.header-top{padding:10px 16px;display:flex;align-items:center;gap:15px}
.top-tabs{display:flex;border-bottom:1px solid var(--border)}
.tab-btn{flex:1;padding:14px;background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;font-weight:600;border-bottom:4px solid transparent}
.tab-btn.active{color:var(--text);border-bottom-color:var(--accent)}

/* POSTS */
.post{border-bottom:1px solid var(--border);padding:16px; position: relative}
.post-header{display:flex;gap:12px;margin-bottom:8px}
.avatar{width:48px;height:48px;border-radius:12px;background:#333;background-size:cover;background-position:center;flex-shrink:0; cursor: pointer}
.post-info{flex:1}
.username{font-weight:700;font-size:16px;display:flex;align-items:center;gap:4px}
.post-content{font-size:16px;line-height:1.5;margin:8px 0;white-space:pre-wrap}

/* ΦΩΤΟΓΡΑΦΙΕΣ ΠΟΣΤ - FIXED */
.post-images img{width:100% !important; max-height:350px !important; object-fit:cover !important; border-radius:16px; margin-top:10px; border:1px solid var(--border); cursor: pointer}

/* ACTION BUTTONS - BIGGER */
.post-actions{display:flex;justify-content:space-between;max-width:350px;color:var(--muted);margin-top:15px}
.post-actions span{display:flex;align-items:center;gap:10px;font-size:16px;cursor:pointer; padding:5px}
.post-actions i{width:22px; height:22px}
.liked{color:var(--accent)}

/* 3 DOTS MENU */
.post-menu-btn{position:absolute; top:16px; right:16px; color:var(--muted); cursor:pointer}

/* MODALS */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-content{background:var(--card);width:100%;max-width:400px;border-radius:20px;padding:20px;border:1px solid var(--border)}
.modal-content textarea{width:100%; height:120px; background:var(--bg); color:#fff; border:1px solid var(--border); border-radius:10px; padding:10px; font-family:inherit; font-size:16px; margin-bottom:15px}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:2500;display:none;align-items:center;justify-content:center}
.close-lightbox{position:absolute; top:40px; right:20px; background:var(--accent); color:#fff; border:none; border-radius:50%; width:40px; height:40px; font-size:20px; cursor:pointer; font-weight:bold}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);display:none;justify-content:space-around;padding:12px 0;max-width:550px;margin:0 auto;z-index:999}
.nav-item{background:none;border:none;color:var(--muted);cursor:pointer}
.nav-item.active{color:var(--text)}

.admin-badge{background:var(--accent);color:#fff;padding:2px 6px;border-radius:6px;font-size:10px;font-weight:800;margin-left:5px}
.btn-save{background:var(--accent); color:#fff; border:none; padding:10px 20px; border-radius:20px; font-weight:700; cursor:pointer}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<aside id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <div style="background:var(--accent);color:#fff;padding:8px 14px;border-radius:20px;font-weight:700">John Ross Social</div>
    <button onclick="closeSidebar()" style="background:none;border:none;color:var(--text);font-size:32px">&times;</button>
  </div>
  <nav class="sidebar-nav">
    <a onclick="showTab('home');closeSidebar()"><i data-lucide="home"></i> Αρχική</a>
    <a onclick="showTab('profile');closeSidebar()"><i data-lucide="user"></i> Προφίλ</a>
    <a onclick="showTab('settings');closeSidebar()"><i data-lucide="settings"></i> Ρυθμίσεις</a>
    <div id="adminMenuBtn" style="display:none"><hr><a onclick="showTab('admin');closeSidebar()"><i data-lucide="shield"></i> Admin Panel</a></div>
    <hr>
    <a onclick="auth.signOut();location.reload()"><i data-lucide="log-out"></i> Αποσύνδεση</a>
  </nav>
</aside>

<main class="app-container">
  <header class="main-header">
    <div class="header-top">
      <button class="menu-btn" onclick="openSidebar()"><i data-lucide="menu"></i></button>
      <div class="logo-text">John Ross Social</div>
    </div>
    <div class="top-tabs" id="homeTabs" style="display:none">
      <button class="tab-btn active" id="tab-foryou" onclick="setFeed('foryou')">Για εσένα</button>
      <button class="tab-btn" id="tab-following" onclick="setFeed('following')">Ακολουθείς</button>
    </div>
  </header>

  <div id="main"></div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item" id="btn-home" onclick="showTab('home')"><i data-lucide="home"></i></button>
    <button class="nav-item" id="btn-search" onclick="showTab('search')"><i data-lucide="search"></i></button>
    <button class="nav-item" id="btn-notif" onclick="showTab('notif')"><i data-lucide="bell"></i></button>
    <button class="nav-item" id="btn-profile" onclick="showTab('profile')"><i data-lucide="user"></i></button>
  </nav>
</main>

<!-- EDIT MODAL -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h3>Επεξεργασία Ποστ</h3><br>
    <textarea id="editPostText"></textarea>
    <div style="display:flex; justify-content:space-between">
      <button onclick="document.getElementById('editModal').style.display='none'" style="background:none; border:none; color:#fff; cursor:pointer">Ακύρωση</button>
      <button class="btn-save" id="saveEditBtn">Save</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="close-lightbox" onclick="document.getElementById('lightbox').style.display='none'">X</button>
  <img id="lightboxImg">
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCPIg-aoWUhqOqO5hyHUd66HLcHPyC6e70",
  authDomain: "studio-386569156-384ec.firebaseapp.com",
  projectId: "studio-386569156-384ec",
  storageBucket: "studio-386569156-384ec.firebasestorage.app",
  messagingSenderId: "976658898078",
  appId: "1:976658898078:web:6209be10508924e2116f8f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let user = null;
let currentTab = 'home';
let feedType = 'foryou';
let pendingImages = [];
const adminEmail = 'rossrossg7@gmail.com';

function openSidebar(){ document.getElementById('sidebar').classList.add('show'); document.getElementById('overlay').classList.add('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('show'); document.getElementById('overlay').classList.remove('show'); }
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showLightbox(src){ document.getElementById('lightboxImg').src=src; document.getElementById('lightbox').style.display='flex'; }

auth.onAuthStateChanged(u => {
  user = u;
  if(u) {
    document.getElementById('adminMenuBtn').style.display = (u.email === adminEmail) ? 'block' : 'none';
    render();
  } else { render(); }
});

function showTab(t){
  currentTab = t;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  if(document.getElementById('btn-'+t)) document.getElementById('btn-'+t).classList.add('active');
  render();
}

function setFeed(f){
  feedType = f;
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-'+f).classList.add('active');
  loadPosts();
}

function render(){
  const m = document.getElementById('main');
  const nav = document.getElementById('bottomNav');
  const hTabs = document.getElementById('homeTabs');
  
  if(!user){
    nav.style.display = 'none'; hTabs.style.display = 'none';
    m.innerHTML = `<div class="auth-container"><h1>John Ross Social</h1><br><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button onclick="auth.signInWithEmailAndPassword(document.getElementById('le').value, document.getElementById('lp').value)">Login</button></div>`;
    lucide.createIcons(); return;
  }

  nav.style.display = 'flex';
  if(currentTab === 'home'){ hTabs.style.display = 'flex'; renderHome(m); }
  else { hTabs.style.display = 'none'; }

  if(currentTab === 'profile') renderProfile(m, user.uid);
  else if(currentTab === 'notif') renderNotifications(m);
  else if(currentTab === 'settings') renderSettings(m);
  else if(currentTab === 'admin') renderAdmin(m);
  
  lucide.createIcons();
}

function renderHome(m){
  m.innerHTML = `
    <div style="padding:16px; border-bottom:1px solid var(--border)">
      <div style="display:flex;gap:12px">
        <div class="avatar" id="myAvatarHome" style="width:40px;height:40px"></div>
        <textarea id="postText" placeholder="Τι συμβαίνει;" style="flex:1; background:none; border:none; color:#fff; font-size:18px; outline:none; resize:none; min-height:60px; font-family:inherit"></textarea>
      </div>
      <div id="imgPreview"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-left:52px">
        <button onclick="document.getElementById('fileInp').click()" style="background:none;border:none;color:var(--blue);cursor:pointer"><i data-lucide="image"></i></button>
        <input type="file" id="fileInp" hidden onchange="handleImage(event)">
        <button class="btn-save" onclick="createPost()">Post</button>
      </div>
    </div>
    <div id="feed"></div>`;
  
  db.collection('users').doc(user.uid).get().then(doc => {
    if(doc.exists && doc.data().photo) document.getElementById('myAvatarHome').style.backgroundImage = `url('${doc.data().photo}')`;
  });
  loadPosts();
}

function loadPosts(){
  const feed = document.getElementById('feed');
  if(!feed) return;
  db.collection('posts').orderBy('createdAt', 'desc').limit(30).onSnapshot(snap => {
    let posts = snap.docs.map(d => ({id: d.id, ...d.data()}));
    if(feedType === 'following'){
      db.collection('users').doc(user.uid).get().then(uDoc => {
        const following = uDoc.data().following || [];
        renderFeed(posts.filter(p => following.includes(p.uid) || p.uid === user.uid));
      });
    } else { renderFeed(posts); }
  });
}

function renderFeed(posts){
  const feed = document.getElementById('feed');
  if(!feed) return;
  feed.innerHTML = posts.map(p => {
    const isLiked = (p.likedBy || []).includes(user.uid);
    const canManage = (user.uid === p.uid || user.email === adminEmail);
    return `<div class="post">
      ${canManage ? `<div class="post-menu-btn" onclick="showPostMenu('${p.id}', '${p.text.replace(/'/g, "\\'")}')"><i data-lucide="more-horizontal"></i></div>` : ''}
      <div class="post-header">
        <div class="avatar" onclick="showTab('profile'); renderProfile(document.getElementById('main'), '${p.uid}')" style="${p.photo?`background-image:url('${p.photo}')`:''}"></div>
        <div class="post-info">
          <div class="username">${esc(p.name)} ${p.email === adminEmail?'<span class="admin-badge">ADMIN</span>':''}</div>
          <div class="handle">@${esc(p.name.toLowerCase())}</div>
        </div>
      </div>
      <div class="post-content">${esc(p.text)}</div>
      ${p.images && p.images[0] ? `<div class="post-images"><img src="${p.images[0]}" onclick="showLightbox('${p.images[0]}')"></div>` : ''}
      <div class="post-actions">
        <span class="${isLiked?'liked':''}" onclick="likePost('${p.id}')"><i data-lucide="heart" style="fill:${isLiked?'var(--accent)':'none'}"></i> ${p.likes||0}</span>
        <span onclick="alert('Σχόλια σύντομα')"><i data-lucide="message-circle"></i> ${(p.comments||[]).length}</span>
        <span><i data-lucide="repeat"></i></span>
        <span onclick="sharePost('${p.id}')"><i data-lucide="share"></i></span>
      </div>
    </div>`;
  }).join('');
  lucide.createIcons();
}

function showPostMenu(id, text){
  const action = confirm("Επιλέξτε: \n OK για Διαγραφή \n Cancel για Επεξεργασία");
  if(action) { 
    if(confirm("Σίγουρα διαγραφή;")) db.collection('posts').doc(id).delete();
  } else {
    document.getElementById('editModal').style.display='flex';
    document.getElementById('editPostText').value = text;
    document.getElementById('saveEditBtn').onclick = () => {
      db.collection('posts').doc(id).update({ text: document.getElementById('editPostText').value });
      document.getElementById('editModal').style.display='none';
    };
  }
}

async function createPost(){
  const txt = document.getElementById('postText').value;
  if(!txt.trim() && pendingImages.length === 0) return;
  const uDoc = await db.collection('users').doc(user.uid).get();
  await db.collection('posts').add({
    uid: user.uid, name: uDoc.data().name, photo: uDoc.data().photo || '', email: user.email,
    text: txt, images: pendingImages, likes: 0, likedBy: [], comments: [], createdAt: Date.now()
  });
  document.getElementById('postText').value = ''; pendingImages = []; 
  document.getElementById('imgPreview').innerHTML = '';
}

async function likePost(id){
  const ref = db.collection('posts').doc(id);
  const doc = await ref.get();
  const p = doc.data();
  if((p.likedBy || []).includes(user.uid)){
    ref.update({ likes: firebase.firestore.FieldValue.increment(-1), likedBy: firebase.firestore.FieldValue.arrayRemove(user.uid) });
  } else {
    ref.update({ likes: firebase.firestore.FieldValue.increment(1), likedBy: firebase.firestore.FieldValue.arrayUnion(user.uid) });
    if(p.uid !== user.uid) db.collection('notifications').add({ userId: p.uid, text: `Ο ${user.email.split('@')[0]} έκανε like`, type:'like', createdAt: Date.now() });
  }
}

function renderProfile(m, uid){
  db.collection('users').doc(uid).onSnapshot(doc => {
    const u = doc.data();
    m.innerHTML = `
      <div style="height:100px;background:var(--card)"></div>
      <div style="padding:0 16px; margin-top:-45px">
        <div style="display:flex;justify-content:space-between;align-items:flex-end">
          <div class="avatar" onclick="showLightbox('${u.photo}')" style="width:90px;height:90px;border-radius:15px;border:4px solid var(--bg);${u.photo?`background-image:url('${u.photo}')`:''}"></div>
          <button class="btn-save" onclick="document.getElementById('profFile').click()">Αλλαγή Φωτό</button>
          <input type="file" id="profFile" hidden onchange="handleImage(event, 'profile')">
        </div>
        <h2 style="margin-top:10px">${esc(u.name)}</h2>
        <p style="color:var(--muted)">${esc(u.bio || 'Κανένα βιογραφικό')}</p>
        <div style="display:flex;gap:20px;margin-top:10px"><span><b>${(u.followers||[]).length}</b> Followers</span></div>
      </div><div id="userPosts"></div>`;
    db.collection('posts').where('uid', '==', uid).orderBy('createdAt', 'desc').get().then(snap => renderFeed(snap.docs.map(d => ({id: d.id, ...d.data()}))));
  });
}

function renderNotifications(m){
  m.innerHTML = '<h2 style="padding:20px">Ειδοποιήσεις</h2><div id="nList"></div>';
  db.collection('notifications').where('userId', '==', user.uid).orderBy('createdAt', 'desc').limit(20).onSnapshot(snap => {
    document.getElementById('nList').innerHTML = snap.docs.map(d => `<div style="padding:15px; border-bottom:1px solid var(--border)">${esc(d.data().text)}</div>`).join('') || '<p style="padding:20px">Καμία ειδοποίηση</p>';
  });
}

function renderSettings(m){ m.innerHTML = '<div style="padding:20px"><h2>Ρυθμίσεις</h2><br><p>Dark Mode: Ενεργό</p><br><p>Γλώσσα: Ελληνικά</p></div>'; }
function renderAdmin(m){ m.innerHTML = '<div style="padding:20px"><h2>Admin Panel</h2><br><p>Καλώς ήρθες John Ross</p></div>'; }

async function handleImage(e, target = 'post'){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 800;
      let w = img.width, h = img.height;
      if(w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } } else { if(h > MAX) { w *= MAX/h; h = MAX; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const data = canvas.toDataURL('image/jpeg', 0.7);
      if(target === 'profile') db.collection('users').doc(user.uid).update({ photo: data });
      else { pendingImages = [data]; document.getElementById('imgPreview').innerHTML = `<div style="position:relative;display:inline-block;margin-top:10px"><img src="${data}" style="width:80px;height:80px;border-radius:10px"><button onclick="pendingImages=[];document.getElementById('imgPreview').innerHTML=''" style="position:absolute;top:-5px;right:-5px;background:red;color:white;border-radius:50%;border:none;width:20px;height:20px">×</button></div>`; }
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
}

function sharePost(id){
  const url = window.location.href.split('?')[0] + '?post=' + id;
  if(navigator.share) navigator.share({ title: 'John Ross Social', url: url });
  else prompt("Link:", url);
}

lucide.createIcons();
</script>
</body>
</html>
