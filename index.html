<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>John Ross Social v23</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg:#000; --text:#fff; --muted:#777; --border:#222; --card:#16181c; --accent:#dc2626; --blue:#1d9bf0; }
        body.light { --bg:#fff; --text:#000; --muted:#666; --border:#eee; --card:#f7f9f9; }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }
        html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:sans-serif; position:fixed; }
        .app-wrapper { width:100%; height:100%; display:flex; flex-direction:column; max-width:550px; margin:0 auto; border-left:1px solid var(--border); border-right:1px solid var(--border); background:var(--bg); position:relative; }
        
        header { background:var(--bg); border-bottom:1px solid var(--border); flex-shrink:0; z-index:1000; }
        .header-top { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
        .tabs { display:flex; border-bottom:1px solid var(--border); }
        .tab { flex:1; padding:14px; text-align:center; font-weight:600; color:var(--muted); cursor:pointer; }
        .tab.active { color:var(--text); border-bottom:2px solid var(--accent); }
        
        #main-scroll { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
        .post { padding:16px; border-bottom:1px solid var(--border); position:relative; width:100%; }
        .post-header { display:flex; gap:12px; margin-bottom:8px; align-items: flex-start; }
        .avatar { width:48px; height:48px; border-radius:12px; background:#333; background-size:cover; background-position:center; flex-shrink:0; cursor:pointer; border:1px solid var(--border); }
        .post-content { flex:1; min-width:0; }
        .username { font-weight:700; font-size:15px; color:var(--text); cursor:pointer; }
        .post-text { font-size:16px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; margin:5px 0; }
        .hashtag { color:var(--accent) !important; font-weight:600; cursor:pointer; }
        .post-img { width:100%; max-height:350px; object-fit:cover; border-radius:14px; margin-top:12px; border:1px solid var(--border); cursor:pointer; display:block; background:#111; }
        
        .post-actions { display:flex; justify-content:space-between; max-width:350px; margin-top:15px; color:var(--muted); }
        .post-actions span { display:flex; align-items:center; gap:8px; font-size:16px; cursor:pointer; padding:5px; }
        .post-menu-btn { position:absolute; top:15px; right:15px; color:var(--muted); cursor:pointer; padding:5px; }

        .sidebar { position:fixed; top:0; left:-285px; width:280px; height:100%; background:var(--bg); z-index:3000; border-right:1px solid var(--border); transition:0.3s ease; display:flex; flex-direction:column; }
        .sidebar.show { left:0; }
        .sidebar-header { padding:20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
        
        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:5000; display:none; align-items:center; justify-content:center; padding:20px; }
        .modal-content { background:var(--card); width:100%; max-width:400px; border-radius:24px; padding:20px; border:1px solid var(--border); }
        .share-item { padding:15px; border-bottom:1px solid var(--border); cursor:pointer; display:flex; align-items:center; gap:10px; font-weight:600; }

        nav.bottom-nav { height:65px; border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; background:var(--bg); flex-shrink:0; }
        .nav-item { color:var(--muted); position:relative; cursor:pointer; padding:12px; }
        .nav-item.active { color:var(--text); }
        .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1500; display:none; }
        .btn-main { background:var(--accent); color:#fff; border:none; padding:12px 25px; border-radius:20px; font-weight:700; cursor:pointer; width:100%; }
    </style>
</head>
<body class="dark">

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><span style="font-weight:800; font-size:20px;">Menu</span><i data-lucide="x-circle" style="color:var(--accent); cursor:pointer" onclick="toggleSidebar(false)"></i></div>
    <div style="padding: 10px; flex: 1; overflow-y: auto;">
        <div onclick="showTab('home');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="home"></i> Αρχική</div>
        <div onclick="showTab('profile');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="user"></i> Προφίλ</div>
        <div onclick="showTab('settings');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="settings"></i> Ρυθμίσεις</div>
        <div id="adminBtn" style="display:none;" onclick="showTab('admin');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="shield"></i> Admin Panel</div>
        <hr style="border:none; border-top:1px solid var(--border); margin:10px 0;">
        <div onclick="forceReset()" style="padding:15px; color:orange; cursor:pointer"><i data-lucide="trash-2"></i> Clean & Reset</div>
        <div onclick="auth.signOut();location.reload()" style="padding:15px; color:var(--accent); cursor:pointer"><i data-lucide="log-out"></i> Αποσύνδεση</div>
    </div>
</aside>

<div class="app-wrapper">
    <header>
        <div class="header-top"><i data-lucide="menu" onclick="toggleSidebar(true)" style="cursor:pointer"></i><div style="font-weight:800; font-size:20px">John Ross Social</div><div style="width:24px"></div></div>
        <div class="tabs" id="home-tabs" style="display:none"><div class="tab active" id="t-foryou" onclick="setFeed('foryou')">Για εσένα</div><div class="tab" id="t-following" onclick="setFeed('following')">Ακολουθείς</div></div>
    </header>
    <main id="main-scroll"><div id="content"></div></main>
    <nav class="bottom-nav">
        <div class="nav-item active" id="btn-home" onclick="showTab('home')"><i data-lucide="home"></i></div>
        <div class="nav-item" id="btn-search" onclick="showTab('search')"><i data-lucide="search"></i></div>
        <div class="nav-item" id="btn-notif" onclick="showTab('notif')"><i data-lucide="bell"></i></div>
        <div class="nav-item" id="btn-profile" onclick="showTab('profile')"><i data-lucide="user"></i></div>
    </nav>
</div>

<!-- MODALS -->
<div class="modal" id="shareModal">
    <div class="modal-content">
        <h3 style="margin-bottom:15px">Κοινοποίηση</h3>
        <div class="share-item" onclick="doNativeShare()"><i data-lucide="external-link"></i> Σε εφαρμογές</div>
        <div class="share-item" onclick="copyPostLink()"><i data-lucide="link"></i> Αντιγραφή Συνδέσμου</div>
        <div class="share-item" onclick="repostPost()"><i data-lucide="repeat"></i> Αναδημοσίευση</div>
        <div class="share-item" onclick="quotePost()"><i data-lucide="quote"></i> Παράθεση</div>
        <button onclick="closeAll()" class="btn-main" style="background:#222; margin-top:15px">Άκυρο</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCPIg-aoWUhqOqO5hyHUd66HLcHPyC6e70", authDomain: "studio-386569156-384ec.firebaseapp.com", projectId: "studio-386569156-384ec", storageBucket: "studio-386569156-384ec.firebasestorage.app", messagingSenderId: "976658898078", appId: "1:976658898078:web:6209be10508924e2116f8f" };
    firebase.initializeApp(firebaseConfig); const auth = firebase.auth(); const db = firebase.firestore();

    let user = null, currentTab = 'home', feedType = 'foryou', pendingImg = null, historyStack = [], activePost = null;
    const adminEmail = 'rossrossg7@gmail.com';

    auth.onAuthStateChanged(u => { 
        user = u; 
        if(u) { document.getElementById('adminBtn').style.display = (u.email === adminEmail) ? 'block' : 'none'; }
        render(); 
    });

    function toggleSidebar(s) { document.getElementById('sidebar').classList.toggle('show', s); document.getElementById('overlay').style.display = s ? 'block' : 'none'; }
    function closeAll() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); toggleSidebar(false); document.getElementById('overlay').style.display='none'; }
    function forceReset() { localStorage.clear(); location.reload(); }

    function showTab(t, fromBack = false) {
        if(!fromBack && currentTab !== t) { historyStack.push(currentTab); window.history.pushState({tab: t}, ""); }
        currentTab = t;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if(document.getElementById('btn-'+t)) document.getElementById('btn-'+t).classList.add('active');
        document.getElementById('home-tabs').style.display = (t === 'home') ? 'flex' : 'none';
        render();
    }

    function render() {
        const c = document.getElementById('content');
        if(!user) { c.innerHTML = '<div style="padding:50px; text-align:center"><h1>John Ross Social</h1><br><button onclick="auth.signInWithEmailAndPassword(prompt(\'Email:\'), prompt(\'Password:\'))" class="btn-main">Login</button></div>'; return; }
        if(currentTab === 'home') renderHome(c);
        else if(currentTab === 'profile') renderProfile(c, user.uid);
        else c.innerHTML = '<div style="padding:40px; text-align:center">Coming Soon...</div>';
        lucide.createIcons();
    }

    function renderHome(m) {
        m.innerHTML = `<div style="padding:16px; border-bottom:1px solid var(--border)"><div style="display:flex;gap:10px"><div class="avatar" id="myAv" style="width:40px;height:40px"></div><textarea id="postText" placeholder="Τι συμβαίνει;" style="flex:1;background:none;border:none;color:#fff;font-size:18px;outline:none;resize:none;min-height:60px"></textarea></div><div id="imgPrv"></div><div style="display:flex;justify-content:space-between;margin-top:10px;padding-left:50px"><div style="display:flex;gap:15px"><i data-lucide="image" onclick="document.getElementById('fInp').click()" style="color:var(--blue);cursor:pointer"></i><i data-lucide="map-pin" onclick="addLocation()" style="color:var(--blue);cursor:pointer"></i></div><input type="file" id="fInp" hidden onchange="handleFile(this)"><button onclick="sendPost()" class="btn-main" style="width:auto">Post</button></div></div><div id="feed"></div>`;
        db.collection('users').doc(user.uid).get().then(doc => { if(doc.data().photo) document.getElementById('myAv').style.backgroundImage = `url('${doc.data().photo}')`; });
        loadFeed('feed');
    }

    function loadFeed(id, uid = null) {
        const feed = document.getElementById(id);
        let q = db.collection('posts').orderBy('createdAt', 'desc').limit(25);
        if(feedType === 'following') {
            db.collection('users').doc(user.uid).get().then(uDoc => {
                const following = uDoc.data().following || [];
                q.onSnapshot(snap => displayPosts(snap.docs.map(d=>({id:d.id, ...d.data()})).filter(p=>following.includes(p.uid) || p.uid === user.uid), feed));
            });
        } else {
            if(uid) q = q.where('uid', '==', uid);
            q.onSnapshot(snap => displayPosts(snap.docs.map(d=>({id:d.id, ...d.data()})), feed));
        }
    }

    function displayPosts(posts, container) {
        container.innerHTML = posts.map(p => {
            const isLiked = (p.likedBy || []).includes(user.uid);
            const canManage = (user.uid === p.uid || user.email === adminEmail);
            return `<div class="post">
                ${canManage ? `<i data-lucide="more-horizontal" class="post-menu-btn" onclick="postOp('${p.id}','${p.text}','${p.uid}')"></i>` : ''}
                <div class="post-header" onclick="openProfile('${p.uid}')"><div class="avatar" style="${p.photo?`background-image:url('${p.photo}')`:''}"></div><div class="post-content"><div class="username">${p.name}</div><div class="post-text">${p.text.replace(/#(\w+)/g, '<span class="hashtag">#$1</span>')}</div>
                ${p.images && p.images[0] ? `<img src="${p.images[0]}" class="post-img" onclick="event.stopPropagation(); openLB('${p.images[0]}')">` : ''}
                <div class="post-actions"><span onclick="event.stopPropagation();like('${p.id}')"><i data-lucide="heart" style="${isLiked?'fill:var(--accent)':''}"></i> ${p.likes||0}</span><span onclick="event.stopPropagation();alert('Comments soon')"><i data-lucide="message-circle"></i></span><span onclick="event.stopPropagation();openShare('${p.id}','${p.text}','${p.images?p.images[0]:''}')"><i data-lucide="share-2"></i></span></div>
                </div></div></div>`;
        }).join(''); lucide.createIcons();
    }

    async function handleFile(inp, target = 'post') {
        const reader = new FileReader(); reader.onload = (e) => {
            const img = new Image(); img.onload = () => {
                const canvas = document.createElement('canvas'); const MAX = 800;
                let w = img.width, h = img.height;
                if (w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } } else { if(h > MAX) { w *= MAX/h; h = MAX; } }
                canvas.width = w; canvas.height = h;
                const data = canvas.toDataURL('image/jpeg', 0.4);
                if(target === 'profile') { db.collection('users').doc(user.uid).update({ photo: data }); alert("Photo OK!"); }
                else { pendingImg = data; document.getElementById('imgPrv').innerHTML = `<div style="position:relative;display:inline-block;margin-top:10px"><img src="${data}" style="width:80px;height:80px;border-radius:10px"><button onclick="pendingImg=null;document.getElementById('imgPrv').innerHTML=''" style="position:absolute;top:-5px;right:-5px;background:red;color:white;border-radius:50%;border:none;width:20px;height:20px">×</button></div>`; }
            }; img.src = e.target.result;
        }; reader.readAsDataURL(inp.files[0]);
    }

    async function sendPost() {
        const txt = document.getElementById('postText').value; if(!txt.trim() && !pendingImg) return;
        const uDoc = await db.collection('users').doc(user.uid).get();
        await db.collection('posts').add({ uid:user.uid, name:uDoc.data().name, photo:uDoc.data().photo||'', text:txt, images:pendingImg?[pendingImg]:[], likes:0, likedBy:[], createdAt:Date.now() });
        document.getElementById('postText').value = ''; pendingImg = null; document.getElementById('imgPrv').innerHTML = '';
    }

    function renderProfile(m, uid) {
        db.collection('users').doc(uid).onSnapshot(doc => {
            const u = doc.data();
            m.innerHTML = `<div style="padding:25px; text-align:center; border-bottom:1px solid var(--border)">
                <div class="avatar" style="width:100px; height:100px; border-radius:20px; border:3px solid var(--accent); margin:0 auto 15px; ${u.photo?`background-image:url('${u.photo}')`:''}" onclick="openLB('${u.photo}')"></div>
                <h2>${u.name}</h2><p style="color:var(--muted); margin-top:5px">${u.bio||''}</p>
                <div style="display:flex; justify-content:center; gap:20px; margin-top:15px"><b>${(u.followers||[]).length} Followers</b> <b>${(u.following||[]).length} Following</b></div>
                ${uid === user.uid ? `<button onclick="showEdit()" class="btn-main" style="width:auto; margin-top:15px">Edit Profile</button>` : `<button onclick="toggleFollow('${uid}')" class="btn-main" style="width:auto; margin-top:15px">Ακολούθηση</button>`}
            </div><div id="p-feed"></div>`;
            loadFeed('p-feed', uid);
        });
    }

    function showEdit() {
        const n = prompt("Νέο Όνομα:", auth.currentUser.displayName);
        const b = prompt("Νέο Bio:");
        if(n) {
            db.collection('users').doc(user.uid).update({ name: n, bio: b });
            db.collection('posts').where('uid','==',user.uid).get().then(s => { const batch = db.batch(); s.forEach(d => batch.update(d.ref, {name: n})); batch.commit(); });
        }
    }

    function postOp(id, text, postUid) {
        if(user.uid === postUid) {
            const op = confirm("OK: Διαγραφή, Cancel: Επεξεργασία");
            if(op) db.collection('posts').doc(id).delete();
            else { const nt = prompt("Κείμενο:", text); if(nt) db.collection('posts').doc(id).update({text:nt}); }
        } else if(user.email === adminEmail) { if(confirm("ADMIN: Διαγραφή;")) db.collection('posts').doc(id).delete(); }
    }

    function openShare(id, text, img) { activePost = {id, text, img}; document.getElementById('shareModal').style.display='flex'; document.getElementById('overlay').style.display='block'; }
    function copyPostLink() { navigator.clipboard.writeText(window.location.origin + window.location.pathname + "?post=" + activePost.id); alert("Link Copied!"); closeAll(); }
    async function repostPost() { const uDoc = await db.collection('users').doc(user.uid).get(); await db.collection('posts').add({ uid:user.uid, name:uDoc.data().name, photo:uDoc.data().photo||'', text:"Repost: " + activePost.text, images: activePost.img ? [activePost.img] : [], createdAt:Date.now(), likes:0, likedBy:[] }); closeAll(); alert("Reposted!"); }
    function quotePost() { document.getElementById('postText').value = "Quote: " + activePost.text + "\n---\n"; showTab('home'); closeAll(); document.getElementById('postText').focus(); }
    function addLocation() { const loc = prompt("Πού βρίσκεστε;"); if(loc) document.getElementById('postText').value += " — στην τοποθεσία " + loc; }
    function setFeed(f) { feedType = f; document.querySelectorAll('.tab').forEach(e => e.classList.remove('active')); document.getElementById('t-'+f).classList.add('active'); loadFeed('feed'); }
    function openProfile(uid) { showTab('profile'); renderProfile(document.getElementById('content'), uid); }
    function openLB(src) { document.getElementById('lb-img').src=src; document.getElementById('lightbox').style.display='flex'; }
    async function like(id) { 
        const ref = db.collection('posts').doc(id); const doc = await ref.get(); const p = doc.data();
        if((p.likedBy || []).includes(user.uid)) ref.update({ likes: firebase.firestore.FieldValue.increment(-1), likedBy: firebase.firestore.FieldValue.arrayRemove(user.uid) });
        else ref.update({ likes: firebase.firestore.FieldValue.increment(1), likedBy: firebase.firestore.FieldValue.arrayUnion(user.uid) });
    }
</script>
</body>
</html>
