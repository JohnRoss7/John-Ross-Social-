
<!-- === ΟΛΟΚΛΗΡΩΜΕΝΟΣ ΚΩΔΙΚΑΣ ΓΙΑ ΤΟ POST ME ΦΩΤΟΓΡΑΦΙΕΣ === -->

<div class="post-creator" style="background: #121212; padding: 15px; border-radius: 12px; color: white; max-width: 500px; margin: 0 auto; font-family: sans-serif;">
    <textarea id="postText" placeholder="Τι σκέφτεσαι;" style="width: 100%; background: #1e1e1e; color: white; border: none; padding: 12px; border-radius: 8px; resize: none; min-height: 80px; box-sizing: border-box;"></textarea>
    
    <!-- Κουμπί επιλογής φωτογραφιών -->
    <div class="image-upload-container" style="margin-top: 10px;">
        <label for="imageInput" class="upload-btn" style="cursor: pointer; background: #262626; padding: 8px 12px; border-radius: 6px; display: inline-block; font-size: 14px;">📷 Φωτογραφίες (έως 4)</label>
        <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
    </div>

    <!-- Χώρος για προεπισκόπηση φωτογραφιών -->
    <div id="imagePreviewContainer" style="display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;"></div>

    <!-- Κουμπί Δημοσίευσης -->
    <button id="submitPostBtn" style="margin-top: 15px; background: #ff3b30; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer;">Δημοσίευση</button>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const previewContainer = document.getElementById('imagePreviewContainer');
    let compressedImages = []; // Εδώ αποθηκεύονται οι συμπιεσμένες εικόνες

    // 1. Διαχείριση και συμπίεση φωτογραφιών
    imageInput.addEventListener('change', function(event) {
        const files = Array.from(event.target.files);
        
        // Έλεγχος για το όριο των 4 φωτογραφιών
        if (files.length > 4) {
            alert('Μπορείς να επιλέξεις έως 4 φωτογραφίες το πολύ!');
            imageInput.value = '';
            return;
        }

        compressedImages = [];
        previewContainer.innerHTML = '';

        files.forEach(file => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Συμπίεση εικόνας στο 70% ποιότητα (JPEG)
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    
                    compressedImages.push(compressedDataUrl);

                    // Δημιουργία μικρογραφίας για προεπισκόπηση
                    const thumb = document.createElement('img');
                    thumb.src = compressedDataUrl;
                    thumb.style.width = '70px';
                    thumb.style.height = '70px';
                    thumb.style.objectFit = 'cover';
                    thumb.style.borderRadius = '8px';
                    previewContainer.appendChild(thumb);
                };
            };
        });
    });

    // 2. Αποστολή στο Firestore με το πάτημα του κουμπιού
    document.getElementById('submitPostBtn').addEventListener('click', async function() {
        const postText = document.getElementById('postText').value;

        if (!postText.trim() && compressedImages.length === 0) {
            alert('Γράψε κάτι ή πρόσθεσε μια φωτογραφία!');
            return;
        }

        try {
            // Στέλνει τα δεδομένα στη συλλογή "posts" του Firestore σου
            await db.collection("posts").add({
                text: postText,
                images: compressedImages, // Οι έως 4 συμπιεσμένες φωτογραφίες
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                author: "John Ross"
            });

            // Καθαρισμός φόρμας μετά την επιτυχή ανάρτηση
            document.getElementById('postText').value = '';
            document.getElementById('imagePreviewContainer').innerHTML = '';
            document.getElementById('imageInput').value = '';
            compressedImages = [];
            
            alert('Η ανάρτηση δημοσιεύτηκε επιτυχώς!');
        } catch (error) {
            console.error("Σφάλμα κατά τη δημοσίευση: ", error);
            alert('Υπήρξε ένα πρόβλημα, δοκίμασε ξανά.');
        }
    });
</script>
