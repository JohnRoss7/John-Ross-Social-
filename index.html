<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>John Ross Social</title>
<meta name="theme-color" content="#000000">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#000;color:#fff;min-height:100vh}
.app-container{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:70px;background:#000;position:relative}
.main-header{position:sticky;top:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);border-bottom:1px solid #333;padding:10px 16px;z-index:100;display:flex;align-items:center;justify-content:space-between}
.logo-text{font-weight:800;font-size:18px}
.lb{background:#333;color:#fff;border:none;padding:4px 10px;border-radius:12px;font-size:11px;cursor:pointer}

/* Feed Sub-tabs */
.feed-tabs{display:flex;border-bottom:1px solid #333;background:#000;position:sticky;top:45px;z-index:90}
.feed-tab{flex:1;padding:12px;background:none;border:none;color:#777;font-size:14px;font-weight:700;cursor:pointer;text-align:center;border-bottom:2px solid transparent}
.feed-tab.active{color:#fff;border-bottom-color:#dc2626}

.post{border-bottom:1px solid #333;padding:14px 16px}
.post-header{display:flex;gap:10px;margin-bottom:10px;align-items:center}
.avatar{width:40px;height:40px;border-radius:8px;background:#222;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;background-size:cover;background-position:center;color:#fff}
.post-info{flex:1;min-width:0}
.username{font-weight:700;font-size:15px;display:flex;align-items:center;gap:5px}
.handle{color:#999;font-size:13px;margin-top:1px}
.post-content{font-size:16px;line-height:1.5;margin-bottom:10px;word-break:break-word}
.post-images-grid{display:grid;gap:6px;margin-top:10px;border-radius:12px;overflow:hidden}
.post-images-grid.count-1{grid-template-columns:1fr}
.post-image-item{width:100%;max-height:350px;object-fit:cover;background:#1a1a1a;border-radius:8px}
.post-actions{display:flex;gap:30px;color:#999;font-size:13px;margin-top:12px;align-items:center}
.post-actions span{display:flex;align-items:center;gap:6px;cursor:pointer}
.like-btn.liked{color:#dc2626}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.95);border-top:1px solid #333;display:flex;justify-content:space-around;padding:10px 0;max-width:600px;margin:0 auto;z-index:100}
.nav-item{background:none;border:none;color:#999;padding:8px 12px;cursor:pointer}
.nav-item.active{color:#dc2626}

.auth-container{text-align:center;padding:80px 24px}
.auth-container h2{margin-bottom:10px;font-size:32px;font-weight:800}
.auth-container input{width:100%;background:#1a1a1a;border:1px solid #333;color:#fff;padding:16px;border-radius:12px;margin:8px 0;font-size:16px;max-width:400px}
.auth-container button{width:100%;max-width:400px;background:#dc2626;color:#fff;border:none;padding:16px;border-radius:12px;font-weight:700;cursor:pointer;font-size:16px;margin:10px 0}
.auth-container .btn-o{background:transparent;border:1px solid #444;color:#fff}
.empty-state{padding:40px 20px;text-align:center;color:#777;font-size:15px}
.admin-badge{background:#dc2626;color:#fff;padding:2px 6px;border-radius:8px;font-size:10px}
</style>
</head>
<body>

<main class="app-container">
  <header class="main-header">
    <div class="logo-text">John Ross Social</div>
    <button class="lb" onclick="toggleLang()">EL</button>
  </header>
  <div id="main"></div>
  <nav class="bottom-nav" id="bottomNav" style="display:none">
    <button class="nav-item active" data-tab="home" onclick="showTab('home')"><i data-lucide="home"></i></button>
    <button class="nav-item" data-tab="search" onclick="showTab('search')"><i data-lucide="search"></i></button>
    <button class="nav-item" data-tab="notif" onclick="showTab('bell')"><i data-lucide="bell"></i></button>
    <button class="nav-item" data-tab="profile" onclick="showTab('profile')"><i data-lucide="user"></i></button>
  </nav>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc, getDoc, setDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCPIg-aoWUhqOqO5hyHUd66HLcHPyC6e70",
    authDomain: "studio-386569156-384ec.firebaseapp.com",
    projectId: "studio-386569156-384ec",
    storageBucket: "studio-386569156-384ec.firebasestorage.app",
    messagingSenderId: "976658898078",
    appId: "1:976658898078:web:6209be10508924e2116f8f"
  };
  
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);

  let currentUser = null, currentTab = 'home', feedSubTab = 'foryou', lang = 'el';
  let userDataCache = {};
  const adminEmails = ['rossrossg7@gmail.com'];

  onAuthStateChanged(auth, async (u) => {
    currentUser = u;
    if(u) {
      const uDoc = await doc(db, 'users', u.uid);
      const snap = await getDoc(uDoc);
      if(snap.exists()) {
        userDataCache = snap.data();
      } else {
        userDataCache = {name: u.displayName || u.email.split('@')[0], photo: u.photoURL || ''};
      }
    }
    render();
  });

  window.login = () => {
    const e = document.getElementById('le').value;
    const p = document.getElementById('lp').value;
    signInWithEmailAndPassword(auth, e, p).catch(err => alert(err.message));
  };

  window.register = () => {
    const e = document.getElementById('le').value;
    const p = document.getElementById('lp').value;
    if(!e || !p) return alert('Συμπλήρωσε email και κωδικό');
    const defaultName = e.split('@')[0];
    createUserWithEmailAndPassword(auth, e, p).then(cred => {
      return setDoc(doc(db, 'users', cred.user.uid), {email:e, name:defaultName, bio:'', photo:'', followers:[], following:[], likedPosts:[]});
    }).catch(err => alert(err.message));
  };

  window.googleLogin = () => {
    signInWithPopup(auth, new GoogleAuthProvider()).then(async cred => {
      const defName = cred.user.displayName || cred.user.email.split('@')[0];
      await setDoc(doc(db, 'users', cred.user.uid), {
        email: cred.user.email, name: defName, bio:'', photo: cred.user.photoURL || ''
      }, {merge:true});
    }).catch(err => alert(err.message));
  };

  window.logout = () => signOut(auth);

  window.postContent = async () => {
    const textVal = document.getElementById('postText').value.trim();
    const fileInput = document.getElementById('imageInput');
    const file = fileInput.files[0];
    
    if(!textVal && !file) return alert('Γράψε κάτι ή πρόσθεσε φωτογραφία!');
    
    const postBtn = document.getElementById('postSubmitBtn');
    if(postBtn) { postBtn.disabled = true; postBtn.textContent = 'Αποστολή...'; }

    try {
      let imageUrls = [];
      if(file){
        const storageRef = ref(storage, `posts/${Date.now()}_${file.name}`);
        const snapshot = await uploadBytes(storageRef, file);
        const url = await getDownloadURL(snapshot.ref);
        imageUrls.push(url);
      }

      const myName = userDataCache.name || currentUser.displayName || currentUser.email.split('@')[0];
      const myPhoto = userDataCache.photo || currentUser.photoURL || '';

      await addDoc(collection(db, 'posts'), {
        uid: currentUser.uid,
        name: myName,
        email: currentUser.email,
        photo: myPhoto,
        text: textVal,
        images: imageUrls,
        likes: 0,
        likedBy: [],
        comments: [],
        createdAt: Date.now()
      });

      document.getElementById('postText').value = '';
      fileInput.value = '';
      alert('Η δημοσίευση ανέβηκε επιτυχώς!');
    } catch(err) {
      alert('Σφάλμα ανέβασματος: ' + err.message);
    } finally {
      if(postBtn) { postBtn.disabled = false; postBtn.textContent = 'Δημοσίευση'; }
    }
  };

  window.likePost = async (id) => {
    const postRef = doc(db, 'posts', id);
    const postDoc = await getDoc(postRef);
    if(!postDoc.exists()) return;
    const data = postDoc.data();
    const likedBy = data.likedBy || [];
    if(likedBy.includes(currentUser.uid)){
      await updateDoc(postRef, {likes: data.likes - 1, likedBy: arrayRemove(currentUser.uid)});
    } else {
      await updateDoc(postRef, {likes: data.likes + 1, likedBy: arrayUnion(currentUser.uid)});
    }
  };

  window.deletePost = async (id) => {
    if(confirm('Διαγραφή δημοσίευσης;')) await deleteDoc(doc(db, 'posts', id));
  };

  window.showTab = (name) => {
    currentTab = name;
    document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    render();
  };

  window.setFeedSubTab = (sub) => {
    feedSubTab = sub;
    render();
  };

  window.toggleLang = () => {
    lang = lang === 'el' ? 'en' : 'el';
    document.querySelector('.lb').textContent = lang.toUpperCase();
    render();
  };

  function render(){
    const m = document.getElementById('main');
    if(!currentUser){
      document.getElementById('bottomNav').style.display = 'none';
      m.innerHTML = `
        <div class="auth-container">
          <div style="font-size:60px;margin-bottom:16px">👋</div>
          <h2>John Ross Social</h2>
          <p style="color:#999;margin-bottom:30px">Ο χώρος σου. Η φωνή σου.</p>
          <div style="max-width:400px;margin:0 auto">
            <input id="le" placeholder="Email" type="email">
            <input id="lp" placeholder="Κωδικός" type="password">
            <button onclick="login()">Σύνδεση</button>
            <button class="btn-o" onclick="register()">Εγγραφή</button>
            <button class="btn-o" onclick="googleLogin()">Google</button>
          </div>
        </div>`;
      return;
    }
    document.getElementById('bottomNav').style.display = 'flex';
    if(currentTab === 'home'){
      m.innerHTML = `
        <div class="feed-tabs">
          <button class="feed-tab ${feedSubTab==='foryou'?'active':''}" onclick="setFeedSubTab('foryou')">Για εσάς</button>
          <button class="feed-tab ${feedSubTab==='following'?'active':''}" onclick="setFeedSubTab('following')">Ακολουθείτε</button>
        </div>
        <div style="padding:14px 16px;border-bottom:1px solid #333">
          <textarea id="postText" placeholder="Τι σκέφτεσαι;" style="width:100%;background:transparent;border:none;color:#fff;font-size:15px;resize:none;min-height:60px;font-family:inherit"></textarea>
          <div style="margin-top:8px;display:flex;align-items:center;justify-content:space-between">
            <label for="imageInput" style="cursor:pointer;background:#262626;padding:8px 14px;border-radius:8px;font-size:13px">📷 Φωτογραφία</label>
            <input type="file" id="imageInput" accept="image/*" style="display:none">
            <button id="postSubmitBtn" style="background:#dc2626;color:#fff;border:none;padding:8px 20px;border-radius:12px;font-weight:700;cursor:pointer" onclick="postContent()">Δημοσίευση</button>
          </div>
        </div>
        <div id="feed"></div>`;
      loadFeed();
    } else if(currentTab === 'search'){
      m.innerHTML = '<div class="empty-state">Αναζήτηση</div>';
    } else if(currentTab === 'bell'){
      m.innerHTML = '<div class="empty-state">Ειδοποιήσεις</div>';
    } else if(currentTab === 'profile'){
      const displayName = userDataCache.name || currentUser.displayName || currentUser.email.split('@')[0];
      const displayPhoto = userDataCache.photo || currentUser.photoURL || '';
      const avatarH = displayPhoto ? `<div class="avatar" style="width:80px;height:80px;border-radius:12px;margin:0 auto 12px;background-image:url('${displayPhoto}')"></div>` : `<div class="avatar" style="width:80px;height:80px;border-radius:12px;margin:0 auto 12px;font-size:32px">👤</div>`;

      m.innerHTML = `
        <div style="padding:30px 20px;text-align:center;border-bottom:1px solid #333">
          ${avatarH}
          <h2 style="font-size:22px;margin-bottom:16px">${displayName}</h2>
          <button style="background:#333;color:#fff;border:none;padding:10px 20px;border-radius:12px;cursor:pointer;font-weight:700;font-size:13px" onclick="logout()">Αποσύνδεση</button>
        </div>
        <div style="padding:10px 16px;font-weight:700;color:#999;font-size:13px;border-bottom:1px solid #222">Οι δημοσιεύσεις μου</div>
        <div id="userPostsFeed"></div>`;
      loadUserPosts();
    }
    if(typeof lucide !== 'undefined') lucide.createIcons();
  }

  function loadFeed(){
    const feed = document.getElementById('feed');
    if(!feed) return;
    
    const q = query(collection(db, 'posts'), orderBy('createdAt', 'desc'));
    onSnapshot(q, (snap) => {
      if(snap.empty){ 
        feed.innerHTML = '<div class="empty-state">Δεν υπάρχουν δημοσιεύσεις</div>'; 
        return; 
      }
      let docs = [];
      snap.forEach(d => docs.push({id: d.id, ...d.data()}));

      if(feedSubTab === 'following') {
        const followingList = userDataCache.following || [];
        docs = docs.filter(p => p.uid === currentUser.uid || followingList.includes(p.uid));
        if(docs.length === 0) {
          feed.innerHTML = '<div class="empty-state">Δεν υπάρχουν δημοσιεύσεις από τις επαφές σας</div>';
          return;
        }
      }

      feed.innerHTML = docs.map(p => renderPostHtml(p)).join('');
      if(typeof lucide !== 'undefined') lucide.createIcons();
    }, (error) => {
      feed.innerHTML = `<div class="empty-state" style="color:#ef4444">Σφάλμα φόρτωσης: ${error.message}</div>`;
    });
  }

  function loadUserPosts(){
    const container = document.getElementById('userPostsFeed');
    if(!container) return;

    const q = query(collection(db, 'posts'), orderBy('createdAt', 'desc'));
    onSnapshot(q, (snap) => {
      if(snap.empty){
        container.innerHTML = '<div class="empty-state">Δεν έχετε κάνει κάποια δημοσίευση ακόμα</div>';
        return;
      }
      let docs = [];
      snap.forEach(d => {
        const data = d.data();
        if(data.uid === currentUser.uid) {
          docs.push({id: d.id, ...data});
        }
      });

      if(docs.length === 0){
        container.innerHTML = '<div class="empty-state">Δεν έχετε κάνει κάποια δημοσίευση ακόμα</div>';
        return;
      }

      container.innerHTML = docs.map(p => renderPostHtml(p)).join('');
      if(typeof lucide !== 'undefined') lucide.createIcons();
    }, (error) => {
      container.innerHTML = `<div class="empty-state" style="color:#ef4444">Σφάλμα φόρτωσης: ${error.message}</div>`;
    });
  }

  function renderPostHtml(p){
    const isAdmin = adminEmails.includes(p.email);
    const canDelete = (currentUser && currentUser.uid === p.uid) || isAdmin;
    const isLiked = currentUser && (p.likedBy || []).includes(currentUser.uid);
    const imgHtml = (p.images && p.images.length > 0) ? `<div class="post-images-grid count-1"><img src="${p.images[0]}" class="post-image-item"></div>` : '';
    const avatarHtml = p.photo ? `<div class="avatar" style="background-image:url('${p.photo}')"></div>` : `<div class="avatar">👤</div>`;
    const postName = p.name || 'User';

    return `<div class="post">
      <div class="post-header">
        ${avatarHtml}
        <div class="post-info">
          <div class="username">${postName} ${isAdmin ? '<span class="admin-badge">Admin</span>' : ''}</div>
          <div class="handle">@${postName.toLowerCase().replace(/\s+/g,'')}</div>
        </div>
        ${canDelete ? `<button style="background:none;border:none;color:#999;cursor:pointer;font-size:16px" onclick="deletePost('${p.id}')">✕</button>` : ''}
      </div>
      <div class="post-content">${p.text || ''}</div>
      ${imgHtml}
      <div class="post-actions">
        <span class="like-btn ${isLiked?'liked':''}" onclick="likePost('${p.id}')">❤️ ${p.likes||0}</span>
      </div>
    </div>`;
  }
</script>
</body>
</html>
