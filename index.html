<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>John Ross Social v17</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg:#000; --text:#fff; --muted:#777; --border:#222; --card:#121212; --accent:#dc2626; --blue:#1d9bf0; }
        body.light { --bg:#fff; --text:#000; --muted:#666; --border:#eee; --card:#f7f9f9; }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }
        html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:-apple-system, system-ui, sans-serif; position:fixed; }
        .app-wrapper { width:100%; height:100%; display:flex; flex-direction:column; max-width:550px; margin:0 auto; border-left:1px solid var(--border); border-right:1px solid var(--border); background:var(--bg); position:relative; }

        /* HEADER */
        header { background:var(--bg); border-bottom:1px solid var(--border); flex-shrink:0; z-index:1000; }
        .header-top { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
        .tabs { display:flex; border-bottom:1px solid var(--border); }
        .tab { flex:1; padding:14px; text-align:center; font-weight:600; color:var(--muted); cursor:pointer; }
        .tab.active { color:var(--text); border-bottom:2px solid var(--accent); }

        /* SCROLL AREA */
        #main-scroll { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
        
        /* POSTS */
        .post { padding:16px; border-bottom:1px solid var(--border); position:relative; }
        .post-header { display:flex; gap:12px; margin-bottom:8px; }
        .avatar { width:48px; height:48px; border-radius:12px; background:#333; background-size:cover; background-position:center; flex-shrink:0; cursor:pointer; border:1px solid var(--border); }
        .username { font-weight:700; font-size:15px; color:var(--text); cursor:pointer; display:flex; align-items:center; gap:4px; }
        .post-text { font-size:16px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; margin:5px 0; }
        .hashtag { color:var(--accent) !important; font-weight:600; cursor:pointer; }
        .post-img { width:100%; max-height:350px; object-fit:cover; border-radius:14px; margin-top:12px; border:1px solid var(--border); cursor:pointer; background:#111; }
        .post-actions { display:flex; justify-content:space-between; max-width:350px; margin-top:15px; color:var(--muted); }
        .post-actions span { display:flex; align-items:center; gap:8px; font-size:15px; cursor:pointer; padding:5px; }

        /* SETTINGS STYLE */
        .settings-group { background:var(--card); border-radius:16px; border:1px solid var(--border); margin:15px; overflow:hidden; }
        .settings-row { padding:16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
        .settings-row:last-child { border-bottom:none; }
        .input-field { width:100%; padding:12px; background:var(--bg); border:1px solid var(--border); color:#fff; border-radius:10px; margin-top:5px; font-size:16px; }

        /* BOTTOM NAV */
        nav.bottom-nav { height:65px; border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; background:var(--bg); flex-shrink:0; }
        .nav-item { color:var(--muted); position:relative; cursor:pointer; padding:12px; }
        .nav-item.active { color:var(--text); }
        .red-dot { position:absolute; top:8px; right:8px; width:12px; height:12px; background:var(--accent); border-radius:50%; border:2px solid var(--bg); display:none; }

        /* SIDEBAR */
        .sidebar { position:fixed; top:0; left:-285px; width:280px; height:100%; background:var(--bg); z-index:2000; border-right:1px solid var(--border); transition:0.3s ease; display:flex; flex-direction:column; }
        .sidebar.show { left:0; }
        .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1500; display:none; }
        
        .img-prev { position:relative; display:inline-block; margin-top:10px; }
        .img-prev img { width:90px; height:90px; border-radius:12px; object-fit:cover; border:1px solid var(--accent); }
        .img-prev .del { position:absolute; top:-5px; right:-5px; background:var(--accent); color:#fff; border-radius:50%; border:none; width:22px; height:22px; font-weight:bold; cursor:pointer; }

        .btn-save { background:var(--accent); color:#fff; border:none; padding:12px; border-radius:20px; font-weight:700; cursor:pointer; width:100%; margin-top:10px; }
        .lightbox { position:fixed; inset:0; background:#000; z-index:5000; display:none; align-items:center; justify-content:center; }
        .close-lb { position:absolute; top:40px; right:20px; background:var(--accent); color:#fff; border:none; border-radius:50%; width:45px; height:45px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:22px; }
    </style>
</head>
<body class="dark">

<div class="overlay" id="overlay" onclick="closeSidebar(); closeModals()"></div>

<aside class="sidebar" id="sidebar">
    <div style="padding:25px; border-bottom:1px solid var(--border); font-weight:800; font-size:20px;">John Ross Social</div>
    <div style="padding: 10px; flex: 1;">
        <div onclick="showTab('home');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="home"></i> Αρχική</div>
        <div onclick="showTab('profile');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="user"></i> Προφίλ</div>
        <div onclick="showTab('settings');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="settings"></i> Ρυθμίσεις</div>
        <div id="adminBtn" style="display:none;" onclick="showTab('admin');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="shield"></i> Admin Panel</div>
        <hr style="border:none; border-top:1px solid var(--border); margin:10px 0;">
        <div onclick="clearCacheNow()" style="padding:15px; color:orange; cursor:pointer"><i data-lucide="trash-2"></i> Εκκαθάριση Cache</div>
        <div onclick="auth.signOut();location.reload()" style="padding:15px; color:var(--accent); cursor:pointer"><i data-lucide="log-out"></i> Αποσύνδεση</div>
    </div>
    <div style="padding:15px; font-size:10px; color:var(--muted); text-align:center">Version 17.0 Professional</div>
</aside>

<div class="app-wrapper">
    <header>
        <div class="header-top">
            <i data-lucide="menu" onclick="toggleSidebar(true)" style="cursor:pointer"></i>
            <div style="font-weight:800; font-size:20px">John Ross Social</div>
            <i data-lucide="bell" onclick="showTab('notif')" style="cursor:pointer"></i>
        </div>
        <div class="tabs" id="home-tabs" style="display:none">
            <div class="tab active" id="t-foryou" onclick="setFeed('foryou')">Για εσένα</div>
            <div class="tab" id="t-following" onclick="setFeed('following')">Ακολουθείς</div>
        </div>
    </header>

    <main id="main-scroll"><div id="content"></div></main>

    <nav class="bottom-nav">
        <div class="nav-item active" id="btn-home" onclick="showTab('home')"><i data-lucide="home"></i></div>
        <div class="nav-item" id="btn-search" onclick="showTab('search')"><i data-lucide="search"></i></div>
        <div class="nav-item" id="btn-notif" onclick="showTab('notif')"><i data-lucide="bell"></i><div class="red-dot" id="notif-badge"></div></div>
        <div class="nav-item" id="btn-profile" onclick="showTab('profile')"><i data-lucide="user"></i></div>
    </nav>
</div>

<div class="lightbox" id="lightbox" onclick="this.style.display='none'"><button class="close-lb">X</button><img id="lb-img" style="max-width:100%; max-height:100%; object-fit:contain"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCPIg-aoWUhqOqO5hyHUd66HLcHPyC6e70",
        authDomain: "studio-386569156-384ec.firebaseapp.com",
        projectId: "studio-386569156-384ec",
        storageBucket: "studio-386569156-384ec.firebasestorage.app",
        messagingSenderId: "976658898078",
        appId: "1:976658898078:web:6209be10508924e2116f8f"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let user = null;
    let currentTab = 'home';
    let historyStack = [];
    let feedType = 'foryou';
    let pendingImg = null;
    let lang = localStorage.getItem('jrs_lang') || 'el';
    let theme = localStorage.getItem('jrs_theme') || 'dark';
    const adminEmail = 'rossrossg7@gmail.com';

    auth.onAuthStateChanged(u => {
        user = u;
        if(u) {
            document.getElementById('adminBtn').style.display = (u.email === adminEmail) ? 'block' : 'none';
            listenNotifs();
        }
        document.body.className = theme;
        render();
    });

    function toggleSidebar(s) { document.getElementById('sidebar').classList.toggle('show', s); document.getElementById('overlay').style.display = s ? 'block' : 'none'; }
    function closeSidebar() { toggleSidebar(false); }
    function clearCacheNow() { localStorage.clear(); location.href = location.pathname + '?reset=' + Date.now(); }

    function showTab(t, fromBack = false) {
        if(!fromBack && currentTab !== t) { historyStack.push(currentTab); window.history.pushState({tab: t}, ""); }
        currentTab = t;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if(document.getElementById('btn-'+t)) document.getElementById('btn-'+t).classList.add('active');
        document.getElementById('home-tabs').style.display = (t === 'home') ? 'flex' : 'none';
        render();
    }
    window.onpopstate = () => { if(historyStack.length > 0) showTab(historyStack.pop(), true); };

    function format(text) {
        if(!text) return "";
        let esc = String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
        return esc.replace(/#(\w+)/g, '<span class="hashtag" onclick="event.stopPropagation(); handleHash(\'#$1\')">#$1</span>');
    }
    function handleHash(h) { showTab('search'); setTimeout(() => { const i = document.getElementById('searchInp'); if(i) { i.value = h; doSearch(h); } }, 400); }

    function render() {
        const c = document.getElementById('content');
        if(!user) {
            c.innerHTML = `<div style="padding:60px 25px; text-align:center;"><h1>John Ross Social</h1><br><button onclick="auth.signInWithEmailAndPassword(prompt('Email:'), prompt('Password:'))" class="btn-main" style="background:var(--accent); color:#fff; border:none; padding:15px; border-radius:15px; width:100%">Σύνδεση</button></div>`;
            return;
        }
        if(currentTab === 'home') renderHome(c);
        else if(currentTab === 'profile') renderProfile(c, user.uid);
        else if(currentTab === 'settings') renderSettings(c);
        else if(currentTab === 'notif') renderNotifications(c);
        else if(currentTab === 'search') renderSearch(c);
        else if(currentTab === 'admin') renderAdmin(c);
        lucide.createIcons();
    }

    function renderHome(m) {
        m.innerHTML = `<div style="padding:16px; border-bottom:1px solid var(--border)"><textarea id="postText" placeholder="Τι συμβαίνει;" style="width:100%; background:none; border:none; color:#fff; font-size:18px; outline:none; resize:none; min-height:60px"></textarea><div id="imgPrv"></div><div style="display:flex; justify-content:space-between; margin-top:10px"><i data-lucide="image" onclick="document.getElementById('fInp').click()" style="color:var(--blue); cursor:pointer"></i><input type="file" id="fInp" hidden onchange="handleFile(this)"><button onclick="sendPost()" class="btn-main" style="width:auto; padding:8px 20px; border-radius:20px">Post</button></div></div><div id="feed"></div>`;
        loadFeed('feed');
    }

    function renderSettings(m) {
        db.collection('users').doc(user.uid).get().then(doc => {
            const u = doc.data();
            m.innerHTML = `<div style="padding:20px"><h2>Ρυθμίσεις</h2>
                <div class="settings-group">
                    <div class="settings-row" onclick="document.getElementById('pInp').click()"><span>Αλλαγή Φωτογραφίας</span><i data-lucide="camera"></i></div>
                    <input type="file" id="pInp" hidden accept="image/*" onchange="handleFile(this, 'profile')">
                    <div style="padding:15px"><label style="font-size:12px; color:var(--muted)">Όνομα Χρήστη</label><input id="s-name" class="input-field" value="${u.name}"><label style="font-size:12px; color:var(--muted); margin-top:10px; display:block">Bio</label><textarea id="s-bio" class="input-field" style="height:70px">${u.bio||''}</textarea><button onclick="saveSet()" class="btn-save">Αποθήκευση</button></div>
                </div>
                <div class="settings-group">
                    <div class="settings-row" onclick="toggleThemeNow()"><span>Θέμα: ${theme==='dark'?'Dark':'Light'}</span><i data-lucide="moon"></i></div>
                    <div class="settings-row" onclick="toggleLangNow()"><span>Γλώσσα: ${lang==='el'?'Ελληνικά':'English'}</span><i data-lucide="languages"></i></div>
                </div></div>`;
            lucide.createIcons();
        });
    }

    async function saveSet() {
        const n = document.getElementById('s-name').value;
        const b = document.getElementById('s-bio').value;
        await db.collection('users').doc(user.uid).update({ name:n, bio:b });
        const snap = await db.collection('posts').where('uid', '==', user.uid).get();
        const batch = db.batch(); snap.docs.forEach(d => batch.update(d.ref, {name: n})); await batch.commit();
        alert("Αποθηκεύτηκε!");
    }

    function loadFeed(id, uid = null) {
        const feed = document.getElementById(id);
        let q = db.collection('posts').orderBy('createdAt', 'desc').limit(25);
        if(uid) q = q.where('uid', '==', uid);
        q.onSnapshot(snap => {
            feed.innerHTML = snap.docs.map(d => {
                const p = d.data();
                const isLiked = (p.likedBy || []).includes(user.uid);
                return `<div class="post">
                    ${(user.uid === p.uid || user.email === adminEmail) ? `<i data-lucide="more-horizontal" onclick="postOp('${d.id}', '${p.text}', '${p.uid}')" style="position:absolute; right:15px; top:15px; color:var(--muted); cursor:pointer"></i>` : ''}
                    <div class="post-header">
                        <div class="avatar" onclick="openProfile('${p.uid}')" style="${p.photo?`background-image:url('${p.photo}')`:''}"></div>
                        <div class="post-content"><div class="username" onclick="openProfile('${p.uid}')">${p.name}</div><div class="post-text">${format(p.text)}</div>
                            ${p.images && p.images[0] ? `<img src="${p.images[0]}" class="post-img" onclick="openLB('${p.images[0]}')">` : ''}
                            <div class="post-actions"><span onclick="like('${d.id}')"><i data-lucide="heart" style="${isLiked?'fill:var(--accent)':''}"></i> ${p.likes||0}</span><span onclick="alert('Coming soon')"><i data-lucide="message-circle"></i></span><span onclick="copyLink('${d.id}')"><i data-lucide="share-2"></i></span></div>
                        </div>
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        });
    }

    function renderProfile(m, uid) {
        db.collection('users').doc(uid).onSnapshot(doc => {
            const u = doc.data();
            m.innerHTML = `<div class="profile-head"><div class="avatar-lg" onclick="openLB('${u.photo}')" style="${u.photo?`background-image:url('${u.photo}')`:''}"></div><h2>${u.name}</h2><p style="color:var(--muted)">${u.bio || ''}</p>
                <div class="stats"><div class="stat-btn" onclick="showUsers('${uid}', 'followers')"><b>${(u.followers||[]).length}</b><span>Followers</span></div><div class="stat-btn" onclick="showUsers('${uid}', 'following')"><b>${(u.following||[]).length}</b><span>Following</span></div></div>
                ${uid !== user.uid ? `<button class="btn-main" onclick="toggleFollow('${uid}')" style="margin-top:15px; width:auto; padding:8px 20px">${(u.followers||[]).includes(user.uid)?'Ακολουθείς':'Ακολούθηση'}</button>` : ''}
                </div><div id="p-feed"></div>`;
            loadFeed('p-feed', uid);
        });
    }

    async function handleFile(inp, target = 'post') {
        const reader = new FileReader();
        reader.onload = async (e) => {
            const img = new Image();
            img.onload = async () => {
                const canvas = document.createElement('canvas'); const MAX = 600;
                let w = img.width, h = img.height;
                if (w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } } else { if(h > MAX) { w *= MAX/h; h = MAX; } }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
                const data = canvas.toDataURL('image/jpeg', 0.4);
                if(target === 'profile') {
                    await db.collection('users').doc(user.uid).update({ photo: data });
                    const snap = await db.collection('posts').where('uid','==',user.uid).get();
                    const batch = db.batch(); snap.docs.forEach(d => batch.update(d.ref, {photo: data})); await batch.commit();
                    alert("Updated!");
                } else {
                    pendingImg = data;
                    document.getElementById('imgPrv').innerHTML = `<div class="img-prev"><img src="${data}"><button class="del" onclick="pendingImg=null;document.getElementById('imgPrv').innerHTML=''">×</button></div>`;
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(inp.files[0]);
    }

    async function like(id) {
        const ref = db.collection('posts').doc(id); const doc = await ref.get(); const p = doc.data();
        if((p.likedBy || []).includes(user.uid)) { ref.update({ likes: firebase.firestore.FieldValue.increment(-1), likedBy: firebase.firestore.FieldValue.arrayRemove(user.uid) }); }
        else { ref.update({ likes: firebase.firestore.FieldValue.increment(1), likedBy: firebase.firestore.FieldValue.arrayUnion(user.uid) });
            if(p.uid !== user.uid) db.collection('notifications').add({ userId: p.uid, text: `${user.email.split('@')[0]} έκανε like`, read: false, createdAt: Date.now() });
        }
    }

    function toggleThemeNow() { theme = (theme === 'dark' ? 'light' : 'dark'); localStorage.setItem('jrs_theme', theme); location.reload(); }
    function toggleLangNow() { lang = (lang === 'el' ? 'en' : 'el'); localStorage.setItem('jrs_lang', lang); location.reload(); }
    function listenNotifs() { db.collection('notifications').where('userId', '==', user.uid).where('read', '==', false).onSnapshot(s => { document.getElementById('notif-badge').style.display = s.empty ? 'none' : 'block'; }); }
    function openProfile(uid) { showTab('profile'); renderProfile(document.getElementById('content'), uid); }
    function openLB(src) { document.getElementById('lb-img').src=src; document.getElementById('lightbox').style.display='flex'; }
    async function sendPost() { const t=document.getElementById('postText').value; if(!t.trim() && !pendingImg) return; await db.collection('posts').add({uid:user.uid, name:user.displayName||user.email.split('@')[0], text:t, images:pendingImg?[pendingImg]:[], likes:0, likedBy:[], createdAt:Date.now()}); document.getElementById('postText').value=''; pendingImg=null; document.getElementById('imgPrv').innerHTML=''; }
    function postOp(id, text, postUid) { if(user.uid === postUid) { if(confirm("Διαγραφή;")) db.collection('posts').doc(id).delete(); } else if(user.email === adminEmail) { if(confirm("ADMIN: Διαγραφή;")) db.collection('posts').doc(id).delete(); } }
    function copyLink(id) { navigator.clipboard.writeText(window.location.origin + window.location.pathname + "?post=" + id); alert("Link Copied!"); }

    lucide.createIcons();
</script>
</body>
</html>
