<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>John Ross Social v25</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg:#000; --text:#fff; --muted:#777; --border:#222; --card:#16181c; --accent:#dc2626; --blue:#1d9bf0; }
        body.light { --bg:#fff; --text:#000; --muted:#666; --border:#eee; --card:#f7f9f9; }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }
        html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:system-ui, -apple-system, sans-serif; position:fixed; }
        
        .app-wrapper { width:100%; height:100%; display:flex; flex-direction:column; max-width:550px; margin:0 auto; border-left:1px solid var(--border); border-right:1px solid var(--border); background:var(--bg); position:relative; }
        
        header { background:var(--bg); border-bottom:1px solid var(--border); flex-shrink:0; z-index:1000; }
        .header-top { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
        .tabs { display:flex; border-bottom:1px solid var(--border); }
        .tab { flex:1; padding:14px; text-align:center; font-weight:600; color:var(--muted); cursor:pointer; }
        .tab.active { color:var(--text); border-bottom:2px solid var(--accent); }
        
        #main-scroll { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }

        .post { padding:16px; border-bottom:1px solid var(--border); position:relative; width:100%; }
        .post-header { display:flex; gap:12px; margin-bottom:8px; align-items: flex-start; }
        .avatar { width:48px; height:48px; border-radius:12px; background:#333; background-size:cover; background-position:center; flex-shrink:0; cursor:pointer; border:1px solid var(--border); }
        .username { font-weight:700; font-size:15px; color:var(--text); cursor:pointer; }
        .post-text { font-size:16px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; margin:5px 0; }
        .hashtag, .mention { color:var(--accent) !important; font-weight:600; cursor:pointer; }
        .post-img { width:100%; max-height:350px; object-fit:cover; border-radius:14px; margin-top:12px; border:1px solid var(--border); cursor:pointer; display:block; background:#111; }
        
        .post-actions { display:flex; justify-content:space-between; max-width:350px; margin-top:15px; color:var(--muted); }
        .post-actions span { display:flex; align-items:center; gap:8px; font-size:16px; cursor:pointer; padding:5px; }
        .post-menu-btn { position:absolute; top:15px; right:12px; color:var(--muted); cursor:pointer; padding:5px; }

        .sidebar { position:fixed; top:0; left:-285px; width:280px; height:100%; background:var(--bg); z-index:3000; border-right:1px solid var(--border); transition:0.3s ease; display:flex; flex-direction:column; }
        .sidebar.show { left:0; }
        .sidebar-header { padding:20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
        .close-btn-red { color:var(--accent); cursor:pointer; }

        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:5000; display:none; align-items:center; justify-content:center; padding:20px; }
        .modal-content { background:var(--card); width:100%; max-width:400px; border-radius:24px; padding:20px; border:1px solid var(--border); max-height:85vh; overflow-y:auto; }
        .input-box { width:100%; padding:14px; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:12px; font-size:16px; margin-top:5px; margin-bottom:10px; }

        nav.bottom-nav { 
            height:70px; 
            border-top:1px solid var(--border); 
            display:flex; 
            justify-content:space-around; 
            align-items:center; 
            background:var(--bg); 
            flex-shrink:0;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item { 
            color:var(--muted); 
            position:relative; 
            cursor:pointer; 
            padding:8px 12px;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:4px;
            font-size:11px;
            font-weight:500;
            transition: all 0.2s;
            min-width:60px;
        }
        .nav-item i { width:24px; height:24px; }
        .nav-item.active { color:var(--accent); }
        .nav-item.active i { transform: scale(1.1); }
        .red-dot { position:absolute; top:4px; right:12px; width:10px; height:10px; background:var(--accent); border-radius:50%; border:2px solid var(--bg); display:none; }

        .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1500; display:none; }
        .btn-main { background:var(--accent); color:#fff; border:none; padding:12px 25px; border-radius:20px; font-weight:700; cursor:pointer; width:100%; }
        
        .lightbox { position:fixed; inset:0; background:#000; z-index:6000; display:none; align-items:center; justify-content:center; }
        .close-lb { position:absolute; top:40px; right:20px; background:var(--accent); color:#fff; border:none; border-radius:50%; width:45px; height:45px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:22px; }
        
        .settings-row { padding:16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; cursor:pointer; font-weight:600; background:var(--card); border-radius:12px; margin-bottom:10px; }
        .admin-badge { background:var(--accent); color:#fff; padding:2px 6px; border-radius:6px; font-size:10px; font-weight:900; margin-left:5px; }
        
        .notif-item { padding:14px 16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
        
        .quote-box { border:1px solid var(--border); border-radius:14px; padding:12px; margin-top:12px; background:rgba(255,255,255,0.03); }
        .quote-box .q-name { font-weight:700; font-size:14px; margin-bottom:4px; }
        .quote-box .q-text { font-size:14px; color:var(--muted); white-space:pre-wrap; }
        .quote-box img { width:100%; max-height:180px; object-fit:cover; border-radius:10px; margin-top:8px; }
        
        .admin-stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:20px 0; }
        .stat-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; text-align:center; }
        .stat-card b { display:block; font-size:24px; color:var(--accent); }
        .stat-card span { font-size:13px; color:var(--muted); }

        .user-list-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); cursor:pointer; }
        .user-list-item:last-child { border-bottom:none; }
        .user-list-item .avatar { width:42px; height:42px; }
    </style>
</head>
<body class="dark">

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <span style="font-weight:800; font-size:20px">John Ross Social</span>
        <i data-lucide="x-circle" class="close-btn-red" onclick="toggleSidebar(false)"></i>
    </div>
    <div style="padding: 10px; flex: 1; overflow-y: auto;">
        <div onclick="showTab('home');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="home"></i> <span data-t="home">Αρχική</span></div>
        <div onclick="showTab('profile');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="user"></i> <span data-t="profile">Προφίλ</span></div>
        <div onclick="showTab('settings');toggleSidebar(false)" style="padding:15px; cursor:pointer"><i data-lucide="settings"></i> <span data-t="settings">Ρυθμίσεις</span></div>
        <div id="adminBtn" style="display:none; padding:15px; cursor:pointer" onclick="showTab('admin');toggleSidebar(false)"><i data-lucide="shield"></i> Admin Panel</div>
        <hr style="border:none; border-top:1px solid var(--border); margin:10px 0;">
        <div onclick="clearCache()" style="padding:15px; color:orange; cursor:pointer"><i data-lucide="trash-2"></i> <span data-t="clearCache">Εκκαθάριση Cache</span></div>
        <div onclick="auth.signOut();location.reload()" style="padding:15px; color:var(--accent); cursor:pointer"><i data-lucide="log-out"></i> <span data-t="logout">Αποσύνδεση</span></div>
    </div>
</aside>

<div class="app-wrapper">
    <header>
        <div class="header-top">
            <i data-lucide="menu" onclick="toggleSidebar(true)" style="cursor:pointer"></i>
            <div style="font-weight:800; font-size:20px">John Ross Social</div>
            <i data-lucide="refresh-cw" onclick="location.reload()" style="opacity:0.2"></i>
        </div>
        <div class="tabs" id="home-tabs" style="display:none">
            <div class="tab active" id="tab-foryou" onclick="setFeed('foryou')" data-t="foryou">Για εσένα</div>
            <div class="tab" id="tab-following" onclick="setFeed('following')" data-t="following">Ακολουθείς</div>
        </div>
    </header>
    <main id="main-scroll"><div id="content"></div></main>
    
    <nav class="bottom-nav">
        <div class="nav-item active" id="btn-home" onclick="showTab('home')">
            <i data-lucide="home"></i>
            <span>Αρχική</span>
        </div>
        <div class="nav-item" id="btn-search" onclick="showTab('search')">
            <i data-lucide="search"></i>
            <span>Αναζήτηση</span>
        </div>
        <div class="nav-item" id="btn-notif" onclick="showTab('notif')">
            <i data-lucide="bell"></i>
            <span>Ειδοπ.</span>
            <div class="red-dot" id="notif-badge"></div>
        </div>
        <div class="nav-item" id="btn-profile" onclick="showTab('profile')">
            <i data-lucide="user"></i>
            <span>Προφίλ</span>
        </div>
    </nav>
</div>

<!-- SHARE MODAL -->
<div class="modal" id="shareModal">
    <div class="modal-content">
        <h3>Κοινοποίηση</h3><br>
        <div onclick="doNativeShare()" class="settings-row"><span>Σε εφαρμογές</span><i data-lucide="share"></i></div>
        <div onclick="copyLink()" class="settings-row"><span>Αντιγραφή Συνδέσμου</span><i data-lucide="link"></i></div>
        <div onclick="repostNow()" class="settings-row"><span>Repost</span><i data-lucide="repeat"></i></div>
        <div onclick="openQuoteModal()" class="settings-row"><span>Παράθεση (Quote)</span><i data-lucide="quote"></i></div>
        <button onclick="closeAll()" class="btn-main" style="background:#222; margin-top:10px">Κλείσιμο</button>
    </div>
</div>

<!-- QUOTE MODAL -->
<div class="modal" id="quoteModal">
    <div class="modal-content">
        <h3>Παράθεση</h3>
        <textarea id="quoteText" class="input-box" style="height:100px; margin-top:12px" placeholder="Πρόσθεσε το σχόλιό σου..."></textarea>
        <div id="quotePreview" class="quote-box"></div>
        <div style="display:flex; gap:10px; margin-top:16px">
            <button onclick="closeAll()" class="btn-main" style="background:#333; flex:1">Ακύρωση</button>
            <button onclick="submitQuote()" class="btn-main" style="flex:1">Δημοσίευση</button>
        </div>
    </div>
</div>

<!-- FOLLOWERS / FOLLOWING MODAL -->
<div class="modal" id="listModal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px">
            <h3 id="listModalTitle">Λίστα</h3>
            <i data-lucide="x" onclick="closeAll()" style="cursor:pointer; color:var(--muted)"></i>
        </div>
        <div id="listModalContent"></div>
    </div>
</div>

<div class="lightbox" id="lightbox" onclick="this.style.display='none'">
    <button class="close-lb" onclick="event.stopPropagation(); this.parentElement.style.display='none'">X</button>
    <img id="lb-img" style="max-width:95%; max-height:95%; object-fit:contain">
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCPIg-aoWUhqOqO5hyHUd66HLcHPyC6e70",
        authDomain: "studio-386569156-384ec.firebaseapp.com",
        projectId: "studio-386569156-384ec",
        storageBucket: "studio-386569156-384ec.firebasestorage.app",
        messagingSenderId: "976658898078",
        appId: "1:976658898078:web:6209be10508924e2116f8f"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    let user = null;
    let currentTab = 'home';
    let feedType = 'foryou';
    let pendingImg = null;
    let activePost = null;
    let historyStack = [];
    let unsubscribeFeed = null;
    let lang = localStorage.getItem('jrs_lang') || 'el';
    let theme = localStorage.getItem('jrs_theme') || 'dark';
    const adminEmail = 'rossrossg7@gmail.com';

    const T = {
        el: { home:"Αρχική", profile:"Προφίλ", settings:"Ρυθμίσεις", clearCache:"Εκκαθάριση Cache", logout:"Αποσύνδεση", foryou:"Για εσένα", following:"Ακολουθείς", placeholder:"Τι συμβαίνει;" },
        en: { home:"Home", profile:"Profile", settings:"Settings", clearCache:"Clear Cache", logout:"Logout", foryou:"For You", following:"Following", placeholder:"What's happening?" }
    };

    function playPop() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = "sine";
            o.frequency.setValueAtTime(500, ctx.currentTime);
            o.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1);
            g.gain.setValueAtTime(0.15, ctx.currentTime);
            o.connect(g); g.connect(ctx.destination);
            o.start(); o.stop(ctx.currentTime + 0.1);
        } catch(e) {}
    }

    auth.onAuthStateChanged(u => {
        user = u;
        if (u) {
            document.getElementById('adminBtn').style.display = (u.email === adminEmail) ? 'block' : 'none';
            db.collection('users').doc(u.uid).get().then(doc => {
                if (!doc.exists) {
                    db.collection('users').doc(u.uid).set({
                        name: u.email.split('@')[0],
                        bio: '',
                        photo: '',
                        followers: [],
                        following: [],
                        createdAt: Date.now()
                    });
                }
            });
            listenNotifs();
        }
        document.body.className = theme;
        render();
    });

    function toggleSidebar(s) {
        document.getElementById('sidebar').classList.toggle('show', s);
        document.getElementById('overlay').style.display = s ? 'block' : 'none';
    }

    function closeAll() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        document.getElementById('sidebar').classList.remove('show');
        document.getElementById('overlay').style.display = 'none';
    }

    function showTab(t, fromBack = false) {
        if (!fromBack && currentTab !== t) {
            historyStack.push(currentTab);
            window.history.pushState({ tab: t }, "");
        }
        currentTab = t;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        const btn = document.getElementById('btn-' + t);
        if (btn) btn.classList.add('active');
        document.getElementById('home-tabs').style.display = (t === 'home') ? 'flex' : 'none';
        render();
    }

    window.onpopstate = () => {
        if (historyStack.length > 0) {
            showTab(historyStack.pop(), true);
        } else {
            showTab('home', true);
        }
    };

    function format(text) {
        if (!text) return "";
        let escaped = String(text).replace(/[&<>"']/g, c => ({
            '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
        }[c]));
        escaped = escaped.replace(/@(\w+)/g, '<span class="mention" onclick="event.stopPropagation(); handleMention(\'$1\')">@$1</span>');
        escaped = escaped.replace(/#(\w+)/g, '<span class="hashtag" onclick="event.stopPropagation(); handleHash(\'#$1\')">#$1</span>');
        return escaped;
    }

    function handleHash(h) {
        showTab('search');
        setTimeout(() => {
            const i = document.getElementById('searchInp');
            if (i) { i.value = h; doSearch(h); }
        }, 300);
    }

    function handleMention(name) {
        db.collection('users').where('name', '==', name).limit(1).get().then(snap => {
            if (!snap.empty) {
                openProfile(snap.docs[0].id);
            } else {
                showTab('search');
                setTimeout(() => {
                    const i = document.getElementById('searchInp');
                    if (i) { i.value = '@' + name; doSearch(name); }
                }, 300);
            }
        });
    }

    function render() {
        const c = document.getElementById('content');
        if (!user) {
            c.innerHTML = `<div style="padding:60px 25px; text-align:center"><h1>John Ross Social</h1><br>
                <button onclick="auth.signInWithEmailAndPassword(prompt('Email:'), prompt('Password:'))" class="btn-main">Σύνδεση</button></div>`;
            return;
        }
        if (currentTab === 'home') renderHome(c);
        else if (currentTab === 'profile') renderProfile(c, user.uid);
        else if (currentTab === 'settings') renderSettings(c);
        else if (currentTab === 'notif') renderNotifs(c);
        else if (currentTab === 'search') renderSearch(c);
        else if (currentTab === 'admin') renderAdmin(c);

        document.querySelectorAll('[data-t]').forEach(el => {
            const k = el.getAttribute('data-t');
            el.innerText = T[lang][k] || k;
        });
        lucide.createIcons();
    }

    function renderHome(m) {
        m.innerHTML = `
            <div style="padding:16px; border-bottom:1px solid var(--border)">
                <div style="display:flex;gap:12px">
                    <div class="avatar" id="myAvH" style="width:40px;height:40px"></div>
                    <textarea id="postText" placeholder="${T[lang].placeholder}" style="flex:1; background:none; border:none; color:var(--text); font-size:18px; outline:none; resize:none; min-height:60px"></textarea>
                </div>
                <div id="imgPrv"></div>
                <div style="display:flex; justify-content:space-between; margin-top:10px; padding-left:52px">
                    <i data-lucide="image" onclick="document.getElementById('fInp').click()" style="color:var(--blue); cursor:pointer"></i>
                    <input type="file" id="fInp" hidden accept="image/*" onchange="handleFile(this)">
                    <button onclick="sendPost()" class="btn-main" style="width:auto">Post</button>
                </div>
            </div>
            <div id="feed"></div>`;
        
        db.collection('users').doc(user.uid).get().then(doc => {
            if (doc.exists && doc.data().photo) {
                document.getElementById('myAvH').style.backgroundImage = `url('${doc.data().photo}')`;
            }
        });
        loadFeed('feed');
    }

    function loadFeed(id, uid = null) {
        if (unsubscribeFeed) { unsubscribeFeed(); unsubscribeFeed = null; }
        const feed = document.getElementById(id);
        if (!feed) return;

        let q = db.collection('posts').orderBy('createdAt', 'desc').limit(40);
        unsubscribeFeed = q.onSnapshot(snap => {
            let posts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            if (feedType === 'following' && currentTab === 'home') {
                db.collection('users').doc(user.uid).get().then(uDoc => {
                    const following = (uDoc.exists && uDoc.data().following) ? uDoc.data().following : [];
                    displayPosts(posts.filter(p => following.includes(p.uid) || p.uid === user.uid), feed);
                });
            } else {
                if (uid) posts = posts.filter(p => p.uid === uid);
                displayPosts(posts, feed);
            }
        }, err => {
            console.error(err);
            feed.innerHTML = "<p style='padding:20px;color:#dc2626'>Σφάλμα φόρτωσης</p>";
        });
    }

    function displayPosts(posts, container) {
        if (!container) return;
        if (posts.length === 0) {
            container.innerHTML = "<p style='padding:30px; text-align:center; color:var(--muted)'>Δεν υπάρχουν αναρτήσεις</p>";
            return;
        }

        container.innerHTML = posts.map(p => {
            const isLiked = (p.likedBy || []).includes(user.uid);
            const canManage = (user.uid === p.uid || user.email === adminEmail);
            const safeId = String(p.id).replace(/'/g, "\\'");
            const safeUid = String(p.uid).replace(/'/g, "\\'");
            const safeText = String(p.text || '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/\n/g,'\\n');
            const safeImg = (p.images && p.images[0]) ? String(p.images[0]).replace(/'/g, "\\'") : '';

            let quoteHtml = '';
            if (p.quote) {
                quoteHtml = `
                <div class="quote-box" style="margin-top:10px">
                    <div class="q-name">${p.quote.name || 'User'}</div>
                    <div class="q-text">${format(p.quote.text || '')}</div>
                    ${p.quote.image ? `<img src="${p.quote.image}">` : ''}
                </div>`;
            }

            return `
            <div class="post">
                ${canManage ? `<i data-lucide="more-horizontal" class="post-menu-btn" onclick="postOp('${safeId}', '${safeText}', '${safeUid}')"></i>` : ''}
                <div class="post-header" onclick="openProfile('${safeUid}')">
                    <div class="avatar" style="${p.photo ? `background-image:url('${p.photo}')` : ''}"></div>
                    <div class="post-content">
                        <div class="username">${p.name || 'User'} ${user.email === adminEmail && p.uid === user.uid ? '<span class="admin-badge">ADMIN</span>' : ''}</div>
                        <div class="post-text">${format(p.text)}</div>
                        ${quoteHtml}
                        ${p.images && p.images[0] ? `<img src="${p.images[0]}" class="post-img" onclick="event.stopPropagation(); openLB('${safeImg}')">` : ''}
                        <div class="post-actions">
                            <span onclick="event.stopPropagation(); like('${safeId}')">
                                <i data-lucide="heart" style="${isLiked ? 'fill:var(--accent);color:var(--accent)' : ''}"></i> ${p.likes || 0}
                            </span>
                            <span onclick="event.stopPropagation(); alert('Comments soon')"><i data-lucide="message-circle"></i></span>
                            <span onclick="event.stopPropagation(); openShare('${safeId}', '${safeText}', '${safeImg}')"><i data-lucide="share-2"></i></span>
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');
        lucide.createIcons();
    }

    async function handleFile(inp, target = 'post') {
        if (!inp.files?.[0]) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX = 800;
                let w = img.width, h = img.height;
                if (w > h) { if (w > MAX) { h *= MAX/w; w = MAX; } }
                else { if (h > MAX) { w *= MAX/h; h = MAX; } }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                const data = canvas.toDataURL('image/jpeg', 0.35);

                if (target === 'profile') {
                    db.collection('users').doc(user.uid).update({ photo: data });
                    updateAllPosts(null, data);
                } else {
                    pendingImg = data;
                    document.getElementById('imgPrv').innerHTML = `
                        <div style="position:relative;display:inline-block;margin-top:10px">
                            <img src="${data}" style="width:80px;height:80px;border-radius:10px;object-fit:cover">
                            <button onclick="pendingImg=null;document.getElementById('imgPrv').innerHTML=''" 
                                style="position:absolute;top:-5px;right:-5px;background:red;color:white;border-radius:50%;border:none;width:22px;height:22px;font-weight:bold;cursor:pointer">×</button>
                        </div>`;
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(inp.files[0]);
    }

    async function sendPost() {
        const txt = document.getElementById('postText').value;
        if (!txt.trim() && !pendingImg) return;
        try {
            const uDoc = await db.collection('users').doc(user.uid).get();
            const uData = uDoc.exists ? uDoc.data() : {};
            await db.collection('posts').add({
                uid: user.uid,
                name: uData.name || user.email.split('@')[0],
                photo: uData.photo || '',
                text: txt,
                images: pendingImg ? [pendingImg] : [],
                likes: 0, likedBy: [],
                createdAt: Date.now()
            });
            document.getElementById('postText').value = '';
            pendingImg = null;
            document.getElementById('imgPrv').innerHTML = '';
        } catch (err) { alert("Σφάλμα δημοσίευσης"); }
    }

    async function like(id) {
        playPop();
        try {
            const ref = db.collection('posts').doc(id);
            const doc = await ref.get();
            if (!doc.exists) return;
            const p = doc.data();
            if ((p.likedBy || []).includes(user.uid)) {
                ref.update({ likes: firebase.firestore.FieldValue.increment(-1), likedBy: firebase.firestore.FieldValue.arrayRemove(user.uid) });
            } else {
                ref.update({ likes: firebase.firestore.FieldValue.increment(1), likedBy: firebase.firestore.FieldValue.arrayUnion(user.uid) });
                if (p.uid !== user.uid) {
                    db.collection('notifications').add({
                        userId: p.uid,
                        text: `${user.email.split('@')[0]} έκανε like`,
                        read: false, createdAt: Date.now()
                    });
                }
            }
        } catch (err) {}
    }

    // ===== ΝΕΟ PROFILE LAYOUT =====

                <div style="padding:20px 16px; text-align:left; border-bottom:1px solid var(--border);">

                    <div style="display:flex; gap:16px; align-items:flex-start;">

                            <span style="font-size:13px; color:var(--muted);">Following</span>

                    <div style="display:flex; gap:10px; margin-top:6px;">
                        ${!isMe ? `

                                   border:1.5px solid var(--border); color:var(--text); cursor:pointer; min-width:52px; display:flex; align-items:center; justify-content:center;">

    async function showUserList(uid, type) {
        const title = type === 'followers' ? 'Followers' : 'Following';
        document.getElementById('listModalTitle').innerText = title;
        document.getElementById('listModalContent').innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px">Φόρτωση...</p>';
        document.getElementById('listModal').style.display = 'flex';
        document.getElementById('overlay').style.display = 'block';

        try {
            const doc = await db.collection('users').doc(uid).get();
            if (!doc.exists) {
                document.getElementById('listModalContent').innerHTML = '<p style="text-align:center;color:var(--muted)">Δεν βρέθηκαν χρήστες</p>';
                return;
            }
            const list = doc.data()[type] || [];
            if (list.length === 0) {
                document.getElementById('listModalContent').innerHTML = '<p style="text-align:center;color:var(--muted);padding:20px">Κανένας ακόμα</p>';
                return;
            }

            const usersData = await Promise.all(list.map(id => db.collection('users').doc(id).get()));

            document.getElementById('listModalContent').innerHTML = usersData.map(d => {
                if (!d.exists) return '';
                const u = d.data();
                return `
                <div class="user-list-item" onclick="closeAll(); openProfile('${d.id}')">
                    <div class="avatar" style="${u.photo ? `background-image:url('${u.photo}')` : ''}"></div>
                    <div>
                        <div style="font-weight:700">${u.name || 'User'}</div>
                        <div style="font-size:13px;color:var(--muted)">${u.bio ? u.bio.substring(0,40) : ''}</div>
                    </div>
                </div>`;
            }).join('') || '<p style="text-align:center;color:var(--muted)">Κανένας ακόμα</p>';

            lucide.createIcons();
        } catch (err) {
            console.error(err);
            document.getElementById('listModalContent').innerHTML = '<p style="color:#dc2626;text-align:center">Σφάλμα φόρτωσης</p>';
        }
    }

    async function toggleFollow(targetUid) {
        if (targetUid === user.uid) return;
        try {
            const myRef = db.collection('users').doc(user.uid);
            const targetRef = db.collection('users').doc(targetUid);
            
            const [myDoc, targetDoc] = await Promise.all([myRef.get(), targetRef.get()]);
            const myData = myDoc.data() || {};
            const targetData = targetDoc.data() || {};

            const isFollowing = (myData.following || []).includes(targetUid);

            if (isFollowing) {
                await myRef.update({ following: firebase.firestore.FieldValue.arrayRemove(targetUid) });
                await targetRef.update({ followers: firebase.firestore.FieldValue.arrayRemove(user.uid) });
            } else {
                await myRef.update({ following: firebase.firestore.FieldValue.arrayUnion(targetUid) });
                await targetRef.update({ followers: firebase.firestore.FieldValue.arrayUnion(user.uid) });
                
                db.collection('notifications').add({
                    userId: targetUid,
                    text: `${myData.name || user.email.split('@')[0]} σε ακολούθησε`,
                    read: false,
                    createdAt: Date.now()
                });
            }
        } catch (err) {
            console.error(err);
            alert("Σφάλμα");
        }
    }

    // ===== Κοινοποίηση Προφίλ =====
    function shareProfile(uid, name) {
        const url = window.location.origin + window.location.pathname + "?user=" + uid;
        
        if (navigator.share) {
            navigator.share({
                title: name + ' | John Ross Social',
                text: 'Δες το προφίλ του/της ' + name + ' στο John Ross Social',
                url: url
            }).catch(() => {
                navigator.clipboard.writeText(url).then(() => alert("Το link του προφίλ αντιγράφηκε!"));
            });
        } else {
            navigator.clipboard.writeText(url).then(() => alert("Το link του προφίλ αντιγράφηκε!"));
        }
    }

        db.collection('users').doc(user.uid).get().then(doc => {
            const u = doc.exists ? doc.data() : {};
            m.innerHTML = `
                <div style="padding:20px">
                    <h2>Ρυθμίσεις</h2><br>
                    <div class="settings-row" onclick="document.getElementById('pInp').click()"><span>Αλλαγή Φωτογραφίας</span><i data-lucide="camera"></i></div>
                    <input type="file" id="pInp" hidden accept="image/*" onchange="handleFile(this, 'profile')">
                    <div style="padding:15px 0">
                        <label>Όνομα Χρήστη</label>
                        <input id="s-name" class="input-box" value="${u.name || ''}">
                        <label style="margin-top:10px; display:block">Bio</label>
                        <textarea id="s-bio" class="input-box" style="height:80px">${u.bio || ''}</textarea>
                        <button onclick="saveProfile()" class="btn-main">Αποθήκευση</button>
                    </div>
                    <div class="settings-row" onclick="toggleThemeNow()"><span>Θέμα: ${theme === 'dark' ? 'Dark' : 'Light'}</span><i data-lucide="moon"></i></div>
                    <div class="settings-row" onclick="toggleLangNow()"><span>Γλώσσα: ${lang === 'el' ? 'Ελληνικά' : 'English'}</span><i data-lucide="languages"></i></div>
                </div>`;
            lucide.createIcons();
        });

    async function saveProfile() {
        const n = document.getElementById('s-name').value.trim();
        const b = document.getElementById('s-bio').value.trim();
        await db.collection('users').doc(user.uid).update({ name: n, bio: b });
        updateAllPosts(n, null);
        alert("Αποθηκεύτηκε!");
    }

    async function updateAllPosts(newName, newPhoto) {
        const posts = await db.collection('posts').where('uid', '==', user.uid).get();
        const batch = db.batch();
        posts.forEach(d => {
            let data = {};
            if (newName) data.name = newName;
            if (newPhoto) data.photo = newPhoto;
            if (Object.keys(data).length) batch.update(d.ref, data);
        });
        await batch.commit();
    }

    function openShare(id, text, img) {
        activePost = { id, text, img };
        document.getElementById('shareModal').style.display = 'flex';
        document.getElementById('overlay').style.display = 'block';
    }

    function copyLink() {
        const url = window.location.origin + window.location.pathname + "?post=" + activePost.id;
        navigator.clipboard.writeText(url).then(() => { alert("Link αντιγράφηκε!"); closeAll(); });
    }

    function doNativeShare() {
        if (navigator.share && activePost) {
            navigator.share({
                title: 'John Ross Social',
                text: activePost.text,
                url: window.location.origin + window.location.pathname + "?post=" + activePost.id
            }).catch(() => copyLink());
        } else copyLink();
        closeAll();
    }

    async function repostNow() {
        try {
            const uDoc = await db.collection('users').doc(user.uid).get();
            const uData = uDoc.exists ? uDoc.data() : {};
            await db.collection('posts').add({
                uid: user.uid,
                name: uData.name || user.email.split('@')[0],
                photo: uData.photo || '',
                text: "Repost: " + (activePost.text || ''),
                images: activePost.img ? [activePost.img] : [],
                createdAt: Date.now(), likes: 0, likedBy: []
            });
            closeAll();
            alert("Reposted!");
        } catch (err) { alert("Σφάλμα"); }
    }

    function openQuoteModal() {
        closeAll();
        const preview = document.getElementById('quotePreview');
        preview.innerHTML = `
            <div class="q-name">Παράθεση ανάρτησης</div>
            <div class="q-text">${format(activePost.text || '')}</div>
            ${activePost.img ? `<img src="${activePost.img}">` : ''}`;
        document.getElementById('quoteText').value = '';
        document.getElementById('quoteModal').style.display = 'flex';
        document.getElementById('overlay').style.display = 'block';
        setTimeout(() => document.getElementById('quoteText').focus(), 200);
    }

    async function submitQuote() {
        const comment = document.getElementById('quoteText').value.trim();
        if (!comment) { alert("Γράψε κάτι!"); return; }

        try {
            const uDoc = await db.collection('users').doc(user.uid).get();
            const uData = uDoc.exists ? uDoc.data() : {};
            const original = await db.collection('posts').doc(activePost.id).get();
            const origData = original.exists ? original.data() : {};

            await db.collection('posts').add({
                uid: user.uid,
                name: uData.name || user.email.split('@')[0],
                photo: uData.photo || '',
                text: comment,
                images: [],
                quote: {
                    id: activePost.id,
                    name: origData.name || 'User',
                    text: activePost.text || '',
                    image: activePost.img || null
                },
                likes: 0, likedBy: [],
                createdAt: Date.now()
            });
            closeAll();
            alert("Η παράθεση δημοσιεύτηκε!");
            if (currentTab !== 'home') showTab('home');
        } catch (err) {
            console.error(err);
            alert("Σφάλμα");
        }
    }

    function toggleThemeNow() {
        theme = theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('jrs_theme', theme);
        location.reload();
    }

    function toggleLangNow() {
        lang = lang === 'el' ? 'en' : 'el';
        localStorage.setItem('jrs_lang', lang);
        location.reload();
    }

    function clearCache() {
        if (confirm("Θέλεις να καθαρίσεις την προσωρινή μνήμη;\n\nΘα διαγραφούν οι ρυθμίσεις θέματος και γλώσσας.")) {
            localStorage.clear();
            sessionStorage.clear();
            if ('caches' in window) {
                caches.keys().then(names => names.forEach(name => caches.delete(name)));
            }
            alert("Η cache καθαρίστηκε!");
            location.reload();
        }
    }

    function listenNotifs() {
        db.collection('notifications')
            .where('userId', '==', user.uid)
            .where('read', '==', false)
            .onSnapshot(s => {
                document.getElementById('notif-badge').style.display = s.empty ? 'none' : 'block';
            });
    }

    function renderNotifs(m) {
        m.innerHTML = '<h2 style="padding:20px">Ειδοποιήσεις</h2><div id="nL"></div>';
        db.collection('notifications')
            .where('userId', '==', user.uid)
            .orderBy('createdAt', 'desc')
            .limit(30)
            .onSnapshot(s => {
                const el = document.getElementById('nL');
                if (!el) return;
                if (s.empty) {
                    el.innerHTML = '<p style="padding:20px;color:var(--muted)">Καμία ειδοποίηση</p>';
                    return;
                }
                el.innerHTML = s.docs.map(d => {
                    const data = d.data();
                    return `<div class="notif-item"><span>${data.text}</span>${!data.read ? '<div class="red-dot" style="position:static"></div>' : ''}</div>`;
                }).join('');
                s.docs.forEach(d => { if (!d.data().read) d.ref.update({ read: true }); });
            });
    }

    function openProfile(uid) {
        historyStack.push(currentTab);
        window.history.pushState({ tab: 'profile' }, "");
        currentTab = 'profile';
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('btn-profile')?.classList.add('active');
        document.getElementById('home-tabs').style.display = 'none';
        renderProfile(document.getElementById('content'), uid);
    }

    function openLB(src) {
        if (!src) return;
        document.getElementById('lb-img').src = src;
        document.getElementById('lightbox').style.display = 'flex';
    }

    function postOp(id, text, postUid) {
        if (user.uid === postUid) {
            const op = confirm("OK = Διαγραφή\nCancel = Επεξεργασία");
            if (op) db.collection('posts').doc(id).delete();
            else {
                const nt = prompt("Νέο κείμενο:", text.replace(/\\n/g, '\n'));
                if (nt !== null) db.collection('posts').doc(id).update({ text: nt });
            }
        } else if (user.email === adminEmail) {
            if (confirm("ADMIN: Διαγραφή ανάρτησης;")) db.collection('posts').doc(id).delete();
        }
    }

    function setFeed(f) {
        feedType = f;
        document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
        document.getElementById('tab-' + f)?.classList.add('active');
        loadFeed('feed');
    }

    function renderSearch(m) {
        m.innerHTML = `
            <div style="padding:16px">
                <input id="searchInp" class="input-box" placeholder="Αναζήτηση #hashtag ή κειμένου..." oninput="doSearch(this.value)">
                <div id="searchResults" style="margin-top:15px"></div>
            </div>`;
    }

    function doSearch(q) {
        const results = document.getElementById('searchResults');
        if (!results) return;
        if (!q || q.trim().length < 2) { results.innerHTML = ''; return; }
        const term = q.toLowerCase().trim().replace(/^#/, '');
        db.collection('posts').orderBy('createdAt', 'desc').limit(60).get().then(snap => {
            const posts = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                .filter(p => 
                    (p.text || '').toLowerCase().includes(term) || 
                    (p.name || '').toLowerCase().includes(term)
                );
            displayPosts(posts, results);
        });
    }

    async function renderAdmin(m) {
        m.innerHTML = `<div style="padding:20px"><h2>Admin Panel</h2><p style="color:var(--muted)">Φόρτωση...</p></div>`;
        try {
            const [postsSnap, usersSnap] = await Promise.all([
                db.collection('posts').get(),
                db.collection('users').get()
            ]);
            const posts = postsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            const totalLikes = posts.reduce((sum, p) => sum + (p.likes || 0), 0);
            const recentPosts = posts.sort((a,b) => b.createdAt - a.createdAt).slice(0, 15);

            m.innerHTML = `
                <div style="padding:20px">
                    <h2 style="margin-bottom:8px">Admin Panel</h2>
                    <p style="color:var(--muted); font-size:14px; margin-bottom:20px">Γεια σου Admin 👋</p>
                    <div class="admin-stats">
                        <div class="stat-card"><b>${posts.length}</b><span>Σύνολο Posts</span></div>
                        <div class="stat-card"><b>${usersSnap.size}</b><span>Χρήστες</span></div>
                        <div class="stat-card"><b>${totalLikes}</b><span>Σύνολο Likes</span></div>
                        <div class="stat-card"><b>${posts.filter(p => p.images?.length).length}</b><span>Posts με φωτό</span></div>
                    </div>
                    <h3 style="margin:25px 0 12px">Πρόσφατες αναρτήσεις</h3>
                    <div id="adminPosts"></div>
                </div>`;

            document.getElementById('adminPosts').innerHTML = recentPosts.map(p => `
                <div style="padding:12px; border:1px solid var(--border); border-radius:12px; margin-bottom:10px; background:var(--card)">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px">
                        <strong>${p.name || 'User'}</strong>
                        <button onclick="adminDeletePost('${p.id}')" style="background:#dc2626;color:white;border:none;padding:5px 10px;border-radius:8px;font-size:12px;cursor:pointer">Διαγραφή</button>
                    </div>
                    <div style="font-size:14px; color:var(--muted); white-space:pre-wrap">${(p.text || '').substring(0, 120)}${(p.text || '').length > 120 ? '...' : ''}</div>
                    <div style="font-size:12px; color:var(--muted); margin-top:6px">${p.likes || 0} likes · ${new Date(p.createdAt).toLocaleString('el-GR')}</div>
                </div>
            `).join('') || '<p style="color:var(--muted)">Καμία ανάρτηση</p>';
        } catch (err) {
            m.innerHTML = `<div style="padding:20px"><h2>Admin Panel</h2><p style="color:#dc2626">Σφάλμα</p></div>`;
        }
    }

    function adminDeletePost(id) {
        if (confirm("Σίγουρα διαγραφή;")) {
            db.collection('posts').doc(id).delete().then(() => {
                alert("Διαγράφηκε");
                renderAdmin(document.getElementById('content'));
            });
        }
    }

    lucide.createIcons();
</script>
