<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>John Ross Social</title>
<meta name="theme-color" content="#000000">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#000;--text:#e7e9ea;--muted:#71767b;--border:#2f3336;--card:#16181c;--accent:#dc2626;--hover:rgba(255,255,255,.05);--blue:#1d9bf0}
body.light{--bg:#fff;--text:#0f1419;--muted:#536471;--border:#eff3f4;--card:#f7f9f9;--accent:#dc2626;--hover:rgba(0,0,0,.03);--blue:#1d9bf0}
*{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none; font-size:17px}
.app-container{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:80px;background:var(--bg);border-left:1px solid var(--border);border-right:1px solid var(--border)}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:-280px;width:280px;height:100vh;background:var(--bg);border-right:1px solid var(--border);z-index:1100;transition:left 0.3s ease;display:flex;flex-direction:column}
.sidebar.show{left:0}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.logo-box{background:var(--accent);color:#fff;padding:8px 14px;border-radius:20px;font-weight:700;font-size:15px}
.sidebar-nav{flex:1;padding:12px;overflow-y:auto}
.sidebar-nav a{display:flex;align-items:center;gap:15px;padding:14px 16px;color:var(--text);text-decoration:none;border-radius:9999px;font-size:18px;font-weight:500;margin-bottom:5px;cursor:pointer}
.sidebar-nav hr{border:none;border-top:1px solid var(--border);margin:15px 0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1050;display:none}
.overlay.show{display:block}

/* HEADER */
.main-header{position:sticky;top:0;background:var(--bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 16px;z-index:100;display:flex;align-items:center;gap:12px}
.menu-btn{background:none;border:none;color:var(--text);cursor:pointer}
.logo-text{font-weight:800;font-size:20px}

/* POSTS */
.post{border-bottom:1px solid var(--border);padding:16px}
.post-header{display:flex;gap:12px;margin-bottom:10px}
.avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#dc2626,#7c2d12);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0}
.post-content{font-size:17px;line-height:1.5;margin:8px 0;white-space:pre-wrap;word-wrap:break-word}
.post-images img{width:100%;max-height:450px;object-fit:cover;border-radius:16px;margin-top:12px;border:1px solid var(--border)}
.post-actions{display:flex;justify-content:space-between;max-width:320px;color:var(--muted);margin-top:15px}
.post-actions span{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.liked{color:var(--accent)}

/* QUOTE/REPOST */
.quoted-box{border:1px solid var(--border);border-radius:16px;padding:12px;margin-top:10px;background:rgba(255,255,255,0.03)}
.q-name{font-weight:700;color:var(--accent);font-size:14px}

/* PHOTO PREVIEW WITH X */
.img-preview{display:flex;gap:10px;margin-top:10px}
.preview-wrapper{position:relative;display:inline-block}
.preview-wrapper img{width:100px;height:100px;border-radius:12px;object-fit:cover;border:2px solid var(--accent)}
.remove-img{position:absolute;top:-8px;right:-8px;background:var(--accent);color:#fff;border:none;border-radius:50%;width:26px;height:26px;cursor:pointer;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,0.5)}

/* SETTINGS APP STYLE */
.settings-group{margin-bottom:20px}
.settings-row{background:var(--card);padding:18px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;cursor:pointer;font-weight:500}
.settings-label{color:var(--muted);font-size:14px;margin:0 0 8px 10px;text-transform:uppercase;letter-spacing:1px}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);display:none;justify-content:space-around;padding:12px 0;max-width:600px;margin:0 auto;z-index:999}
.nav-item{background:none;border:none;color:var(--muted);cursor:pointer}
.nav-item.active{color:var(--text)}

.auth-container{text-align:center;padding:60px 25px}
.auth-container input{width:100%;max-width:360px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:16px;border-radius:14px;margin:10px 0;font-size:16px;outline:none}
.auth-container button{width:100%;max-width:360px;background:var(--accent);color:#fff;border:none;padding:16px;border-radius:14px;font-weight:700;font-size:16px;margin:10px 0}
.admin-badge{background:var(--accent);color:#fff;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800;margin-left:5px}
</style>
</head>
<body class="dark">

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<aside id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <div class="logo-box">John Ross Social</div>
    <button onclick="closeSidebar()" style="background:none;border:none;color:var(--text);font-size:32px">&times;</button>
  </div>
  <nav class="sidebar-nav">
    <a onclick="showTab('home');closeSidebar()"><i data-lucide="home"></i> <span data-t="home">Αρχική</span></a>
    <a onclick="showTab('profile');closeSidebar()"><i data-lucide="user"></i> <span data-t="profile">Προφίλ</span></a>
    <a onclick="showTab('settings');closeSidebar()"><i data-lucide="settings"></i> <span data-t="settings">Ρυθμίσεις</span></a>
    <div id="adminMenu" style="display:none"><hr><a onclick="showTab('admin');closeSidebar()"><i data-lucide="shield"></i> Admin Panel</a></div>
    <hr>
    <a onclick="logout()"><i data-lucide="log-out"></i> <span data-t="logout">Αποσύνδεση</span></a>
  </nav>
</aside>

<main class="app-container">
  <header class="main-header">
    <button class="menu-btn" onclick="openSidebar()"><i data-lucide="menu"></i></button>
    <div class="logo-text">John Ross Social</div>
  </header>
  <div id="main"></div>
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item" id="btn-home" onclick="showTab('home')"><i data-lucide="home"></i></button>
    <button class="nav-item" id="btn-search" onclick="showTab('search')"><i data-lucide="search"></i></button>
    <button class="nav-item" id="btn-notif" onclick="showTab('notif')"><i data-lucide="bell"></i></button>
    <button class="nav-item" id="btn-profile" onclick="showTab('profile')"><i data-lucide="user"></i></button>
  </nav>
</main>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCPIg-aoWUhqOqO5hyHUd66HLcHPyC6e70",
  authDomain: "studio-386569156-384ec.firebaseapp.com",
  projectId: "studio-386569156-384ec",
  storageBucket: "studio-386569156-384ec.firebasestorage.app",
  messagingSenderId: "976658898078",
  appId: "1:976658898078:web:6209be10508924e2116f8f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let user = null;
let currentTab = 'home';
let historyStack = [];
let pendingImages = [];
let lang = localStorage.getItem('jrs_lang') || 'el';
let theme = localStorage.getItem('jrs_theme') || 'dark';

const T = {
  el: { home: "Αρχική", profile: "Προφίλ", settings: "Ρυθμίσεις", logout: "Αποσύνδεση", post: "Δημοσίευση", placeholder: "Τι συμβαίνει;", langName: "Ελληνικά", themeName: "Σκοτεινό" },
  en: { home: "Home", profile: "Profile", settings: "Settings", logout: "Logout", post: "Post", placeholder: "What's happening?", langName: "English", themeName: "Dark" }
};

function t(k) { return T[lang][k] || k; }

// NAVIGATION LOGIC (BACK BUTTON)
function showTab(tabName, fromBack = false) {
  if(!fromBack && currentTab !== tabName) {
    historyStack.push(currentTab);
    history.pushState({tab: tabName}, "");
  }
  currentTab = tabName;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  if(document.getElementById('btn-'+tabName)) document.getElementById('btn-'+tabName).classList.add('active');
  render();
}

window.onpopstate = (e) => {
  if(historyStack.length > 0) {
    showTab(historyStack.pop(), true);
  }
};

function openSidebar(){ document.getElementById('sidebar').classList.add('show'); document.getElementById('overlay').classList.add('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('show'); document.getElementById('overlay').classList.remove('show'); }
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function toggleTheme() {
  theme = theme === 'dark' ? 'light' : 'dark';
  document.body.className = theme;
  localStorage.setItem('jrs_theme', theme);
  render();
}

function toggleLang() {
  lang = lang === 'el' ? 'en' : 'el';
  localStorage.setItem('jrs_lang', lang);
  render();
}

auth.onAuthStateChanged(u => {
  user = u;
  if(u) document.getElementById('adminMenu').style.display = (u.email === 'rossrossg7@gmail.com') ? 'block' : 'none';
  document.body.className = theme;
  render();
});

function login(){
  const e=document.getElementById('le').value, p=document.getElementById('lp').value;
  auth.signInWithEmailAndPassword(e,p).catch(err=>alert("Σφάλμα"));
}
function register(){
  const e=document.getElementById('le').value, p=document.getElementById('lp').value;
  auth.createUserWithEmailAndPassword(e,p).then(cred => {
    db.collection('users').doc(cred.user.uid).set({name:e.split('@')[0], bio:'', photo:'', followers:[], following:[], createdAt:Date.now()});
  }).catch(err=>alert("Σφάλμα"));
}
function logout(){ auth.signOut(); location.reload(); }

async function handleImage(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 800;
      let w = img.width, h = img.height;
      if(w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } }
      else { if(h > MAX) { w *= MAX/h; h = MAX; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      pendingImages = [canvas.toDataURL('image/jpeg', 0.7)];
      renderPreview();
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
}
function renderPreview() {
  const box = document.getElementById('imgPreview');
  if(!box) return;
  box.innerHTML = pendingImages.map(img => `
    <div class="preview-wrapper">
      <img src="${img}">
      <button class="remove-img" onclick="removeImage()">×</button>
    </div>`).join('');
}
function removeImage() { pendingImages = []; renderPreview(); }

function render(){
  const m = document.getElementById('main');
  const nav = document.getElementById('bottomNav');
  if(!user){
    nav.style.display = 'none';
    m.innerHTML = `<div class="auth-container"><h1>John Ross Social</h1><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Κωδικός"><button onclick="login()">Σύνδεση</button><button onclick="register()" style="background:#222">Εγγραφή</button></div>`;
    lucide.createIcons(); return;
  }
  nav.style.display = 'flex';
  if(currentTab === 'home') renderHome(m);
  else if(currentTab === 'profile') renderProfile(m, user.uid);
  else if(currentTab === 'settings') renderSettings(m);
  else if(currentTab === 'search') m.innerHTML = '<div style="padding:20px"><h2>Search</h2></div>';
  else if(currentTab === 'notif') m.innerHTML = '<div style="padding:20px"><h2>Notifications</h2></div>';
  else if(currentTab === 'admin') m.innerHTML = '<div style="padding:20px"><h2>Admin Panel</h2></div>';
  lucide.createIcons();
}

function renderHome(m){
  m.innerHTML = `
    <div style="padding:16px; border-bottom:1px solid var(--border)">
      <textarea id="postText" placeholder="${t('placeholder')}" style="width:100%; background:none; border:none; color:var(--text); font-size:18px; outline:none; resize:none; min-height:80px; font-family:inherit"></textarea>
      <div id="imgPreview" class="img-preview"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px">
        <button onclick="document.getElementById('fileInp').click()" style="background:none;border:none;color:var(--blue);cursor:pointer"><i data-lucide="image"></i></button>
        <input type="file" id="fileInp" hidden onchange="handleImage(event)">
        <button class="btn-full" style="width:auto; padding:10px 25px; border-radius:30px" onclick="createPost()">${t('post')}</button>
      </div>
    </div>
    <div id="feed"></div>`;
  
  db.collection('posts').orderBy('createdAt', 'desc').limit(25).onSnapshot(snap => {
    const feed = document.getElementById('feed');
    if(!feed) return;
    feed.innerHTML = snap.docs.map(d => {
      const p = d.data();
      return `<div class="post">
        <div class="post-header">
          <div class="avatar" style="${p.photo?`background-image:url('${p.photo}')`:''}">👤</div>
          <div class="post-info"><b>${esc(p.name)}</b> <div class="handle">@${esc(p.name.toLowerCase())}</div></div>
        </div>
        <div class="post-content">${esc(p.text)}</div>
        ${p.images ? p.images.map(img => `<img src="${img}" style="width:100%;border-radius:16px;margin-top:10px">`).join('') : ''}
      </div>`;
    }).join('');
    lucide.createIcons();
  });
}

async function createPost(){
  const txt = document.getElementById('postText').value;
  if(!txt.trim() && pendingImages.length === 0) return;
  const uDoc = await db.collection('users').doc(user.uid).get();
  await db.collection('posts').add({
    uid: user.uid, name: uDoc.data().name || user.email.split('@')[0],
    photo: uDoc.data().photo || '', text: txt, images: pendingImages,
    likes: 0, likedBy: [], comments: [], createdAt: Date.now()
  });
  pendingImages = []; document.getElementById('postText').value = ''; renderPreview();
}

function renderSettings(m){
  m.innerHTML = `<div style="padding:20px">
    <h2 style="margin-bottom:25px; font-size:24px">${t('settings')}</h2>
    
    <div class="settings-group">
      <p class="settings-label">Εμφάνιση & Γλώσσα</p>
      <div class="settings-row" onclick="toggleLang()">
        <span>Γλώσσα / Language</span>
        <span style="color:var(--accent)">${lang === 'el' ? 'Ελληνικά' : 'English'}</span>
      </div>
      <div class="settings-row" onclick="toggleTheme()">
        <span>Θέμα / Theme</span>
        <span style="color:var(--accent)">${theme === 'dark' ? 'Dark' : 'Light'}</span>
      </div>
    </div>

    <div class="settings-group">
      <p class="settings-label">Πληροφορίες</p>
      <div class="settings-row">
        <span>Έκδοση Εφαρμογής</span>
        <span style="color:var(--muted)">2.3.0</span>
      </div>
    </div>
  </div>`;
  lucide.createIcons();
}

function renderProfile(m, uid){
  db.collection('users').doc(uid).get().then(doc => {
    const u = doc.data() || {};
    m.innerHTML = `<div style="padding:25px; text-align:center">
      <div class="avatar" style="width:90px;height:90px;margin:0 auto;font-size:30px;${u.photo?`background-image:url('${u.photo}')`:''}">👤</div>
      <h2 style="margin-top:15px">${esc(u.name)}</h2>
      <p style="color:var(--muted)">${esc(u.bio || 'No bio')}</p>
    </div>`;
  });
}

lucide.createIcons();
</script>
</body>
</html>
