
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>John Ross Social</title>
<meta name="theme-color" content="#000000">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#000;color:#fff;min-height:100vh;overflow-x:hidden}
.app-container{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:70px;background:#000;position:relative}

/* Header */
.main-header{position:sticky;top:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);border-bottom:1px solid #333;padding:10px 16px;z-index:100;display:flex;align-items:center;justify-content:space-between}
.menu-btn{background:none;border:none;color:#fff;cursor:pointer;padding:6px}
.menu-btn i{width:24px;height:24px}
.logo-text{font-weight:800;font-size:18px;letter-spacing:-0.5px}
.lb{background:#333;color:#fff;border:none;padding:4px 10px;border-radius:12px;font-size:11px;cursor:pointer}

/* Tabs */
.top-tabs{display:flex;border-bottom:1px solid #333}
.tab-btn{flex:1;padding:14px;background:none;border:none;color:#999;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;font-weight:600}
.tab-btn.active{color:#fff;border-bottom-color:#dc2626}

/* Post */
.post{border-bottom:1px solid #333;padding:14px 16px}
.post-header{display:flex;gap:10px;margin-bottom:10px;align-items:center}
.avatar{width:40px;height:40px;border-radius:20px;background:#222;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;background-size:cover;background-position:center;color:#fff}
.avatar-lg{width:90px;height:90px;font-size:40px;border-radius:45px;margin:0 auto}
.post-info{flex:1;min-width:0}
.username{font-weight:700;font-size:15px;display:flex;align-items:center;gap:5px}
.handle{color:#999;font-size:13px;margin-top:1px}
.post-content{font-size:16px;line-height:1.5;margin-bottom:10px;word-break:break-word}
.hash{color:#3b82f6}

/* Grid */
.post-images-grid {display: grid; gap: 6px; margin-top: 10px; border-radius: 12px; overflow: hidden;}
.post-images-grid.count-1 { grid-template-columns: 1fr; }
.post-images-grid.count-2 { grid-template-columns: 1fr 1fr; }
.post-image-item { width: 100%; height: 250px; object-fit: cover; background: #1a1a1a; }

/* Actions */
.post-actions{display:flex;gap:30px;color:#999;font-size:13px;margin-top:12px;align-items:center}
.post-actions span{display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 0}
.post-actions i{width:18px;height:18px}
.like-btn.liked{color:#dc2626}
.like-btn.liked svg{fill:#dc2626}

/* Comments */
.comments-section{margin-top:12px;padding-top:12px;border-top:1px solid #222;display:none}
.comments-section.show{display:block}
.comment{padding:8px 0;display:flex;gap:8px;align-items:flex-start}
.comment-avatar{width:28px;height:28px;border-radius:14px;background:#333;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.comment-content{flex:1}
.comment-name{font-weight:700;font-size:13px}
.comment-text{font-size:14px;margin-top:1px}
.comment-input-row{display:flex;gap:8px;margin-top:10px;align-items:center}
.comment-input-row input{flex:1;background:#1a1a1a;border:1px solid #333;color:#fff;padding:10px 12px;border-radius:20px;font-size:14px}
.comment-input-row button{background:#dc2626;border:none;color:#fff;padding:8px 16px;border-radius:18px;cursor:pointer;font-weight:600}

/* Post menu */
.post-menu-container{position:relative}
.menu-btn-icon{background:none;border:none;color:#999;cursor:pointer;padding:4px}
.post-menu{position:absolute;right:0;top:28px;background:#1a1a1a;border:1px solid #333;border-radius:12px;min-width:140px;z-index:50;display:none;box-shadow:0 5px 15px rgba(0,0,0,0.5)}
.post-menu.show{display:block}
.post-menu button{width:100%;background:none;border:none;color:#fff;padding:12px 16px;text-align:left;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px}
.post-menu button:hover{background:#2a2a2a}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.95);backdrop-filter:blur(10px);border-top:1px solid #333;display:flex;justify-content:space-around;padding:10px 0;max-width:600px;margin:0 auto;z-index:100}
.nav-item{background:none;border:none;color:#999;padding:8px 12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nav-item.active{color:#dc2626}
.nav-item i{width:26px;height:26px}

/* Auth */
.auth-container{text-align:center;padding:80px 24px}
.auth-icon{font-size:64px;margin-bottom:24px}
.auth-container h2{margin-bottom:10px;font-size:32px;font-weight:800}
.auth-container .slogan{color:#999;margin-bottom:40px;font-size:16px}
.auth-container input{width:100%;background:#1a1a1a;border:1px solid #333;color:#fff;padding:16px 18px;border-radius:12px;margin:8px 0;font-size:16px;max-width:400px}
.auth-container button{width:100%;max-width:400px;background:#dc2626;color:#fff;border:none;padding:16px;border-radius:12px;font-weight:700;cursor:pointer;font-size:16px;margin:10px 0}
.auth-container .btn-o{background:transparent;border:1px solid #444;color:#fff}
.auth-container .btn-o i{width:20px;height:20px;vertical-align:middle;margin-right:8px}

/* Profile */
.profile{padding:30px 16px}
.profile-header{text-align:center;margin-bottom:30px}
.profile-stats{display:flex;justify-content:center;gap:40px;margin:20px 0;color:#999;font-size:14px}
.profile-stats b{color:#fff;font-size:22px;display:block}
.profile-form{max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.profile-form input,.profile-form textarea{width:100%;background:#1a1a1a;border:1px solid #333;color:#fff;padding:14px;border-radius:12px;font-size:15px}
.profile-form textarea{min-height:80px;resize:vertical}
.profile-form button{padding:14px;border-radius:12px;border:none;font-weight:700;cursor:pointer}

/* Generics */
.btn-full{width:100%;background:#dc2626;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:700;cursor:pointer;margin-top:15px}
.btn-outline{background:transparent;border:1px solid #444;color:#fff;width:100%;padding:12px;border-radius:12px;cursor:pointer;margin-top:10px;font-weight:700}
.empty-state{padding:60px 20px;text-align:center;color:#777;font-size:16px}
.admin-badge{background:#dc2626;color:#fff;padding:2px 6px;border-radius:8px;font-size:10px;vertical-align:middle}
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);color:#fff;display:flex;align-items:center;justify-content:center;z-index:200;display:none}
.loading-overlay.show{display:flex}
</style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">Κάποια στιγμή...</div>

<main class="app-container">
  <header class="main-header">
    <div class="logo-text">John Ross Social</div>
    <button class="lb" onclick="toggleLang()">EL</button>
  </header>

  <div id="main"></div>

  <nav class="bottom-nav" id="bottomNav" style="display:none">
    <button class="nav-item active" data-tab="home" onclick="showTab('home')"><i data-lucide="home"></i></button>
    <button class="nav-item" data-tab="search" onclick="showTab('search')"><i data-lucide="search"></i></button>
    <button class="nav-item" data-tab="notif" onclick="showTab('bell')"><i data-lucide="bell"></i></button>
    <button class="nav-item" data-tab="profile" onclick="showTab('user')"><i data-lucide="user"></i></button>
  </nav>
</main>
