<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Ross Social</title>
<meta property="og:title" content="John Ross Social">
<meta property="og:description" content="Your space. Your voice. Free expression.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://johnross7.github.io/John-Ross-Social-/">
<meta name="theme-color" content="#000000">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#000;color:#e7e9ea;min-height:100vh}
.app-container{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:70px;background:#000;position:relative;border-left:1px solid #2f3336;border-right:1px solid #2f3336}

/* Sidebar */
.sidebar{position:fixed;top:0;left:-280px;width:280px;height:100vh;background:#000;border-right:1px solid #2f3336;z-index:1000;transition:left .3s;display:flex;flex-direction:column}
.sidebar.show{left:0}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid #2f3336}
.logo-box{background:#dc2626;color:#fff;padding:8px 14px;border-radius:20px;font-weight:700;font-size:14px}
#close-sidebar{background:none;border:none;color:#e7e9ea;font-size:28px;cursor:pointer;padding:0 8px}
.sidebar-nav{flex:1;padding:12px;overflow-y:auto}
.sidebar-nav a{display:flex;align-items:center;gap:14px;padding:14px 16px;color:#e7e9ea;text-decoration:none;border-radius:9999px;font-size:18px;font-weight:500;cursor:pointer;margin-bottom:4px}
.sidebar-nav a:hover,.sidebar-nav a.active{background:#181818}
.sidebar-nav a i{width:24px;height:24px}
.sidebar-nav hr{border:none;border-top:1px solid #2f3336;margin:12px 0}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:999;display:none}
.overlay.show{display:block}

/* Header */
.main-header{position:sticky;top:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);border-bottom:1px solid #2f3336;padding:12px 16px;z-index:100;display:flex;align-items:center;justify-content:space-between}
.menu-btn{background:none;border:none;color:#e7e9ea;cursor:pointer;padding:6px}
.menu-btn i{width:24px;height:24px}
.logo-text{font-weight:700;font-size:18px}
.lb{background:#2f3336;color:#e7e9ea;border:none;padding:5px 12px;border-radius:16px;font-size:12px;cursor:pointer;font-weight:600}

/* Tabs */
.top-tabs{display:flex;border-bottom:1px solid #2f3336}
.tab-btn{flex:1;padding:16px;background:none;border:none;color:#71767b;font-size:15px;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;font-weight:500}
.tab-btn.active{color:#e7e9ea;border-bottom-color:#dc2626;font-weight:700}

/* Post */
.post{border-bottom:1px solid #2f3336;padding:14px 16px}
.post:hover{background:rgba(255,255,255,.03)}
.post-header{display:flex;gap:12px;margin-bottom:6px;align-items:flex-start}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#dc2626,#7c2d12);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden;background-size:cover;background-position:center;color:#fff}
.avatar-lg{width:90px;height:90px;font-size:40px;border-radius:50%}
.post-info{flex:1;min-width:0}
.username{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.handle{color:#71767b;font-size:14px}
.post-content{font-size:15px;line-height:1.5;margin:4px 0 10px;word-wrap:break-word;white-space:pre-wrap}
.hash{color:#1d9bf0;cursor:pointer}
.hash:hover{text-decoration:underline}
.post-actions{display:flex;gap:40px;color:#71767b;font-size:13px;margin-top:8px}
.post-actions span{display:flex;align-items:center;gap:6px;cursor:pointer;transition:color .2s}
.post-actions span:hover{color:#1d9bf0}
.post-actions i{width:18px;height:18px}
.like-btn.liked,.like-btn.liked svg{color:#f91880}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
.pop{animation:pop .3s}

/* Comments */
.comments-section{margin-top:12px;padding-top:10px;border-top:1px solid #2f3336}
.comment{padding:10px 0;display:flex;gap:10px}
.comment-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#dc2626,#7c2d12);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.comment-info{flex:1}
.comment-name{font-weight:700;font-size:13px}
.comment-text{font-size:14px;margin-top:2px;color:#e7e9ea}
.comment-input-row{display:flex;gap:8px;margin-top:12px}
.comment-input-row input{flex:1;background:#16181c;border:1px solid #2f3336;color:#e7e9ea;padding:10px 14px;border-radius:9999px;font-size:14px;outline:none}
.comment-input-row input:focus{border-color:#1d9bf0}

/* Post menu */
.post-menu-container{position:relative;margin-left:auto}
.menu-btn-icon{background:none;border:none;color:#71767b;cursor:pointer;padding:4px}
.menu-btn-icon i{width:18px;height:18px}
.post-menu{position:absolute;right:0;top:28px;background:#16181c;border:1px solid #2f3336;border-radius:12px;min-width:140px;z-index:50;display:none;box-shadow:0 0 15px rgba(255,255,255,.1)}
.post-menu.show{display:block}
.post-menu button{width:100%;background:none;border:none;color:#e7e9ea;padding:12px 16px;text-align:left;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px}
.post-menu button:hover{background:#dc2626}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);border-top:1px solid #2f3336;display:flex;justify-content:space-around;padding:10px 0;max-width:600px;margin:0 auto;z-index:100}
.nav-item{background:none;border:none;color:#71767b;padding:8px 18px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.nav-item.active{color:#dc2626}
.nav-item i{width:26px;height:26px}
.nav-badge{position:absolute;top:6px;right:14px;width:9px;height:9px;background:#dc2626;border-radius:50%;display:none}

/* Auth */
.auth-container{text-align:center;padding:50px 24px}
.auth-container h2{margin-bottom:8px;font-size:28px;font-weight:800}
.auth-container .slogan{color:#71767b;margin-bottom:32px;font-size:16px}
.auth-container input{width:100%;background:#16181c;border:1px solid #2f3336;color:#e7e9ea;padding:14px 18px;border-radius:9999px;margin:8px 0;font-size:15px;max-width:340px;outline:none}
.auth-container input:focus{border-color:#1d9bf0}
.auth-container button{width:100%;max-width:340px;background:#dc2626;color:#fff;border:none;padding:14px;border-radius:9999px;font-weight:700;cursor:pointer;font-size:15px;margin:8px 0}
.auth-container .btn-o{background:transparent;border:1px solid #536471;color:#e7e9ea}
.auth-container .btn-o:hover{background:rgba(255,255,255,.08)}

/* Profile */
.profile{padding:20px}
.profile-header{text-align:center;margin-bottom:24px}
.profile-stats{display:flex;justify-content:center;gap:36px;margin:18px 0;color:#71767b;font-size:14px}
.profile-stats b{color:#e7e9ea;font-size:20px;display:block}
.profile-form input,.profile-form textarea{width:100%;background:#16181c;border:1px solid #2f3336;color:#e7e9ea;padding:12px 16px;border-radius:16px;margin:8px 0;font-size:15px;font-family:inherit;outline:none}
.profile-form textarea{border-radius:12px;min-height:80px;resize:vertical}
.profile-form button{width:100%;background:#dc2626;color:#fff;border:none;padding:12px;border-radius:9999px;font-weight:700;cursor:pointer;margin-top:12px}

/* Buttons */
.btn-full{width:100%;background:#dc2626;color:#fff;border:none;padding:10px 20px;border-radius:9999px;font-weight:700;cursor:pointer;font-size:14px}
.btn-outline{background:transparent;border:1px solid #536471;color:#e7e9ea;width:100%;padding:10px;border-radius:9999px;cursor:pointer;margin-top:8px}
.btn-follow{background:#e7e9ea;color:#0f1419;border:none;padding:6px 18px;border-radius:9999px;font-weight:700;cursor:pointer;font-size:13px}
.btn-follow.following{background:transparent;border:1px solid #536471;color:#e7e9ea}

.center{text-align:center;padding:40px 20px;color:#71767b}
.empty-state{padding:60px 20px;text-align:center;color:#71767b;font-size:15px}
.admin-badge{background:#dc2626;color:#fff;padding:2px 7px;border-radius:8px;font-size:11px;vertical-align:middle;font-weight:600}
.notif-item{padding:14px 16px;border-bottom:1px solid #2f3336;display:flex;align-items:center;justify-content:space-between;gap:12px}
.notif-item:hover{background:rgba(255,255,255,.03)}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<aside id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <div class="logo-box">John Ross Social</div>
    <button id="close-sidebar" onclick="closeSidebar()">&times;</button>
  </div>
  <nav class="sidebar-nav" id="sideNav">
    <a onclick="goHome();closeSidebar()" class="active"><i data-lucide="home"></i> Home</a>
    <a onclick="goSearch();closeSidebar()"><i data-lucide="search"></i> Search</a>
    <a onclick="goNotif();closeSidebar()"><i data-lucide="bell"></i> Notifications</a>
    <a onclick="goProfile();closeSidebar()"><i data-lucide="user"></i> Profile</a>
    <a onclick="aiAssistant();closeSidebar()"><i data-lucide="bot"></i> AI Assistant</a>
    <a onclick="settings();closeSidebar()"><i data-lucide="settings"></i> Settings</a>
    <hr>
    <a onclick="logout();closeSidebar()"><i data-lucide="log-out"></i> Logout</a>
  </nav>
</aside>

<main class="app-container">
  <header class="main-header">
    <button class="menu-btn" onclick="openSidebar()"><i data-lucide="menu"></i></button>
    <div class="logo-text">John Ross Social</div>
    <button class="lb" onclick="toggleLang()">EL</button>
  </header>

  <div id="main"></div>

  <nav class="bottom-nav" id="bottomNav" style="display:none">
    <button class="nav-item active" data-tab="home" onclick="showTab('home')"><i data-lucide="home"></i></button>
    <button class="nav-item" data-tab="search" onclick="showTab('search')"><i data-lucide="search"></i></button>
    <button class="nav-item" data-tab="notif" onclick="showTab('notif')">
      <i data-lucide="bell"></i>
      <span class="nav-badge" id="notifBadge"></span>
    </button>
    <button class="nav-item" data-tab="profile" onclick="showTab('profile')"><i data-lucide="user"></i></button>
  </nav>
</main>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCPIg-aoWUhqOqO5hyHUd66HLcHPyC6e70",
  authDomain: "studio-386569156-384ec.firebaseapp.com",
  projectId: "studio-386569156-384ec",
  storageBucket: "studio-386569156-384ec.firebasestorage.app",
  messagingSenderId: "976658898078",
  appId: "1:976658898078:web:6209be10508924e2116f8f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let user = null, tab = 'home', feedType = 'foryou', lang = 'en';

const adminEmails = ['rossrossg7@gmail.com'];

const T = {
  en: {
    forYou: 'For You', following: 'Following', login: 'Login', register: 'Register',
    email: 'Email', password: 'Password', google: 'Google', logout: 'Logout',
    post: 'Post', placeholder: "What's happening?", like: 'Like', comment: 'Comment',
    noPosts: 'No posts yet', noNotifs: 'No notifications', search: 'Search',
    profile: 'Profile', bio: 'Bio', save: 'Save', followers: 'followers',
    following2: 'following', delete: 'Delete', follow: 'Follow', unfollow: 'Following',
    changePic: 'Change photo', slogan: 'Your space. Your voice.', reply: 'Reply',
    send: 'Send', aiTitle: 'AI Assistant', aiSubtitle: 'Ask me anything about the app',
    aiPlaceholder: 'Type your question...', settings: 'Settings', language: 'Language',
    comingSoon: 'Coming soon', noFollowing: "You're not following anyone yet"
  },
  el: {
    forYou: 'Για εσένα', following: 'Ακολουθείς', login: 'Σύνδεση', register: 'Εγγραφή',
    email: 'Email', password: 'Κωδικός', google: 'Google', logout: 'Αποσύνδεση',
    post: 'Δημοσίευση', placeholder: 'Τι σκέφτεσαι;', like: 'Μου αρέσει', comment: 'Σχόλιο',
    noPosts: 'Δεν υπάρχουν δημοσιεύσεις', noNotifs: 'Δεν υπάρχουν ειδοποιήσεις', search: 'Αναζήτηση',
    profile: 'Προφίλ', bio: 'Βιογραφικό', save: 'Αποθήκευση', followers: 'ακόλουθοι',
    following2: 'ακολουθείς', delete: 'Διαγραφή', follow: 'Ακολούθηση', unfollow: 'Ακολουθείς',
    changePic: 'Αλλαγή φωτογραφίας', slogan: 'Ο χώρος σου. Η φωνή σου.', reply: 'Απάντηση',
    send: 'Αποστολή', aiTitle: 'Βοηθός AI', aiSubtitle: 'Ρώτα με οτιδήποτε για την εφαρμογή',
    aiPlaceholder: 'Γράψε την ερώτησή σου...', settings: 'Ρυθμίσεις', language: 'Γλώσσα',
    comingSoon: 'Έρχεται σύντομα', noFollowing: 'Δεν ακολουθείς κανέναν ακόμα'
  }
};

function t(k){ return T[lang][k] || k; }
function isAdmin(email){ return adminEmails.includes(email); }
function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toggleLang(){
  lang = lang === 'en' ? 'el' : 'en';
  document.querySelector('.lb').textContent = lang === 'en' ? 'EL' : 'EN';
  render();
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function openSidebar(){ document.getElementById('sidebar').classList.add('show'); document.getElementById('overlay').classList.add('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('show'); document.getElementById('overlay').classList.remove('show'); }
function goHome(){ showTab('home'); }
function goSearch(){ showTab('search'); }
function goNotif(){ showTab('notif'); }
function goProfile(){ showTab('profile'); }
function aiAssistant(){ alert(t('aiTitle') + ' - ' + t('comingSoon')); }
function settings(){ showSettings(); }

function showTab(name){
  tab = name;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.sidebar-nav a').forEach((a, i) => {
    a.classList.remove('active');
    if ((name === 'home' && i === 0) || (name === 'search' && i === 1) || (name === 'notif' && i === 2) || (name === 'profile' && i === 3)) a.classList.add('active');
  });
  render();
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function setFeedType(type){
  feedType = type;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.feed === type));
  renderHome(document.getElementById('main'));
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

auth.onAuthStateChanged(u => {
  user = u;
  render();
  if (u) listenUnreadNotifs(u.uid);
  if (typeof lucide !== 'undefined') lucide.createIcons();
});

function login(){
  const e = document.getElementById('le').value;
  const p = document.getElementById('lp').value;
  auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
}

function register(){
  const e = document.getElementById('le').value;
  const p = document.getElementById('lp').value;
  if (!e || !p) return alert(lang === 'el' ? 'Συμπλήρωσε email και κωδικό' : 'Fill email and password');
  auth.createUserWithEmailAndPassword(e, p).then(cred => {
    return db.collection('users').doc(cred.user.uid).set({
      email: e, name: e.split('@')[0], bio: '', photo: '',
      followers: [], following: [], likedPosts: [], createdAt: Date.now()
    });
  }).catch(err => alert(err.message));
}

function googleLogin(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).then(cred => {
    saveUserToDb(cred.user);
  }).catch(err => {
    if (err.code === 'auth/popup-blocked' || err.code === 'auth/cancelled-popup-request') {
      auth.signInWithRedirect(provider);
    } else {
      alert(err.message);
    }
  });
}

function saveUserToDb(u){
  db.collection('users').doc(u.uid).set({
    email: u.email,
    name: u.displayName || u.email.split('@')[0],
    bio: '', photo: u.photoURL || '',
    followers: [], following: [], likedPosts: [], createdAt: Date.now()
  }, { merge: true });
}

function logout(){ auth.signOut(); }

function postContent(){
  const ta = document.getElementById('postText');
  if (!ta.value.trim()) return;
  db.collection('users').doc(user.uid).get().then(doc => {
    const u = doc.data() || {};
    db.collection('posts').add({
      uid: user.uid,
      name: u.name || user.displayName || user.email.split('@')[0],
      email: user.email,
      photo: u.photo || user.photoURL || '',
      text: ta.value,
      likes: 0,
      likedBy: [],
      comments: [],
      createdAt: Date.now()
    });
    ta.value = '';
  });
}

function likePost(id){
  const ref = db.collection('posts').doc(id);
  ref.get().then(doc => {
    const postData = doc.data();
    const likedBy = postData.likedBy || [];
    if (likedBy.includes(user.uid)) {
      ref.update({
        likes: firebase.firestore.FieldValue.increment(-1),
        likedBy: firebase.firestore.FieldValue.arrayRemove(user.uid)
      });
    } else {
      ref.update({
        likes: firebase.firestore.FieldValue.increment(1),
        likedBy: firebase.firestore.FieldValue.arrayUnion(user.uid)
      });
      if (postData.uid !== user.uid) {
        db.collection('notifications').add({
          userId: postData.uid,
          senderId: user.uid,
          text: (user.displayName || user.email.split('@')[0]) + (lang === 'el' ? ' έκανε like στη δημοσίευσή σου.' : ' liked your post.'),
          read: false,
          timestamp: Date.now()
        });
      }
    }
  });
}

function addComment(postId){
  const inp = document.getElementById('c_' + postId);
  if (!inp.value.trim()) return;
  db.collection('posts').doc(postId).get().then(doc => {
    const postData = doc.data();
    db.collection('posts').doc(postId).update({
      comments: firebase.firestore.FieldValue.arrayUnion({
        name: user.displayName || user.email.split('@')[0],
        email: user.email,
        text: inp.value,
        time: Date.now()
      })
    });
    if (postData.uid !== user.uid) {
      db.collection('notifications').add({
        userId: postData.uid,
        senderId: user.uid,
        text: (user.displayName || user.email.split('@')[0]) + (lang === 'el' ? ' σχολίασε τη δημοσίευσή σου.' : ' commented on your post.'),
        read: false,
        timestamp: Date.now()
      });
    }
  });
  inp.value = '';
}

function deletePost(id){
  if (!confirm(t('delete') + '?')) return;
  db.collection('posts').doc(id).delete();
}

function togglePostMenu(id){
  event.stopPropagation();
  const m = document.getElementById('pm_' + id);
  if (m) m.classList.toggle('show');
}

function toggleFollow(targetUid){
  const myRef = db.collection('users').doc(user.uid);
  const hisRef = db.collection('users').doc(targetUid);

  Promise.all([myRef.get(), hisRef.get()]).then(([myDoc, hisDoc]) => {
    const myData = myDoc.data() || {};
    const following = myData.following || [];

    if (following.includes(targetUid)) {
      myRef.update({ following: firebase.firestore.FieldValue.arrayRemove(targetUid) });
      hisRef.update({ followers: firebase.firestore.FieldValue.arrayRemove(user.uid) });
    } else {
      myRef.update({ following: firebase.firestore.FieldValue.arrayUnion(targetUid) });
      hisRef.update({ followers: firebase.firestore.FieldValue.arrayUnion(user.uid) });
      db.collection('notifications').add({
        userId: targetUid,
        senderId: user.uid,
        text: (myData.name || user.email.split('@')[0]) + (lang === 'el' ? ' άρχισε να σε ακολουθεί.' : ' started following you.'),
        read: false,
        timestamp: Date.now()
      });
    }
  }).then(() => render());
}

function renderTextWithHashtags(text){
  return esc(text).replace(/#(\w+)/g, '<span class="hash" onclick="searchHashtag(\'$1\')">#$1</span>');
}

function searchHashtag(tag){
  showTab('search');
  setTimeout(() => {
    const inp = document.querySelector('#main input');
    if (inp) { inp.value = '#' + tag; inp.dispatchEvent(new Event('input')); }
  }, 100);
}

function render(){
  const m = document.getElementById('main');
  if (!user) {
    document.getElementById('bottomNav').style.display = 'none';
    m.innerHTML = `
      <div class="auth-container">
        <div style="font-size:64px;margin-bottom:16px">👋</div>
        <h2>John Ross Social</h2>
        <p class="slogan">${t('slogan')}</p>
        <div style="max-width:340px;margin:0 auto">
          <input id="le" placeholder="${t('email')}" type="email">
          <input id="lp" placeholder="${t('password')}" type="password">
          <button onclick="login()">${t('login')}</button>
          <button class="btn-o" onclick="register()">${t('register')}</button>
          <button class="btn-o" onclick="googleLogin()"><i data-lucide="chrome" style="width:16px;height:16px;vertical-align:middle"></i> ${t('google')}</button>
        </div>
      </div>`;
    if (typeof lucide !== 'undefined') lucide.createIcons();
    return;
  }
  document.getElementById('bottomNav').style.display = 'flex';
  if (tab === 'home') renderHome(m);
  else if (tab === 'search') renderSearch(m);
  else if (tab === 'notif') renderNotifs(m);
  else if (tab === 'profile') renderProfile(m);
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function renderHome(m){
  m.innerHTML = `
    <div style="padding:14px 16px;border-bottom:1px solid #2f3336">
      <textarea id="postText" placeholder="${t('placeholder')}" style="width:100%;background:transparent;border:none;color:#e7e9ea;font-size:17px;resize:none;min-height:70px;font-family:inherit;outline:none"></textarea>
      <div style="display:flex;justify-content:flex-end;margin-top:8px">
        <button class="btn-full" style="width:auto;padding:8px 22px;margin:0" onclick="postContent()">${t('post')}</button>
      </div>
    </div>
    <div class="top-tabs">
      <button class="tab-btn ${feedType === 'foryou' ? 'active' : ''}" data-feed="foryou" onclick="setFeedType('foryou')">${t('forYou')}</button>
      <button class="tab-btn ${feedType === 'following' ? 'active' : ''}" data-feed="following" onclick="setFeedType('following')">${t('following')}</button>
    </div>
    <div id="feed"></div>`;
  loadFeed();
}

function loadFeed(){
  const f = document.getElementById('feed');
  if (!f) return;
  if (feedType === 'following') {
    db.collection('users').doc(user.uid).get().then(doc => {
      const following = (doc.data() || {}).following || [];
      if (following.length === 0) {
        f.innerHTML = '<div class="empty-state">' + t('noFollowing') + '</div>';
        return;
      }
      db.collection('posts').where('uid', 'in', following.slice(0, 10)).orderBy('createdAt', 'desc').limit(50).onSnapshot(snap => renderPosts(snap, f));
    });
  } else {
    db.collection('posts').orderBy('createdAt', 'desc').limit(50).onSnapshot(snap => renderPosts(snap, f));
  }
}

function renderPosts(snap, f){
  if (!f) return;
  if (snap.empty) {
    f.innerHTML = '<div class="empty-state">' + t('noPosts') + '</div>';
    return;
  }
  f.innerHTML = snap.docs.map(d => {
    const p = d.data();
    const postId = d.id;
    const isPostAdmin = isAdmin(p.email);
    const adminBadge = isPostAdmin ? '<span class="admin-badge">👑 Admin</span>' : '';
    const canDelete = (user.uid === p.uid) || isAdmin(user.email);
    const isLiked = (p.likedBy || []).includes(user.uid);
    const heartClass = isLiked ? 'liked' : '';
    const comments = (p.comments || []).map(c => `
      <div class="comment">
        <div class="comment-avatar">👤</div>
        <div class="comment-info">
          <div class="comment-name">${esc(c.name)}</div>
          <div class="comment-text">${esc(c.text)}</div>
        </div>
      </div>`).join('');
    const avatar = p.photo
      ? `<div class="avatar" style="background-image:url('${p.photo}')"></div>`
      : `<div class="avatar">👤</div>`;
    return `
      <div class="post">
        <div class="post-header">
          ${avatar}
          <div class="post-info">
            <div class="username">${esc(p.name || 'User')} ${adminBadge}</div>
            <div class="handle">@${esc((p.name || 'user').toLowerCase().replace(/\s+/g, ''))} · ${new Date(p.createdAt).toLocaleString()}</div>
          </div>
          ${canDelete ? `
            <div class="post-menu-container">
              <button class="menu-btn-icon" onclick="togglePostMenu('${postId}')"><i data-lucide="more-horizontal"></i></button>
              <div class="post-menu" id="pm_${postId}">
                <button onclick="deletePost('${postId}')"><i data-lucide="trash-2"></i> ${t('delete')}</button>
              </div>
            </div>` : ''}
        </div>
        <div class="post-content">${renderTextWithHashtags(p.text)}</div>
        <div class="post-actions">
          <span class="like-btn ${heartClass}" onclick="likePost('${postId}')"><i data-lucide="heart"></i> ${p.likes || 0}</span>
          <span><i data-lucide="message-circle"></i> ${(p.comments || []).length}</span>
          <span><i data-lucide="share-2"></i></span>
        </div>
        ${comments.length ? `<div class="comments-section">${comments}</div>` : ''}
        <div class="comment-input-row">
          <input id="c_${postId}" placeholder="${t('comment')}...">
          <button onclick="addComment('${postId}')" style="background:#dc2626;border:none;color:#fff;padding:8px 16px;border-radius:9999px;cursor:pointer">
            <i data-lucide="send" style="width:16px;height:16px"></i>
          </button>
        </div>
      </div>`;
  }).join('');
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function renderSearch(m){
  m.innerHTML = `
    <div style="padding:12px 16px">
      <input placeholder="${t('search')}..." oninput="searchUsers(this.value)"
        style="width:100%;background:#16181c;border:1px solid #2f3336;color:#e7e9ea;padding:12px 16px;border-radius:9999px;font-size:15px;outline:none">
      <div id="searchRes"></div>
    </div>`;
}

function searchUsers(q){
  const out = document.getElementById('searchRes');
  if (!q) { out.innerHTML = ''; return; }
  if (q.startsWith('#')) {
    const tag = q.substring(1).toLowerCase();
    db.collection('posts').where('text', '>=', '#' + tag).where('text', '<', '#' + tag + '\uf8ff').limit(20).get().then(snap => {
      out.innerHTML = snap.docs.map(d => {
        const p = d.data();
        return `<div class="post"><div class="post-content">${renderTextWithHashtags(p.text)}</div><div class="handle">${esc(p.name)} · ${new Date(p.createdAt).toLocaleString()}</div></div>`;
      }).join('') || '<div class="empty-state">-</div>';
    });
    return;
  }
  db.collection('users').where('name', '>=', q).where('name', '<=', q + '\uf8ff').limit(20).get().then(snap => {
    out.innerHTML = snap.docs.map(d => {
      const u = d.data();
      const uId = d.id;
      const isPostAdmin = isAdmin(u.email);
      const adminBadge = isPostAdmin ? '<span class="admin-badge">👑 Admin</span>' : '';
      const avatar = u.photo
        ? `<div class="avatar" style="background-image:url('${u.photo}')"></div>`
        : `<div class="avatar">👤</div>`;
      return `
        <div class="post">
          <div class="post-header">
            ${avatar}
            <div class="post-info">
              <div class="username">${esc(u.name)} ${adminBadge}</div>
              <div class="handle">${esc(u.bio || '')}</div>
            </div>
            ${uId !== user.uid ? `<button class="btn-follow" onclick="toggleFollow('${uId}')">${t('follow')}</button>` : ''}
          </div>
        </div>`;
    }).join('') || '<div class="empty-state">-</div>';
    if (typeof lucide !== 'undefined') lucide.createIcons();
  });
}

function listenUnreadNotifs(userId){
  db.collection('notifications')
    .where('userId', '==', userId)
    .where('read', '==', false)
    .onSnapshot(snap => {
      const badge = document.getElementById('notifBadge');
      if (badge) badge.style.display = snap.empty ? 'none' : 'block';
    });
}

function renderNotifs(m){
  db.collection('notifications')
    .where('userId', '==', user.uid)
    .orderBy('timestamp', 'desc')
    .limit(30)
    .get()
    .then(snap => {
      if (snap.empty) {
        m.innerHTML = '<div class="empty-state">' + t('noNotifs') + '</div>';
        return;
      }
      snap.docs.forEach(doc => {
        if (!doc.data().read) {
          db.collection('notifications').doc(doc.id).update({ read: true });
        }
      });
      m.innerHTML = `<div style="padding:10px 0">` + snap.docs.map(d => {
        const notif = d.data();
        return `
          <div class="notif-item">
            <div>
              <div style="font-size:15px;margin-bottom:4px">${esc(notif.text)}</div>
              <div class="handle">${new Date(notif.timestamp).toLocaleString()}</div>
            </div>
            ${notif.senderId ? `<button class="btn-follow" onclick="toggleFollow('${notif.senderId}')">${t('follow')}</button>` : ''}
          </div>`;
      }).join('') + `</div>`;
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });
}

function renderProfile(m){
  db.collection('users').doc(user.uid).get().then(doc => {
    const u = doc.data() || {};
    const admin = isAdmin(user.email);
    const following = (u.following || []).length;
    const followers = (u.followers || []).length;
    const avatarContent = u.photo
      ? `<div class="avatar avatar-lg" style="background-image:url('${u.photo}');cursor:pointer" onclick="document.getElementById('photoInput').click()"></div>`
      : `<div class="avatar avatar-lg" style="cursor:pointer" onclick="document.getElementById('photoInput').click()">👤</div>`;
    m.innerHTML = `
      <div class="profile">
        <div class="profile-header">
          ${avatarContent}
          <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="uploadPhoto(event)">
          <button class="btn-outline" style="width:auto;padding:6px 14px;font-size:13px;border-radius:9999px;display:inline-block;margin-top:10px" onclick="document.getElementById('photoInput').click()">
            <i data-lucide="camera" style="width:14px;height:14px;vertical-align:middle"></i> ${t('changePic')}
          </button>
          <h2 style="font-size:20px;margin-top:14px;font-weight:800">${esc(u.name || user.email)} ${admin ? '<span class="admin-badge">👑 Admin</span>' : ''}</h2>
          <div class="handle">@${esc((u.name || user.email.split('@')[0]).toLowerCase().replace(/\s+/g, ''))}</div>
          <p style="color:#71767b;margin:10px 0;font-size:15px">${esc(u.bio || t('bio'))}</p>
          <div class="profile-stats">
            <span><b>${followers}</b> ${t('followers')}</span>
            <span><b>${following}</b> ${t('following2')}</span>
          </div>
        </div>
        <div class="profile-form">
          <input id="newName" placeholder="${t('profile')}" value="${esc(u.name || '')}">
          <textarea id="newBio" placeholder="${t('bio')}">${esc(u.bio || '')}</textarea>
          <button onclick="saveProfile()">${t('save')}</button>
          <button class="btn-outline" onclick="logout()">${t('logout')}</button>
        </div>
      </div>`;
    if (typeof lucide !== 'undefined') lucide.createIcons();
  });
}

function showSettings(){
  const m = document.getElementById('main');
  m.innerHTML = `
    <div class="profile">
      <h2 style="margin-bottom:20px;font-weight:800">${t('settings')}</h2>
      <div class="profile-form">
        <label style="display:block;margin:10px 0;color:#71767b">${t('language')}</label>
        <button onclick="toggleLang();showSettings()">${lang === 'en' ? '🇬🇧 English' : '🇬🇷 Ελληνικά'} → ${lang === 'en' ? 'Ελληνικά' : 'English'}</button>
      </div>
    </div>`;
}

function uploadPhoto(event){
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 500000) {
    alert(lang === 'el' ? 'Η εικόνα είναι πολύ μεγάλη (<500KB)' : 'Image too large (<500KB)');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    db.collection('users').doc(user.uid).update({ photo: e.target.result }).then(() => {
      alert('OK!');
      render();
    });
  };
  reader.readAsDataURL(file);
}

function saveProfile(){
  const name = document.getElementById('newName').value;
  const bio = document.getElementById('newBio').value;
  db.collection('users').doc(user.uid).set({ name, bio }, { merge: true }).then(() => {
    alert(lang === 'el' ? 'Αποθηκεύτηκε!' : 'Saved!');
    render();
  });
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.post-menu-container')) {
    document.querySelectorAll('.post-menu.show').forEach(m => m.classList.remove('show'));
  }
});
</script>
<script>lucide.createIcons();</script>
</body>
</html>
