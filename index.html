<style>
:root {
  --bg: #000;
  --text: #e7e9ea;
  --muted: #71767b;
  --border: #2f3336;
  --card: #16181c;
  --accent: #dc2626;
  --hover: rgba(255,255,255,.03);
}
body.light {
  --bg: #fff;
  --text: #0f1419;
  --muted: #536471;
  --border: #eff3f4;
  --card: #f7f9f9;
  --accent: #dc2626;

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
.app-container{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:70px;background:var(--bg);position:relative;border-left:1px solid var(--border);border-right:1px solid var(--border)}

.sidebar{position:fixed;top:0;left:-280px;width:280px;height:100vh;background:var(--bg);border-right:1px solid var(--border);z-index:1000;transition:left .3s;display:flex;flex-direction:column}
.sidebar.show{left:0}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border)}
.logo-box{background:var(--accent);color:#fff;padding:8px 14px;border-radius:20px;font-weight:700;font-size:14px}
#close-sidebar{background:none;border:none;color:var(--text);font-size:28px;cursor:pointer}
.sidebar-nav{flex:1;padding:12px;overflow-y:auto}
.sidebar-nav a{display:flex;align-items:center;gap:14px;padding:14px 16px;color:var(--text);text-decoration:none;border-radius:9999px;font-size:17px;font-weight:500;cursor:pointer;margin-bottom:4px}
.sidebar-nav a:hover,.sidebar-nav a.active{background:var(--card)}
.sidebar-nav a i{width:22px;height:22px}
.sidebar-nav hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.admin-link{background:var(--card)!important;border:1px solid var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;display:none}
.overlay.show{display:block}

.main-header{position:sticky;top:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 16px;z-index:100;display:flex;align-items:center;gap:12px}
body.light .main-header{background:rgba(255,255,255,.85)}
.menu-btn{background:none;border:none;color:var(--text);cursor:pointer;padding:6px}
.menu-btn i{width:24px;height:24px}
.logo-text{font-weight:700;font-size:18px;flex:1}

.top-tabs{display:flex;border-bottom:1px solid var(--border)}
.tab-btn{flex:1;padding:16px;background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;border-bottom:3px solid transparent;font-weight:500}
.tab-btn.active{color:var(--text);border-bottom-color:var(--accent);font-weight:700}

.post{border-bottom:1px solid var(--border);padding:14px 16px}
.post:hover{background:var(--hover)}
.post-header{display:flex;gap:12px;margin-bottom:6px;align-items:flex-start}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#dc2626,#7c2d12);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden;background-size:cover;background-position:center;color:#fff}
.avatar-lg{width:90px;height:90px;font-size:40px;border-radius:50%}
.post-info{flex:1;min-width:0}
.username{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.handle{color:var(--muted);font-size:14px}
.post-content{font-size:15px;line-height:1.5;margin:4px 0 10px;word-wrap:break-word;white-space:pre-wrap}
.post-images{display:grid;gap:6px;margin:10px 0;border-radius:12px;overflow:hidden}
.post-images.one{grid-template-columns:1fr}
.post-images.two{grid-template-columns:1fr 1fr}
.post-images img{width:100%;max-height:340px;object-fit:cover;border-radius:12px;cursor:pointer}
.hash{color:#1d9bf0;cursor:pointer}
.post-actions{display:flex;gap:40px;color:var(--muted);font-size:13px;margin-top:8px}
.post-actions span{display:flex;align-items:center;gap:6px;cursor:pointer}

@keyframes heartPop{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
.heart-pop{animation:heartPop .35s ease}

.comments-section{margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0;max-width:600px;margin:0 auto;z-index:100}
body.light .bottom-nav{background:rgba(255,255,255,.92)}

.img-preview img{width:80px;height:80px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}

.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center}
.stat-card b{display:block;font-size:28px;color:var(--accent);margin-bottom:4px}

/* ========== ΒΕΛΤΙΩΜΕΝΗ ΣΥΜΠΙΕΣΗ (για κάμερα) ========== */
function compressImage(file, maxWidth=900, quality=0.65){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const canvas=document.createElement('canvas');
          let w=img.width, h=img.height;
          if(w>maxWidth){h=Math.round(h*maxWidth/w);w=maxWidth}
          if(h>1200){w=Math.round(w*1200/h);h=1200}
          canvas.width=w;canvas.height=h;
          const ctx=canvas.getContext('2d');
          ctx.drawImage(img,0,0,w,h);
          let data=canvas.toDataURL('image/jpeg',quality);
          // Αν ακόμα μεγάλη, μειώνουμε περισσότερο
          if(data.length>450000){
            data=canvas.toDataURL('image/jpeg',0.5);
          }
          resolve(data);
        }catch(err){reject(err)}
      };
      img.onerror=()=>reject(new Error('Δεν μπόρεσε να φορτωθεί η εικόνα'));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error('Σφάλμα ανάγνωσης αρχείου'));
    reader.readAsDataURL(file);
  });
}

async function handleImageSelect(e){
  const files=Array.from(e.target.files).slice(0,2-pendingImages.length);
  for(const file of files){
    try{
      if(file.size>12*1024*1024){alert('Η φωτογραφία είναι πολύ μεγάλη (max 12MB)');continue}
      const compressed=await compressImage(file);
      pendingImages.push(compressed);
    }catch(err){
      alert(lang==='el'?'Πρόβλημα με τη φωτογραφία. Δοκίμασε άλλη.':'Problem with the photo. Try another one.');
      console.error(err);
    }
  }
  renderImagePreview();
  e.target.value='';
}

function renderImagePreview(){
  const box=document.getElementById('imgPreview');
  if(!box) return;
  box.innerHTML=pendingImages.map((src,i)=>`
    <div style="position:relative">
      <img src="${src}">
      <button class="remove-img" onclick="removeImage(${i})">×</button>
    </div>`).join('');
}
function removeImage(i){pendingImages.splice(i,1);renderImagePreview()}

function postContent(){
  const ta=document.getElementById('postText');
  if(!ta.value.trim() && pendingImages.length===0) return;
  db.collection('users').doc(user.uid).get().then(doc=>{
    const u=doc.data()||{};
    db.collection('posts').add({
      uid:user.uid,
      name:u.name||user.displayName||user.email.split('@')[0],
      email:user.email,
      photo:u.photo||user.photoURL||'',
      text:ta.value,
      images:pendingImages.slice(0,2),
      likes:0,likedBy:[],comments:[],
      createdAt:Date.now()
    });
    ta.value='';
    pendingImages=[];
    renderImagePreview();
  });
}

/* ========== LIKE ΜΕ ΗΧΟ ========== */
function playLikeSound(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(600,ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(900,ctx.currentTime+0.08);
    osc.frequency.exponentialRampToValueAtTime(400,ctx.currentTime+0.15);
    gain.gain.setValueAtTime(0.35,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.2);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime+0.2);
  }catch(e){}
}

function likePost(id, el){
  const ref=db.collection('posts').doc(id);
  ref.get().then(doc=>{
    const p=doc.data();
    const liked=(p.likedBy||[]).includes(user.uid);
    if(liked){
      ref.update({likes:firebase.firestore.FieldValue.increment(-1),likedBy:firebase.firestore.FieldValue.arrayRemove(user.uid)});
    }else{
      ref.update({likes:firebase.firestore.FieldValue.increment(1),likedBy:firebase.firestore.FieldValue.arrayUnion(user.uid)});
      playLikeSound();
      if(el){el.classList.add('heart-pop');setTimeout(()=>el.classList.remove('heart-pop'),400)}
      if(p.uid!==user.uid){
        db.collection('notifications').add({
          userId:p.uid,senderId:user.uid,
          text:(user.displayName||user.email.split('@')[0])+(lang==='el'?' έκανε like στη δημοσίευσή σου.':' liked your post.'),
          read:false,timestamp:Date.now()
        });
      }
    }
  });
}

function addComment(postId){
  const inp=document.getElementById('c_'+postId);
  if(!inp.value.trim()) return;
  db.collection('posts').doc(postId).get().then(doc=>{
    const p=doc.data();
    db.collection('posts').doc(postId).update({
      comments:firebase.firestore.FieldValue.arrayUnion({
        name:user.displayName||user.email.split('@')[0],email:user.email,text:inp.value,time:Date.now()
      })
    });
    if(p.uid!==user.uid){
      db.collection('notifications').add({
        userId:p.uid,senderId:user.uid,
        text:(user.displayName||user.email.split('@')[0])+(lang==='el'?' σχολίασε τη δημοσίευσή σου.':' commented on your post.'),
        read:false,timestamp:Date.now()
      });
    }
  });
  inp.value='';
}

function deletePost(id){if(!confirm(t('delete')+'?'))return;db.collection('posts').doc(id).delete()}
function togglePostMenu(id){event.stopPropagation();const m=document.getElementById('pm_'+id);if(m)m.classList.toggle('show')}

function toggleFollow(targetUid){
  const myRef=db.collection('users').doc(user.uid);
  const hisRef=db.collection('users').doc(targetUid);
  Promise.all([myRef.get(),hisRef.get()]).then(([myDoc])=>{
    const myData=myDoc.data()||{};
    const following=myData.following||[];
    if(following.includes(targetUid)){
      myRef.update({following:firebase.firestore.FieldValue.arrayRemove(targetUid)});
      hisRef.update({followers:firebase.firestore.FieldValue.arrayRemove(user.uid)});
    }else{
      myRef.update({following:firebase.firestore.FieldValue.arrayUnion(targetUid)});
      hisRef.update({followers:firebase.firestore.FieldValue.arrayUnion(user.uid)});
      db.collection('notifications').add({
        userId:targetUid,senderId:user.uid,
        text:(myData.name||user.email.split('@')[0])+(lang==='el'?' άρχισε να σε ακολουθεί.':' started following you.'),
        read:false,timestamp:Date.now()
      });
    }
  }).then(()=>render());
}

function renderTextWithHashtags(text){
  return esc(text).replace(/#(\w+)/g,'<span class="hash" onclick="searchHashtag(\'$1\')">#$1</span>');
}
function searchHashtag(tag){
  showTab('search');
  setTimeout(()=>{const inp=document.querySelector('#main input');if(inp){inp.value='#'+tag;inp.dispatchEvent(new Event('input'))}},100);
}

/* Lightbox */
function openLightbox(src){
  document.getElementById('lightboxImg').src=src;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox(){document.getElementById('lightbox').classList.remove('show')}

function render(){
  const m=document.getElementById('main');
  if(!user){
    document.getElementById('bottomNav').style.display='none';
    m.innerHTML=`
      <div class="auth-container">
        <div style="font-size:64px;margin-bottom:16px">👋</div>
        <h2>John Ross Social</h2>
        <p class="slogan">${t('slogan')}</p>
        <div style="max-width:340px;margin:0 auto">
          <input id="le" placeholder="${t('email')}" type="email">
          <input id="lp" placeholder="${t('password')}" type="password">
          <button onclick="login()">${t('login')}</button>
          <button class="btn-o" onclick="register()">${t('register')}</button>
          <button class="btn-o" onclick="googleLogin()"><i data-lucide="chrome" style="width:16px;height:16px;vertical-align:middle"></i> ${t('google')}</button>
        </div>
      </div>`;
    if(typeof lucide!=='undefined')lucide.createIcons();
    return;
  }
  document.getElementById('bottomNav').style.display='flex';
  if(tab==='home') renderHome(m);
  else if(tab==='search') renderSearch(m);
  else if(tab==='notif') renderNotifs(m);
  else if(tab==='profile') renderProfile(m);
  else if(tab==='admin') showAdminPanel();
  if(typeof lucide!=='undefined')lucide.createIcons();
}

function renderHome(m){
  pendingImages=[];
  m.innerHTML=`
    <div style="padding:14px 16px;border-bottom:1px solid var(--border)">
      <textarea id="postText" placeholder="${t('placeholder')}" style="width:100%;background:transparent;border:none;color:var(--text);font-size:17px;resize:none;min-height:60px;font-family:inherit;outline:none"></textarea>
      <div id="imgPreview" class="img-preview"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
        <div>
          <input type="file" id="imgInput" accept="image/*" capture="environment" multiple style="display:none" onchange="handleImageSelect(event)">
          <button onclick="document.getElementById('imgInput').click()" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:6px">
            <i data-lucide="image" style="width:22px;height:22px"></i>
          </button>
        </div>
        <button class="btn-full" style="width:auto;padding:8px 22px;margin:0" onclick="postContent()">${t('post')}</button>
      </div>
    </div>
    <div class="top-tabs">
      <button class="tab-btn ${feedType==='foryou'?'active':''}" data-feed="foryou" onclick="setFeedType('foryou')">${t('forYou')}</button>
      <button class="tab-btn ${feedType==='following'?'active':''}" data-feed="following" onclick="setFeedType('following')">${t('following')}</button>
    </div>
    <div id="feed"></div>`;
  loadFeed();
  if(typeof lucide!=='undefined')lucide.createIcons();
}

function loadFeed(){
  const f=document.getElementById('feed');
  if(!f) return;
  if(feedType==='following'){
    db.collection('users').doc(user.uid).get().then(doc=>{
      const following=(doc.data()||{}).following||[];
      if(following.length===0){f.innerHTML='<div class="empty-state">'+t('noFollowing')+'</div>';return}
      db.collection('posts').where('uid','in',following.slice(0,10)).orderBy('createdAt','desc').limit(40).onSnapshot(snap=>renderPosts(snap,f));
    });
  }else{
    db.collection('posts').orderBy('createdAt','desc').limit(40).onSnapshot(snap=>renderPosts(snap,f));
  }
}

function renderPosts(snap,f){
  if(!f) return;
  if(snap.empty){f.innerHTML='<div class="empty-state">'+t('noPosts')+'</div>';return}
  f.innerHTML=snap.docs.map(d=>{
    const p=d.data(), postId=d.id;
    const isPostAdmin=isAdmin(p.email);
    const adminBadge=isPostAdmin?'<span class="admin-badge">👑 Admin</span>':'';
    const canDelete=(user.uid===p.uid)||isAdmin(user.email);
    const isLiked=(p.likedBy||[]).includes(user.uid);
    const images=p.images||[];
    const imgHtml=images.length?`<div class="post-images ${images.length===1?'one':'two'}">${images.map(src=>`<img src="${src}" onclick="openLightbox('${src}')">`).join('')}</div>`:'';
    const comments=(p.comments||[]).map(c=>`
      <div class="comment">
        <div class="comment-avatar">👤</div>
        <div class="comment-info"><div class="comment-name">${esc(c.name)}</div><div class="comment-text">${esc(c.text)}</div></div>
      </div>`).join('');
    const avatar=p.photo?`<div class="avatar" style="background-image:url('${p.photo}')"></div>`:`<div class="avatar">👤</div>`;
    return `
      <div class="post">
        <div class="post-header">
          ${avatar}
          <div class="post-info">
            <div class="username">${esc(p.name||'User')} ${adminBadge}</div>
            <div class="handle">@${esc((p.name||'user').toLowerCase().replace(/\s+/g,''))} · ${new Date(p.createdAt).toLocaleString()}</div>
          </div>
          ${canDelete?`<div class="post-menu-container">
            <button class="menu-btn-icon" onclick="togglePostMenu('${postId}')"><i data-lucide="more-horizontal"></i></button>
            <div class="post-menu" id="pm_${postId}"><button onclick="deletePost('${postId}')"><i data-lucide="trash-2"></i> ${t('delete')}</button></div>
          </div>`:''}
        </div>
        <div class="post-content">${renderTextWithHashtags(p.text||'')}</div>
        ${imgHtml}
        <div class="post-actions">
          <span class="like-btn ${isLiked?'liked':''}" onclick="likePost('${postId}',this)"><i data-lucide="heart"></i> ${p.likes||0}</span>
          <span><i data-lucide="message-circle"></i> ${(p.comments||[]).length}</span>
          <span><i data-lucide="share-2"></i></span>
        </div>
        ${comments?`<div class="comments-section">${comments}</div>`:''}
        <div class="comment-input-row">
          <input id="c_${postId}" placeholder="${t('comment')}...">
          <button onclick="addComment('${postId}')" style="background:var(--accent);border:none;color:#fff;padding:8px 16px;border-radius:9999px;cursor:pointer">
            <i data-lucide="send" style="width:16px;height:16px"></i>
          </button>
        </div>
      </div>`;
  }).join('');
  if(typeof lucide!=='undefined')lucide.createIcons();
}

function renderSearch(m){
  m.innerHTML=`
    <div style="padding:12px 16px">
      <input placeholder="${t('search')}..." oninput="searchUsers(this.value)"
        style="width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:9999px;font-size:15px;outline:none">
      <div id="searchRes"></div>
    </div>`;
}

function searchUsers(q){
  const out=document.getElementById('searchRes');
  if(!q){out.innerHTML='';return}
  if(q.startsWith('#')){
    const tag=q.substring(1).toLowerCase();
    db.collection('posts').where('text','>=','#'+tag).where('text','<','#'+tag+'\uf8ff').limit(15).get().then(snap=>{
      out.innerHTML=snap.docs.map(d=>{
        const p=d.data();
        return `<div class="post"><div class="post-content">${renderTextWithHashtags(p.text)}</div><div class="handle">${esc(p.name)}</div></div>`;
      }).join('')||'<div class="empty-state">-</div>';
    });
    return;
  }
  db.collection('users').where('name','>=',q).where('name','<=',q+'\uf8ff').limit(15).get().then(snap=>{
    out.innerHTML=snap.docs.map(d=>{
      const u=d.data(),uId=d.id;
      const adminBadge=isAdmin(u.email)?'<span class="admin-badge">👑 Admin</span>':'';
      const avatar=u.photo?`<div class="avatar" style="background-image:url('${u.photo}')"></div>`:`<div class="avatar">👤</div>`;
      return `<div class="post"><div class="post-header">${avatar}<div class="post-info"><div class="username">${esc(u.name)} ${adminBadge}</div><div class="handle">${esc(u.bio||'')}</div></div>
        ${uId!==user.uid?`<button class="btn-follow" onclick="toggleFollow('${uId}')">${t('follow')}</button>`:''}</div></div>`;
    }).join('')||'<div class="empty-state">-</div>';
    if(typeof lucide!=='undefined')lucide.createIcons();
  });
}

function listenUnreadNotifs(userId){
  db.collection('notifications').where('userId','==',userId).where('read','==',false)
    .onSnapshot(snap=>{
      const badge=document.getElementById('notifBadge');
      if(badge) badge.style.display=snap.empty?'none':'block';
    });
}

function renderNotifs(m){
  db.collection('notifications').where('userId','==',user.uid).orderBy('timestamp','desc').limit(25).get().then(snap=>{
    if(snap.empty){m.innerHTML='<div class="empty-state">'+t('noNotifs')+'</div>';return}
    snap.docs.forEach(doc=>{if(!doc.data().read) db.collection('notifications').doc(doc.id).update({read:true})});
    m.innerHTML=snap.docs.map(d=>{
      const n=d.data();
      return `<div class="notif-item"><div><div style="font-size:15px;margin-bottom:4px">${esc(n.text)}</div><div class="handle">${new Date(n.timestamp).toLocaleString()}</div></div>
        ${n.senderId?`<button class="btn-follow" onclick="toggleFollow('${n.senderId}')">${t('follow')}</button>`:''}</div>`;
    }).join('');
  });
}

/* ========== ΠΡΟΦΙΛ ΜΕ ΝΗΜΑ ========== */
function renderProfile(m){
  db.collection('users').doc(user.uid).get().then(doc=>{
    const u=doc.data()||{};
    const admin=isAdmin(user.email);
    const following=(u.following||[]).length;
    const followers=(u.followers||[]).length;
    const avatarContent=u.photo
      ?`<div class="avatar avatar-lg" style="background-image:url('${u.photo}');cursor:pointer" onclick="document.getElementById('photoInput').click()"></div>`
      :`<div class="avatar avatar-lg" style="cursor:pointer" onclick="document.getElementById('photoInput').click()">👤</div>`;
    m.innerHTML=`
      <div class="profile">
        <div class="profile-header">
          ${avatarContent}
          <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="uploadPhoto(event)">
          <button class="btn-outline" style="width:auto;padding:6px 14px;font-size:13px;border-radius:9999px;display:inline-block;margin-top:10px" onclick="document.getElementById('photoInput').click()">
            <i data-lucide="camera" style="width:14px;height:14px;vertical-align:middle"></i> ${t('changePic')}
          </button>
          <h2 style="font-size:20px;margin-top:14px;font-weight:800">${esc(u.name||user.email)} ${admin?'<span class="admin-badge">👑 Admin</span>':''}</h2>
          <div class="handle">@${esc((u.name||user.email.split('@')[0]).toLowerCase().replace(/\s+/g,''))}</div>
          <p style="color:var(--muted);margin:10px 0;font-size:15px">${esc(u.bio||t('bio'))}</p>
          <div class="profile-stats">
            <span><b>${followers}</b> ${t('followers')}</span>
            <span><b>${following}</b> ${t('following2')}</span>
          </div>
        </div>
        <div class="profile-form">
          <input id="newName" placeholder="${t('profile')}" value="${esc(u.name||'')}">
          <textarea id="newBio" placeholder="${t('bio')}">${esc(u.bio||'')}</textarea>
          <button onclick="saveProfile()">${t('save')}</button>
        </div>
        <h3 style="margin:28px 0 12px;font-size:16px;font-weight:700">${t('myPosts')}</h3>
        <div id="myPostsFeed"><div class="empty-state">Φόρτωση...</div></div>
      </div>`;

    // Φόρτωση νήματος – χωρίς orderBy για να μην χρειάζεται index
    db.collection('posts').where('uid','==',user.uid).limit(30).get().then(snap=>{
      const docs=snap.docs.sort((a,b)=>(b.data().createdAt||0)-(a.data().createdAt||0));
      // Δημιουργούμε ψεύτικο snapshot-like
      const fakeSnap={empty:docs.length===0,docs:docs};
      renderPosts(fakeSnap,document.getElementById('myPostsFeed'));
    }).catch(err=>{
      document.getElementById('myPostsFeed').innerHTML='<div class="empty-state">Σφάλμα φόρτωσης</div>';
      console.error(err);
    });

    if(typeof lucide!=='undefined')lucide.createIcons();
  });
}

function showSettings(){
  const m=document.getElementById('main');
  const isLight=document.body.classList.contains('light');
  m.innerHTML=`
    <div class="profile">
      <h2 style="margin-bottom:20px;font-weight:800">${t('settings')}</h2>
      <div class="profile-form">
        <label style="display:block;margin:10px 0;color:var(--muted)">${t('language')}</label>
        <button onclick="toggleLang();showSettings()">${lang==='en'?'🇬🇧 English → Ελληνικά':'🇬🇷 Ελληνικά → English'}</button>
        <label style="display:block;margin:20px 0 10px;color:var(--muted)">Theme</label>
        <button onclick="toggleTheme();showSettings()">${isLight?'☀️ '+t('lightMode')+' → 🌙 '+t('darkMode'):'🌙 '+t('darkMode')+' → ☀️ '+t('lightMode')}</button>
      </div>
    </div>`;
}

function showAdminPanel(){
  if(!user||!isAdmin(user.email)) return;
  tab='admin';
  const m=document.getElementById('main');
  m.innerHTML=`
    <div class="profile">
      <h2 style="margin-bottom:8px;font-weight:800">🛡️ ${t('adminPanel')}</h2>
      <p style="color:var(--muted);margin-bottom:20px">John Ross Social – Διαχείριση</p>
      <div class="admin-stats" id="adminStats">
        <div class="stat-card"><b>...</b><span>${t('totalUsers')}</span></div>
        <div class="stat-card"><b>...</b><span>${t('totalPosts')}</span></div>
      </div>
      <h3 style="margin:24px 0 12px;font-size:16px">${t('recentActivity')}</h3>
      <div id="adminActivity" class="empty-state">Φόρτωση...</div>
    </div>`;
  Promise.all([db.collection('users').get(),db.collection('posts').get()]).then(([u,p])=>{
    document.getElementById('adminStats').innerHTML=`
      <div class="stat-card"><b>${u.size}</b><span>${t('totalUsers')}</span></div>
      <div class="stat-card"><b>${p.size}</b><span>${t('totalPosts')}</span></div>`;
  });
  db.collection('notifications').orderBy('timestamp','desc').limit(12).get().then(snap=>{
    const act=document.getElementById('adminActivity');
    if(snap.empty){act.innerHTML='<div class="empty-state">Δεν υπάρχουν ακόμα</div>';return}
    act.innerHTML=snap.docs.map(d=>{
      const n=d.data();
      return `<div class="notif-item"><div style="font-size:14px">${esc(n.text)}</div><div class="handle">${new Date(n.timestamp).toLocaleString()}</div></div>`;
    }).join('');
  });
}

function uploadPhoto(event){
  const file=event.target.files[0];
  if(!file) return;
  compressImage(file,400,0.7).then(data=>{
    db.collection('users').doc(user.uid).update({photo:data}).then(()=>{alert('OK!');render()});
  }).catch(()=>alert('Σφάλμα ανεβάσματος φωτογραφίας'));
}

function saveProfile(){
  const name=document.getElementById('newName').value;
  const bio=document.getElementById('newBio').value;
  db.collection('users').doc(user.uid).set({name,bio},{merge:true}).then(()=>{alert(lang==='el'?'Αποθηκεύτηκε!':'Saved!');render()});
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.post-menu-container')){
    document.querySelectorAll('.post-menu.show').forEach(m=>m.classList.remove('show'));
  }
});

loadTheme();
</script>
<script>lucide.createIcons();</script>
</body>
</html>
